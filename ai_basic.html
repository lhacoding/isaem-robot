<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인공지능 기초</title>
  <style>
    :root {
      --navy: #10243d;
      --navy-2: #152d4c;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --bg: #f3f5f7;
      --card: #ffffff;
      --line: #d9e0e8;
      --text: #1f2937;
      --muted: #64748b;
      --choice: #f8fafc;
      --choice-hover: #eef6ff;
      --explain: #eef6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.55;
    }

    .page {
      width: min(100% - 28px, 860px);
      margin: 22px auto 28px;
    }

    .exam-header {
      position: relative;
      overflow: hidden;
      padding: 26px 30px 22px;
      border-radius: 20px;
      color: #fff;
      background:
        radial-gradient(circle at 96% 18%, rgba(190, 211, 226, 0.22) 0%, rgba(190, 211, 226, 0.13) 14%, rgba(190, 211, 226, 0.04) 28%, transparent 39%),
        linear-gradient(135deg, #0c1e34 0%, #102642 58%, #132a47 82%, #1b344f 100%);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.14);
    }

    .exam-header h1 {
      margin: 0 0 6px;
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .exam-header .meta {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .header-line {
      height: 3px;
      width: 100%;
      margin-top: 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(27, 188, 178, 0.95), rgba(27, 188, 178, 0.36), transparent 82%);
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .menu-card,
    .score-panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.045);
    }

    .menu-card {
      padding: 13px;
    }

    .unit-title {
      margin: 0 0 9px;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.03em;
    }

    .menu-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .nav-btn,
    .reset-btn {
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: #f8fafc;
      color: #1e293b;
      font-weight: 700;
      padding: 9px 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      font-family: inherit;
    }

    .nav-btn:hover,
    .reset-btn:hover {
      background: #eef6ff;
      border-color: #93c5fd;
    }

    .nav-btn.active {
      background: var(--navy-2);
      border-color: var(--navy-2);
      color: #fff;
    }

    .quiz-section {
      margin-top: 14px;
    }

    .quiz-section.hidden {
      display: none;
    }

    .section-heading {
      margin: 0 0 8px;
      padding: 0 2px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.16rem;
      color: var(--navy);
      letter-spacing: -0.04em;
    }

    .section-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .question-card {
      margin: 8px 0;
      padding: 15px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.035);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .question-card.correct-card {
      border-color: rgba(22, 163, 74, 0.68);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.08);
    }

    .question-card.wrong-card {
      border-color: rgba(220, 38, 38, 0.66);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
    }

    .question-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 9px;
    }

    .q-num {
      flex: 0 0 auto;
      min-width: 22px;
      color: var(--blue);
      font-size: 1.14rem;
      font-weight: 900;
      line-height: 1.5;
      text-align: right;
    }

    .question-text {
      margin: 0;
      font-weight: 700;
      color: #172033;
      letter-spacing: -0.02em;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .score {
      display: inline;
      margin-left: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    u {
      text-underline-offset: 4px;
      text-decoration-thickness: 1.5px;
      text-decoration-color: rgba(37, 99, 235, 0.45);
    }

    .question-note {
      margin: -1px 0 9px 30px;
      padding: 10px 12px;
      border-radius: 11px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 0.92rem;
      overflow-x: auto;
    }

    .question-note ul {
      margin: 0;
      padding-left: 18px;
    }

    pre {
      margin: 0;
      padding: 12px 13px;
      border-radius: 11px;
      background: #f1f5f9;
      color: #0f172a;
      overflow-x: auto;
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      gap: 7px;
      margin-left: 30px;
    }

    .choices.short {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .choices.medium {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .choices.full {
      grid-template-columns: 1fr;
    }

    .choice {
      width: 100%;
      min-height: 40px;
      border: 1px solid #d6dde7;
      border-radius: 11px;
      background: var(--choice);
      color: #1f2937;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.93rem;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      word-break: keep-all;
      overflow-wrap: anywhere;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .choice span {
      flex: 0 0 auto;
      font-weight: 900;
      color: #475569;
    }

    .choice:hover {
      background: var(--choice-hover);
      border-color: #93c5fd;
    }

    .choice:disabled {
      cursor: default;
    }

    .choice.correct-choice {
      border-color: rgba(22, 163, 74, 0.78);
      background: #ecfdf5;
      color: #14532d;
    }

    .choice.correct-choice span {
      color: var(--green);
    }

    .choice.wrong-choice {
      border-color: rgba(220, 38, 38, 0.78);
      background: #fef2f2;
      color: #7f1d1d;
    }

    .choice.wrong-choice span {
      color: var(--red);
    }

    .feedback {
      display: none;
      margin: 8px 0 0 30px;
      font-weight: 900;
      font-size: 0.93rem;
    }

    .feedback.ok,
    .feedback.no {
      display: block;
    }

    .feedback.ok {
      color: var(--green);
    }

    .feedback.no {
      color: var(--red);
    }

    .explanation {
      display: none;
      margin: 6px 0 0 30px;
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--explain);
      border: 1px solid #cfe2ff;
      color: #243447;
      font-size: 0.91rem;
    }

    .explanation strong {
      display: block;
      margin-bottom: 4px;
      color: #1e40af;
    }

    .explanation p {
      margin: 3px 0;
    }

    .keyword {
      color: #475569;
      font-size: 0.88rem;
    }

    .score-panel {
      margin-top: 12px;
      padding: 15px 16px;
    }

    .score-panel h2 {
      margin: 0 0 9px;
      color: var(--navy);
      font-size: 1.08rem;
      letter-spacing: -0.03em;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .score-item {
      padding: 10px 11px;
      border-radius: 13px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .score-value {
      display: block;
      margin-top: 2px;
      font-size: 1.04rem;
      font-weight: 900;
      color: #0f172a;
    }

    .reset-btn {
      width: 100%;
      background: #fff;
    }

    footer {
      margin: 12px 0 0;
      padding: 10px 0;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 20px, 860px);
        margin-top: 16px;
      }

      .exam-header {
        padding: 23px 20px 20px;
        border-radius: 18px;
      }

      .unit-grid {
        grid-template-columns: 1fr;
      }

      .question-card {
        padding: 14px 13px 13px;
      }

      .q-num {
        min-width: 20px;
        font-size: 1.08rem;
      }

      .choices,
      .feedback,
      .explanation {
        margin-left: 26px;
      }

      .question-note {
        margin-left: 26px;
      }

      .choices.short,
      .choices.medium {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .choices.full {
        grid-template-columns: 1fr;
      }

      .choice {
        font-size: 0.9rem;
        padding: 8px 9px;
      }

      .score-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .choices.short,
      .choices.medium {
        grid-template-columns: 1fr;
      }

      .menu-actions {
        grid-template-columns: 1fr;
      }

      .score-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <header class="exam-header">
      <h1>인공지능 기초</h1>

      </div>
      <button class="reset-btn" id="resetBtn">처음부터 다시 풀기</button>
    </section>

    <footer>[송도이샘로봇]</footer>
  </main>

    const SCORES = {};
    Object.values(sections).forEach(section => {
      section.questions.forEach(q => {
        SCORES[q.id] = 1;
      });
    });

    const answered = {};
    const totalScore = Object.values(SCORES).reduce((sum, score) => sum + score, 0);

    function renderSections() {
      Object.entries(sections).forEach(([sectionId, section]) => {
        const target = document.getElementById(sectionId);
        const heading = `
          <div class="section-heading">
            <h2>${section.title}</h2>
            <p>${section.type}</p>
          </div>
        `;

        const cards = section.questions.map((q, index) => {
          const note = q.note ? `<div class="question-note">${q.note}</div>` : "";
          const choices = q.choices.map((choice, choiceIndex) => `
            <button class="choice" data-choice="${choiceIndex + 1}">
              <span>${choiceLabels[choiceIndex + 1]}</span>${choice}
            </button>
          `).join("");

          return `
            <article class="question-card" data-q="${q.id}" data-answer="${q.answer}">
              <div class="question-top">
                <span class="q-num">${index + 1}</span>
                <p class="question-text">${q.text} <span class="score">1점</span></p>
              </div>
              ${note}
              <div class="choices ${q.layout}">
                ${choices}
              </div>
              <div class="feedback"></div>
              <div class="explanation">
                <strong>문제풀이</strong>
                <p>${q.explanation}</p>
                <p class="keyword">암기 키워드: ${q.keyword}</p>
              </div>
            </article>
          `;
        }).join("");

        target.innerHTML = heading + cards;
      });
    }

    function updateScore() {
      let earned = 0;
      let correct = 0;
      let wrong = 0;

      Object.keys(answered).forEach((q) => {
        if (answered[q].correct) {
          correct += 1;
          earned += SCORES[q] || 0;
        } else {
          wrong += 1;
        }
      });

      const totalQuestions = Object.keys(SCORES).length;
      const left = totalQuestions - correct - wrong;

      document.getElementById("scoreNow").textContent = `${earned} / ${totalScore}점`;
      document.getElementById("correctCount").textContent = `${correct}개`;
      document.getElementById("wrongCount").textContent = `${wrong}개`;
      document.getElementById("leftCount").textContent = `${left}개`;
    }

    function grade(card, selectedButton) {
      if (card.classList.contains("answered")) return;

      const q = card.dataset.q;
      const answer = card.dataset.answer;
      const selected = selectedButton.dataset.choice;
      const isCorrect = selected === answer;
      const buttons = Array.from(card.querySelectorAll(".choice"));
      const feedback = card.querySelector(".feedback");
      const explanation = card.querySelector(".explanation");

      card.classList.add("answered");

      buttons.forEach((button) => {
        button.disabled = true;
        if (button.dataset.choice === answer) {
          button.classList.add("correct-choice");
        }
      });

      if (isCorrect) {
        selectedButton.classList.add("correct-choice");
        card.classList.add("correct-card");
        feedback.textContent = "정답입니다.";
        feedback.classList.add("ok");
      } else {
        selectedButton.classList.add("wrong-choice");
        card.classList.add("wrong-card");
        feedback.textContent = `오답입니다. 정답은 ${choiceLabels[Number(answer)]}입니다.`;
        feedback.classList.add("no");
      }

      explanation.style.display = "block";
      answered[q] = { selected, correct: isCorrect };
      updateScore();
    }

    renderSections();

    document.querySelectorAll(".question-card").forEach((card) => {
      card.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => grade(card, button));
      });
    });

    document.querySelectorAll(".nav-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.target;

        document.querySelectorAll(".nav-btn").forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");

        document.querySelectorAll(".quiz-section").forEach((section) => {
          section.classList.toggle("hidden", section.id !== target);
        });

        const top = document.querySelector(".unit-grid").offsetTop;
        window.scrollTo({ top: top - 8, behavior: "smooth" });
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      Object.keys(answered).forEach((q) => delete answered[q]);

      document.querySelectorAll(".question-card").forEach((card) => {
        card.classList.remove("answered", "correct-card", "wrong-card");

        card.querySelectorAll(".choice").forEach((button) => {
          button.disabled = false;
          button.classList.remove("correct-choice", "wrong-choice");
        });

        const feedback = card.querySelector(".feedback");
        feedback.textContent = "";
        feedback.className = "feedback";

        const explanation = card.querySelector(".explanation");
        explanation.style.display = "none";
      });

      updateScore();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    updateScore();
  </script>
</body>
</html>
