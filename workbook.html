tecture-civil-02","major":"건축·토목공학","question":"기둥의 단면 모양과 속이 빈 구조는 좌굴 하중에 어떤 영향을 줄까?","hypothesis":"같은 종이 양이라면 재료가 중심에서 멀리 분포한 원통형 또는 상자형 기둥이 평평한 기둥보다 좌굴에 강할 것이다.","methods":[{"kind":"제작·검증","title":"단면별 종이기둥","detail":"같은 크기 종이를 평판·원통·삼각·사각 기둥으로 만들고 수직 하중을 준다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 최대하중·기둥 질량·좌굴 방향을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"수학 모형","title":"단면2차모멘트 비교","detail":"단면 크기와 재료 두께를 단순화해 휨 저항 지표를 계산한다. 단면별 계산값·실험 순위·오차 원인을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"H형강과 강관 기둥","detail":"건축 구조재의 단면 형상과 사용 위치를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 재료 효율·좌굴·접합·시공 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"기둥의 단면 모양과 속이 빈 구조는 좌굴 하중에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-03","major":"건축·토목공학","question":"보의 길이가 길어질수록 중앙 처짐은 어떤 비율로 커질까?","hypothesis":"재료와 단면이 같을 때 경간이 길어지면 처짐은 길이에 단순 비례하는 것보다 훨씬 빠르게 증가할 것이다.","methods":[{"kind":"직접 실험","title":"경간별 보 처짐","detail":"같은 자 또는 막대를 두 받침에 놓고 받침 간격만 바꿔 같은 중앙하중을 준다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 경간·중앙 처짐·복원 여부을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"보 처짐식과 실측 비교","detail":"재료·단면·하중을 고정한 단순 보 모형으로 경간별 처짐을 계산한다. 예상 처짐·실측값·상대오차을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"설계·검증","title":"높이 보강 효과","detail":"재료량은 비슷하게 하고 평판 보와 접은 보의 높이를 다르게 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 단위질량당 강성·최대하중을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"보의 길이가 길어질수록 중앙 처짐은 어떤 비율로 커질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-04","major":"건축·토목공학","question":"콘크리트의 물-시멘트 비는 강도와 작업성에 어떤 영향을 줄까?","hypothesis":"물의 비율이 높으면 반죽은 다루기 쉬워지지만 굳은 뒤 빈 공간이 늘어 압축강도는 낮아질 것이다.","methods":[{"kind":"자료 분석","title":"배합비와 강도 데이터","detail":"공개 배합자료에서 물-시멘트 비·재령·압축강도를 정리하고 다른 조건이 비슷한 표본을 고른다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 비율별 평균강도·분산·재령 영향을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"모형 재료 실험","title":"안전한 석고 배합 비교","detail":"소량의 석고와 물 비율만 바꿔 같은 틀에서 굳힌 뒤 동일 방식으로 하중을 준다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 배합비·질량·파손하중·표면 기공을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"강도와 작업성의 균형","detail":"고성능 콘크리트와 감수제 자료를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 물-시멘트 비·슬럼프·강도·양생 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"콘크리트의 물-시멘트 비는 강도와 작업성에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-05","major":"건축·토목공학","question":"단열재의 종류와 공기층은 실내 모형의 온도 변화를 얼마나 늦출까?","hypothesis":"열전도율이 낮고 정지된 공기층을 포함한 구조가 같은 두께의 단일 재료보다 온도 변화를 더 늦출 것이다.","methods":[{"kind":"모형 실험","title":"단열재별 온도 변화","detail":"같은 용기에 종이·천·에어캡·폼을 같은 두께로 감싸고 따뜻한 물을 넣는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 내부온도·초기 냉각속도·목표온도 도달시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"설계·검증","title":"단일층과 공기층 비교","detail":"총 두께를 맞추고 재료 밀착 구조와 간격을 둔 구조를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 10분당 온도변화·구조 질량·두께을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"건물 열관류율","detail":"벽체·창호의 열관류율과 결로 방지 자료를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 재료층·열교·기밀성·시공 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"단열재의 종류와 공기층은 실내 모형의 온도 변화를 얼마나 늦출까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-06","major":"건축·토목공학","question":"지붕과 외벽의 색은 햇빛 아래 표면온도와 내부온도에 어떤 차이를 만들까?","hypothesis":"같은 재료에서는 밝은 색이 빛을 더 많이 반사해 검은색보다 표면과 내부 온도가 낮을 것이다.","methods":[{"kind":"모형 실험","title":"색상별 건물 온도","detail":"같은 상자 외부를 검정·회색·흰색으로 마감하고 같은 거리의 광원에 둔다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 표면온도·내부온도·상승률을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"반사율과 온도 관계","detail":"색상별 반복 측정값과 알려진 반사율 자료를 결합한다. 결측값과 단위를 확인한 뒤 반사율-최고온도 그래프·변동·예외을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"쿨루프와 도시열섬","detail":"밝은 지붕의 에너지 절감과 겨울철 영향 연구를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 기후·냉난방에너지·눈부심·내구성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"지붕과 외벽의 색은 햇빛 아래 표면온도와 내부온도에 어떤 차이를 만들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-07","major":"건축·토목공학","question":"건물의 높이와 단면 모양은 바람에 의한 흔들림에 어떤 영향을 줄까?","hypothesis":"높이가 커질수록 흔들림이 커지며 모서리가 둥글거나 바람이 통하는 형태는 각진 밀폐형보다 진동이 작을 것이다.","methods":[{"kind":"모형 실험","title":"높이별 흔들림 측정","detail":"같은 바닥과 단면의 막대 모형에서 높이만 바꾸고 같은 선풍기 바람을 준다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 끝단 변위·진동 횟수·복원시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"제작·검증","title":"단면 형상 비교","detail":"재료량과 높이를 맞춘 사각·원형·모서리 절단 모형을 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 풍속별 변위·넘어짐 여부·질량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"초고층 풍하중 제어","detail":"테이퍼·개구부·튜닝질량감쇠기 적용 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 건물형상·와류·고유진동·제어원리을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"건물의 높이와 단면 모양은 바람에 의한 흔들림에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-08","major":"건축·토목공학","question":"복도의 폭과 출구 배치는 대피 완료시간에 어떤 영향을 줄까?","hypothesis":"통로가 넓어도 출구가 한곳에 집중되면 병목이 생기며, 분산된 출구가 대피시간을 더 줄일 것이다.","methods":[{"kind":"시뮬레이션","title":"대피 경로와 병목","detail":"격자 모형에서 인원수·복도폭·출구 수와 위치를 바꾼다. 전체 대피시간·출구별 통과량·최대 밀집도을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"수학 모형","title":"통로 처리용량 계산","detail":"초당 통과 인원을 통로폭과 출구 수의 함수로 두고 예상시간을 계산한다. 조건별 최소시간·병목 위치·모형 가정을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"건축물 피난 설계","detail":"공공건물 피난 동선과 방화구획 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 보행거리·출구 분산·계단폭·연기 영향을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"복도의 폭과 출구 배치는 대피 완료시간에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-09","major":"건축·토목공학","question":"지반을 이루는 입자 크기와 물의 양은 모형 기초의 침하에 어떤 영향을 줄까?","hypothesis":"입자 크기가 고르고 잘 다져진 지반은 느슨하거나 물을 많이 머금은 지반보다 같은 하중에서 침하가 작을 것이다.","methods":[{"kind":"모형 실험","title":"지반별 침하 측정","detail":"같은 용기에 자갈·모래·혼합토를 같은 높이로 채우고 동일 면적의 판에 하중을 준다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 침하량·하중 제거 후 복원량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"조건 비교","title":"다짐과 수분 영향","detail":"같은 모래를 느슨·다짐·수분 첨가 조건으로 준비한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 밀도·침하량·기초판 기울기을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"지반조사와 기초 선택","detail":"직접기초·말뚝기초의 적용 조건을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 지지력·침하·지하수·하중 분산을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"지반을 이루는 입자 크기와 물의 양은 모형 기초의 침하에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]},{"id":"architecture-civil-10","major":"건축·토목공학","question":"건물 바닥과 지면 사이의 면진층은 진동 전달을 얼마나 줄일까?","hypothesis":"부드러운 면진층은 높은 주파수 진동의 전달을 줄이지만 지나치게 부드러우면 변위가 커질 것이다.","methods":[{"kind":"제작·검증","title":"면진재료별 진동","detail":"같은 건물 모형 아래에 고무·폼·구슬층을 두고 같은 방식으로 바닥을 흔든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 상단 가속도·최대 변위·넘어짐 여부을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"영상 분석","title":"진동 주기와 진폭","detail":"스마트폰 영상의 기준점을 추적해 바닥과 상단 움직임을 시간에 따라 추출한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 진동주기·진폭비·감쇠시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"내진·면진·제진 비교","detail":"세 구조기술의 원리와 적용 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 힘 전달·변형 위치·장치·적용 건물을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"건물 바닥과 지면 사이의 면진층은 진동 전달을 얼마나 줄일까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["하중","구조","재료","열전달","안전"]}]},{"id":"chemical-materials","label":"화학·신소재공학","shortLabel":"화학신소재","accent":"#aa6330","concepts":["반응속도","고분자","복합재","흡착","전기화학"],"topics":[{"id":"chemical-materials-01","major":"화학·신소재공학","question":"고체 입자의 크기는 물에 녹는 속도에 어떤 영향을 줄까?","hypothesis":"같은 질량에서 입자가 작을수록 물과 닿는 전체 면적이 커져 더 빨리 녹을 것이다.","methods":[{"kind":"직접 실험","title":"입자 크기별 용해","detail":"같은 질량의 각설탕·굵은 설탕·고운 설탕을 같은 온도와 물의 양에서 녹인다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 완전 용해시간·시간별 남은 질량 또는 농도을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"입자 크기와 표면적","detail":"같은 부피의 입자를 정육면체로 가정해 한 변 길이에 따른 총 표면적을 계산한다. 입자 수·총 표면적·예상 속도 순위을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"분쇄 공정의 역할","detail":"의약품·식품·광물 공정에서 입자 크기를 조절하는 이유를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 용해·반응성·흐름성·에너지 비용을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"고체 입자의 크기는 물에 녹는 속도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-02","major":"화학·신소재공학","question":"온도가 높아지면 화학반응 속도는 어느 정도 빨라질까?","hypothesis":"온도가 높아질수록 반응 가능한 입자 충돌이 늘어 반응시간이 짧아질 것이다.","methods":[{"kind":"직접 실험","title":"온도별 발포정 반응","detail":"같은 물의 양에서 안전한 온도 범위를 정하고 같은 발포정을 넣는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 반응 완료시간·초기 기포 발생률·수온 변화을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"반응속도와 온도 곡선","detail":"각 온도에서 3회 이상 측정해 반응속도를 1/시간으로 바꾼다. 결측값과 단위를 확인한 뒤 온도-속도 그래프·증가율·측정 편차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·이론","title":"활성화에너지와 온도","detail":"충돌이론과 아레니우스 관계를 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 활성화에너지·유효충돌·촉매와의 차이을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"온도가 높아지면 화학반응 속도는 어느 정도 빨라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-03","major":"화학·신소재공학","question":"반응물의 농도는 반응속도와 생성물 발생량을 어떻게 바꿀까?","hypothesis":"다른 조건이 같을 때 농도가 높으면 초기 반응속도는 증가하지만 제한 반응물의 양에 따라 최종 생성량은 달라질 것이다.","methods":[{"kind":"직접 실험","title":"농도별 기체 발생","detail":"안전한 구연산·탄산수소나트륨 용액에서 한 물질의 농도만 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 일정 시간의 풍선 둘레 또는 기체 부피·완료시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"초기속도와 최종량 구분","detail":"시간별 생성량 곡선에서 초기 기울기와 최종값을 각각 구한다. 결측값과 단위를 확인한 뒤 농도별 초기속도·최종 생성량·제한 반응물을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"산업 반응기의 농도 제어","detail":"반응속도와 안전을 함께 고려하는 농도 제어 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 생산성·발열·혼합·폭주 방지을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"반응물의 농도는 반응속도와 생성물 발생량을 어떻게 바꿀까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-04","major":"화학·신소재공학","question":"용액의 pH와 염분은 금속의 부식 속도에 어떤 영향을 줄까?","hypothesis":"산성 또는 염분이 높은 조건에서는 전기화학 반응이 촉진되어 철의 부식이 더 빠를 것이다.","methods":[{"kind":"직접 실험","title":"용액 조건별 철 부식","detail":"같은 철못을 수돗물·소금물·묽은 식초물에 넣고 온도와 시간을 맞춘다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 질량 변화·녹 면적·용액 색 변화을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"이미지 분석","title":"부식면적 정량화","detail":"같은 조명에서 매일 촬영한 사진의 갈색 영역 비율을 계산한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 조건별 부식면적 증가율·반복 편차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"부식 방지 기술","detail":"도장·도금·희생양극의 원리와 사용 환경을 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 차단·전위차·유지보수·적용 금속을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"용액의 pH와 염분은 금속의 부식 속도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-05","major":"화학·신소재공학","question":"고분자 필름의 두께는 늘어날수록 인장강도와 늘어남이 같은 비율로 커질까?","hypothesis":"필름이 두꺼우면 파단하중은 커지지만 단면적으로 나눈 인장강도는 재료가 같다면 비슷할 것이다.","methods":[{"kind":"직접 실험","title":"두께별 필름 당김시험","detail":"같은 폭과 길이의 비닐을 1겹·2겹·3겹으로 만들고 추를 단계적으로 건다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 파단하중·늘어난 길이·단면적당 하중을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"하중과 강도의 구분","detail":"겹수별 최대하중과 단위두께당 값을 함께 계산한다. 결측값과 단위를 확인한 뒤 겉보기 강도·재료 고유 성질·접합 영향을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"고분자 사슬과 기계성질","detail":"결정성·가교·연신이 필름 성질을 바꾸는 자료를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 인장강도·연신율·투명성·가공법을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"고분자 필름의 두께는 늘어날수록 인장강도와 늘어남이 같은 비율로 커질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-06","major":"화학·신소재공학","question":"서로 다른 방향으로 층을 쌓은 복합재는 휨 강도가 어떻게 달라질까?","hypothesis":"섬유 방향을 번갈아 배치하면 한 방향으로만 쌓은 구조보다 여러 방향의 하중에 고르게 견딜 것이다.","methods":[{"kind":"제작·검증","title":"종이 복합재 적층","detail":"같은 종이를 결 방향 평행·교차·대각 배치로 같은 겹수만큼 접착한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 방향별 중앙 처짐·파손하중·질량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"강도와 방향성","detail":"각 적층판을 길이·폭 방향으로 시험해 강도비를 계산한다. 결측값과 단위를 확인한 뒤 방향별 강성·최대하중·이방성 지표을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"탄소섬유 복합재 설계","detail":"항공·자동차 부품의 적층각과 장단점을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 섬유방향·수지·충격·수리성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"서로 다른 방향으로 층을 쌓은 복합재는 휨 강도가 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-07","major":"화학·신소재공학","question":"표면 코팅의 종류와 두께는 물의 흡수와 재료 보호에 어떤 영향을 줄까?","hypothesis":"공극을 잘 막는 연속 코팅은 물 흡수를 줄이지만 균열이나 빈틈이 있으면 두께가 두꺼워도 보호 효과가 급감할 것이다.","methods":[{"kind":"직접 실험","title":"코팅별 흡수량","detail":"같은 종이 또는 석고 조각에 왁스·수성코팅·테이프를 같은 면적으로 적용한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 침수 전후 질량·젖은 면적·코팅 질량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"설계·검증","title":"코팅 횟수와 결함","detail":"같은 코팅을 1·2·3회 바르고 일부 표본에는 일정한 흠집을 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 흡수율·흠집 주변 침투거리·건조시간을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"방수·방오 표면","detail":"발수 코팅과 초소수성 표면의 원리를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 접촉각·표면거칠기·내구성·환경 영향을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"표면 코팅의 종류와 두께는 물의 흡수와 재료 보호에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-08","major":"화학·신소재공학","question":"활성탄의 양과 입자 크기는 색소 제거 속도에 어떤 영향을 줄까?","hypothesis":"활성탄의 양이 많고 입자가 작을수록 흡착 가능한 표면이 커져 색 농도가 더 빠르게 감소할 것이다.","methods":[{"kind":"직접 실험","title":"활성탄 조건별 탈색","detail":"식용색소 용액의 농도와 부피를 고정하고 활성탄 양 또는 입자 크기만 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 사진 밝기 또는 흡광 대용값·여과시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"흡착량과 속도 분리","detail":"처리 전후 색 농도와 활성탄 질량으로 단위질량당 제거량을 계산한다. 결측값과 단위를 확인한 뒤 제거율·g당 제거량·평형 도달시간을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"흡착제의 선택성","detail":"정수·공기정화용 활성탄과 다른 흡착재를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 기공크기·표면적·대상물질·재생 방법을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"활성탄의 양과 입자 크기는 색소 제거 속도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-09","major":"화학·신소재공학","question":"용액의 냉각 속도는 결정의 크기와 개수에 어떤 영향을 줄까?","hypothesis":"천천히 식히면 적은 핵에서 결정이 오래 성장해 크고 수가 적은 결정이 생길 것이다.","methods":[{"kind":"직접 실험","title":"냉각 조건별 결정화","detail":"같은 농도의 명반 또는 소금 포화용액을 빠른 냉각과 느린 냉각 조건에 둔다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 결정 수·평균 크기·회수 질량·형성시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"이미지 분석","title":"결정 크기 분포","detail":"같은 배율의 사진에서 각 결정의 면적을 측정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 중앙값·최대크기·크기 분포·조건별 편차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"핵생성과 결정 성장","detail":"의약품·반도체 재료의 결정화 조건을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 과포화도·불순물·냉각속도·제품 품질을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"용액의 냉각 속도는 결정의 크기와 개수에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]},{"id":"chemical-materials-10","major":"화학·신소재공학","question":"전극 재료와 충방전 속도는 배터리 용량 유지에 어떤 영향을 줄까?","hypothesis":"빠르게 충방전할수록 내부 저항과 반응 제한으로 사용 가능한 용량이 줄고 온도 상승이 커질 것이다.","methods":[{"kind":"공개 데이터 분석","title":"방전율별 용량 곡선","detail":"배터리 공개자료에서 같은 셀의 방전율·전압·용량·온도를 추출한다. 결측값과 단위를 확인한 뒤 방전율별 사용용량·평균전압·에너지을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문 비교","title":"전극 재료 성능 비교","detail":"양극 또는 음극 재료가 다른 연구를 같은 평가조건 중심으로 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 비용량·수명·안전성·측정 전류·온도을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."},{"kind":"수학 모형","title":"내부저항과 전압강하","detail":"전류와 내부저항을 바꿔 단자전압과 손실전력을 계산한다. 전류별 전압강하·발열·사용 가능 에너지을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"전극 재료와 충방전 속도는 배터리 용량 유지에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["반응속도","고분자","복합재","흡착","전기화학"]}]},{"id":"industrial-safety","label":"산업·안전공학","shortLabel":"산업안전","accent":"#52774b","concepts":["공정","대기행렬","품질","인체공학","위험성평가"],"topics":[{"id":"industrial-safety-01","major":"산업·안전공학","question":"작업도구의 배치 거리는 조립시간과 불필요한 동작 수에 어떤 영향을 줄까?","hypothesis":"자주 쓰는 도구를 손이 쉽게 닿는 범위에 공정 순서대로 놓으면 이동거리와 작업시간이 줄어들 것이다.","methods":[{"kind":"모형 실험","title":"배치별 조립 작업","detail":"블록 조립 순서와 도구 수를 고정하고 무작위·거리순·공정순 배치에서 같은 작업을 반복한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 완료시간·손 이동거리·도구 찾기 횟수·실수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"영상 분석","title":"동작 분해와 낭비 측정","detail":"손의 이동 경로를 영상에서 표시하고 잡기·이동·대기 동작으로 분류한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 동작별 시간 비율·총 이동거리·반복 편차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"작업장 동작경제 원칙","detail":"산업공학의 작업측정과 인체공학적 배치 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 정상 작업영역·양손 사용·피로·표준시간을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"작업도구의 배치 거리는 조립시간과 불필요한 동작 수에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-02","major":"산업·안전공학","question":"대기줄의 도착 간격과 처리 창구 수는 평균 대기시간에 어떤 영향을 줄까?","hypothesis":"도착률이 처리율에 가까워질수록 대기시간이 급격히 늘고 창구를 하나 더 열면 혼잡 구간에서 효과가 클 것이다.","methods":[{"kind":"시뮬레이션","title":"대기행렬 모형","detail":"사람의 도착간격과 창구당 처리시간을 무작위로 만들고 창구 수를 1~3개로 바꾼다. 평균·최대 대기시간·줄 길이·창구 가동률을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"수학 모형","title":"도착률과 처리율 비교","detail":"분당 도착 인원과 처리 인원의 비율을 단계적으로 높인다. 부하율·예상 대기인원·불안정 조건을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"창구 운영 전략","detail":"은행·매표소·콜센터의 단일줄과 여러 줄 운영 자료를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 공정성·유휴시간·대기시간·인력비용을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"대기줄의 도착 간격과 처리 창구 수는 평균 대기시간에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-03","major":"산업·안전공학","question":"재고를 언제 다시 주문하느냐에 따라 품절과 보관량은 어떻게 달라질까?","hypothesis":"주문 기준점을 높이면 품절은 줄지만 평균 재고와 보관비용은 증가할 것이다.","methods":[{"kind":"시뮬레이션","title":"재주문점별 재고","detail":"일별 수요와 배송기간을 무작위로 두고 주문 기준점과 주문량을 바꾼다. 품절일수·평균재고·긴급주문·총비용을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"수요 변동과 안전재고","detail":"공개 또는 가상 판매자료의 일별 평균과 표준편차를 구한다. 결측값과 단위를 확인한 뒤 배송기간별 안전재고·서비스 수준·재고회전을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"사례 분석","title":"재고관리 방식 비교","detail":"편의점·제조업·온라인 물류의 재고보충 방식을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 수요예측·배송주기·유통기한·품절 비용을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"재고를 언제 다시 주문하느냐에 따라 품절과 보관량은 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-04","major":"산업·안전공학","question":"한 번에 처리하는 작업 묶음의 크기는 전체 완료시간과 대기재공품에 어떤 영향을 줄까?","hypothesis":"큰 묶음은 준비 횟수를 줄이지만 다음 공정이 늦게 시작되어 전체 흐름시간과 대기품이 늘어날 수 있다.","methods":[{"kind":"모형 실험","title":"배치 크기별 2단계 공정","detail":"종이 접기와 표시하기처럼 두 공정을 정하고 1개·5개·10개씩 넘기는 조건을 반복한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 첫 제품·마지막 제품 완료시간·공정 사이 대기품 수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"시뮬레이션","title":"준비시간이 있는 공정","detail":"공정별 준비시간과 개당 처리시간을 설정하고 배치 크기를 바꾼다. 총완료시간·가동률·평균 재공품을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"소량흐름과 대량생산","detail":"린 생산의 한 개 흐름과 대량 배치의 적용 조건을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 준비시간·품종·수요·불량 발견 시점을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"한 번에 처리하는 작업 묶음의 크기는 전체 완료시간과 대기재공품에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-05","major":"산업·안전공학","question":"제품 일부만 검사할 때 표본 수는 불량을 발견할 확률을 어떻게 바꿀까?","hypothesis":"불량률이 같다면 검사 표본이 클수록 최소 한 개의 불량을 찾을 확률이 높아지지만 검사비용도 늘어날 것이다.","methods":[{"kind":"시뮬레이션","title":"표본검사 발견률","detail":"서로 다른 불량률의 가상 제품에서 5·10·20·50개를 무작위 추출하는 과정을 반복한다. 표본 수별 불량 발견률·검사량·미검출 횟수을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"수학 모형","title":"미검출 확률 계산","detail":"불량률과 표본 수를 변수로 불량이 하나도 뽑히지 않을 확률을 계산한다. 조건별 검출확률·목표 검출률에 필요한 표본을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"전수검사와 표본검사","detail":"식품·전자부품의 품질검사 계획 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 검사비용·파괴검사·허용불량률·오판 위험을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"제품 일부만 검사할 때 표본 수는 불량을 발견할 확률을 어떻게 바꿀까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-06","major":"산업·안전공학","question":"물체까지 손을 뻗는 거리와 작업대 높이는 작업속도와 자세 부담을 어떻게 바꿀까?","hypothesis":"팔을 멀리 뻗거나 작업대가 지나치게 높고 낮으면 동작시간과 관절 각도 부담이 커질 것이다.","methods":[{"kind":"모형 실험","title":"도달거리별 반복 작업","detail":"안전한 가벼운 물체를 가까움·중간·먼 위치에서 같은 횟수만큼 옮긴다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 완료시간·상체 기울기·물체 놓침 횟수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"영상 분석","title":"관절각도 정량화","detail":"옆면 영상에서 어깨·팔꿈치·허리의 기준점을 표시해 조건별 최대각도를 잰다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 관절각도·동작시간·반복 간 변화을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"인체치수 기반 작업대","detail":"서서·앉아서 하는 작업의 권장 높이와 도달범위 자료를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 사용자 치수·정밀도·힘·조절 가능성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"물체까지 손을 뻗는 거리와 작업대 높이는 작업속도와 자세 부담을 어떻게 바꿀까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-07","major":"산업·안전공학","question":"경고표지의 색 대비와 정보량은 목표 기호를 찾는 시간에 어떤 영향을 줄까?","hypothesis":"배경과 대비가 크고 핵심 기호가 단순할수록 복잡한 화면에서 위험정보를 더 빨리 찾을 것이다.","methods":[{"kind":"객관식 시각탐색 실험","title":"표지 디자인별 탐색시간","detail":"같은 위치 수와 크기에서 색 대비·글자 수·기호 복잡도만 바꾼 화면을 제시한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 정답 여부·반응시간·조건별 오답 유형을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"이미지 분석","title":"명도 대비 계산","detail":"표지와 배경의 RGB 또는 상대휘도 값을 이용해 대비비를 계산한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 디자인별 대비비·탐색시간과의 관계을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"표준·사례 분석","title":"안전표지 설계기준","detail":"산업 안전표지의 색·형태·픽토그램 기준을 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 금지·경고·지시 구분·가독거리·표준화 이유을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"경고표지의 색 대비와 정보량은 목표 기호를 찾는 시간에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-08","major":"산업·안전공학","question":"완충재의 구조와 사용량은 낙하 충격을 얼마나 줄일까?","hypothesis":"같은 질량의 완충재라도 구겨진 종이·공기층처럼 변형거리가 큰 구조가 최대 충격을 더 낮출 것이다.","methods":[{"kind":"제작·검증","title":"포장구조 낙하시험","detail":"같은 상자와 모형제품에 평판·주름·격자 완충재를 같은 질량만큼 넣어 같은 높이에서 낙하시킨다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 제품 변형·상자 손상·스마트폰 제외 안전한 충격지표을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"영상 분석","title":"충돌시간 비교","detail":"고속 촬영 영상에서 바닥 접촉부터 정지까지 프레임 수와 튀어오른 높이를 잰다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 충돌시간·반발높이·구조 변형량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"포장 최적화","detail":"종이·폼·공기 완충재의 낙하보호와 환경성을 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 완충곡선·제품질량·재사용·재료 사용량을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"완충재의 구조와 사용량은 낙하 충격을 얼마나 줄일까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-09","major":"산업·안전공학","question":"공정별 처리시간의 차이는 전체 생산량과 대기품을 어떻게 결정할까?","hypothesis":"가장 느린 공정 앞에 대기품이 쌓이며 그 공정을 개선할 때 전체 생산량이 가장 크게 증가할 것이다.","methods":[{"kind":"모형 실험","title":"3단계 공정의 병목","detail":"분류·조립·검사 세 작업의 처리시간을 다르게 정하고 일정 수의 제품을 흘려보낸다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 공정별 가동시간·대기품·시간당 완제품을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"시뮬레이션","title":"개선 위치별 효과","detail":"느린 공정·빠른 공정의 처리시간을 각각 20% 줄여 결과를 비교한다. 생산량 증가·평균 대기·공정 가동률을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"제약이론과 병목관리","detail":"제조·물류 시스템에서 병목을 찾고 개선한 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 제약공정·버퍼·개선 전후 지표·새 병목을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"공정별 처리시간의 차이는 전체 생산량과 대기품을 어떻게 결정할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]},{"id":"industrial-safety-10","major":"산업·안전공학","question":"위험의 발생가능성과 피해크기를 함께 평가하면 개선 우선순위는 어떻게 달라질까?","hypothesis":"자주 발생하지만 피해가 작은 위험과 드물지만 피해가 큰 위험은 단일 기준보다 종합점수에서 우선순위가 달라질 것이다.","methods":[{"kind":"사례 분석","title":"교내 활동 위험요인 분해","detail":"실험·이동·공구 사용 등 가상 상황의 고장형태와 원인을 정리한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 발생가능성·심각도·발견가능성·현재 통제을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."},{"kind":"수학 모형","title":"위험우선순위 민감도","detail":"세 점수의 곱 또는 가중합에서 점수 하나씩을 바꾼다. 위험 순위 변화·가중치 영향·동점 사례을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·표준","title":"FMEA와 위험성평가 비교","detail":"공정 FMEA와 위험성평가의 절차와 한계를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 평가단계·근거자료·개선조치·재평가을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"위험의 발생가능성과 피해크기를 함께 평가하면 개선 우선순위는 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["공정","대기행렬","품질","인체공학","위험성평가"]}]},{"id":"environment-energy","label":"환경·에너지공학","shortLabel":"환경에너지","accent":"#2b8c7e","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"],"topics":[{"id":"environment-energy-01","major":"환경·에너지공학","question":"바닥과 지붕 재료의 색은 주변 표면온도와 열 방출에 어떤 영향을 줄까?","hypothesis":"어두운 표면은 빛을 더 많이 흡수해 낮 동안 온도가 높고, 광원을 끈 뒤에도 저장된 열을 더 오래 방출할 것이다.","methods":[{"kind":"모형 실험","title":"재료·색상별 온도","detail":"같은 크기의 검정·흰색 종이와 아스팔트·잔디 대체재를 같은 광원에 둔다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 가열·냉각 시간별 표면온도·최고온도을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"공공데이터 분석","title":"토지피복과 기온","detail":"지역별 녹지율·불투수면 비율·지표면온도 자료를 같은 공간단위로 정리한다. 결측값과 단위를 확인한 뒤 피복률-온도 관계·시간대·예외 지역을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"도시열섬 저감기술","detail":"쿨루프·투수포장·도시숲 연구를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 저감온도·적용면적·물관리·계절 영향을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"바닥과 지붕 재료의 색은 주변 표면온도와 열 방출에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-02","major":"환경·에너지공학","question":"건물의 틈새와 단열 두께는 냉난방 에너지 손실에 어떤 영향을 줄까?","hypothesis":"단열을 두껍게 해도 틈새로 공기가 많이 드나들면 열손실이 커져 단열 효과가 제한될 것이다.","methods":[{"kind":"모형 실험","title":"단열·기밀 조건 비교","detail":"같은 상자에 단열층 유무와 일정 크기 틈새 유무를 조합해 따뜻한 물을 넣는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 내부온도·초기 냉각률·조건 간 차이을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"전도와 환기 손실","detail":"벽 면적·열관류율·실내외 온도차와 환기량을 변수로 열손실을 계산한다. 단열 두께별 손실·틈새 손실 비중을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"제로에너지 건축","detail":"고단열·고기밀·열회수환기 적용 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 에너지 절감·실내공기질·결로·시공 품질을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"건물의 틈새와 단열 두께는 냉난방 에너지 손실에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-03","major":"환경·에너지공학","question":"바람의 세기와 건물 배치는 미세먼지 농도의 시간 변화에 어떤 영향을 줄까?","hypothesis":"풍속이 높으면 오염물질이 빠르게 희석되지만 건물 사이 막힌 공간에서는 약한 순환 때문에 농도가 오래 유지될 것이다.","methods":[{"kind":"공공데이터 분석","title":"풍속과 미세먼지","detail":"시간별 풍속·풍향·PM2.5 자료를 강수 없는 날 중심으로 결합한다. 결측값과 단위를 확인한 뒤 풍속구간별 농도·시간지연·풍향별 차이을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시뮬레이션","title":"거리 협곡 환기 모형","detail":"간단한 격자에서 건물 높이·간격·바람 방향을 바꾸고 입자 이동을 모형화한다. 평균 체류시간·고농도 영역·배출구 위치 영향을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문 비교","title":"도시형태와 대기질","detail":"가로수·건물높이·도로폭이 오염 확산에 미치는 연구를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 풍동/수치해석 조건·농도 변화·적용 한계을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"바람의 세기와 건물 배치는 미세먼지 농도의 시간 변화에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-04","major":"환경·에너지공학","question":"여과재의 종류와 층 순서는 탁도 제거와 물의 흐름속도를 어떻게 바꿀까?","hypothesis":"고운 여과재를 많이 쓰면 탁도는 낮아지지만 흐름 저항이 커져 처리시간이 길어질 것이다.","methods":[{"kind":"모형 실험","title":"여과층 조건별 비교","detail":"자갈·굵은모래·솜을 같은 총높이에서 종류와 순서만 바꾸고 식용 흙탕물을 통과시킨다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 통과시간·처리량·사진 밝기로 본 탁도·막힘을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"설계·검증","title":"정화도와 유량 최적화","detail":"여과층 두께 비율을 바꾸고 목표 탁도와 최소 유량을 동시에 정한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 조건별 제거율·분당 유량·재료량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"정수처리 공정의 역할","detail":"응집·침전·여과·소독 단계를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 각 단계 제거대상·운전조건·모형 여과수는 음용 불가인 이유을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"여과재의 종류와 층 순서는 탁도 제거와 물의 흐름속도를 어떻게 바꿀까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-05","major":"환경·에너지공학","question":"태양광 패널의 설치각과 그늘 면적은 하루 발전량에 어떤 영향을 줄까?","hypothesis":"빛을 수직에 가깝게 받을수록 출력이 높고 작은 부분 그늘도 직렬 연결 셀의 전체 출력을 크게 낮출 수 있다.","methods":[{"kind":"직접 실험","title":"각도·그늘별 출력","detail":"같은 소형 패널에서 각도를 바꾸고 불투명 종이로 면적의 0%·10%·25%를 가린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 전압·전류·전력·시간별 반복값을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"공공데이터 분석","title":"태양 고도와 발전량","detail":"시간별 일사량·태양고도·발전량 자료에서 맑은 날을 골라 정리한다. 결측값과 단위를 확인한 뒤 고도별 출력·오전/오후 차이·온도 영향을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시뮬레이션","title":"계절별 최적각","detail":"지역 위도와 월별 태양고도를 이용해 경사면에 들어오는 상대 일사량을 계산한다. 월별 최적각·고정각 대비 손실을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"태양광 패널의 설치각과 그늘 면적은 하루 발전량에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-06","major":"환경·에너지공학","question":"풍력터빈 날개의 개수와 각도는 발전전압과 회전 시작 풍속에 어떤 영향을 줄까?","hypothesis":"날개 수나 각도가 커지면 낮은 풍속에서 회전은 쉬워지지만 저항이 증가해 높은 풍속의 최고 회전수는 낮아질 수 있다.","methods":[{"kind":"제작·검증","title":"날개 조건별 소형 터빈","detail":"같은 모터와 날개 면적에서 날개 수 또는 피치각 하나만 바꿔 선풍기 앞에서 시험한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 회전 시작 거리·무부하 전압·부하 전력을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"풍속-출력 곡선","detail":"안전한 풍속 단계에서 조건별 전압·전류를 3회 이상 측정한다. 결측값과 단위를 확인한 뒤 시동 풍속·최대전력·단위면적당 출력을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"터빈 형식과 운전환경","detail":"수평축·수직축 풍력터빈의 설계와 적용 사례를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 효율·풍향 대응·소음·유지보수을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"풍력터빈 날개의 개수와 각도는 발전전압과 회전 시작 풍속에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-07","major":"환경·에너지공학","question":"음식물폐기물의 수분함량은 건조에 필요한 에너지와 질량 감소에 어떤 영향을 줄까?","hypothesis":"초기 수분함량이 높을수록 같은 최종 질량에 도달하는 데 더 많은 시간과 에너지가 필요할 것이다.","methods":[{"kind":"안전한 모형 실험","title":"수분량별 건조","detail":"같은 마른 재료에 물의 양만 다르게 더해 얕은 용기에 펴고 동일한 안전 온도에서 말린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간별 질량·건조속도·최종 수분 추정을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"물 증발 에너지 계산","detail":"제거할 물의 질량과 물의 비열·증발잠열을 이용해 최소 에너지를 계산한다. 수분량별 이론에너지·실제 장치 손실 요인을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"자료 분석","title":"처리방식별 에너지·자원화","detail":"건조·퇴비화·혐기성소화 자료를 같은 처리량 기준으로 비교한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 에너지 사용·처리시간·생성물·악취 관리을 측정해 평균과 변동 폭으로 가설을 판단한다."}],"focus":"음식물폐기물의 수분함량은 건조에 필요한 에너지와 질량 감소에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-08","major":"환경·에너지공학","question":"물의 낙차와 유량은 소형 수력발전 출력에 어떤 영향을 줄까?","hypothesis":"유량과 낙차가 커질수록 물이 가진 위치에너지가 증가해 출력이 커지지만 장치 손실 때문에 이론값보다는 작을 것이다.","methods":[{"kind":"모형 실험","title":"낙차·유량별 발전","detail":"같은 소형 물레와 모터에 물통 높이 또는 단위시간 물의 양 하나만 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 전압·전류·전력·사용 물의 부피을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"수력 위치에너지","detail":"물의 밀도·중력·유량·낙차로 이론 출력을 계산한다. 이론출력·실측출력·효율·오차 요인을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"대형·소수력 발전 비교","detail":"댐식·수로식·상수도 소수력 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 낙차·유량·환경영향·출력 안정성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"물의 낙차와 유량은 소형 수력발전 출력에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-09","major":"환경·에너지공학","question":"교실의 외기온·일사량·재실인원은 냉난방 에너지 사용량을 얼마나 설명할까?","hypothesis":"외기온과 실내 설정온도의 차이가 클수록 에너지 사용이 늘고, 같은 외기온에서도 재실인원과 햇빛 조건에 따라 차이가 날 것이다.","methods":[{"kind":"공공·모형 데이터 분석","title":"기상과 에너지 결합","detail":"공개 건물에너지 자료와 같은 시간대의 기온·일사량을 결합한다. 결측값과 단위를 확인한 뒤 변수별 상관·시간대별 사용량·주중/주말 차이을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"회귀 모형","title":"에너지 사용 예측","detail":"외기온·시간·일사량·재실 대용변수로 단순 회귀모형을 만든다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 예측오차·변수계수·설명되지 않는 구간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"사례 분석","title":"건물 에너지관리","detail":"센서와 자동제어로 에너지를 줄인 학교·공공건물 사례를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 제어변수·절감률·쾌적성·운영 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"교실의 외기온·일사량·재실인원은 냉난방 에너지 사용량을 얼마나 설명할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["열섬","여과","재생에너지","탄소배출","에너지효율"]},{"id":"environment-energy-10","major":"환경·에너지공학","question":"같은 거리를 이동할 때 교통수단별 탄소배출량은 승차인원에 따라 어떻게 달라질까?","hypothesis":"차량 한 대의 배출량이 커도 승차인원이 많아지면 1인·1km당 배출량은 줄어들어 교통수단 순위가 달라질 수 있다.","methods":[{"kind":"공공데이터 분석","title":"교통수단별 배출원단위","detail":"승용차·버스·철도의 에너지 사용과 배출계수를 같은 거리 기준으로 정리한다. 결측값과 단위를 확인한 뒤 차량-km 배출량·평균 탑승률·인-km 배출량을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시나리오 모형","title":"승차인원 민감도","detail":"승용차와 버스의 탑승인원을 단계적으로 바꿔 1인당 배출량을 계산한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3 rols":"같은 시계열 원자료","resources":"시간별 온도 또는 센서값 CSV","concepts":["표본","평균과 중앙값","확률","함수","자료 시각화"],"methods":[{"kind":"데이터 분석","title":"이동평균과 신호 지연 자료 분석","detail":"시간별 온도 또는 센서값 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 이동평균 창의 크기을 기준으로 자료를 나눈다. 각 조건의 변동 폭과 최고점이 나타나는 시점을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"이동평균 창의 크기을 가로축, 변동 폭과 최고점이 나타나는 시점을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"이동평균과 신호 지연 자료 비교","detail":"이동평균과 신호 지연을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 이동평균 창의 크기과 변동 폭과 최고점이 나타나는 시점의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"mathematics-statistics-05","major":"수학·통계학","question":"동전 던지기 횟수가 늘어나면 앞면의 비율은 0.5에 가까워질까?","hypothesis":"시행 횟수가 증가할수록 앞면 비율의 변동 폭이 줄어 0.5에 가까워질 것이다.","focus":"큰 수의 법칙","change":"동전 던지기 횟수","measure":"앞면 비율과 반복 실험의 범위","controls":"동전의 종류와 모의실험 규칙","resources":"동전 또는 스프레드시트 난수 함수","concepts":["표본","평균과 중앙값","확률","함수","자료 시각화"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"큰 수의 법칙 조건 모형","detail":"동전 또는 스프레드시트 난수 함수을 사용한다. 동전 던지기 횟수을 일정한 간격으로 바꾸고 앞면 비율과 반복 실험의 범위을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 동전 던지기 횟수 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 앞면 비율과 반복 실험의 범위의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"큰 수의 법칙 자료 비교","detail":"큰 수의 법칙을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 동전 던지기 횟수과 앞면 비율과 반복 실험의 범위의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"mathematics-statistics-06","major":"수학·통계학","question":"생일 문제에서 사람 수가 늘어나면 같은 생일이 있을 확률은 얼마나 빠르게 증가할까?","hypothesis":"사람 수가 늘어날수록 가능한 사람 쌍이 빠르게 증가해 예상보다 적은 인원에서도 같은 생일 확률이 높아질 것이다.","focus":"조합과 생일 문제","change":"가상 집단의 사람 수","measure":"같은 생일 발생 비율","controls":"1년을 365일로 두는 조건과 반복 횟수","resources":"스프레드시트 난수 또는 간단한 파이썬 템플릿","concepts":["표본","평균과 중앙값","확률","함수","자료 시각화"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"조합과 생일 문제 조건 모형","detail":"스프레드시트 난수 또는 간단한 파이썬 템플릿을 사용한다. 가상 집단의 사람 수을 일정한 간격으로 바꾸고 같은 생일 발생 비율을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 가상 집단의 사람 수 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 같은 생일 발생 비율의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"조합과 생일 문제 자료 비교","detail":"조합과 생일 문제을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 가상 집단의 사람 수과 같은 생일 발생 비율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"mathematics-statistics-07","major":"수학·통계학","question":"몬티홀 문제에서 선택을 바꾸는 전략이 실제로 더 유리할까?","hypothesis":"진행자가 빈 문을 알려 준 뒤 선택을 바꾸면 성공률이 약 두 배 높아질 것이다.","focus":"조건부확률과 선택 전략","change":"유지 전략과 변경 전략","measure":"전략별 성공률","controls":"진행자가 반드시 빈 문을 여는 규칙과 시행 횟수","resources":"카드 3장 또는 제공된 모의실험 표","concepts":["표본","평균과 중앙값","확률","함수","자료 시각화"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"조건부확률과 선택 전략 조건 모형","detail":"카드 3장 또는 제공된 모의실험 표을 사용한다. 유지 전략과 변경 전략을 일정한 간격으로 바꾸고 전략별 성공률을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 유지 전략과 변경 전략 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 전략별 성공률의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"조건부확률과 선택 전략 자료 비교","detail":"조건부확률과 선택 전략을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 유지 전략과 변경 전략과 전략별 성공률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"mathematics-statistics-08","major":"수학·통계학","question":"같은 냉각 자료에 선형함수와 지수함수를 적용하면 어느 모형의 오차가 작을까?","hypothesis":"온도 차가 시간에 따라 일정한 비율로 감소하므로 지수모형의 예측오차가 더 작을 것이다.","focus":"함수 모형과 예측오차","change":"선형모형과 지수모형","measure":"실측값과 예측값의 이상값을 확인한 뒤 2시간 전후 질량 변화와 흡수율의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"씨앗 크기와 수분 흡수 자료 비교","detail":"씨앗 크기와 수분 흡수을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 씨앗 크기 또는 종류과 2시간 전후 질량 변화와 흡수율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-04","major":"생명과학·농학","question":"운동 강도가 달라지면 심박수가 원래 수준으로 돌아오는 시간은 달라질까?","hypothesis":"안전한 범위에서 운동 강도가 높을수록 운동 직후 심박수와 회복시간이 증가할 것이다.","focus":"운동 강도와 심박 회복","change":"제자리 걷기의 속도 또는 시간","measure":"운동 직후 심박수와 회복시간","controls":"같은 학생의 측정·휴식시간·측정 자세·안전 범위","resources":"스마트폰 타이머·심박 측정 기록지·낮은 강도의 제자리 걷기","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"객관적 수행 검사","title":"운동 강도와 심박 회복 수행 비교","detail":"스마트폰 타이머·심박 측정 기록지·낮은 강도의 제자리 걷기을 준비한다. 제자리 걷기의 속도 또는 시간만 다르게 하고 같은 학생의 측정·휴식시간·측정 자세·안전 범위을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 운동 직후 심박수와 회복시간을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 운동 직후 심박수와 회복시간을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"운동 강도와 심박 회복 자료 비교","detail":"운동 강도와 심박 회복을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 제자리 걷기의 속도 또는 시간과 운동 직후 심박수와 회복시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-05","major":"생명과학·농학","question":"우세손과 비우세손은 자 떨어뜨리기 반응거리에서 차이가 날까?","hypothesis":"평소 자주 사용하는 우세손의 평균 반응거리가 더 짧고 변동도 작을 것이다.","focus":"우세손과 반응시간","change":"우세손과 비우세손","measure":"자를 잡은 낙하거리와 환산 반응시간","controls":"자 시작 위치·시선·시행 횟수·예고하지 않는 방식","resources":"30cm 자·기록지·반응시간 환산표","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"객관적 수행 검사","title":"우세손과 반응시간 수행 비교","detail":"30cm 자·기록지·반응시간 환산표을 준비한다. 우세손과 비우세손만 다르게 하고 자 시작 위치·시선·시행 횟수·예고하지 않는 방식을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 자를 잡은 낙하거리와 환산 반응시간을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 자를 잡은 낙하거리와 환산 반응시간을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"우세손과 반응시간 자료 비교","detail":"우세손과 반응시간을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 우세손과 비우세손과 자를 잡은 낙하거리와 환산 반응시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-06","major":"생명과학·농학","question":"잎의 앞면과 뒷면은 물방울이 퍼지는 정도가 다를까?","hypothesis":"기공과 표면구조가 다른 잎의 앞뒷면에서 물방울 접촉 면적이 다르게 나타날 것이다.","focus":"잎 표면과 발수성","change":"잎의 앞면·뒷면과 식물 종류","measure":"같은 물방울의 퍼진 지름","controls":"물방울 부피·촬영각도·잎 크기·시간","resources":"여러 잎·스포이트·격자종이·스마트폰","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"직접 실험","title":"잎 표면과 발수성 조건 비교","detail":"여러 잎·스포이트·격자종이·스마트폰을 준비한다. 잎의 앞면·뒷면과 식물 종류만 3가지 조건으로 바꾸고 물방울 부피·촬영각도·잎 크기·시간은 동일하게 유지한다. 조건별로 같은 물방울의 퍼진 지름을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"같은 물방울의 퍼진 지름 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 같은 물방울의 퍼진 지름의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"잎 표면과 발수성 자료 비교","detail":"잎 표면과 발수성을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 잎의 앞면·뒷면과 식물 종류과 같은 물방울의 퍼진 지름의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-07","major":"생명과학·농학","question":"잎의 넓이가 커지면 2시간 동안 줄어드는 물의 질량이 증가할까?","hypothesis":"노출된 잎의 전체 면적이 넓을수록 증산에 의한 물의 질량 감소가 클 것이다.","focus":"잎 면적과 증산","change":"노출하는 잎의 수 또는 면적","measure":"용기 전체의 시간별 질량 감소","controls":"물의 양·용기 입구 밀봉·조명·온도·측정시간","resources":"잎이 달린 가지·물병·랩·전자저울","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"직접 실험","title":"잎 면적과 증산 조건 비교","detail":"잎이 달린 가지·물병·랩·전자저울을 준비한다. 노출하는 잎의 수 또는 면적만 3가지 조건으로 바꾸고 물의 양·용기 입구 밀봉·조명·온도·측정시간은 동일하게 유지한다. 조건별로 용기 전체의 시간별 질량 감소을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"용기 전체의 시간별 질량 감소 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 용기 전체의 시간별 질량 감소의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"잎 면적과 증산 자료 비교","detail":"잎 면적과 증산을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 노출하는 잎의 수 또는 면적과 용기 전체의 시간별 질량 감소의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-08","major":"생명과학·농학","question":"완두콩 형질을 모형으로 반복 추출하면 이론적 유전비에 가까워질까?","hypothesis":"추출 횟수가 증가할수록 관찰한 표현형 비율이 이론적 확률에 가까워질 것이다.","focus":"멘델 유전과 확률","change":"가상 자손의 수","measure":"표현형 비율과 이론비의 차이","controls":"부모 유전자형·추출 규칙·반복 횟수","resources":"색 구슬 또는 종이카드·유전 조합표","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"멘델 유전과 확률 조건 모형","detail":"색 구슬 또는 종이카드·유전 조합표을 사용한다. 가상 자손의 수을 일정한 간격으로 바꾸고 표현형 비율과 이론비의 차이을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 가상 자손의 수 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 표현형 비율과 이론비의 차이의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"멘델 유전과 확률 자료 비교","detail":"멘델 유전과 확률을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 가상 자손의 수과 표현형 비율과 이론비의 차이의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-09","major":"생명과학·농학","question":"방형구의 크기와 개수는 가상 생태조사의 개체수 추정에 어떤 영향을 줄까?","hypothesis":"작은 방형구를 적게 사용하면 추정값의 변동이 크고, 표본 면적이 넓을수록 실제값에 가까워질 것이다.","focus":"방형구 표본과 개체수 추정","change":"방형구 크기와 추출 개수","measure":"전체 개체수 추정값과 실제값의 오차","controls":"같은 가상 서식지 지도와 추출 방법","resources":"개체가 표시된 격자 생태지도와 투명 방형구","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"데이터 분석","title":"방형구 표본과 개체수 추정 자료 분석","detail":"개체가 표시된 격자 생태지도와 투명 방형구을 준비한다. 결측값·중복값·단위를 먼저 확인하고 방형구 크기와 추출 개수을 기준으로 자료를 나눈다. 각 조건의 전체 개체수 추정값과 실제값의 오차을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"방형구 크기와 추출 개수을 가로축, 전체 개체수 추정값과 실제값의 오차을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"방형구 표본과 개체수 추정 자료 비교","detail":"방형구 표본과 개체수 추정을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 방형구 크기와 추출 개수과 전체 개체수 추정값과 실제값의 오차의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"life-agriculture-10","major":"생명과학·농학","question":"아밀레이스가 전분을 분해하는 시간은 온도에 따라 달라질까?","hypothesis":"체온에 가까운 조건에서 전분 반응색이 가장 빠르게 사라지고 지나치게 높은 온도에서는 느려질 것이다.","focus":"온도와 효소 활성","change":"아밀레이스 용액의 온도","measure":"아이오딘 전분 반응색이 약해지는 시간","controls":"전분·효소의 양과 농도·반응시간·용기","resources":"교육용 아밀레이스·전분용액·아이오딘용액·온도계·보안경","concepts":["효소","항상성","생태","유전","생물의 반응"],"methods":[{"kind":"직접 실험","title":"온도와 효소 활성 조건 비교","detail":"교육용 아밀레이스·전분용액·아이오딘용액·온도계·보안경을 준비한다. 아밀레이스 용액의 온도만 3가지 조건으로 바꾸고 전분·효소의 양과 농도·반응시간·용기은 동일하게 유지한다. 조건별로 아이오딘 전분 반응색이 약해지는 시간을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"아이오딘 전분 반응색이 약해지는 시간 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 아이오딘 전분 반응색이 약해지는 시간의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"온도와 효소 활성 자료 비교","detail":"온도와 효소 활성을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 아밀레이스 용액의 온도과 아이오딘 전분 반응색이 약해지는 시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]}]},{"id":"earth-environment-science","label":"환경과학·지구과학","concepts":["물의 순환","지표 변화","대기","기후","지구 시스템"],"accent":"#247a73","topics":[{"id":"earth-environment-science-01","major":"환경과학·지구과학","question":"흙의 입자 크기에 따라 같은 양의 물이 스며드는 시간이 달라질까?","hypothesis":"입자가 큰 자갈과 굵은 모래는 공극이 커서 고운 흙보다 물이 빠르게 통과할 것이다.","focus":"토양 입자와 침투","change":"자갈·굵은모래·고운모래의 구성","measure":"일정량의 물이 통과한 시간과 배출량","controls": 로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"earth-environment-science-07","major":"환경과학·지구과학","question":"구름량이 비슷한 날과 다른 날의 낮과 밤 기온 차이는 어떻게 달라질까?","hypothesis":"구름이 많은 날은 낮의 가열과 밤의 냉각이 모두 줄어 일교차가 작을 것이다.","focus":"구름량과 일교차","change":"전운량이 낮은 날과 높은 날","measure":"일최고·최저기온 차이","controls":"같은 지역·계절·강수 여부·분석기간","resources":"교사가 준비한 시간별 기온·전운량 CSV","concepts":["물의 순환","지표 변화","대기","기후","지구 시스템"],"methods":[{"kind":"데이터 분석","title":"구름량과 일교차 자료 분석","detail":"교사가 준비한 시간별 기온·전운량 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 전운량이 낮은 날과 높은 날을 기준으로 자료를 나눈다. 각 조건의 일최고·최저기온 차이을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"전운량이 낮은 날과 높은 날을 가로축, 일최고·최저기온 차이을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"구름량과 일교차 자료 비교","detail":"구름량과 일교차을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 전운량이 낮은 날과 높은 날과 일최고·최저기온 차이의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"earth-environment-science-08","major":"환경과학·지구과학","question":"풍속이 높아진 뒤 미세먼지 농도는 바로 감소할까, 시간차를 두고 감소할까?","hypothesis":"강수가 없는 조건에서는 풍속 증가 후 일정한 시간차를 두고 미세먼지 농도가 낮아질 것이다.","focus":"풍속과 미세먼지","change":"풍속 구간과 1~3시간 시간차","measure":"PM2.5 평균농도와 변화량","controls":"같은 측정소·강수 제외·시간대·자료 단위","resources":"시간별 풍속·강수·PM2.5 자료 CSV","concepts":["물의 순환","지표 변화","대기","기후","지구 시스템"],"methods":[{"kind":"데이터 분석","title":"풍속과 미세먼지 자료 분석","detail":"시간별 풍속·강수·PM2.5 자료 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 풍속 구간과 1~3시간 시간차을 기준으로 자료를 나눈다. 각 조건의 PM2.5 평균농도와 변화량을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"풍속 구간과 1~3시간 시간차을 가로축, PM2.5 평균농도와 변화량을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"풍속과 미세먼지 자료 비교","detail":"풍속과 미세먼지을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"완전히 반응하는 시간 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 완전히 반응하는 시간의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"정제 표면적과 용출 모형 자료 비교","detail":"정제 표면적과 용출 모형을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 발포정의 조각 크기과 완전히 반응하는 시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-03","major":"의학·간호학·약학","question":"제산제의 성분과 양에 따라 산성 용액의 pH 변화량이 달라질까?","hypothesis":"중화 가능한 성분의 양이 많은 제산제가 같은 조건에서 pH를 더 크게 높일 것이다.","focus":"제산제와 중화","change":"제산제 종류 또는 동일 성분의 양","measure":"묽은 식초물의 pH 변화","controls":"초기 pH·용액량·반응시간·분쇄 정도","resources":"제산제·묽은 식초물·pH 시험지·컵","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"직접 실험","title":"제산제와 중화 조건 비교","detail":"제산제·묽은 식초물·pH 시험지·컵을 준비한다. 제산제 종류 또는 동일 성분의 양만 3가지 조건으로 바꾸고 초기 pH·용액량·반응시간·분쇄 정도은 동일하게 유지한다. 조건별로 묽은 식초물의 pH 변화을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"묽은 식초물의 pH 변화 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 묽은 식초물의 pH 변화의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"제산제와 중화 자료 비교","detail":"제산제와 중화을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 제산제 종류 또는 동일 성분의 양과 묽은 식초물의 pH 변화의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-04","major":"의학·간호학·약학","question":"손 씻기 동작의 순서를 지키면 손 모형에 남는 색소 면적이 줄어들까?","hypothesis":"손가락 사이와 손등을 포함한 정해진 순서를 사용하면 임의로 씻을 때보다 남은 색소 면적이 작을 것이다.","focus":"손 씻기 동작과 세척 범위","change":"임의 세척과 정해진 동작","measure":"격자 사진에서 남은 안전한 수성색소 면적","controls":"색소량·세척시간·물의 양·촬영조건","resources":"수성물감 또는 로션·비누·격자 배경·스마트폰","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"객관적 수행 검사","title":"손 씻기 동작과 세척 범위 수행 비교","detail":"수성물감 또는 로션·비누·격자 배경·스마트폰을 준비한다. 임의 세척과 정해진 동작만 다르게 하고 색소량·세척시간·물의 양·촬영조건을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 격자 사진에서 남은 안전한 수성색소 면적을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 격자 사진에서 남은 안전한 수성색소 면적을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"손 씻기 동작과 세척 범위 자료 비교","detail":"손 씻기 동작과 세척 범위을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 임의 세척과 정해진 동작과 격자 사진에서 남은 안전한 수성색소 면적의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-05","major":"의학·간호학·약학","question":"마스크 모형의 겹수는 공기가 통과하는 시간에 어떤 영향을 줄까?","hypothesis":"겹수가 늘어날수록 공기 흐름의 저항이 증가해 같은 양의 공기가 통과하는 시간이 길어질 것이다.","focus":"재료 겹수와 공기저항","change":"안전한 천 또는 필터재의 겹수","measure":"풍선의 일정 부피가 줄어드는 시간","controls":"풍선 크기·출구 면적·재료 크기·고정 방법","resources":"풍선·천 조각·고무줄·초시계","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"직접 실험","title":"재료 겹수와 공기저항 조건 비교","detail":"풍선·천 조각·고무줄·초시계을 준비한다. 안전한 천 또는 필터재의 겹수만 3가지 조건으로 바꾸고 풍선 크기·출구 면적·재료 크기·고정 방법은 동일하게 유지한다. 조건별로 풍선의 일정 부피가 줄어드는 시간을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"풍선의 일정 부피가 줄어드는 시간 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 풍선의 일정 부피가 줄어드는 시간의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"재료 겹수와 공기저항 자료 비교","detail":"재료 겹수와 공기저항을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 안전한 천 또는 필터재의 겹수과 풍선의 일정 부피가 줄어드는 시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-06","major":"의학·간호학·약학","question":"같은 시간의 가벼운 운동 뒤 심박수 회복은 운동 속도에 따라 달라질까?","hypothesis":"빠른 속도의 제자리 걷기 뒤에는 느린 속도보다 초기 심박수와 회복시간이 길 것이다.","focus":"운동 속도와 회복","change":"안전한 제자리 걷기 속도","measure":"운동 직후와 1분 간격 심박수","controls":"운동시간·측정자·휴식·안전기준","resources":"타이머·심박 기록표·안전한 제자리 걷기","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"객관적 수행 검사","title":"운동 속도와 회복 수행 비교","detail":"타이머·심박 기록표·안전한 제자리 걷기을 준비한다. 안전한 제자리 걷기 속도만 다르게 하고 운동시간·측정자·휴식·안전기준을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 운동 직후와 1분 간격 심박수을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 운동 직후와 1분 간격 심박수을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"운동 속도와 회복 자료 비교","detail":"운동 속도와 회복을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 안전한 제자리 걷기 속도과 운동 직후와 1분 간격 심박수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-07","major":"의학·간호학·약학","question":"일별 감염자 자료에서 이동평균 기간은 유행의 최고점을 다르게 보이게 할까?","hypothesis":"이동평균 기간이 길수록 변동은 줄지만 최고점의 크기가 낮아지고 시점이 늦게 나타날 수 있다.","focus":"이동평균과 감염 추세","change":"3일·7일·14일 이동평균","measure":"최고값·최고점 날짜·변동 폭","controls":"같은 공개자료·분석기간·결측처리","resources":"익명화된 일별 감염자 수 CSV","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"데이터 분석","title":"이동평균과 감염 추세 자료 분석","detail":"익명화된 일별 감염자 수 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 3일·7일·14일 이동평균을 기준으로 자료를 나눈다. 각 조건의 최고값·최고점 날짜·변동 폭을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"3일·7일·14일 이동평균을 가로축, 최고값·최고점 날짜·변동 폭을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"이동평균과 감염 추세 자료 비교","detail":"이동평균과 감염 추세을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 3일·7일·14일 이동평균과 최고값·최고점 날짜·변동 폭의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"medical-nursing-pharmacy-08","major":"의학·간호학·약학","question":"일반의약품의 제품명이 달라도 주성분과 함량이 같은 경우가 있을까?","hypothesis":"효능군이 같은 제품 중에는 제품명이 달라도 동일한 주성분과 함량을 가진 사례가 있을 것이다.","focus":"의약품 표시정보 비교","change":"같은 효능군의 여러 제품","measure":"주성분·함량·복용연령·주의사항의 공통점과 차이","controls":"공 ls":"같은 가상 환자사례·처리 인력·분류규칙","resources":"개인정보가 없는 가상 사례카드와 대기행렬 활동지","concepts":["항상성","약물 농도","산과 염기","감염 예방","보건자료"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"중증도와 우선순위 조건 모형","detail":"개인정보가 없는 가상 사례카드와 대기행렬 활동지을 사용한다. 도착시간·긴급도·처리시간을 일정한 간격으로 바꾸고 평균 대기시간과 긴급사례 대기시간을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 도착시간·긴급도·처리시간 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 평균 대기시간과 긴급사례 대기시간의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"중증도와 우선순위 자료 비교","detail":"중증도와 우선순위을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 도착시간·긴급도·처리시간과 평균 대기시간과 긴급사례 대기시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]}]},{"id":"public-health-rehabilitation","label":"보건·재활학","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"accent":"#b54f67","topics":[{"id":"public-health-rehabilitation-01","major":"보건·재활학","question":"작업대 높이에 따라 같은 분류 작업의 시간과 상체 기울기가 달라질까?","hypothesis":"팔꿈치 높이에 가까운 작업대에서 작업시간과 상체 기울기가 가장 작을 것이다.","focus":"작업대 높이와 자세","change":"낮음·중간·높음 작업대","measure":"분류 완료시간과 영상 속 상체 각도","controls":"물체 수·작업 순서·의자·거리","resources":"가벼운 블록·높이 다른 받침·스마트폰","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"작업대 높이와 자세 수행 비교","detail":"가벼운 블록·높이 다른 받침·스마트폰을 준비한다. 낮음·중간·높음 작업대만 다르게 하고 물체 수·작업 순서·의자·거리을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 분류 완료시간과 영상 속 상체 각도을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 분류 완료시간과 영상 속 상체 각도을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"작업대 높이와 자세 자료 비교","detail":"작업대 높이와 자세을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 낮음·중간·높음 작업대과 분류 완료시간과 영상 속 상체 각도의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-02","major":"보건·재활학","question":"물체까지 손을 뻗는 거리가 멀어질수록 반복 작업시간은 증가할까?","hypothesis":"정상 도달범위를 벗어난 위치에서는 손의 이동거리가 늘어 작업시간이 길어질 것이다.","focus":"도달거리와 작업효율","change":"가까움·중간·먼 위치","measure":"완료시간·손 이동거리·놓침 횟수","controls":"물체 수·작업대 높이·사용 손","resources":"가벼운 물체·거리표시·타이머","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"도달거리와 작업효율 수행 비교","detail":"가벼운 물체·거리표시·타이머을 준비한다. 가까움·중간·먼 위치만 다르게 하고 물체 수·작업대 높이·사용 손을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 완료시간·손 이동거리·놓침 횟수을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 완료시간·손 이동거리·놓침 횟수을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"도달거리와 작업효율 자료 비교","detail":"도달거리와 작업효율을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 가까움·중간·먼 위치과 완료시간·손 이동거리·놓침 횟수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-03","major":"보건·재활학","question":"배경 소음이 있을 때 시각 반응과제의 정확도와 반응시간이 달라질까?","hypothesis":"일정한 소음이 있는 조건에서 반응시간의 변동과 오답 수가 증가할 것이다.","focus":"주의분산과 반응시간","change":"조용한 조건과 일정한 배경음","measure":"정답률과 반응시간","controls":"같은 과제·음량·화면·시행 수·조건 순서 교차","resources":"간단한 색상 반응과제·이어폰 또는 스피커·기록표","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"주의분산과 반응시간 수행 비교","detail":"간단한 색상 반응과제·이어폰 또는 스피커·기록표을 준비한다. 조용한 조건과 일정한 배경음만 다르게 하고 같은 과제·음량·화면·시행 수·조건 순서 교차을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 정답률과 반응시간을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 정답률과 반응시간을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"주의분산과 반응시간 자료 비교","detail":"주의분산과 반응시간을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 조용한 조건과 일정한 배경음과 정답률과 반응시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-04","major":"보건·재활학","question":"글자 크기와 줄 간격은 짧은 안내문의 읽기 정확도에 어떤 영향을 줄까?","hypothesis":"글자가 너무 작고 줄 간격이 좁은 안내문에서 읽기시간과 내용 확인 오류가 증가할 것이다.","focus":"가독성과 정보이해","change":"글자 크기와 줄 간격","measure":"읽기시간과 객관식 정답률","controls":"글 내용·문장 수·화면 밝기·제시 순서","resources":"내용이 같은 안내문 시안·타이머·객관식 문항","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"가독성과 정보이해 수행 비교","detail":"내용이 같은 안내문 시안·타이머·객관식 문항을 준비한다. 글자 크기와 줄 간격만 다르게 하고 글 내용·문장 수·화면 밝기·제시 순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 읽기시간과 객관식 정답률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 읽기시간과 객관식 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"가독성과 정보이해 자료 비교","detail":"가독성과 정보이해을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 글자 크기와 줄 간격과 읽기시간과 객관식 정답률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-05","major":"보건·재활학","question":"경사로의 기울기가 커지면 모형 수레를 끌어 올리는 힘은 얼마나 증가할까?","hypothesis":"경사각이 커질수록 이동거리는 짧아지지만 필요한 당기는 힘은 증가할 것이다.","focus":"경사로와 이동 힘","change":"경사로 각도","measure":"용수철저울 힘·이동거리·걸린 시간","controls":"수레 질량·표면·출발점·상승 높이","resources":"모형 수레·경사판·각도기·용수철저울","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"직접 실험","title":"경사로와 이동 힘 조건 비교","detail":"모형 수레·경사판·각도기·용수철저울을 준비한다. 경사로 각도만 3가지 조건으로 바꾸고 수레 질량·표면·출발점·상승 높이은 동일하게 유지한다. 조건별로 용수철저울 힘·이동거리·걸린 시간을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"용수철저울 힘·이동거리·걸린 시간 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 용수철저울 힘·이동거리·걸린 시간의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"경사로와 이동 힘 자료 비교","detail":"경사로와 이동 힘을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 경사로 각도과 용수철저울 힘·이동거리·걸린 시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-06","major":"보건·재활학","question":"우세손과 비우세손은 작은 물체 옮기기 과제의 속도와 오류에서 차이가 날까?","hypothesis":"우세손으로 수행할 때 평균시간과 떨어뜨린 횟수가 더 작을 것이다.","focus":"손 기능과 작업정확도","change":"우세손과 비우세손","measure":"완료시간과 떨어뜨린 횟수","controls":"물체 수·거리·도구·시행 횟수","resources":"집게·구슬 또는 블록·용기·타이머","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"손 기능과 작업정확도 수행 비교","detail":"집게·구슬 또는 블록·용기·타이머을 준비한다. 우세손과 비우세손만 다르게 하고 물체 수·거리·도구·시행 횟수을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 완료시간과 떨어뜨린 횟수을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 완료시간과 떨어뜨린 횟수을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"손 기능과 작업정확도 자료 비교","detail":"손 기능과 작업정확도을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 우세손과 비우세손과 완료시간과 떨어뜨린 횟수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-07","major":"보건·재활학","question":"눈을 뜬 조건과 감은 조건에서 한 발 서기 시간은 달라질까?","hypothesis":"시각정보를 차단하면 균형 유지시간이 짧아지고 개인 내 변동이 커질 것이다.","focus":"시각정보와 균형","change":"눈 뜸과 감음","measure":"안전한 범위의 균형 유지시간","controls":"벽 가까이에서 실시·발 위치·휴식·중단기준","resources":"안전한 평지·벽 또는 보조자·타이머","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"시각정보와 균형 수행 비교","detail":"안전한 평지·벽 또는 보조자·타이머을 준비한다. 눈 뜸과 감음만 다르게 하고 벽 가까이에서 실시·발 위치·휴식·중단기준을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 안전한 범위의 균형 유지시간을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 안전한 범위의 균형 유지시간을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"시각정보와 균형 자료 비교","detail":"시각정보와 균형을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 눈 뜸과 감음과 안전한 범위의 균형 유지시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-08","major":"보건·재활학","question":"경고음의 간격은 여러 소리 속에서 목표 신호를 찾는 정확도에 영향을 줄까?","hypothesis":"너무 빠르거나 느린 간격보다 일정하고 구분되는 간격에서 목표 신호 확인이 빠를 것이다.","focus":"경고음 패턴과 인지","change":"경고음 반복 간격","measure":"목표 신호 반응시간과 오답 수","controls":"음량·신호 길이·시행 수·제시 순서","resources":"짧은 음원 파일·이어폰 또는 스피커·반응 기록지","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"객관적 수행 검사","title":"경고음 패턴과 인지 수행 비교","detail":"짧은 음원 파일·이어폰 또는 스피커·반응 기록지을 준비한다. 경고음 반복 간격만 다르게 하고 음량·신호 길이·시행 수·제시 순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 목표 신호 반응시간과 오답 수을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 목표 신호 반응시간과 오답 수을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"경고음 패턴과 인지 자료 비교","detail":"경고음 패턴과 인지을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 경고음 반복 간격과 목표 신호 반응시간과 오답 수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-09","major":"보건·재활학","question":"출입구 폭과 회전공간은 휠체어 모형의 통과 경로에 어떤 영향을 줄까?","hypothesis":"출입구가 좁고 회전공간이 작을수록 방향전환 횟수와 통과시간이 증가할 것이다.","focus":"이동 접근성과 공간","change":"출입구 폭과 회전공간","measure":"모형 이동시간·접촉 횟수·방향전환 수","controls":"모형 크기·출발점·도착점·이동 규칙","resources":"격자 평면도·휠체어 크기의 종이 모형·타이머","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"이동 접근성과 공간 조건 모형","detail":"격자 평면도·휠체어 크기의 종이 모형·타이머을 사용한다. 출입구 폭과 회전공간을 일정한 간격으로 바꾸고 모형 이동시간·접촉 횟수·방향전환 수을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 출입구 폭과 회전공간 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 모형 이동시간·접촉 횟수·방향전환 수의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"이동 접근성과 공간 자료 비교","detail":"이동 접근성과 공간을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 출입구 폭과 회전공간과 모형 이동시간·접촉 횟수·방향전환 수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"public-health-rehabilitation-10","major":"보건·재활학","question":"기온과 미세먼지 수준에 따라 야외활동 권고가 어떻게 달라지는지 자료에서 공통 기준을 찾을 수 있을까?","hypothesis":"공공기관 자료는 취약집단과 오염 수준에 따라 활동시간·마스크·휴식 권고를 다르게 제시할 것이다.","focus":"환경보건 행동기준","change":"기관별 야외활동 권고자료","measure":"대상·수치기준·권고행동·예외조건","controls":"공식기관 자료·같은 오염물질·발행연도 표시","resources":"공공기관 행동요령 3편","concepts":["인체공학","재활","접근성","반응시간","공중보건"],"methods":[{"kind":"자료 비교","title":"환경보건 행동기준 비교표 작성","detail":"공공기관 행동요령 3편을 준비한다. 기관별 야외활동 권고자료을 공통 비교기준으로 정하고 자료별 대상·수치기준·권고행동·예외조건을 같은 표에 기록한다. 작성자·기관·시기·목적을 확인해 사실·해석·주장을 구분하고, 자료가 일치하는 부분과 충돌하는 부분을 각각 표시한다."},{"kind":"내용 분석","title":"핵심 근거와 관점 분류","detail":"자료의 문장이나 사례를 원인·근거·결과·한계 항목으로 분류한다. 자료별 분량 차이를 고려해 빈도와 대표 사례를 함께 제시한다. 어떤 자료를 선택했는지가 결론에 미친 영향도 한계로 작성한다."},{"kind":"논문·전문자료","title":"환경보건 행동기준 자료 비교","detail":"환경보건 행동기준을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 기관별 야외활동 권고자료과 대상·수치기준·권고행동·예외조건의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]}]},{"id":"food-nutrition","label":"식품영양학·식품과학","concepts":["영양성분","식품가공","효소","수분","에너지"],"accent":"#b54f67","topics":[{"id":"food-nutrition-01","major":"식품영양학·식품과학","question":"음료의 1회 제공량 표시는 실제 한 병의 당류 섭취량 판단에 어떤 차이를 만들까?","hypothesis":"총내용량과 1회 제공량이 다른 제품에서는 1회 수치만 보면 실제 한 병의 당류를 적게 판단할 수 있다.","focus":"제공량과 당류 표시","change":"제품별 제공량과 총내용량","measure":"한 병당 당류·각설탕 환산량·하루 기준치 비율","controls":"같은 음료 유형·공식 영양표시·단위 통일","resources":"음료 영양표시 사진 또는 제공 CSV","concepts":["영양성분","식품가공","효소","수분","에너지"],"methods":[{"kind":"데이터 분석","title":"제공량과 당류 표시 자료 분석","detail":"음료 영양표시 사진 또는 제공 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 제품별 제공량과 총내용량을 기준으로 자료를 나눈다. 각 조건의 한 병당 당류·각설탕 환산량·하루 기준치 비율을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"제품별 제공량과 총내용량을 가로축, 한 병당 당류·각설탕 환산량·하루 기준치 비율을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"제공량과 당류 표시 자료 비교","detail":"제공량과 당류 표시을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 제품별 제공량과 총내용량과 한 병당 당류·각설탕 환산량·하루 기준치 비율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"food-nutrition-02","major":"식품영양학·식품과학","question":"시리얼의 100g당 영양성분과 1회 제공량 기준 평가는 같은 순위를 만들까?","hypothesis":"제공량이 다른 제품은 100g 기준과 1회 섭취 기준에서 당류·식이섬유 순위가 달라질 것이다.","focus":"영양표시 기준과 제품 비교","change":"100g 기준과 1회 제공량 기준","measure":"당류·나트륨·식이섬유 순위","controls":"같은 제품군·단위 통일·공식 표시값","resources":"시리얼 제품 영양표시 6개 이상","concepts":["영양성분","식품가공","효소","수분","에너지"],"methods":[{"kind":"데이터 분석","title":"영양표시 기준과 제품 비교 자료 분석","detail":"시리얼 제품 영양표시 6개 이상을 준비한다. 결측값·중복값·단위를 먼저 확인하고 100g 기준과 1회 제공량 기준을 기준으로 자료를 나눈다. 각 조건의 당류·나트륨·식이섬유 순위을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"100g 기준과 1회 제공량 기준을 가로축, 당류·나트륨·식이섬유 순위을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"영양표시 기준과 제품 비교 자료 비교","detail":"영양표시 기준과 제품 비교을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 100g 기준과 1회 제공량 기준과 당류·나트륨·식이섬유 순위의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"food-nutrition-03","major":"식품영양학·식품과학","question":"처리용액에 따라 자른 과일의 갈변 속도가 달라질까?","hypothesis":"레몬물 처리가 물이나 무처리 조건보다 갈색 영역의 증가를 늦출 것이다.","focus":"과일 갈변과 처리","change":"레몬물·소금물·물·무처리","measure":"시간별 갈색 영역 비율","controls":"과일 종류·조각 크기·용액량·조명","resources":"사과 또는 바나나·생활용액·스마트폰","concepts":["영양성분","식품가공","효소","수분","에너지"],"methods":[{"kind":"직접 실험","title":"과일 갈변과 처리 조건 비교","detail":"사과 또는 바나나·생활용액·스마트폰을 준비한다. 레몬물·소금물·물·무처리만 3가지 조건으로 바꾸고 과일 종류·조각 크기·용액량·조명은 동일하게 유지한다. 조건별로 시간별 갈색 영역 비율을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"시간별 갈색 영역 비율 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 시간별 갈색 영역 비율의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"과일 갈변과 처리 자료 비교","detail":"과일 갈변과 처리을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 레몬물·소금물·물·무처리과 시간별 갈색 영역 비율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"food-nutrition-04","major":"식품영양학·식품과학","question":"유화제의 양이 달라지면 물과 기름 혼합물이 분리되는 시간이 달라질까?","hypothesis":"유화제 역할을 하는 안전한 재료가 많을수록 분리층이 생기는 시간이 길어질 것이다.","focus":"유화와 혼합물 안정성","change":"겨자 또는 난황 대체 유화재의 양","measure":"분리 시작시간과 층 높이","controls":"물·기름의 양·흔드는 횟수·용기","resources":"식용유·물·안전한 유화재·투명병·자","concepts":["영양성분","식품가공","효소","수분","에너지"],"methods":[{"kind":"직접 실험","title":"유화와 혼합물 안정성 조건 비교","detail":"식용유·물·안전한 유화재·투명병·자을 준비한다. 겨자 또는 난황 대체 유화재의 양만 3가지 조건으로 바꾸고 물·기름의 양·흔드는 횟수·용기은 동일하게 유지한다. 조건별로 분리 시작시간과 층 높이을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다."},{"kind":"측정 데이터 분석","title":"분리 시작시간과 층 높이 반복값 분석","detail":"직접 얻은 측정값을 조건·회차별 표로 정리한다. 단위와 이상값을 확인한 뒤 분리 시작시간과 층 높이의 평균·최댓값·최솟값·변동 폭을 계산한다. 막대그래프나 선그래프로 조건 차이를 나타내고, 반복 편차가 조건 간 차이보다 큰지도 확인한다."},{"kind":"논문·전문자료","title":"유화와 혼합물 안정성 자료 비교","detail":"유화와 혼합물 안정성을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 겨자 또는 난황 대체 유화재의 양과 분리 시작시간과 층 높이의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"food-nutrition-05","major":"식품영양학·식품과학","question":"전분 농도가 높아지면 소스 모형의 흐르는 속도는 어떻게 달라질까?","hypothesis":"전분 농도가 높을수록 점성이 커져 경사판을 흐르는 시간이 길어질 것이다.","focus":"전분 농도와 점성","change":"전분물의 농도","measure":"같은 거리의 흐름시간과 퍼진 폭","controls":"용액량·온도·경사각·출발 위치","resources":"전분·물·경사판·스포이트·타이머","concepts":["영양성분","식품가공","효소","수분","에너지"],"methods":[{"kind":"직접 실험","title":"전분 농도와 점성 조건 비교","detail":"전분·물·경사판·스포이트·타이머을 준비한다. 전분물의 농도만 3가지 조건으로 바꾸고 용액량·온도·경사각·출발 위치은 동일하게 유지한다. 조건별로 같은 거리의 흐름시간과 퍼진 폭을 3회 이상 측정해 평균과 범위를 계산하고, 조건-결과 그래프로 가설을 판단한다. 준비 15분, 측정 50분, 분석 35분, 해석 20분 안에 마친다.
