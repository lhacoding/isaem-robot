<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="궁금증을 탐구 질문으로 바꾸고, 가설을 세워 근거를 찾는 전공별 진로 탐구 주제은행">
  <title>전공별 진로 탐구 주제은행</title>
  <style>:root {
  --ink: #172039;
  --muted: #606a7c;
  --paper: #f5f1e8;
  --panel: #fffefd;
  --line: #ddd6c9;
  --navy: #172139;
  --orange: #dc6845;
  --accent: #dc6845;
  --shadow: 0 18px 55px rgba(23, 32, 57, 0.12);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(23, 32, 57, .025) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 32px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid #6ea2ff;
  outline-offset: 2px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* 주제은행 상단 */
.hero {
  position: relative;
  overflow: hidden;
  min-height: 300px;
  color: white;
  background:
    radial-gradient(circle at 82% 12%, rgba(255, 175, 112, .24), transparent 27%),
    radial-gradient(circle at 10% 100%, rgba(69, 164, 170, .2), transparent 35%),
    var(--navy);
}
.hero::before, .hero::after {
  position: absolute;
  content: "";
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 50%;
}
.hero::before { width: 560px; height: 560px; right: -130px; top: -280px; }
.hero::after { width: 390px; height: 390px; right: -40px; top: -210px; }
.hero-inner {
  position: relative;
  z-index: 1;
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
  padding: 72px 0 85px;
}
.hero h1 {
  max-width: 1000px;
  margin: 0;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: clamp(40px, 5.6vw, 68px);
  font-weight: 600;
  line-height: 1.12;
  letter-spacing: -.05em;
}
.hero-copy {
  max-width: 720px;
  margin: 24px 0 0;
  color: #cbd5e4;
  font-size: 17px;
  line-height: 1.85;
  word-break: keep-all;
}
/* 계열·전공 선택 */
.navigation-shell {
  position: sticky;
  z-index: 20;
  top: 0;
  width: min(1220px, calc(100% - 32px));
  margin: -52px auto 0;
  padding: 10px;
  background: rgba(255,254,253,.96);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(15px);
}
.category-tabs, .major-tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.category-tab, .major-tab {
  flex: 1 0 auto;
  min-width: 105px;
  padding: 13px 16px;
  color: #657085;
  font-weight: 800;
  background: transparent;
  border: 0;
  border-radius: 12px;
  white-space: nowrap;
}
.category-tab:hover, .major-tab:hover { color: var(--ink); background: #f4f0e8; }
.category-tab.active {
  color: white;
  background: var(--category-accent);
}
.major-area {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid #ebe5db;
}
.major-tab { min-width: auto; padding: 9px 13px; font-size: 12px; }
.major-tab.active {
  color: var(--major-accent);
  background: color-mix(in srgb, var(--major-accent) 10%, white);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--major-accent) 22%, white);
}

/* 전공별 주제표 */
.bank-main {
  width: min(1320px, calc(100% - 48px));
  margin: 0 auto;
  padding: 80px 0 95px;
}
.breadcrumb {
  margin: 0 0 14px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: .03em;
}
.major-heading {
  margin-bottom: 30px;
}
.major-heading h2 {
  margin: 0;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: clamp(38px, 4.2vw, 56px);
  letter-spacing: -.04em;
}
.major-heading h2::after {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-left: 11px;
  content: "";
  background: var(--accent);
  border-radius: 50%;
  vertical-align: .18em;
}
.table-frame {
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
}
.topic-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.topic-table th {
  padding: 22px 20px;
  color: white;
  font-size: 13px;
  text-align: left;
  background: var(--navy);
  border-right: 1px solid rgba(255,255,255,.12);
}
.topic-table th:first-child { width: 50px; padding-right: 8px; padding-left: 8px; text-align: center; }
.topic-table th:nth-child(2) { width: 32%; }
.topic-table th:nth-child(3) { width: 35%; }
.topic-table th:last-child { width: 29%; border-right: 0; }
.topic-row td {
  padding: 27px 20px;
  vertical-align: top;
  border-right: 1px solid #e7e1d7;
  border-bottom: 1px solid #e1dbcf;
}
.topic-row td:first-child { padding-right: 8px; padding-left: 8px; text-align: center; }
.topic-row td:last-child { border-right: 0; }
.topic-row:hover { background: #fcf9f4; }
.row-number {
  display: inline-block;
  color: #bf5f42;
  font-size: 13px;
  font-weight: 850;
}
.question { font-size: 17px; line-height: 1.7; word-break: keep-all; }
.hypothesis { margin: 0; color: #626c7e; font-size: 14px; line-height: 1.85; word-break: keep-all; }
.method-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.method-tags span {
  padding: 6px 9px;
  color: #a64e37;
  font-size: 11px;
  font-weight: 800;
  background: #fff5ef;
  border: 1px solid #f0d3c8;
  border-radius: 7px;
}
.detail-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 14px;
  padding: 11px 13px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 850;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.detail-toggle b {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  color: white;
  background: var(--accent);
  border-radius: 7px;
}
.detail-row td { padding: 0; background: #f0ece4; border-bottom: 1px solid var(--line); }
.detail-panel { padding: 28px; }
.detail-title { margin-bottom: 18px; }
.detail-title h3 { margin: 0; font-size: 20px; }
.methods-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.method-option {
  position: relative;
  min-height: 230px;
  padding: 20px;
  color: var(--ink);
  text-align: left;
  background: white;
  border: 2px solid transparent;
  border-radius: 15px;
  box-shadow: 0 8px 22px rgba(23,32,57,.07);
}
.method-option:hover { transform: translateY(-2px); }
.method-option.selected { border-color: var(--accent); background: #fffaf7; }
.method-option-top { display: flex; align-items: center; gap: 10px; }
.method-option-top strong { color: var(--accent); font-size: 11px; }
.method-option h4 { margin: 15px 0 9px; font-size: 16px; }
.method-option p { margin: 0; color: #626c7d; font-size: 12px; line-height: 1.75; }
.method-check {
  position: absolute;
  right: 14px;
  bottom: 14px;
  width: 23px;
  height: 23px;
  border: 2px solid #c8c2b7;
  border-radius: 50%;
}
.method-option.selected .method-check { border: 7px solid var(--accent); }
.start-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  margin-top: 18px;
}
.selection-message { color: #a04f39; font-size: 12px; font-weight: 750; }
.primary-button, .save-button, .generate-button {
  padding: 13px 18px;
  color: white;
  font-weight: 850;
  background: var(--accent);
  border: 0;
  border-radius: 11px;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 25%, transparent);
}
.empty-state { padding: 70px 20px; text-align: center; }
.empty-state p { color: var(--muted); }

/* 탐구보고서 편집 화면 */
.report-view { min-height: 100vh; background: #f2eee6; }
.report-topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px max(24px, calc((100% - 1180px) / 2));
  color: white;
  background: rgba(23,33,57,.97);
  backdrop-filter: blur(12px);
}
.back-button, .outline-button {
  padding: 10px 13px;
  color: inherit;
  font-size: 12px;
  font-weight: 800;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 9px;
}
.report-topbar strong { font-size: 14px; }
.save-status { color: #d3dfed; font-size: 11px; }
.report-hero {
  color: white;
  background: var(--navy);
}
.report-hero-inner {
  width: min(1080px, calc(100% - 40px));
  margin: 0 auto;
  padding: 52px 0 65px;
}
.report-breadcrumb { margin: 0 0 12px; color: #ffad7e; font-size: 12px; font-weight: 850; }
.report-hero h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(36px, 5vw, 58px); }
.selected-topic {
  margin-top: 24px;
  padding: 18px 20px;
  color: var(--ink);
  background: white;
  border-left: 5px solid var(--accent);
  border-radius: 12px;
}
.selected-topic small { color: var(--accent); font-weight: 850; }
.selected-topic strong { display: block; margin-top: 7px; line-height: 1.6; }
.selected-topic p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.report-layout {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  gap: 28px;
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 45px 0 90px;
}
.report-nav {
  position: sticky;
  top: 82px;
  align-self: start;
  padding: 14px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: 0 8px 28px rgba(23,32,57,.07);
}
.report-nav a {
  display: block;
  padding: 10px 11px;
  color: #657083;
  font-size: 12px;
  font-weight: 750;
  text-decoration: none;
  border-radius: 8px;
}
.report-nav a:hover { color: var(--accent); background: #f7f2eb; }
.report-content { min-width: 0; }
.report-section {
  scroll-margin-top: 82px;
  margin-bottom: 22px;
  padding: 27px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 9px 30px rgba(23,32,57,.065);
}
.section-number { color: var(--accent); font-family: Georgia, serif; font-size: 12px; font-weight: 800; }
.report-section h2 { margin: 6px 0 7px; font-size: 24px; }
.section-guide { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.7; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.form-grid.four { grid-template-columns: repeat(4, 1fr); }
.field { display: block; }
.field.full { grid-column: 1 / -1; }
.field-label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 850; }
.field input, .field textarea, .field select, .generated-text {
  width: 100%;
  padding: 12px 13px;
  color: var(--ink);
  background: #fffdfa;
  border: 1px solid #d8d1c5;
  border-radius: 10px;
  outline: 0;
}
.field textarea { min-height: 105px; resize: vertical; line-height: 1.7; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.examples { margin: 13px 0 15px; padding: 14px; background: #f8f4ed; border-radius: 12px; }
.examples-title { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; color: #96503e; font-size: 11px; font-weight: 900; }
.example-grid { overflow: hidden; background: white; border: 1px solid #e4ddd2; border-radius: 9px; }
.example-card {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 10px;
  margin: 0;
  padding: 11px 13px;
  color: #60697a;
  font-size: 11px;
  line-height: 1.65;
  border-bottom: 1px solid #ece6dc;
}
.example-card:last-child { border-bottom: 0; }
.example-card strong { color: #a45842; font-size: 10px; }
.plan-summary { padding: 14px; color: #4e596c; font-size: 12px; line-height: 1.75; background: #eff4f5; border-left: 4px solid #4a8d88; border-radius: 9px; }
.process-guide { margin-top: 16px; padding: 18px; background: #f8fafc; border: 1px solid #d9e1e8; border-radius: 12px; }
.process-guide-head { margin-bottom: 12px; }
.process-type { display: inline-block; margin-bottom: 6px; color: #33736f; font-size: 10px; font-weight: 900; }
.process-guide h3 { margin: 0; font-size: 16px; }
.process-guide-head p { margin: 7px 0 0; color: #667184; font-size: 11px; line-height: 1.65; }
.process-steps { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.process-step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 11px; align-items: start; padding: 10px 12px; background: white; border: 1px solid #e1e7ec; border-radius: 9px; }
.process-index { display: grid; place-items: center; width: 28px; height: 28px; color: white; font-size: 11px; font-weight: 900; background: #4a8d88; border-radius: 7px; }
.process-step strong { display: block; margin-bottom: 3px; font-size: 12px; }
.process-step p { margin: 0; color: #626d7e; font-size: 11px; line-height: 1.65; }
.process-caution { margin: 11px 0 0; padding-top: 10px; color: #7a5a4e; font-size: 10px; line-height: 1.6; border-top: 1px dashed #d8cabe; }
.ai-guide { margin-top: 16px; padding: 18px; background: #f7f5ff; border: 1px solid #dcd5f2; border-radius: 12px; }
.ai-guide-head { margin-bottom: 13px; }
.ai-guide-kicker { display: inline-block; margin-bottom: 6px; color: #7255a6; font-size: 10px; font-weight: 900; }
.ai-guide h3 { margin: 0; font-size: 16px; }
.ai-guide-head p { margin: 7px 0 0; color: #68617b; font-size: 11px; line-height: 1.65; }
.ai-workflow { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.ai-workflow li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 12px; background: white; border: 1px solid #e3ddf2; border-radius: 9px; }
.ai-workflow b { display: grid; place-items: center; width: 25px; height: 25px; color: white; font-size: 10px; background: #8062b1; border-radius: 7px; }
.ai-workflow strong { display: block; margin-bottom: 3px; font-size: 12px; }
.ai-workflow p { margin: 0; color: #676174; font-size: 11px; line-height: 1.65; }
.ai-prompt-title { margin: 16px 0 8px; color: #5f477f; font-size: 12px; font-weight: 900; }
.ai-prompt { margin-top: 7px; padding: 11px 12px; color: #4f485d; font-size: 10.5px; line-height: 1.7; background: white; border: 1px solid #ddd5ec; border-radius: 9px; }
.ai-prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
.ai-prompt-head strong { color: #7255a6; }
.copy-prompt { flex: 0 0 auto; padding: 6px 9px; color: #65468d; font-size: 9.5px; font-weight: 900; background: #f2edfb; border: 1px solid #d9ceee; border-radius: 7px; }
.copy-prompt:hover { background: #e9e0f7; }
.ai-prompt-text { white-space: pre-wrap; }
.ai-check { margin: 13px 0 0; padding: 11px 12px; color: #6d4d44; font-size: 10.5px; line-height: 1.7; background: #fff9f3; border-left: 4px solid #d88964; border-radius: 8px; }

.record-table { width: 100%; border-collapse: collapse; }
.record-table th { padding: 10px 8px; color: white; font-size: 11px; background: #313d56; }
.record-table td { padding: 6px; border: 1px solid #ddd6ca; }
.record-table input, .record-table textarea { width: 100%; min-width: 80px; padding: 8px; border: 0; background: #fffdfa; }
.record-table textarea { min-height: 82px; line-height: 1.55; resize: vertical; }
.table-scroll { overflow-x: auto; }

/* 자기평가서 */
.self-field { margin-top: 18px; padding-top: 18px; border-top: 1px solid #ebe5dc; }
.self-field:first-of-type { border-top: 0; }
.generate-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 22px; }
.generate-button { background: #725093; }
.generated-text { min-height: 220px; margin-top: 14px; line-height: 1.85; resize: vertical; }
.character-count { color: var(--muted); font-size: 11px; }
.report-footer-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 25px; }
.secondary-action { padding: 12px 15px; color: var(--ink); font-weight: 800; background: white; border: 1px solid var(--line); border-radius: 10px; }
.toast {
  position: fixed;
  z-index: 60;
  right: 20px;
  bottom: 20px;
  padding: 13px 17px;
  color: white;
  font-size: 12px;
  font-weight: 800;
  background: #25324c;
  border-radius: 10px;
  box-shadow: var(--shadow);
}

@media (max-width: 980px) {
  .methods-grid { grid-template-columns: 1fr; }
  .method-option { min-height: auto; }
  .report-layout { grid-template-columns: 1fr; }
  .report-nav { position: static; display: flex; overflow-x: auto; }
  .report-nav a { flex: 0 0 auto; }
  .form-grid.four { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 760px) {
  .hero-inner { width: min(100% - 32px, 1180px); padding: 50px 0 75px; }
  .hero h1 { font-size: 43px; }
  .hero-copy { font-size: 14px; }
  .navigation-shell { width: calc(100% - 18px); margin-top: -50px; border-radius: 15px; }
  .category-tab { min-width: 92px; padding: 11px; font-size: 12px; }
  .major-tab { font-size: 11px; }
  .bank-main { width: calc(100% - 24px); padding-top: 65px; }
  .topic-table, .topic-table tbody, .topic-table tr, .topic-table td { display: block; width: 100%; }
  .topic-table thead, .topic-table colgroup { display: none; }
  .topic-row { padding: 18px; border-bottom: 1px solid var(--line); }
  .topic-row td { padding: 9px 0; border: 0; }
  .topic-row td::before { display: block; margin-bottom: 5px; color: #8d776c; font-size: 10px; font-weight: 850; content: attr(data-label); }
  .topic-row td:first-child { text-align: left; }
  .detail-row { display: block; }
  .detail-row td { display: block; }
  .detail-panel { padding: 18px; }
  .start-area { align-items: stretch; flex-direction: column; }
  .primary-button { width: 100%; }
  .report-topbar { padding: 10px 12px; }
  .report-topbar > strong { display: none; }
  .report-hero-inner, .report-layout { width: calc(100% - 24px); }
  .report-section { padding: 20px 16px; }
  .form-grid, .form-grid.four { grid-template-columns: 1fr; }
  .generate-row, .report-footer-actions { align-items: stretch; flex-direction: column; }
  .generate-button, .secondary-action, .save-button { width: 100%; }
}

/* 화면 가독성 확대 */
body { font-size: 16px; }
.category-tab { font-size: 15px; }
.major-tab { font-size: 14px; }
.breadcrumb { font-size: 14px; }
.topic-table th { font-size: 15px; }
.row-number { font-size: 15px; }
.question { font-size: 19px; }
.hypothesis { font-size: 16px; }
.method-tags span { font-size: 13px; }
.detail-toggle { font-size: 14px; }
.detail-title h3 { font-size: 22px; }
.method-option-top strong { font-size: 13px; }
.method-option h4 { font-size: 18px; }
.method-option p { font-size: 15px; }
.selection-message { font-size: 14px; }
.primary-button, .save-button, .generate-button { font-size: 15px; }
.report-layout { grid-template-columns: 225px minmax(0, 1fr); }
.back-button, .outline-button { font-size: 14px; }
.report-topbar strong { font-size: 16px; }
.save-status { font-size: 13px; }
.report-breadcrumb { font-size: 14px; }
.selected-topic small { font-size: 14px; }
.selected-topic strong { font-size: 17px; }
.selected-topic p { font-size: 15px; }
.report-nav a { font-size: 14px; }
.section-number { font-size: 14px; }
.report-section h2 { font-size: 27px; }
.section-guide { font-size: 16px; }
.field-label { font-size: 15px; }
