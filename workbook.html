<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="진로 연계 탐구주제 선택부터 탐구 기획서, 자료 탐구, 완성 보고서, 자기평가서까지 이어지는 학생용 워크북">
  <title>탐구보고서 작성 워크북</title>
  <style>:root {
  --navy: #192238;
  --navy-2: #24314d;
  --paper: #f3efe7;
  --panel: #fffdf9;
  --ink: #172039;
  --muted: #697184;
  --line: #ddd6ca;
  --orange: #b95139;
  --orange-soft: #fff0ea;
  --gold: #e8c84e;
  --teal: #177c72;
  --shadow: 0 18px 54px rgba(24, 32, 52, .12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(25,34,56,.028) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 32px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { word-break: keep-all; text-wrap: pretty; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid #78a5ff;
  outline-offset: 3px;
}
a { color: inherit; }
[hidden] { display: none !important; }

.topbar {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 64px;
  padding: 8px 20px;
  color: white;
  background: rgba(25,34,56,.98);
  box-shadow: 0 10px 28px rgba(14,20,35,.18);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand-home { padding: 0; color: inherit; text-align: left; background: transparent; border: 0; cursor: pointer; }
.brand-home:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.brand-home:focus-visible { border-radius: 8px; }
.brand-badge {
  padding: 7px 10px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 999px;
}
.brand strong { font-size: 14px; white-space: nowrap; }
.step-nav {
  display: flex;
  flex: 1;
  justify-content: flex-end;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.step-button {
  flex: 0 0 auto;
  padding: 11px 13px;
  color: #cbd3e0;
  font-size: 12px;
  font-weight: 850;
  background: transparent;
  border: 0;
  border-radius: 9px;
  white-space: nowrap;
}
.step-button:hover { color: white; background: rgba(255,255,255,.08); }
.step-button.active { color: white; background: var(--orange); }
.step-button.sample { color: var(--gold); }
.step-button.sample.active { color: var(--navy); background: var(--gold); }
.save-cluster { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.save-status { color: #cbd3e0; font-size: 10px; white-space: nowrap; }
.plain-action {
  padding: 8px 10px;
  color: white;
  font-size: 11px;
  font-weight: 800;
  background: transparent;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 8px;
}

.page-shell { width: min(1280px, calc(100% - 30px)); margin: 0 auto; padding: 48px 0 90px; }
.scroll-anchor { scroll-margin-top: 86px; }
.hero {
  position: relative;
  overflow: hidden;
  min-height: 240px;
  margin-bottom: 32px;
  padding: 50px 54px;
  color: white;
  background:
    radial-gradient(circle at 90% 10%, rgba(232,200,78,.2), transparent 28%),
    radial-gradient(circle at 8% 110%, rgba(23,124,114,.28), transparent 34%),
    var(--navy);
  border-radius: 28px;
  box-shadow: var(--shadow);
}
.hero::after {
  position: absolute;
  width: 410px;
  height: 410px;
  right: -130px;
  top: -240px;
  content: "";
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 50%;
}
.eyebrow { margin: 0 0 14px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .16em; }
.hero h1 { max-width: none; margin: 0; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(34px, 5vw, 58px); font-weight: 600; line-height: 1.16; letter-spacing: -.05em; word-break: keep-all; text-wrap: pretty; }
.hero p:not(.eyebrow) { max-width: none; margin: 20px 0 0; color: #d2dae7; font-size: 16px; line-height: 1.85; word-break: keep-all; text-wrap: pretty; }
.hero .highlight { color: var(--gold); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 38px 0 16px; }
.section-head > div { min-width: 0; width: 100%; }
.section-head h2, .section-head h3 { margin: 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.section-head p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; word-break: keep-all; text-wrap: pretty; }
.topic-meta span {
  display: inline-flex;
  align-items: center;
  padding: 6px 9px;
  color: #7a5b24;
  font-size: 11px;
  font-weight: 850;
  background: #fff9da;
  border: 1px solid #eadc93;
  border-radius: 999px;
}

.choice-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.choice-button {
  min-height: 48px;
  padding: 9px 10px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 900;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 3px 9px rgba(25,34,56,.035);
}
.choice-button:hover { transform: translateY(-2px); border-color: var(--orange); }
.choice-button.active { color: white; background: var(--orange); border-color: var(--orange); }
.major-row, .difficulty-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
.major-button, .difficulty-button {
  flex: 0 0 auto;
  padding: 10px 14px;
  color: #596478;
  font-size: 12px;
  font-weight: 850;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.major-button.active, .difficulty-button.active { color: white; background: var(--navy-2); border-color: var(--navy-2); }
.difficulty-button.easy.active { background: var(--teal); border-color: var(--teal); }
.difficulty-button.normal.active { background: #a56325; border-color: #a56325; }
.difficulty-button.challenge.active { background: var(--orange); border-color: var(--orange); }

.topic-list { display: grid; gap: 13px; }
.topic-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(25,34,56,.06);
}
.topic-card:hover { border-color: #d7a493; box-shadow: 0 14px 30px rgba(25,34,56,.1); }
.topic-copy h3 { margin: 0; font-size: 18px; line-height: 1.6; word-break: keep-all; text-wrap: pretty; }
.topic-copy p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
.topic-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.topic-meta span { color: #5b6475; background: #f6f3ed; border-color: #e2dcd1; }
.custom-topic-callout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: center;
  margin-top: 30px;
  padding: 28px 30px;
  color: white;
  background:
    radial-gradient(circle at 95% 10%, rgba(232,200,78,.18), transparent 34%),
    var(--navy);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.custom-topic-kicker { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .06em; }
.custom-topic-copy h2 { margin: 0; color: white; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy > p:not(.custom-topic-kicker) { max-width: none; margin: 10px 0 0; color: #d3dbea; font-size: 13px; line-height: 1.75; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy small { display: block; margin-top: 10px; color: #aeb9ca; font-size: 11px; line-height: 1.65; }
.custom-topic-actions { display: grid; gap: 9px; min-width: 184px; }
.external-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
.custom-topic-callout .secondary-button { color: white; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); }
.primary-button, .secondary-button, .download-button, .generate-button {
  padding: 12px 16px;
  color: white;
  font-size: 12px;
  font-weight: 900;
  background: var(--orange);
  border: 0;
  border-radius: 11px;
  box-shadow: 0 8px 18px rgba(185,81,57,.2);
  white-space: nowrap;
}
.secondary-button { color: var(--ink); background: white; border: 1px solid var(--line); box-shadow: none; }
.download-button { background: var(--navy); }
.generate-button { background: var(--teal); }

.selected-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  margin-bottom: 22px;
  padding: 20px 22px;
  background: #fff8e6;
  border: 1px solid #e7d49b;
  border-radius: 16px;
}
.selected-banner small { color: #936d24; font-weight: 900; }
.selected-banner strong { display: block; margin-top: 5px; font-size: 17px; line-height: 1.55; word-break: keep-all; text-wrap: pretty; }

.form-card, .content-card, .source-card, .summary-card {
  margin-top: 16px;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 9px 25px rgba(25,34,56,.055);
}
.form-card-number { display: inline; color: var(--ink); font-size: 22px; font-weight: 950; letter-spacing: -.025em; }
.form-card h3, .content-card h3, .source-card h3, .summary-card h3 { display: inline; margin: 0 0 0 6px; font-size: 22px; letter-spacing: -.025em; }
.form-card-number + h3 + .guide { margin-top: 10px; }
.source-card .form-card-number, .source-card h3 { font-size: 17px; }
.mindmap-launch .form-card-number { color: var(--gold); font-size: 23px; }
.mindmap-launch .form-card-number + h3 { display: inline; margin-left: 6px; }
.guide { margin: 9px 0 14px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.field-label { display: block; margin: 14px 0 7px; color: #404b60; font-size: 13px; font-weight: 900; }
input, textarea {
  width: 100%;
  padding: 13px 14px;
  color: var(--ink);
  background: white;
  border: 1px solid #d8d1c5;
  border-radius: 11px;
}
textarea { min-height: 118px; line-height: 1.75; resize: vertical; }
input::placeholder, textarea::placeholder { color: #9aa1ad; }
.field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.examples { margin: 12px 0 14px; border: 1px solid #e2d9ca; border-radius: 13px; background: #faf7f1; }
.examples summary { padding: 12px 14px; color: #8e472f; font-size: 12px; font-weight: 900; list-style: none; cursor: pointer; }
.examples summary::-webkit-details-marker { display: none; }
.examples summary::after { float: right; content: "＋"; }
.examples[open] summary::after { content: "－"; }
.example-list { display: grid; gap: 8px; padding: 0 12px 12px; }
.example-card {
  width: 100%;
  padding: 13px 14px;
  color: #465066;
  font-size: 13px;
  line-height: 1.7;
  text-align: left;
  white-space: pre-wrap;
  background: white;
  border: 1px solid #e0d8cc;
  border-radius: 10px;
}
.example-card:hover { color: var(--ink); border-color: var(--orange); background: #fffaf7; }
.example-card b { display: block; margin-bottom: 4px; color: var(--orange); font-size: 10px; }
.input-note { margin: 7px 0 0; color: #8c6a29; font-size: 11px; }

.keyword-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.keyword-chip {
  padding: 9px 11px;
  color: #245e59;
  font-size: 12px;
  font-weight: 800;
  background: #eef9f7;
  border: 1px solid #cbe5e1;
  border-radius: 999px;
}
.keyword-chip:hover { background: #dff2ef; }
.source-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.content-card + .source-grid,
.content-card + .reference-grid { margin-top: 14px; }
.source-card { margin: 0; }
.source-card h3 { font-size: 17px; }
.source-card p, .source-card li { color: var(--muted); font-size: 13px; line-height: 1.7; }
.source-links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.source-links a { padding: 7px 9px; color: #255f59; font-size: 11px; font-weight: 850; text-decoration: none; background: #edf8f6; border-radius: 8px; }
.check-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
.check-list li { padding: 10px 12px; color: #515c70; font-size: 13px; background: #f7f4ee; border-radius: 9px; }
.check-list li::before { margin-right: 6px; color: var(--teal); content: "✓"; font-weight: 950; }
.reference-grid { display: grid; gap: 12px; }
.reference-card { padding: 18px; background: #fbf9f5; border: 1px solid #e2dbd0; border-radius: 14px; }
.reference-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
.reference-card h4 { margin: 0; }
.reference-delete-button {
  flex: 0 0 auto;
  padding: 7px 10px;
  color: #9a4632;
  font-size: 11px;
  font-weight: 900;
  background: #fff7f3;
  border: 1px solid #e7b9aa;
  border-radius: 8px;
}
.reference-delete-button:hover { color: white; background: var(--orange); border-color: var(--orange); }
.reference-add-row { display: flex; justify-content: center; margin: 14px 0 24px; }
.reference-add-row .secondary-button { min-width: 170px; border-style: dashed; }
.reference-fields { display: grid; grid-template-columns: 1.4fr .9fr .45fr; gap: 9px; }
.clip-help { margin: 5px 0 8px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.source-clip {
  min-height: 150px;
  padding: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  background: white;
  border: 1px solid #d8d1c5;
  border-radius: 11px;
  overflow-wrap: anywhere;
}
.source-clip:empty::before { color: #9aa1ad; content: attr(data-placeholder); pointer-events: none; }
.source-clip img { display: block; max-width: 100%; height: auto; margin: 12px auto; border: 1px solid #ddd6ca; border-radius: 8px; }
.reading-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.reading-steps article { min-height: 145px; padding: 17px; background: #f7f4ee; border-top: 4px solid var(--teal); border-radius: 11px; }
.reading-steps article:nth-child(2) { border-top-color: var(--orange); }
.reading-steps article:nth-child(3) { border-top-color: #8b6cc4; }
.reading-steps article:nth-child(4) { border-top-color: var(--gold); }
.reading-steps b { font-size: 13px; }
.reading-steps p { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.mindmap-launch, .sync-panel { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 16px; padding: 24px; border-radius: 18px; }
.mindmap-launch { color: white; background: linear-gradient(135deg, var(--navy), #233c51); box-shadow: var(--shadow); }
.mindmap-launch h3 { margin: 6px 0 8px; font-size: 23px; }
.mindmap-launch p:not(.eyebrow) { margin: 0; color: #cfd8e4; font-size: 12px; line-height: 1.7; }
.launch-button, .inline-launch { display: inline-flex; align-items: center; padding: 12px 16px; color: var(--navy); font-size: 12px; font-weight: 900; text-decoration: none; background: var(--gold); border-radius: 10px; white-space: nowrap; }
.inline-launch { color: white; background: var(--teal); }
.sample-link-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sync-panel { background: #eef8f6; border: 1px solid #c9e3df; }
.sync-panel b { color: #215f59; }
.sync-panel p { margin: 5px 0 0; color: #52706d; font-size: 12px; line-height: 1.65; }

.outline-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 16px; }
.outline-chips span { padding: 7px 9px; color: #605a4e; font-size: 11px; background: #f2eee5; border-radius: 8px; }
.analysis-block { margin-top: 14px; padding: 18px; background: #fbfaf7; border: 1px solid #e3ddd1; border-left: 4px solid var(--orange); border-radius: 12px; }
.analysis-block-head { display: flex; align-items: flex-end; gap: 12px; }
.analysis-block-head label { flex: 1 1 auto; min-width: 0; }
.analysis-block .analysis-title { font-weight: 900; }
.analysis-delete-button {
  flex: 0 0 auto;
  margin-bottom: 1px;
  padding: 8px 11px;
  color: #9a4632;
  font-size: 11px;
  font-weight: 900;
  background: #fff7f3;
  border: 1px solid #e7b9aa;
  border-radius: 8px;
}
.analysis-delete-button:hover { color: white; background: var(--orange); border-color: var(--orange); }
.analysis-block textarea { margin-top: 9px; min-height: 145px; }
.analysis-add-row { display: flex; justify-content: center; margin: 16px 0 2px; }
.analysis-add-row .secondary-button { min-width: 170px; border-style: dashed; }
.auto-label { display: inline-flex; margin-left: 6px; padding: 4px 7px; color: #27625c; font-size: 9px; font-weight: 900; background: #e8f7f4; border-radius: 999px; vertical-align: middle; }
.report-actions { display: flex; justify-content: flex-end; gap: 9px; margin: 20px 0; }
.back-to-top-wrap { display: flex; justify-content: center; margin: 34px 0 0; }
.back-to-top-button {
  padding: 10px 16px;
  color: #596478;
  font-size: 12px;
  font-weight: 850;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: 0 5px 14px rgba(25,34,56,.05);
}
.back-to-top-button:hover { color: var(--ink); border-color: #b9b2a7; transform: translateY(-1px); }
.download-inline-note { margin: 24px 0 0; padding: 14px 16px; color: #76412f; font-size: 12px; line-height: 1.7; background: #fff4e8; border: 1px solid #efc8aa; border-left: 5px solid var(--orange); border-radius: 11px; }
.download-inline-note b { display: inline-block; margin-right: 6px; color: #a1432e; }
.final-download-card { margin: 30px 0 10px; padding: 30px; color: white; background: linear-gradient(135deg, var(--navy), #263b50); border: 1px solid #3b4b61; border-radius: 20px; box-shadow: var(--shadow); }
.download-required-label { display: inline-flex; margin: 0 0 12px; padding: 6px 10px; color: var(--navy); font-size: 10px; font-weight: 900; letter-spacing: .08em; background: var(--gold); border-radius: 999px; }
.final-download-card h2 { margin: 0 0 10px; color: white; font-size: 25px; line-height: 1.4; }
.final-download-card > p:not(.download-required-label) { margin: 0; color: #d4dbe5; font-size: 12px; line-height: 1.75; }
.download-file-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 6px; }
.download-file-list div { padding: 14px 15px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 11px; }
.download-file-list b, .download-file-list span { display: block; }
.download-file-list b { margin-bottom: 5px; color: white; font-size: 12px; }
.download-file-list span { color: #cbd4df; font-size: 10px; line-height: 1.55; }
.final-download-actions { margin: 18px 0 0; }
.final-download-actions .download-button { color: var(--navy); background: var(--gold); box-shadow: none; }

.summary-sheet-card { padding: 0; overflow: hidden; }
.summary-sheet-heading { padding: 28px 30px 24px; color: white; background: var(--navy); }
.summary-sheet-heading .eyebrow { margin-bottom: 10px; }
.summary-sheet-heading h3 { margin: 0; color: white; font-size: 28px; }
.summary-sheet-body { padding: 28px 30px 22px; }
.report-summary { width: 100%; }
.summary-topic-block { padding: 16px 18px; text-align: left; background: #fbfcfd; border: 1px solid #d8dde5; border-bottom: 0; border-radius: 12px 12px 0 0; }
.summary-topic-block span { display: block; margin-bottom: 6px; color: #265d67; font-size: 10px; font-weight: 900; }
.summary-topic-block h4 { max-width: none; margin: 0 0 7px; font-size: 18px; line-height: 1.5; letter-spacing: -.02em; word-break: keep-all; text-wrap: pretty; }
.summary-topic-block p { margin: 0; color: var(--muted); font-size: 11px; }
.summary-meta-row { display: grid; grid-template-columns: .8fr 1.5fr; border: 1px solid #d8dde5; border-radius: 0 0 12px 12px; overflow: hidden; }
.summary-meta-row > div { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; }
.summary-meta-row > div + div { border-left: 1px solid #d8dde5; }
.summary-meta-row b { flex: 0 0 auto; color: #265d67; font-size: 11px; }
.summary-meta-row span { color: #4e596d; font-size: 12px; line-height: 1.55; }
.summary-section-list { display: grid; }
.summary-item { padding: 14px 4px; border-bottom: 1px solid #dfe3e9; }

  <script>const STORAGE_KEY = "isaem-inquiry-workbook-v5";
const app = document.querySelector("#app");
let saveTimer = null;
let toastTimer = null;
let resumeVisible = false;
let resumeTargetView = "topics";

function defaultState() {
  const firstCategory = TOPIC_DATA[0];
  return {
    view: "topics",
    categoryId: firstCategory.id,
    majorId: firstCategory.majors[0].id,
    difficulty: "easy",
    topicId: null,
    customTopicMode: true,
    referenceCount: 3,
    analysisExtraCount: 0,
    analysisManualOutline: null,
    fields: {},
    selfOutputCustomized: false,
    selfOutputNeedsSync: false,
    savedAt: null,
  };
}

let state = defaultState();

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value).replaceAll("\n", "&#10;");
}

function cleanQuestion(value) {
  return String(value ?? "")
    .replace(/^(기본 자료 비교|연구 조건 비교|연구 한계 분석):\s*/, "")
    .trim();
}

function activeCategory() {
  return TOPIC_DATA.find((item) => item.id === state.categoryId) ?? TOPIC_DATA[0];
}

function activeMajor() {
  const category = activeCategory();
  return category.majors.find((item) => item.id === state.majorId) ?? category.majors[0];
}

function activeTopic() {
  for (const category of TOPIC_DATA) {
    for (const major of category.majors) {
      const topic = major.topics.find((item) => item.id === state.topicId);
      if (topic) {
        topic.majorLabel = major.label;
        return { category, major, topic };
      }
    }
  }
  return null;
}

function hasCustomTopicDraft() {
  if (state.customTopicMode) return true;
  return ["draft-topic","draft-motivation-purpose","draft-question-hypothesis","draft-method","draft-outline","draft-expectation"]
    .some((id) => String(state.fields[id] ?? "").trim());
}

function workflowSelection() {
  const selected = activeTopic();
  if (selected) return selected;
  if (!hasCustomTopicDraft()) return null;

  const title = String(state.fields["draft-topic"] ?? "").trim() || "직접 작성한 탐구 주제";
  const questionRaw = String(state.fields["draft-question-hypothesis"] ?? "").trim();
  const question = questionRaw
    .split(/\n+/)
    .map((line) => line.replace(/^(핵심\s*질문|질문)\s*[:：]\s*/i, "").trim())
    .find((line) => line.includes("?") || line.includes("？"))
    || questionRaw.split(/\n+/).map((line) => line.trim()).find(Boolean)
    || title;

  const topic = {
    id: "custom-topic",
    question: title,
    coreQuestion: question,
    hypothesis: "",
    course: "관련 교과 · 핵심 개념",
    careers: "관심 분야",
    sourceHint: "학술논문·공공기관 자료·전문기관 보고서",
    levelGuide: "자료의 연구 대상·조건·측정 기준·핵심 결과를 같은 기준으로 확인합니다.",
    concepts: ["핵심 개념","탐구 조건","자료 분석"],
    keywords: [title, `${title} 논문`, `${title} 연구 결과`, `${title} 실험 자료`, `${title} 통계 자료`],
    comparison: ["연구 대상과 조건","측정·비교 기준","핵심 결과","자료별 차이","자료의 한계"],
    majorLabel: "직접 정한 주제",
  };

  return {
    custom: true,
    category: { id: "custom", label: "직접 입력" },
    major: { id: "custom", label: "직접 정한 주제" },
    topic,
  };
}

function workflowBanner(selected) {
  if (!selected?.custom) return selectedBanner();
  const title = String(state.fields["draft-topic"] ?? "").trim() || "직접 작성한 탐구 주제";
  return `<section class="selected-banner">
    <div><small>직접 작성한 탐구 주제</small><strong>${escapeHTML(title)}</strong></div>
    <button type="button" class="secondary-button" data-nav="draft">기획서에서 수정하기</button>
  </section>`;
}

function hasMeaningfulDraft() {
  return Boolean(state.topicId || Object.values(state.fields).some((value) => String(value ?? "").trim()));
}

function saveNow(silent = true) {
  try {
    state.savedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const label = document.querySelector("#save-status");
    if (label) label.textContent = `이 브라우저에 임시 저장됨 · ${formatTime(state.savedAt)}`;
    if (!silent) showToast("현재 기기의 브라우저에 작성 내용을 저장했습니다.");
  } catch {
    if (!silent) showToast("브라우저 저장공간을 사용할 수 없습니다.");
  }
}

function scheduleSave() {
  window.clearTimeout(saveTimer);
  const label = document.querySelector("#save-status");
  if (label) label.textContent = "작성 중…";
  saveTimer = window.setTimeout(() => saveNow(true), 450);
}

function formatTime(value) {
  if (!value) return "아직 저장되지 않음";
  const date = new Date(value);
  return new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit" }).format(date);
}

function formatDateTime(value) {
  if (!value) return "저장 시각 없음";
  return new Intl.DateTimeFormat("ko-KR", {
    year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit",
  }).format(new Date(value));
}

function showToast(message) {
  let toast = document.querySelector("#toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toast";
    toast.className = "toast";
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.hidden = false;
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2400);
}

function topicOutline(topic) {
  const core = cleanQuestion(topic.coreQuestion).replace(/[?？]+$/g, "");
  const conceptA = topic.concepts[0] ?? "핵심 개념";
  const conceptB = topic.concepts[1] ?? "적용 원리";
  return [
    `5-1. 분석에 사용한 자료의 특징`,
    `5-2. ${conceptA} 관련 핵심 결과 비교`,
    `5-3. ${withJosa(conceptB, "와")} 결과가 나타난 조건 비교`,
    `5-4. 자료별 공통점·차이점과 그 원인`,
    `5-5. ${topic.majorLabel ?? "관련 분야"}에서의 적용과 의미`,
    `5-6. 예상·가설 판단`,
    `5-7. ${core}에 대한 종합 해석과 한계`,
  ].join("\n");
}

function draftExamples(topic) {
  const question = cleanQuestion(topic.coreQuestion);
  const q = question.replace(/[?？]+$/g, "");
  const concept = topic.concepts[0] ?? "관련 개념";
  const career = topic.careers.split("·")[0];
  const comparison = topic.comparison.join("·");
  return {
    "draft-topic": [
      question,
      `${q}에 관한 선행연구의 공통점과 차이점 분석`,
      `${q}의 적용 조건과 한계에 관한 자료 비교 탐구`,
    ],
    "draft-motivation-purpose": [
      `수업에서 ${withJosa(concept, "을")} 배우면서 ${q}라는 궁금증이 생겼다. 이에 전문자료와 연구 사례를 비교하여 관련 원리와 결과가 나타나는 조건을 알아보고자 한다.`,
      `생활 속에서 ${withJosa(q, "와")} 관련된 현상을 자주 접했지만 자료마다 설명이 달라 정확한 근거가 궁금했다. 신뢰할 수 있는 자료를 같은 기준으로 비교하여 타당한 결론을 내리고자 한다.`,
      `${career} 분야에 관심이 있어 실제 연구와 산업에서 ${withJosa(q, "를")} 어떻게 다루는지 알아보고자 한다. 이를 통해 교과 개념이 전공 분야에서 활용되는 방식을 이해하는 것이 목적이다.`,
    ],
    "draft-question-hypothesis": [
      `핵심 질문: ${q}?\n예상·가설: ${topic.hypothesis}`,
      `핵심 질문: ${q}에 관한 자료들은 어떤 공통된 결과와 차이를 보이는가?\n예상·가설: 연구 대상과 조건이 비슷한 자료에서는 유사한 경향이 나타날 것이다.`,
      `핵심 질문: ${q}에 대한 연구의 결론이 달라지는 조건은 무엇인가?\n예상·가설: 측정방법과 적용 범위의 차이가 결론의 차이를 만들 것이다.`,
    ],
    "draft-method": [
      `${topic.levelGuide} 비교 항목은 ${withJosa(comparison, "으로")} 정하고, 자료별 핵심 근거와 한계를 같은 표에 기록한다.`,
      `공공기관 설명자료 1개와 학술논문·연구보고서 2개 이상을 찾는다. 작성기관, 연구대상, 조건, 핵심 결과, 한계를 확인한 뒤 공통점과 차이점을 비교한다.`,
      `먼저 검색어를 넓게 사용해 자료 후보를 찾고, 원문과 발행기관을 확인해 신뢰할 수 있는 자료만 선정한다. 서로 다른 결과가 있으면 연구 조건과 측정지표를 비교해 차이의 이유를 해석한다.`,
    ],
    "draft-outline": [
      topicOutline(topic),
      [`5-1. 분석 자료의 대상·조건·측정 기준`,`5-2. ${concept}에 관한 자료별 핵심 결과`,`5-3. 결과가 비슷하게 나타난 조건`,`5-4. 서로 다른 결과와 그 원인`,`5-5. 자료의 신뢰도와 적용 범위`,`5-6. 예상·가설 판단`,`5-7. 종합 해석과 한계`].join("\n"),
      [`5-1. 사용한 자료의 종류와 선정 이유`,`5-2. 연구 사례별 주요 수치와 결과`,`5-3. 국내외 사례의 공통점과 차이점`,`5-4. 결과에 영향을 준 조건`,`5-5. ${career} 분야에서의 활용 가능성`,`5-6. 예상과 실제 자료의 일치 여부`,`5-7. 최종 해석과 탐구의 한계`].join("\n"),
    ],
    "draft-expectation": [
      `자료마다 결과가 완전히 같기보다 대상과 조건에 따라 차이가 나타날 것으로 예상한다. 교과 개념을 실제 연구에 적용하고 근거의 신뢰도와 한계를 판단하는 능력을 기를 수 있을 것이다.`,
      `${topic.hypothesis} 다만 한 자료만으로 일반화할 수 없으며 여러 연구의 공통 경향과 적용 범위를 함께 확인해야 할 것으로 예상한다.`,
      `이 탐구를 통해 ${topic.careers} 분야에서 자료를 근거로 의사결정하는 방식을 이해하고, 후속 탐구에서 필요한 새로운 질문을 찾을 수 있을 것이다.`,
    ],
  };
}

function sanitizeClipHTML(value) {
  const template = document.createElement("template");
  template.innerHTML = String(value ?? "");
  const allowed = new Set(["BR", "DIV", "P", "UL", "OL", "LI", "B", "STRONG", "EM", "IMG"]);
  [...template.content.querySelectorAll("*")].forEach((node) => {
    if (!allowed.has(node.tagName)) {
      node.replaceWith(document.createTextNode(node.textContent ?? ""));
      return;
    }
    [...node.attributes].forEach((attribute) => {
      if (node.tagName === "IMG" && ["src", "alt"].includes(attribute.name)) return;
      node.removeAttribute(attribute.name);
    });
    if (node.tagName === "IMG" && !String(node.getAttribute("src") ?? "").startsWith("data:image/")) node.remove();
  });
  return template.innerHTML;
}

function parseOutline() {
  const raw = String(state.fields["draft-outline"] ?? "");
  return raw.split(/\n+/).map((line) => line.trim()).filter(Boolean).slice(0, 12);
}

function reportOutline(topic) {
  if (Array.isArray(state.analysisManualOutline) && state.analysisManualOutline.length) {
    return state.analysisManualOutline
      .map((item) => String(item ?? "").trim())
      .filter(Boolean)
      .slice(0, 12);
  }

  const written = parseOutline();
  let outline;

  if (written.length) {
    outline = [...written];
  } else if (topic?.id === "custom-topic") {
    outline = ["5-1. 분석 내용 1", "5-2. 분석 내용 2", "5-3. 분석 내용 3"];
  } else {
    outline = topicOutline(topic).split("\n");
  }

  const extraCount = Math.max(0, Number(state.analysisExtraCount) || 0);
  for (let index = 0; index < extraCount; index += 1) {
    outline.push(`5-${outline.length + 1}. 새 소제목`);
  }
  return outline;
}

function renumberAnalysisTitle(title, index) {
  const value = String(title ?? "").trim();
  if (!value) return `5-${index + 1}. 분석 내용 ${index + 1}`;

  // 기존에 5-1., 5-2.처럼 번호가 붙어 있던 제목만 새 순서에 맞게 번호를 다시 매깁니다.
  if (/^\s*5\s*[-–—.]\s*\d+/i.test(value)) {
    const clean = stripAnalysisNumber(value).trim();
    return `5-${index + 1}. ${clean || `분석 내용 ${index + 1}`}`;
  }
  return value;
}

function referencesText() {
  const rows = [];
  const referenceCount = Math.max(1, Number(state.referenceCount) || 3);
  for (let index = 1; index <= referenceCount; index += 1) {
    const title = String(state.fields[`ref${index}-title`] ?? "").trim();
    if (!title) continue;
    const author = String(state.fields[`ref${index}-author`] ?? "").trim();
    const year = String(state.fields[`ref${index}-year`] ?? "").trim();
    const url = String(state.fields[`ref${index}-url`] ?? "").trim().replace(/[?&]utm_source=[^&\s]+/g, "");
    rows.push(`${author ? `${author}. ` : ""}${title}${year ? ` (${year})` : ""}${url ? `\n${url}` : ""}`);
  }
  return rows.join("\n\n");
}

function syncReportFromPrevious(force = false) {
  if (force) {
    state.analysisManualOutline = null;
    state.analysisExtraCount = 0;
  }

  const pairs = [
    ["final01", "draft-motivation-purpose"],
    ["final02", "draft-question-hypothesis"],
    ["final04", "draft-method"],
  ];
  pairs.forEach(([target, source]) => {
    const marker = `_imported-${target}`;
    const previousImport = String(state.fields[marker] ?? "");
    const current = String(state.fields[target] ?? "");
    const next = String(state.fields[source] ?? "");
    if (force || !current.trim() || current === previousImport) {
      state.fields[target] = next;
      state.fields[marker] = next;
    }
  });
  const refs = referencesText();
  const previousRefs = String(state.fields["_imported-final08"] ?? "");
  const currentRefs = String(state.fields.final08 ?? "");
  if (force || !currentRefs.trim() || currentRefs === previousRefs) {
    state.fields.final08 = refs;
    state.fields["_imported-final08"] = refs;
  }
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  outline.forEach((title, index) => {
    const target = `analysis-title-${index}`;
    const marker = `_imported-${target}`;
    const previousImport = String(state.fields[marker] ?? "");
    const current = String(state.fields[target] ?? "");
    if (force || !current.trim() || current === previousImport) {
      state.fields[target] = title;
      state.fields[marker] = title;
    }
  });
  saveNow(true);
}

function stripAnalysisNumber(value) {
  return String(value ?? "").replace(/^\s*5\s*[-–—.]\s*\d+\s*[.)·:：-]?\s*/, "");
}

function summarySentenceList(value) {
  const text = String(value ?? "")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
  if (!text) return [];

  // 학생이 작성한 문장을 그대로 활용하기 위해 문장 경계만 나눈다.
  // 마침표·물음표·느낌표 뒤 또는 줄바꿈을 문장 경계로 본다.
  const protectedText = text
    .replace(/(\d)\.(\d)/g, "$1__DECIMAL__$2")
    .replace(/([A-Za-z])\.([A-Za-z])/g, "$1__DOT__$2");
  return protectedText
    .split(/(?<=[.!?。！？])\s+|\n+/)
    .map((sentence) => sentence
      .replace(/__DECIMAL__/g, ".")
      .replace(/__DOT__/g, ".")
      .replace(/\s+/g, " ")
      .trim())
    .filter((sentence) => sentence.length >= 12);
}

function summarySentenceScore(sentence, index, total, keywords = []) {
  const s = String(sentence ?? "");
  let score = 0;
  if (index === 0) score += 2.4;
  if (index === total - 1) score += 1.0;
  if (/\d|%|배|증가|감소|높|낮|차이|비교|비례|반비례|관계|경향|결과|확인|나타|영향|원인|때문|따라/.test(s)) score += 2.2;
  if (/따라서|종합|결론|판단|가설|예상|의미|해석|시사|알 수|확인할 수/.test(s)) score += 2.6;
  if (/한계|제한|어렵|부족|주의|추가|보완|후속/.test(s)) score += 1.8;
  keywords.forEach((keyword) => {
    if (keyword && s.includes(keyword)) score += 1.3;
  });
  // 지나치게 짧은 문장이나 매우 긴 문장은 핵심문장 후보에서 약간 낮춘다.
  if (s.length < 28) score -= 1.0;
  if (s.length > 220) score -= 0.8;
  return score;
}

function selectCoreSentences(value, options = {}) {
  const {
    maxChars = 220,
    maxSentences = 2,
    keywords = [],
    preferFirst = true,
    filter = null,
  } = options;
  let sentences = summarySentenceList(value);
  if (typeof filter === "function") {
    const filtered = sentences.filter(filter);
    if (filtered.length) sentences = filtered;
  }
  if (!sentences.length) return "아직 작성되지 않았습니다.";

  const ranked = sentences.map((sentence, index) => ({
    sentence,
    index,
    score: summarySentenceScore(sentence, index, sentences.length, keywords),
  }));
  if (preferFirst && ranked.length) ranked[0].score += 1.2;
  ranked.sort((a, b) => b.score - a.score || a.index - b.index);

  const selected = [];
  let used = 0;
  for (const item of ranked) {
    if (selected.length >= maxSentences) break;
    const add = item.sentence.length + (selected.length ? 1 : 0);
    if (selected.length && used + add > maxChars) continue;
    // 첫 핵심문장이 예산보다 조금 길더라도 문장 중간을 자르지 않고 그대로 둔다.
    if (!selected.length && item.sentence.length > maxChars * 1.35 && ranked.length > 1) continue;
    selected.push(item);
    used += add;
  }
  if (!selected.length) selected.push(ranked[0]);
  selected.sort((a, b) => a.index - b.index);
  return selected.map((item) => item.sentence).join(" ");
}

function analysisSummaryItems(maxChars = 520) {
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  const candidates = [];

  outline.forEach((title, index) => {
    const actualTitle = String(state.fields[`analysis-title-${index}`] ?? title).trim();
    const content = stripAnalysisNumber(state.fields[`analysis-content-${index}`]).trim();
    if (!content) return;
    const sentences = summarySentenceList(content);
    if (!sentences.length) return;

    const titleBoost = /종합|해석|결론|가설|예상|판단|핵심 결과|결과 비교|공통점|차이점|원인/.test(actualTitle) ? 2.3
      : /적용|의미/.test(actualTitle) ? 0.8
      : /특징|자료/.test(actualTitle) ? 0.2 : 1.0;
    sentences.forEach((sentence, sentenceIndex) => {
      candidates.push({
        title: actualTitle,
        sentence,
        blockIndex: index,
        sentenceIndex,
        score: summarySentenceScore(sentence, sentenceIndex, sentences.length, ["결과", "비교", "영향", "관계", "가설", "종합"]) + titleBoost,
      });
    });
  });

  if (!candidates.length) return [];
  candidates.sort((a, b) => b.score - a.score || a.blockIndex - b.blockIndex || a.sentenceIndex - b.sentenceIndex);

  const picked = [];
  const usedBlocks = new Set();
  let usedChars = 0;

  // 먼저 서로 다른 소제목에서 핵심문장을 골라 결과 전체가 한쪽에 치우치지 않게 한다.
  for (const item of candidates) {
    if (picked.length >= 5) break;
    if (usedBlocks.has(item.blockIndex)) continue;
    const line = `${item.title} — ${item.sentence}`;
    if (picked.length && usedChars + line.length > maxChars) continue;
    picked.push(item);
    usedBlocks.add(item.blockIndex);
    usedChars += line.length;
  }

  // 분량이 남으면 가장 중요한 문장을 한두 개 보충한다.
  for (const item of candidates) {
    if (picked.length >= 6) break;
    if (picked.includes(item)) continue;
    const line = `${item.title} — ${item.sentence}`;
    if (usedChars + line.length > maxChars) continue;
    picked.push(item);
    usedChars += line.length;
  }

  picked.sort((a, b) => a.blockIndex - b.blockIndex || a.sentenceIndex - b.sentenceIndex);
  return picked.map((item) => `${item.title} — ${item.sentence}`);
}

function compactSummaryText(value, maxLength, preserveLines = false) {
  const source = String(value ?? "");
  const text = preserveLines
    ? source.split(/\r?\n/).map((line) => line.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n")
    : source.replace(/\s+/g, " ").trim();
  return text || "아직 작성되지 않았습니다.";
}

function summaryCoreQuestion(topic) {
  const raw = String(state.fields.final02 || state.fields["draft-question-hypothesis"] || "").trim();

  if (labeled?.[1]) return labeled[1].trim();
  const question = raw.match(/[^.!。\n]*[?？]/)?.[0]?.trim();
  return question || cleanQuestion(topic.coreQuestion);
}

function hasKoreanBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
  if (/\d/.test(last)) return new Set(["0", "1", "3", "6", "7", "8"]).has(last);
  return false;
}

function hasRieulBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  return code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8;
}

function resolveLeadingJosa(value, suffix) {
  const batchim = hasKoreanBatchim(value);
  const text = String(suffix);
  if (text.startsWith("으로") || text.startsWith("로")) {
    const particle = !batchim || hasRieulBatchim(value) ? "로" : "으로";
    return `${particle}${text.slice(text.startsWith("으로") ? 2 : 1)}`;
  }
  const pairs = [
    ["을", "를"],
    ["이", "가"],
    ["은", "는"],
    ["과", "와"],
  ];
  for (const [withBatchim, withoutBatchim] of pairs) {
    if (text.startsWith(withBatchim) || text.startsWith(withoutBatchim)) {
      return `${batchim ? withBatchim : withoutBatchim}${text.slice(1)}`;
    }
  }
  return suffix;
}

function withJosa(value, suffix) {
  return `${value}${resolveLeadingJosa(value, suffix)}`;
}

function updateGuidedJosa(id, value) {
  const suffix = document.querySelector(`[data-josa-for="${CSS.escape(id)}"]`);
  if (!suffix) return;
  suffix.textContent = resolveLeadingJosa(value, suffix.dataset.josaTemplate ?? "");
}

        <h3>05. 분석 결과 및 해석</h3>
        <h4>5-1. 두통과 진통제 선택의 필요성</h4><p>두통은 원인과 유형이 다양하며 조사 자료의 주요 대상인 긴장형 두통과 편두통도 구분해야 한다. 따라서 ‘두통’이라는 증상만으로 한 성분을 일괄 선택하는 것은 적절하지 않다. 이번 탐구에서는 비교 범위를 성인의 급성 긴장형 두통으로 좁히고, 효과뿐 아니라 복용자의 상태와 안전성까지 선택 기준에 포함하였다.</p>
        <h4>5-2. 아세트아미노펜과 이부프로펜의 특징</h4><p>두 성분 모두 진통·해열 목적으로 사용되지만 이부프로펜은 NSAID에 속해 항염 작용을 함께 나타내고, 아세트아미노펜의 항염 효과는 상대적으로 약하다. 즉 같은 ‘두통약’으로 판매되더라도 약의 분류와 주의해야 할 신체 기관이 같지 않았다. 제품명보다 주성분과 다른 복합 성분의 포함 여부를 확인해야 하는 이유가 여기에 있다.</p>
        <h4>5-3. 두 성분의 작용 원리 비교</h4><p>이부프로펜은 프로스타글란딘 생성에 관여하는 효소 경로를 억제해 통증·열·염증 반응을 줄인다. 아세트아미노펜은 중추에서 진통과 해열 효과를 나타내는 것으로 알려져 있으나 정확한 기전에는 아직 설명되지 않은 부분이 있다. 작용 원리가 다르다는 사실만으로 실제 두통 완화 효과의 우열을 확정할 수는 없으므로 임상 결과를 따로 확인하였다.</p>
        <h4>5-4. 긴장형 두통 완화 효과 비교</h4><p>아세트아미노펜에 관한 Cochrane 고찰은 23개 연구 8,079명을 포함했고, 2시간 뒤 통증이 사라진 사람은 약물군 100명 중 24명, 위약군 19명이었다. 이부프로펜 고찰은 12개 연구 3,094명을 포함했으며 약물군 23명, 위약군 16명이 2시간 뒤 통증 소실을 보였다. 따라서 위약보다 추가로 효과를 얻은 사람은 각각 약 5명과 7명 수준이었다. 그러나 두 수치는 서로 다른 연구 집단과 조건에서 산출되었기 때문에 24%와 23%만 비교하여 아세트아미노펜이 더 낫다고 말할 수 없다. 성인 154명의 직접 비교 연구에서는 특정 액상형 이부프로펜이 아세트아미노펜보다 통증 완화를 더 빨리 시작했지만, 작은 표본과 특정 제형에 한정된 결과이므로 모든 제품과 사람에게 일반화하기 어렵다.</p>
        <h4>5-5. 부작용과 복용 시 주의사항 비교</h4><p>FDA 자료에서는 아세트아미노펜을 권장량보다 많이 복용하거나 동일 성분이 포함된 여러 제품을 함께 복용할 때 심각한 간 손상이 발생할 수 있다고 안내한다. 이부프로펜과 같은 NSAID는 위장 출혈·궤양, 신장 문제, 심혈관계 위험 등을 확인해야 하며 기존 질환과 병용약에 따라 주의가 필요하다. 그러므로 ‘아세트아미노펜은 안전하고 이부프로펜은 위험하다’는 식의 단순 구분은 근거에 맞지 않았다.</p>
        <h4>5-6. 개인의 상태에 따른 선택 기준</h4><p>선택 전에는 두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약, 같은 성분의 중복 여부를 확인해야 한다. 위장·신장 관련 위험이 있는 사람과 간 손상 위험이 있는 사람에게 필요한 판단 기준은 서로 다르다. 따라서 실제 선택과 용량은 제품 설명서를 확인하고 청소년은 보호자·약사·의료전문가와 상의해야 한다.</p>
        <h4>5-7. 결론으로 이어지는 해석과 탐구의 한계</h4><p>‘이부프로펜은 일부 조건에서 더 빠를 수 있다’는 예상은 특정 직접 비교 연구에서는 지지되었다. 반면 아세트아미노펜이 항상 더 안전할 것이라는 예상은 간 손상과 중복복용 위험 때문에 수정해야 했다. 조사한 핵심 연구가 성인을 대상으로 했고 서로 다른 연구의 결과를 간접 비교했으며, 두통 유형과 제형도 제한되어 있다는 점이 최종 결론의 범위를 제한한다.</p>
        <h3>06. 결론 및 한계</h3><blockquote>두 성분 모두 성인의 급성 긴장형 두통 완화에 도움이 될 수 있지만 한 성분이 모든 사람에게 항상 더 적합하다고 결론 내리기는 어려웠다. 두통의 유형, 연령, 기존 질환, 복용 중인 약, 각 성분의 부작용 위험과 제품 설명서를 함께 고려해야 한다. 또한 주요 연구가 성인을 대상으로 했고 서로 다른 연구 조건을 간접 비교했으므로 결과를 청소년에게 그대로 적용할 수 없다는 한계가 있다.</blockquote>
        <h3>07. 후속 탐구 계획</h3><blockquote>후속 탐구에서는 긴장형 두통과 편두통을 구분하여 두 성분의 효과를 비교하고, 정제와 액상형 연질캡슐 등 제형 차이가 약효가 나타나는 시간에 미치는 영향을 조사하고자 한다. 청소년을 대상으로 한 연구가 충분한지도 추가로 확인할 필요가 있다.</blockquote>
        <h3>08. 참고자료 및 출처</h3><ol><li><a href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6557" target="_blank" rel="noopener">질병관리청 국가건강정보포털－편두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011889_oral-paracetamol-treatment-acute-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－아세트아미노펜과 급성 긴장형 두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011474_oral-ibuprofen-acute-treatment-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－이부프로펜과 급성 긴장형 두통</a></li><li><a href="https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen" target="_blank" rel="noopener">FDA－아세트아미노펜 안전정보</a></li><li><a href="https://www.nhs.uk/medicines/nsaids/" target="_blank" rel="noopener">NHS－NSAID 안전정보</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10940094/" target="_blank" rel="noopener">PubMed－두 성분 직접 비교 임상시험</a></li></ol>

  const wrapMapLabel = (value, limit) => {
    const text = String(value);
    const rows = [];
    let current = "";
    text.split(/\s+/).forEach((word) => {
      if (!word) return;
      if (current && `${current} ${word}`.length <= limit) {
        current += ` ${word}`;
        return;
      }
      if (current) {
        rows.push(current);
        current = "";
      }
      if (word.length <= limit) {
        current = word;
        return;
      }
      let rest = word;
      while (rest.length > limit) {
        rows.push(rest.slice(0, limit));
        rest = rest.slice(limit);
      }
      current = rest;
    });
    if (current) rows.push(current);
    return rows.length ? rows : [text];

    cursorY += 48;
    return layout;

  const firstBranchY = branchLayouts[0].center;

    nodes.push(`<rect class="mapr-main-${color}" height="${branch.height}" rx="10" width="205" x="268" y="${mainTop}"></rect>`);
    nodes.push(`<circle cx="289" cy="${mainTop + 18}" fill="#ffffff28" r="12"></circle>`);
    nodes.push(`<text class="mapr-main-text" text-anchor="middle" x="289" y="${mainTop + 22}">${branch.no}</text>`);
    nodes.push(svgText(branch.titleRows, 310, branch.center, "mapr-main-text", 16));

    branch.groups.forEach((group) => {
      const subTop = group.center - group.height / 2;
      connectors.push(`<path class="mapr-line-${color}" d="M 488 ${group.center} H 503"></path>`);
      connectors.push(`<path class="mapr-line-${color}" d="M 643 ${group.center} H 653 V ${group.leaves[0].center} V ${group.leaves.at(-1).center}"></path>`);
      nodes.push(`<rect class="mapr-sub-${color}" height="${group.height}" rx="7" width="140" x="503" y="${subTop}"></rect>`);
      nodes.push(svgText(group.rows, 513, group.center, "mapr-sub-text"));
      group.leaves.forEach((leaf) => {
        connectors.push(`<path class="mapr-line-${color}" d="M 653 ${leaf.center} H 668"></path>`);
        nodes.push(`<rect class="mapr-leaf" height="${leaf.height}" rx="6" width="310" x="668" y="${leaf.top}"></rect>`);
        nodes.push(svgText(leaf.rows, 678, leaf.center, "mapr-leaf-text"));
      });
    });

  const rootTop = rootCenterY - 49;
  const root = `<rect class="mapr-root" height="98" rx="10" width="210" x="18" y="${rootTop}"></rect>${svgText(["두통약 주요 성분","(아세트아미노펜·","이부프로펜)","비교 분석"],32,rootCenterY,"mapr-root-text",18)}`;

        <h4>5-3. 효과가 나타나는 시간 비교</h4><p>직접 비교 연구에서는 특정 액상형 이부프로펜이 아세트아미노펜보다 통증 완화를 더 빨리 시작한 결과가 보고되었다. 다만 표본이 작고 특정 제형에 한정되어 일반 정제와 다른 연령대까지 같은 결과로 일반화하기 어렵다. 또한 붕해가 빠른 것, 혈중농도가 빨리 높아지는 것, 통증이 빨리 사라지는 것은 같은 측정값이 아니다.</p>
        <h4>5-4. 부작용과 복용 시 주의사항 비교</h4><p>아세트아미노펜은 권장량을 초과하거나 같은 성분이 든 여러 제품을 함께 복용할 때 간 손상 위험을 확인해야 한다. 이부프로펜과 같은 NSAID는 위장 출혈·궤양, 신장 기능, 심혈관계 위험과 다른 NSAID의 중복 여부를 확인해야 한다. 한 성분은 안전하고 다른 성분은 위험하다고 단순화할 수 없었다.</p>
        <h4>5-5. 개인의 상태에 따른 선택 기준</h4><p>두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약, 동일 성분의 중복 여부를 확인해야 한다. 따라서 효과 순위보다 개인에게 더 큰 위험이 무엇인지 먼저 판단하는 것이 중요하며, 청소년의 실제 선택과 용량은 보호자·약사·의료전문가와 상의해야 한다.</p>
        <h4>5-6. 가설 판단</h4><p>이부프로펜이 일부 조건에서 효과가 더 빨리 나타날 수 있다는 예상은 특정 직접 비교 연구에서 부분적으로 지지되었다. 그러나 아세트아미노펜이 항상 더 안전하다는 예상은 간 손상과 중복복용 위험 때문에 그대로 받아들일 수 없었다.</p>
        <h4>5-7. 종합 해석</h4><p>두 성분 모두 성인의 급성 긴장형 두통 완화에 도움이 될 수 있지만 어느 하나가 모든 사람에게 항상 더 적합하다고 결론 내릴 수 없었다. 성분 선택은 두통 유형, 개인의 질환과 병용약, 제형, 성분별 위험을 함께 고려하는 조건부 판단이었다. 성인 중심 연구와 간접 비교라는 한계 때문에 청소년에게 결과를 그대로 적용해서는 안 된다.</p>
        <h3>6. 결론 및 한계</h3><blockquote>한 성분의 무조건적인 우열보다 개인의 위험 조건과 제품 성분을 함께 확인해야 한다. 주요 자료가 성인 중심이고 서로 다른 연구 조건을 간접 비교했다는 점이 한계이다.</blockquote>
        <h3>7. 후속 탐구 계획</h3><blockquote>긴장형 두통과 편두통을 구분하고, 정제·액상형 등 제형에 따른 효과 시간과 청소년 대상 연구를 추가로 조사하고자 한다.</blockquote>
        <h3>8. 참고자료 및 출처</h3><ol><li><a href="https://www.cochrane.org/evidence/CD011889_oral-paracetamol-treatment-acute-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－아세트아미노펜과 급성 긴장형 두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011474_oral-ibuprofen-acute-treatment-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－이부프로펜과 급성 긴장형 두통</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10940094/" target="_blank" rel="noopener">PubMed－두 성분 직접 비교 임상시험</a></li><li><a href="https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen" target="_blank" rel="noopener">FDA－아세트아미노펜 안전정보</a></li><li><a href="https://www.nhs.uk/medicines/nsaids/" target="_blank" rel="noopener">NHS－NSAID 안전정보</a></li></ol>

      <details class="sample-section" id="sample-self-new"><summary>5. 자기평가서 작성 예시</summary><div class="sample-body">
        <div class="sample-summary-preview"><header><span>REPORT SUMMARY</span><h3>탐구내용 요약정리</h3></header><div class="sample-summary-content"><div class="sample-summary-topic"><b>탐구 주제</b><p>두통이 있을 때 아세트아미노펜과 이부프로펜 중 어떤 성분을 선택해야 할까?</p><small>의약·보건계열 · 의약품 비교 탐구</small></div><div class="sample-summary-meta"><span><b>탐구 유형</b> 논문·자료 조사 및 비교 분석</span><span><b>핵심 질문</b> 두 성분의 선택 기준은 어떤 조건에서 달라지는가?</span></div><div class="sample-summary-vertical"><article><b>1. 탐구 동기 및 목적</b><p>두통약 포장지를 살펴보며 같은 용도의 제품도 아세트아미노펜과 이부프로펜처럼 유효성분과 주의사항이 다르다는 점에 관심을 가졌다. 제품명이나 막연한 인상이 아니라 작용 원리·두통 완화 효과·안전성에 관한 연구 근거를 비교하여, 개인의 상태에 따른 선택 기준을 알아보고자 하였다.</p></article><article><b>2. 탐구 방법</b><p>성인의 급성 긴장형 두통을 다룬 Cochrane 체계적 문헌고찰 2편과 두 성분을 직접 비교한 임상시험, FDA·NHS의 안전정보를 중심 자료로 선정하였다. 각 자료에서 연구 대상, 약물 용량과 제형, 효과 측정 시간, 통증 소실률, 부작용과 연구 한계를 추출하였다. 수집한 내용은 작용 원리·임상 효과·안전성·선택 기준으로 나누어 마인드맵과 비교표로 구조화하였다.</p></article><article><b>3. 주요 결과</b><p>아세트아미노펜 1,000mg과 이부프로펜 400mg은 모두 위약보다 긴장형 두통을 완화한 사람이 많았지만, 서로 다른 연구의 24%와 23%를 그대로 비교해 우열을 판단할 수는 없었다. 일부 직접 비교 연구에서는 특정 액상형 이부프로펜의 효과가 더 빨리 나타났으나 성인 154명과 특정 제형을 대상으로 했다는 제한이 있었다. 안전성에서는 아세트아미노펜의 과다·중복 복용에 따른 간 손상 위험과 이부프로펜의 위장·신장·심혈관계 위험을 각각 확인해야 했다.</p></article><article><b>4. 결론</b><p>두 성분 중 하나가 모든 두통과 모든 사람에게 항상 더 적합하다고 결론 내릴 수 없었다. 두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약과 동일 성분의 중복 여부를 함께 확인해야 한다. 따라서 효과 순위보다 개인에게 더 큰 위험이 무엇인지 먼저 판단하는 조건부 선택이 필요하다고 정리하였다.</p></article><article><b>5. 한계 및 배운 점</b><p>주요 근거가 성인을 대상으로 한 연구였기 때문에 결과를 청소년에게 그대로 적용하기 어렵고, 서로 다른 연구의 수치를 간접 비교했다는 한계가 있었다. 또한 효과가 나타나는 시간과 2시간 후 통증 소실률은 같은 지표가 아니므로 구분해서 해석해야 했다. 이번 탐구를 통해 연구 결과는 수치만 보는 것이 아니라 대상·용량·제형·측정 시간·적용 범위를 함께 확인해야 한다는 점을 배웠다.</p></article></div></div></div>

function startTopic(topicId) {
  if (state.topicId && state.topicId !== topicId && hasMeaningfulDraft() && !window.confirm("현재 작성 중인 내용을 유지할 수 없습니다. 새 주제로 시작할까요?")) return;
  const keep = Object.fromEntries(Object.entries(state.fields).filter(([key]) => key.startsWith("student-")));
  state.fields = keep;
  state.selfOutputCustomized = false;
  state.selfOutputNeedsSync = false;
  state.analysisExtraCount = 0;
  state.analysisManualOutline = null;
  state.customTopicMode = false;
  state.topicId = topicId;
  const selected = activeTopic();
  if (!selected) return;
  selected.topic.majorLabel = selected.major.label;
  state.view = "draft";
  saveNow(true);
  render();
}

function startCustomTopic() {
  if (hasMeaningfulDraft() && !window.confirm("현재 작성 중인 내용은 초기화됩니다. 내가 찾은 주제로 새 기획서를 시작할까요?")) return;
  const keep = Object.fromEntries(Object.entries(state.fields).filter(([key]) => key.startsWith("student-")));
  state.fields = keep;
  state.topicId = null;
  state.customTopicMode = true;
  state.referenceCount = 3;
  state.analysisExtraCount = 0;
  state.analysisManualOutline = null;
  state.selfOutputCustomized = false;
  state.selfOutputNeedsSync = false;
  state.view = "draft";
  saveNow(true);
  render("#draft-topic-section");
}

function safeFileName(value) {
  return String(value ?? "").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
}

function wordText(value) {
  return escapeHTML(value ?? "").replace(/\r?\n/g, "<br>");
}

// Word에서 <br>을 강제 줄바꿈으로 해석하면 양쪽 맞춤 문단의 낱말 간격이
// 과도하게 벌어진다. 보고서 본문은 줄마다 일반 문단으로 변환해 자연스럽게 배치한다.
function wordParagraphs(value) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  if (!lines.some((line) => line.trim())) return "<p>&nbsp;</p>";
  return lines
    .map((line) => line.trim() ? `<p>${escapeHTML(line.trim())}</p>` : '<p class="blank-line">&nbsp;</p>')
    .join("");
}

function docxXmlText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function normalizeReportMath(value) {
  let text = String(value ?? "");

  // 자주 사용되는 LaTeX 명령을 일반 문서에서 읽을 수 있는 기호로 변환한다.
  const symbols = {
    "\\rho": "ρ", "\\theta": "θ", "\\alpha": "α", "\\beta": "β",
    "\\gamma": "γ", "\\delta": "δ", "\\Delta": "Δ", "\\lambda": "λ",
    "\\mu": "μ", "\\pi": "π", "\\sigma": "σ", "\\omega": "ω",
    "\\Omega": "Ω", "\\times": "×", "\\cdot": "·", "\\pm": "±",
    "\\leq": "≤", "\\le": "≤", "\\geq": "≥", "\\ge": "≥",
    "\\neq": "≠", "\\approx": "≈", "\\rightarrow": "→", "\\to": "→",
    "\\infty": "∞"
  };
  Object.entries(symbols).forEach(([from, to]) => { text = text.split(from).join(to); });

  // \text{drop} -> drop
  text = text.replace(/\\text\s*\{([^{}]*)\}/g, "$1");

  // 단순 분수는 L/A와 같이 읽기 쉬운 꼴로 바꾼다.
  // 중첩되지 않은 \frac{...}{...}를 여러 번 처리한다.
  for (let i = 0; i < 4; i += 1) {
    const next = text.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, "$1/$2");
    if (next === text) break;
    text = next;
  }

  // 아래첨자/위첨자 중 숫자는 유니코드로 바꾸고, 문자 첨자는 붙여서 표시한다.
  const subMap = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","-":"₋" };
  const supMap = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻" };
  text = text.replace(/_\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => subMap[ch] || ch).join(""));
  text = text.replace(/_([0-9])/g, (_, s) => subMap[s] || s);
  text = text.replace(/\^\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => supMap[ch] || ch).join(""));
  text = text.replace(/\^([0-9])/g, (_, s) => supMap[s] || s);
  text = text.replace(/_\{([^{}]+)\}/g, "$1");
  text = text.replace(/_([A-Za-z가-힣]+)/g, "$1");

  // 수식 구분 기호와 남은 불필요한 LaTeX 기호를 정리한다.
  text = text
    .replace(/\\left|\\right/g, "")
    .replace(/\\\[|\\\]|\$\$/g, "")
    .replace(/\$/g, "")
    .replace(/\\,/g, " ")
    .replace(/\\;/g, " ")
    .replace(/\\!/g, "")
    .replace(/\s*=\s*/g, " = ")
    .replace(/\s*([≤≥≈≠×±])\s*/g, " $1 ")
    .replace(/[ \t]{2,}/g, " ")
    .trim();

  return text;
}

function docxRun(text, options = {}) {
  const props = [];
  props.push('<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕"/>');
  if (options.bold) props.push('<w:b/>');
  if (options.color) props.push(`<w:color w:val="${options.color}"/>`);
  if (options.size) props.push(`<w:sz w:val="${options.size}"/><w:szCs w:val="${options.size}"/>`);
  const sourceText = options.normalizeMath ? normalizeReportMath(text) : String(text ?? "");
  const value = docxXmlText(sourceText || " ");
  return `<w:r><w:rPr>${props.join("")}</w:rPr><w:t xml:space="preserve">${value}</w:t></w:r>`;
}

function docxParagraph(text, options = {}) {
  const pPr = [];
  if (options.align) pPr.push(`<w:jc w:val="${options.align}"/>`);
  if (options.keepNext) pPr.push('<w:keepNext/>');
  if (options.pageBreakBefore) pPr.push('<w:pageBreakBefore/>');
  if (options.spacingBefore || options.spacingAfter || options.line) {
    pPr.push(`<w:spacing w:before="${options.spacingBefore || 0}" w:after="${options.spacingAfter || 0}" w:line="${options.line || 360}" w:lineRule="auto"/>`);
  }
  if (options.leftIndent || options.hanging) {
    pPr.push(`<w:ind w:left="${options.leftIndent || options.hanging || 0}"${options.hanging ? ` w:hanging="${options.hanging}"` : ""}/>`);
  }
  if (options.borderBottom) {
    pPr.push(`<w:pBdr><w:bottom w:val="single" w:sz="${options.borderSize || 10}" w:space="5" w:color="${options.borderColor || "192238"}"/></w:pBdr>`);
  }
  return `<w:p><w:pPr>${pPr.join("")}</w:pPr>${docxRun(text, options)}</w:p>`;
}

function docxBodyParagraphs(value, options = {}) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  const paragraphOptions = { normalizeMath: options.normalizeMath !== false, ...options };
  if (!lines.some((line) => line.trim())) return docxParagraph(" ", { spacingAfter: 100, line: 350, ...paragraphOptions });

function docxCrc32(bytes) {
  if (!docxCrc32.table) {
    docxCrc32.table = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      return c >>> 0;
    });
  }
  let crc = 0xFFFFFFFF;
  for (const byte of bytes) crc = docxCrc32.table[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function docxLe16(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF);
}

function docxLe32(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF, (value >>> 16) & 0xFF, (value >>> 24) & 0xFF);
}

function docxConcat(parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const part of parts) { out.set(part, offset); offset += part.length; }
  return out;
}

function docxZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;
  const now = new Date();
  const year = Math.max(1980, now.getFullYear());
  const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((Math.floor(now.getSeconds() / 2)) & 31);
  const dosDate = (((year - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

  for (const [name, content] of Object.entries(files)) {
    const nameBytes = encoder.encode(name);
    const data = encoder.encode(content);
    const crc = docxCrc32(data);
    const localHeader = docxConcat([
      docxLe32(0x04034B50), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), nameBytes,
    ]);
    localParts.push(localHeader, data);

    const centralHeader = docxConcat([
      docxLe32(0x02014B50), docxLe16(20), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), docxLe16(0),
      docxLe16(0), docxLe16(0), docxLe32(0), docxLe32(localOffset), nameBytes,
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + data.length;
  }

  const central = docxConcat(centralParts);
  const local = docxConcat(localParts);
  const count = Object.keys(files).length;
  const end = docxConcat([
    docxLe32(0x06054B50), docxLe16(0), docxLe16(0), docxLe16(count), docxLe16(count),
    docxLe32(central.length), docxLe32(local.length), docxLe16(0),
  ]);
  return new Blob([local, central, end], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function downloadDocx(title, bodyXml, fileName, message, options = {}) {
  const blob = docxZipBlob(docxPackageFiles(title, bodyXml, options));
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  saveNow(true);
  showToast(message);
}

function docxReferenceParagraphs() {
  const currentRefs = String(state.fields.final08 ?? "").trim();
  const importedRefs = String(state.fields["_imported-final08"] ?? "").trim();

  // 보고서 완성 단계에서 참고자료를 직접 수정했다면 그 수정 내용을 우선한다.
  if (currentRefs && currentRefs !== importedRefs) {
    return docxBodyParagraphs(currentRefs, {
      size: 19,
      color: "333333",
      line: 320,
      spacingAfter: 110,
      leftIndent: 360,
      hanging: 360,
      normalizeMath: false
    });
  }

  const items = [];
  const referenceCount = Math.max(1, Number(state.referenceCount) || 3);

  for (let index = 1; index <= referenceCount; index += 1) {
    const title = String(state.fields[`ref${index}-title`] ?? "").trim();
    if (!title) continue;

    const author = String(state.fields[`ref${index}-author`] ?? "").trim().replace(/[.。]\s*$/g, "");
    const year = String(state.fields[`ref${index}-year`] ?? "").trim();
    const cleanTitle = title.replace(/[.。]\s*$/g, "");
    const url = String(state.fields[`ref${index}-url`] ?? "").trim().replace(/[?&]utm_source=[^&\s]+/g, "");

    const parts = [];
    if (author) parts.push(`${author}.`);
    if (year) parts.push(`(${year}).`);
    parts.push(`${cleanTitle}.`);
    if (url) parts.push(url);

    items.push(`${items.length + 1}. ${parts.join(" ")}`);
  }

  if (items.length) {
    return items.map((item) => docxParagraph(item, {
      size: 19,
      color: "333333",
      line: 320,
      spacingAfter: 110,
      leftIndent: 360,
      hanging: 360,
      normalizeMath: false
    })).join("");
  }

function insertPlainTextAtCursor(textValue) {
  const selection = window.getSelection();
  if (!selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  range.deleteContents();
  const textNode = document.createTextNode(textValue);
  range.insertNode(textNode);
  range.setStartAfter(textNode);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
}

function compressedImageData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const image = new Image();
      image.onerror = reject;
      image.onload = () => {
        const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", .8));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.addEventListener("click", async (event) => {
  const target = event.target.closest("button, a");
  if (!target) return;
  if (target.hasAttribute("data-scroll-top")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (target.dataset.nav) {
    const next = target.dataset.nav;
    state.view = next;
    saveNow(true);
    render();
    return;
  }
  if (target.dataset.category) {
    state.categoryId = target.dataset.category;
    state.majorId = activeCategory().majors[0].id;
    state.difficulty = "easy";
    render("#major-section"); return;
  }
  if (target.dataset.major) { state.majorId = target.dataset.major; state.difficulty = "easy"; render("#difficulty-section"); return; }
  if (target.dataset.difficulty) { state.difficulty = target.dataset.difficulty; render("#topic-section"); return; }
  if (target.dataset.startTopic) { startTopic(target.dataset.startTopic); return; }
  if (target.hasAttribute("data-start-custom-topic")) { startCustomTopic(); return; }
  if (target.dataset.exampleTarget) {
    const id = target.dataset.exampleTarget;
    const text = decodeURIComponent(target.dataset.example);
    const input = document.querySelector(`[data-field="${CSS.escape(id)}"]`);
    const current = String(state.fields[id] ?? "").trim();
    let next = text;
    if (current && current !== text && !SELF_PART_FIELDS.has(id)) {
      const replace = window.confirm("이미 작성한 내용이 있습니다. 확인을 누르면 예시로 바꾸고, 취소하면 기존 내용 뒤에 예시를 추가합니다.");
      next = replace ? text : `${current}${input?.tagName === "INPUT" ? " / " : "\n\n"}${text}`;
    }
    state.fields[id] = next;
    if (input) { input.value = next; input.focus(); }
    if (SELF_PART_FIELDS.has(id)) updateGuidedJosa(id, next);
    const selfSynced = SELF_PART_FIELDS.has(id) ? syncSelfOutputFromParts(false) : true;
    scheduleSave();
    showToast(selfSynced ? "예시가 입력되었습니다. 자신의 내용에 맞게 수정하세요." : "예시는 입력했지만 아래에서 직접 수정한 문장은 유지했습니다.");
    return;
  }
  if (target.dataset.copyKeyword) {
    try { await navigator.clipboard.writeText(target.dataset.copyKeyword); showToast("검색어를 복사했습니다."); }
    catch { showToast("검색어를 선택해 직접 복사하세요."); }
    return;
  }
  if (target.hasAttribute("data-delete-reference")) {
    const deleteIndex = Number(target.dataset.deleteReference);
    const referenceCount = Math.max(1, Number(state.referenceCount) || 3);
    if (!Number.isInteger(deleteIndex) || deleteIndex < 1 || deleteIndex > referenceCount) return;
    if (referenceCount <= 1) {
      showToast("자료 입력칸은 최소 1개가 필요합니다.");
      return;
    }

    const suffixes = ["title", "author", "year", "url", "clipping", "limit"];
    if (!window.confirm(`자료 ${deleteIndex}를 삭제하시겠습니까? 삭제한 자료는 복구할 수 없습니다.`)) return;

    // 중간 자료를 삭제하면 뒤 자료를 한 칸씩 당겨 번호가 연속되도록 유지합니다.
    for (let index = deleteIndex; index < referenceCount; index += 1) {
      suffixes.forEach((suffix) => {
        const nextKey = `ref${index + 1}-${suffix}`;
        const currentKey = `ref${index}-${suffix}`;
        if (Object.prototype.hasOwnProperty.call(state.fields, nextKey)) state.fields[currentKey] = state.fields[nextKey];
        else delete state.fields[currentKey];
      });
    }
    suffixes.forEach((suffix) => delete state.fields[`ref${referenceCount}-${suffix}`]);
    state.referenceCount = referenceCount - 1;

    // 보고서의 참고자료가 자동 연동 상태라면 삭제 결과도 즉시 반영합니다.
    syncReportFromPrevious(false);
    saveNow(true);
    render("#explore-references");
    showToast(`자료 ${deleteIndex}를 삭제했습니다.`);
    return;
  }
  if (target.hasAttribute("data-add-reference")) {
    state.referenceCount = Math.max(1, Number(state.referenceCount) || 3) + 1;
    saveNow(true);
    const addedIndex = state.referenceCount;
    render(`#reference-card-${addedIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="ref${addedIndex}-title"]`)?.focus();
    }, 450);
    showToast(`자료 ${addedIndex} 입력칸을 추가했습니다.`);
    return;
  }
  if (target.hasAttribute("data-delete-analysis-subheading")) {
    const deleteIndex = Number(target.dataset.deleteAnalysisSubheading);
    const selected = workflowSelection();
    const topic = selected?.topic ?? { id: "custom-topic" };
    const outline = reportOutline(topic);
    const count = outline.length;

    if (!Number.isInteger(deleteIndex) || deleteIndex < 0 || deleteIndex >= count) return;
    if (count <= 1) {
      showToast("분석 결과 소제목은 최소 1개가 필요합니다.");
      return;
    }

    if (!window.confirm(`소제목 ${deleteIndex + 1}을 삭제하시겠습니까? 작성한 제목과 내용도 함께 삭제되며 복구할 수 없습니다.`)) return;

    // 화면에 보이는 현재 제목을 기준으로 삭제 후 목록을 만들고 번호를 다시 정리합니다.
    const visibleTitles = outline.map((title, index) =>
      String(state.fields[`analysis-title-${index}`] ?? title).trim() || title
    );
    const remainingTitles = visibleTitles
      .filter((_, index) => index !== deleteIndex)
      .map((title, index) => renumberAnalysisTitle(title, index));

    // 중간 항목을 삭제하면 뒤의 제목·본문을 한 칸씩 앞으로 당깁니다.
    for (let index = deleteIndex; index < count - 1; index += 1) {
      const nextTitleKey = `analysis-title-${index + 1}`;
      const nextContentKey = `analysis-content-${index + 1}`;
      const currentTitleKey = `analysis-title-${index}`;
      const currentContentKey = `analysis-content-${index}`;

      if (Object.prototype.hasOwnProperty.call(state.fields, nextTitleKey)) {
        state.fields[currentTitleKey] = state.fields[nextTitleKey];
      } else {
        delete state.fields[currentTitleKey];
      }

      if (Object.prototype.hasOwnProperty.call(state.fields, nextContentKey)) {
        state.fields[currentContentKey] = state.fields[nextContentKey];
      } else {
        delete state.fields[currentContentKey];
      }
    }

    // 마지막에 남은 이전 값과 자동 연동 표식을 제거합니다.
    delete state.fields[`analysis-title-${count - 1}`];
    delete state.fields[`analysis-content-${count - 1}`];
    for (let index = 0; index < count; index += 1) {
      delete state.fields[`_imported-analysis-title-${index}`];
    }

    // 삭제 후 제목을 새 순서대로 저장합니다.
    remainingTitles.forEach((title, index) => {
      state.fields[`analysis-title-${index}`] = title;
      state.fields[`_imported-analysis-title-${index}`] = title;
    });

    state.analysisManualOutline = remainingTitles;
    state.analysisExtraCount = 0;

    saveNow(true);
    const focusIndex = Math.min(deleteIndex, remainingTitles.length - 1);
    render(`#analysis-block-${focusIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="analysis-title-${focusIndex}"]`)?.focus();
    }, 450);
    showToast(`소제목 ${deleteIndex + 1}을 삭제했습니다.`);
    return;
  }

  if (target.hasAttribute("data-add-analysis-subheading")) {
    const selected = workflowSelection();
    const topic = selected?.topic ?? { id: "custom-topic" };
    const currentOutline = reportOutline(topic);

    if (Array.isArray(state.analysisManualOutline) && state.analysisManualOutline.length) {
      state.analysisManualOutline = [
        ...currentOutline,
        `5-${currentOutline.length + 1}. 새 소제목`
      ];
    } else {
      state.analysisExtraCount = Math.max(0, Number(state.analysisExtraCount) || 0) + 1;
    }

    const newOutline = reportOutline(topic);
    const addedIndex = newOutline.length - 1;
    saveNow(true);
    render(`#analysis-block-${addedIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="analysis-title-${addedIndex}"]`)?.focus();
    }, 450);
    showToast(`소제목 ${addedIndex + 1}을 추가했습니다.`);
    return;
  }
  if (target.hasAttribute("data-generate-self")) {
    if (state.selfOutputCustomized && !window.confirm("아래에서 직접 수정한 문장은 사라지고 위 항목을 기준으로 다시 만들어집니다. 계속할까요?")) return;
    syncSelfOutputFromParts(true);
    scheduleSave(); showToast("위 항목을 기준으로 자기평가서 문장을 다시 만들었습니다."); return;
  }
  if (target.hasAttribute("data-sync-report")) { syncReportFromPrevious(true); render(); showToast("기획서·예상 목차·참고자료의 최신 내용을 다시 반영했습니다."); return; }
  if (target.hasAttribute("data-download-word")) { downloadReportWord(); return; }
  if (target.hasAttribute("data-download-self-word")) { downloadSelfWord(); return; }
  if (target.hasAttribute("data-save-now")) { saveNow(false); return; }
  if (target.hasAttribute("data-reset")) {
    if (!window.confirm("이 브라우저에 저장된 작성 내용을 모두 지우고 새로 시작할까요?")) return;
    localStorage.removeItem(STORAGE_KEY); state = defaultState(); resumeTargetView = "topics"; resumeVisible = false; render(); showToast("새 보고서를 시작합니다."); return;
  }
  if (target.hasAttribute("data-resume-continue")) {
    resumeVisible = false;
    state.view = resumeTargetView;
    render();
    return;
  }
  if (target.hasAttribute("data-resume-new")) {
    if (!window.confirm("저장된 작성 내용을 지우고 새로 시작할까요?")) return;
    localStorage.removeItem(STORAGE_KEY); state = defaultState(); resumeTargetView = "topics"; resumeVisible = false; render(); return;
  }
});

document.addEventListener("paste", async (event) => {
  const rich = event.target.closest?.("[data-rich-field]");
  if (!rich) return;
  const imageFiles = [...(event.clipboardData?.items ?? [])]
    .filter((item) => item.type.startsWith("image/"))
    .map((item) => item.getAsFile())
    .filter(Boolean);
  event.preventDefault();
  if (imageFiles.length) {
    for (const file of imageFiles) {
      try {
        const image = document.createElement("img");
        image.src = await compressedImageData(file);
        image.alt = "붙여넣은 참고자료 그림";
        rich.append(document.createElement("br"), image, document.createElement("br"));
      } catch {
        showToast("그림을 붙여넣지 못했습니다. 화면 캡처 크기를 줄여 다시 시도하세요.");
      }
    }
    state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
    scheduleSave();
    showToast("참고자료 그림을 이 브라우저에 저장했습니다.");
    return;
  }
  insertPlainTextAtCursor(event.clipboardData?.getData("text/plain") ?? "");
  state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
  scheduleSave();
});

document.addEventListener("input", (event) => {
  const rich = event.target.closest?.("[data-rich-field]");
  if (rich) {
    state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
    scheduleSave();
    return;
  }
  const element = event.target.closest("[data-field]");
  if (!element) return;
  state.fields[element.dataset.field] = element.value;
  if (!state.topicId && (
    element.dataset.field.startsWith("draft-")
    || element.dataset.field.startsWith("final")
    || element.dataset.field.startsWith("analysis-")
  )) {
    state.customTopicMode = true;
  }
  if (SELF_PART_FIELDS.has(element.dataset.field)) {
    updateGuidedJosa(element.dataset.field, element.value);
    syncSelfOutputFromParts(false);
  }
  if (element.dataset.field === "self-output") {
    state.selfOutputCustomized = true;
    state.selfOutputNeedsSync = false;
    updateSelfSyncNote();
  }
  if (element.dataset.field === "self-output") updateSelfCount();
  scheduleSave();
});

});

window.addEventListener("pagehide", () => saveNow(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(true); });

try {
  const rawSaved = localStorage.getItem(STORAGE_KEY);
  if (rawSaved) {
    const saved = JSON.parse(rawSaved);
    if (saved && typeof saved === "object") {
      state = { ...defaultState(), ...saved, fields: saved.fields ?? {} };
      if (typeof saved.selfOutputCustomized !== "boolean" && String(state.fields["self-output"] ?? "").trim()) {
        state.selfOutputCustomized = true;
      }
      resumeTargetView = ["draft","explore","report","self"].includes(saved.view) ? saved.view : "draft";
      state.view = "topics";
      resumeVisible = hasMeaningfulDraft();
    }
  }
} catch {
  state = defaultState();
}

render();
</script>
</body>
</html>
