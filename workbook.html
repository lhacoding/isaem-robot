  <script>"use strict";

const CATEGORIES = [{"id":"engineering","label":"공학계열","shortLabel":"공학","accent":"#de6843","majors":[{"id":"mechanical","label":"기계공학","shortLabel":"기계","accent":"#e45c3a","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"],"topics":[{"id":"mechanical-01","major":"기계공학","question":"물체의 무게중심 높이는 넘어지기 시작하는 경사각에 어떤 영향을 줄까?","hypothesis":"무게중심이 낮고 바퀴 사이 폭이 넓을수록 더 큰 경사각까지 넘어지지 않을 것이다.","methods":[{"kind":"직접 실험","title":"적재 높이별 전도각 측정","detail":"같은 이동체에 동일한 추를 낮음·중간·높음 위치에 고정하고 경사판 각도를 천천히 높인다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 조건별 전도각과 반복 오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"무게중심과 임계각 모형","detail":"차체 폭은 고정하고 무게중심 높이를 일정 간격으로 바꾸는 전도 모형을 만든다. 높이별 예상 임계각과 실험값의 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"이동체 안정성 자료 비교","detail":"이동로봇·지게차·자동차의 무게중심 안정성을 다룬 자료 3편을 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 차체 폭·무게중심·전도 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"물체의 무게중심 높이는 넘어지기 시작하는 경사각에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-02","major":"기계공학","question":"기어의 크기 비율을 바꾸면 회전속도와 돌리는 힘은 어떻게 달라질까?","hypothesis":"큰 기어가 작은 기어를 돌리면 속도는 증가하고 힘은 감소하며, 반대 연결에서는 힘이 증가할 것이다.","methods":[{"kind":"직접 실험","title":"기어비별 회전수 비교","detail":"톱니 수가 다른 기어를 연결하고 입력 기어를 10회 돌려 출력 회전수를 센다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 기어비별 출력 회전수와 이론값을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"제작·검증","title":"기어비별 물체 들어 올리기","detail":"같은 모터에 서로 다른 기어 조합을 연결해 같은 추를 들어 올리는 장치를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 상승시간·들어 올린 최대 질량·소비전류을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"수학 모형","title":"속도와 토크의 교환 관계","detail":"입력 회전수와 기어 톱니 수를 바꾸는 계산표를 만든다. 출력 회전수·예상 토크·실제 측정값을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"기어의 크기 비율을 바꾸면 회전속도와 돌리는 힘은 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-03","major":"기계공학","question":"도르래의 개수가 늘어나면 물체를 들어 올리는 데 필요한 힘이 얼마나 줄어들까?","hypothesis":"움직도르래를 지지하는 줄의 수가 증가할수록 필요한 힘은 감소하지만 당겨야 하는 줄의 길이는 증가할 것이다.","methods":[{"kind":"직접 실험","title":"도르래 구성별 힘 측정","detail":"고정도르래와 움직도르래 조합을 바꾸고 같은 추를 일정 높이까지 올린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 용수철저울 힘·당긴 줄 길이·상승 높이을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"이론적 이득과 실제 효율","detail":"도르래별 지지 줄 수와 측정 힘을 표로 정리한다. 결측값과 단위를 확인한 뒤 이론적 힘·실제 힘·마찰로 인한 효율 손실을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"승강장치의 도르래 적용","detail":"엘리베이터·크레인·운동기구에서 도르래를 사용한 구조를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 힘의 방향·기계적 이득·안전장치을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"도르래의 개수가 늘어나면 물체를 들어 올리는 데 필요한 힘이 얼마나 줄어들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-04","major":"기계공학","question":"보의 길이와 두께는 중앙 처짐량에 어떤 영향을 줄까?","hypothesis":"재료와 하중이 같을 때 보가 길수록 처짐이 커지고, 두께가 증가하면 처짐은 크게 감소할 것이다.","methods":[{"kind":"직접 실험","title":"길이·두께별 처짐 측정","detail":"같은 재료의 보 길이와 겹친 층 수를 바꾸고 중앙에 같은 하중을 올린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 중앙 처짐량과 하중 제거 후 복원량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"길이와 처짐 관계식 탐색","detail":"보 길이별 측정값을 정리하고 선형·제곱·세제곱 관계를 각각 적용한다. 결측값과 단위를 확인한 뒤 각 모형의 예측 오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"보강 구조의 처짐 저감","detail":"I형 보·상자형 보·리브 보강을 설명한 구조 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 단면 모양·재료량·처짐 감소 효과을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"보의 길이와 두께는 중앙 처짐량에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-05","major":"기계공학","question":"바퀴 지름은 한 바퀴 이동거리와 실제 주행 오차에 어떤 영향을 줄까?","hypothesis":"바퀴 지름이 클수록 이론상 이동거리는 증가하지만 미끄러짐 때문에 실제 거리는 원주 계산값보다 작을 것이다.","methods":[{"kind":"직접 실험","title":"바퀴 크기별 이동거리","detail":"지름이 다른 바퀴를 같은 축에 연결하고 정확히 10회 회전시킨다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 이론거리·실제거리·오차율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"표면 비교 실험","title":"노면에 따른 미끄러짐 오차","detail":"같은 바퀴로 종이·천·고무판 위를 같은 회전수만큼 이동한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 노면별 실제거리와 미끄러짐 비율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"회전수 기반 거리 보정","detail":"바퀴 지름과 회전수로 거리를 계산한 뒤 실험 오차율을 보정계수로 적용한다. 보정 전후 예측 오차을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"바퀴 지름은 한 바퀴 이동거리와 실제 주행 오차에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-06","major":"기계공학","question":"윤활 상태와 접촉 재료는 축의 회전 마찰에 어떤 차이를 만들까?","hypothesis":"마찰이 작은 접촉재와 적절한 윤활을 사용하면 같은 초기 힘에서 회전 지속시간이 길어질 것이다.","methods":[{"kind":"직접 실험","title":"축 재료별 회전 지속시간","detail":"같은 회전체의 축 받침을 종이·플라스틱·금속 등으로 바꾸어 같은 속도로 출발시킨다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 정지까지 걸린 시간과 회전수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"조건 비교 실험","title":"윤활 전후 마찰 변화","detail":"축과 하중을 고정하고 무윤활과 안전한 윤활 조건을 비교한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시작에 필요한 힘·회전 지속시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"베어링 구조와 마찰 감소","detail":"미끄럼베어링과 구름베어링의 구조를 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 접촉 방식·마찰·하중 범위·유지관리을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"윤활 상태와 접촉 재료는 축의 회전 마찰에 어떤 차이를 만들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-07","major":"기계공학","question":"선풍기 날개의 각도와 개수는 바람의 세기와 소비전력에 어떤 영향을 줄까?","hypothesis":"날개 각도가 증가하면 일정 구간까지 풍속이 높아지지만 너무 크면 저항이 증가해 효율이 낮아질 것이다.","methods":[{"kind":"제작·검증","title":"날개 각도별 풍속 비교","detail":"같은 모터와 재료로 날개 각도만 다른 회전체를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 일정 거리의 풍속·회전수·소비전류을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"직접 실험","title":"날개 수에 따른 성능","detail":"날개 각도와 크기는 고정하고 2개·3개·4개 날개 조건을 시험한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 풍속과 전류로 계산한 상대 효율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"축류팬 설계 변수 조사","detail":"팬의 피치각·날개 수·직경을 다룬 기술자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 설계 변수별 풍량·소음·전력을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"선풍기 날개의 각도와 개수는 바람의 세기와 소비전력에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-08","major":"기계공학","question":"방열판의 표면적과 공기 흐름은 물체의 냉각 속도에 어떤 영향을 줄까?","hypothesis":"표면적이 넓고 공기 흐름이 있는 조건에서 온도가 더 빠르게 내려갈 것이다.","methods":[{"kind":"직접 실험","title":"표면적별 냉각곡선","detail":"같은 온도의 물체에 크기가 다른 금속판 또는 핀 모형을 부착한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 2분 간격 온도와 10분당 감소량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"조건 비교 실험","title":"자연냉각과 강제냉각","detail":"방열판은 고정하고 바람 없음과 일정한 팬 바람 조건을 비교한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 목표 온도까지 걸린 시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"냉각속도 모형 비교","detail":"시간별 온도 자료에 선형 모형과 지수 감소 모형을 적용한다. 결측값과 단위를 확인한 뒤 모형별 예측 오차와 초기·후반 냉각률을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"방열판의 표면적과 공기 흐름은 물체의 냉각 속도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-09","major":"기계공학","question":"스프링의 압축량은 발사된 물체의 이동거리와 어떤 관계가 있을까?","hypothesis":"탄성 범위 안에서는 압축량이 증가할수록 이동거리가 늘지만 마찰과 공기저항 때문에 증가 폭은 일정하지 않을 것이다.","methods":[{"kind":"직접 실험","title":"압축량별 이동거리","detail":"안전한 수평 발사장치에서 스프링 압축량을 일정 간격으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 이동거리·최대거리 편차·출발속도을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"탄성에너지와 거리 관계","detail":"압축량의 제곱에 비례하는 에너지 모형과 실제 거리를 비교한다. 압축량별 예측거리와 잔차을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"스프링 장치의 에너지 손실","detail":"완구·완충기·기계식 저장장치의 스프링 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 탄성한계·마찰·감쇠·안전 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"스프링의 압축량은 발사된 물체의 이동거리와 어떤 관계가 있을까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]},{"id":"mechanical-10","major":"기계공학","question":"완충재의 종류와 두께는 진동이 전달되는 정도에 어떤 영향을 줄까?","hypothesis":"공기층이 있고 탄성이 큰 재료를 여러 층 사용하면 전달 진동의 최대값이 감소할 것이다.","methods":[{"kind":"직접 실험","title":"완충재별 진동 측정","detail":"같은 진동원과 센서 사이에 스펀지·고무·종이·에어캡을 넣는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 가속도 최대값·평균 진폭·감쇠시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"설계·검증","title":"다층 완충 구조 제작","detail":"재료 양을 같게 하고 단일 재료층과 서로 다른 재료를 겹친 구조를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 진동 저감률과 구조 질량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"진동 절연 소재 비교","detail":"건물·차량·전자제품 포장에 쓰이는 방진 소재 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 재료 특성·사용 주파수·감쇠 효과을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"완충재의 종류와 두께는 진동이 전달되는 정도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["힘과 운동","무게중심","마찰","에너지","측정오차"]}]},{"id":"robotics","label":"로봇공학","shortLabel":"로봇","accent":"#18856f","concepts":["센서","제어","피드백","좌표","오차"],"topics":[{"id":"robotics-01","major":"로봇공학","question":"초음파센서의 설치 각도와 물체 재질은 거리 측정 오차에 어떤 영향을 줄까?","hypothesis":"센서가 물체 면과 수직일 때 오차가 작고, 소리를 흡수하거나 비스듬한 물체에서는 오차가 커질 것이다.","methods":[{"kind":"센서 실험","title":"각도별 거리 오차","detail":"실제 거리를 고정하고 센서와 판의 각도를 0°·15°·30°·45°로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 실제거리와 센서값의 절대오차·측정 실패율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"재질 비교 실험","title":"표면 재질별 반사 차이","detail":"거리와 각도는 고정하고 금속·종이·천·스펀지를 측정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 재질별 평균오차와 값의 변동 폭을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"초음파 반사 오차 요인","detail":"초음파센서의 빔각·흡음·다중반사를 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 오차 원인·권장 거리·보정 방법을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"초음파센서의 설치 각도와 물체 재질은 거리 측정 오차에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-02","major":"로봇공학","question":"라인센서 사이 간격은 라인트레이서의 곡선 추종 성능에 어떤 영향을 줄까?","hypothesis":"센서 간격이 너무 좁거나 넓으면 곡선에서 이탈이 증가하고 중간 간격에서 주행시간과 이탈횟수가 줄어들 것이다.","methods":[{"kind":"제작·검증","title":"센서 간격별 주행 시험","detail":"같은 로봇에서 좌우 라인센서 간격만 3단계로 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 완주시간·이탈횟수·수정조향 횟수을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"곡률별 오차 비교","detail":"직선·완만한 곡선·급곡선 구간의 센서값과 조향값을 저장한다. 결측값과 단위를 확인한 뒤 구간별 추종오차와 간격별 차이을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시뮬레이션","title":"센서 위치와 선 검출 모형","detail":"로봇 중심과 센서 위치를 바꾸는 2차원 경로 모형을 만든다. 곡선 반지름별 선 검출 가능 범위을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"라인센서 사이 간격은 라인트레이서의 곡선 추종 성능에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-03","major":"로봇공학","question":"좌우 바퀴의 속도 차이는 로봇의 회전반지름에 어떤 영향을 줄까?","hypothesis":"두 바퀴 속도 차이가 커질수록 회전반지름이 작아지고, 반대 방향 회전에서는 제자리 회전에 가까워질 것이다.","methods":[{"kind":"직접 실험","title":"속도비별 회전반지름","detail":"한쪽 바퀴 속도를 고정하고 다른 쪽 PWM을 단계적으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 원 궤적의 반지름·한 바퀴 시간·좌우 이동오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"차동구동 운동학","detail":"바퀴 간 거리와 좌우 속도로 회전반지름을 계산한다. 계산 반지름과 실제 궤적의 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"배터리 전압에 따른 보정","detail":"동일 PWM에서 시간대별 전압과 바퀴 회전수를 기록한다. 결측값과 단위를 확인한 뒤 전압·회전수·회전반지름 변화을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"좌우 바퀴의 속도 차이는 로봇의 회전반지름에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-04","major":"로봇공학","question":"비례제어 값이 커지면 로봇은 목표 위치에 더 빠르고 정확하게 도달할까?","hypothesis":"비례제어 값이 작으면 느리고, 너무 크면 목표를 반복해서 지나치며 중간 값에서 정착시간이 가장 짧을 것이다.","methods":[{"kind":"제어 실험","title":"P값별 목표 도달 응답","detail":"같은 거리 목표에서 비례게인을 낮음·중간·높음으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 도달시간·최대 초과량·진동횟수·정착시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"시간-오차 곡선 비교","detail":"제어 주기마다 목표와 현재값의 차이를 저장한다. 결측값과 단위를 확인한 뒤 P값별 오차곡선 면적과 최종오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시뮬레이션","title":"비례제어 응답 모형","detail":"관성과 마찰을 단순화한 제어 모형에서 게인을 일정 간격으로 바꾼다. 정착시간과 초과량의 균형을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"비례제어 값이 커지면 로봇은 목표 위치에 더 빠르고 정확하게 도달할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-05","major":"로봇공학","question":"로봇의 제어 명령 간격은 경로 추종의 부드러움과 정확도에 어떤 영향을 줄까?","hypothesis":"제어 간격이 짧아질수록 오차 수정은 빨라지지만 센서 잡음에 민감해져 조향이 불안정해질 수 있다.","methods":[{"kind":"주행 실험","title":"제어주기별 추종 성능","detail":"같은 경로와 속도에서 제어 간격을 10ms·50ms·100ms로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 완주시간·경로이탈·조향 변화량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"명령 변화의 매끄러움","detail":"시간별 센서값과 좌우 모터 명령을 저장한다. 결측값과 단위를 확인한 뒤 명령값 차분의 평균·최대값과 추종오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"실시간 제어주기 설계","detail":"이동로봇 제어주기와 센서 샘플링을 다룬 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 로봇 속도·센서주기·제어 안정성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"로봇의 제어 명령 간격은 경로 추종의 부드러움과 정확도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-06","major":"로봇공학","question":"로봇에 실은 물체의 높이와 위치는 경사 주행 안정성에 어떤 영향을 줄까?","hypothesis":"같은 질량이라도 낮고 중앙에 적재할수록 경사면과 회전 구간에서 전도 위험이 낮을 것이다.","methods":[{"kind":"제작·검증","title":"적재 위치별 경사 주행","detail":"같은 추를 낮음·높음, 중앙·좌우 위치에 부착한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 완주 가능한 최대 경사각·전도횟수·주행시간을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"수학 모형","title":"적재 위치와 무게중심 계산","detail":"차체와 추의 질량·좌표로 전체 무게중심을 계산한다. 무게중심 좌표와 실제 최대 경사각을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"물류로봇 적재 안전","detail":"창고로봇·배송로봇의 적재 구조와 전도 방지 사례를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 적재 높이·속도 제한·센서 안전기능을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"로봇에 실은 물체의 높이와 위치는 경사 주행 안정성에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-07","major":"로봇공학","question":"그리퍼 접촉면의 재료와 모양은 물체가 미끄러지는 힘에 어떤 영향을 줄까?","hypothesis":"마찰이 큰 재료와 물체 모양에 맞는 접촉면을 사용하면 같은 서보 힘에서도 더 큰 하중을 잡을 수 있을 것이다.","methods":[{"kind":"제작·검증","title":"그리퍼 패드 재료 비교","detail":"같은 그리퍼에 고무·스펀지·플라스틱 패드를 같은 크기로 부착한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 미끄러지기 시작하는 하중·물체 손상·파지 성공률을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"형상 비교 실험","title":"평면과 곡면 접촉 비교","detail":"재료는 고정하고 평면·V자·곡면 패드로 원통과 상자를 잡는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 물체별 최대 파지하중과 중심 흔들림을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"소프트그리퍼 접촉 원리","detail":"산업용·소프트 그리퍼의 접촉면 설계 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 마찰·접촉면적·변형·적용 물체을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"그리퍼 접촉면의 재료와 모양은 물체가 미끄러지는 힘에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-08","major":"로봇공학","question":"장애물의 수와 위치가 달라질 때 어떤 경로탐색 방법이 가장 짧고 빠른 길을 찾을까?","hypothesis":"장애물이 적을 때는 알고리즘 차이가 작지만 복잡한 지도에서는 휴리스틱을 사용하는 방법이 탐색 칸 수를 줄일 것이다.","methods":[{"kind":"코딩 실험","title":"BFS와 A* 경로탐색 비교","detail":"같은 격자 지도에서 BFS와 A*를 실행하고 장애물 비율을 단계적으로 높인다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 경로 길이·탐색한 칸 수·실행시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"로봇 검증","title":"계산 경로의 실제 주행","detail":"두 알고리즘이 만든 경로를 같은 로봇이 따라가게 한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 실제 이동거리·회전횟수·완주시간·경로이탈을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"시뮬레이션","title":"휴리스틱 변화 실험","detail":"A*의 거리 추정 방식을 맨해튼·유클리드 방식으로 바꾼다. 지도 형태별 탐색량과 최종 경로을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"장애물의 수와 위치가 달라질 때 어떤 경로탐색 방법이 가장 짧고 빠른 길을 찾을까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-09","major":"로봇공학","question":"조명의 밝기와 방향은 카메라 기반 물체인식 정확도에 어떤 영향을 줄까?","hypothesis":"학습 때와 비슷한 조명에서는 정확도가 높고, 역광이나 낮은 밝기에서는 누락과 오분류가 증가할 것이다.","methods":[{"kind":"인식 실험","title":"조명 조건별 정확도","detail":"같은 물체와 배경에서 정면광·측면광·역광·저조도 영상을 수집한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 조건별 인식률·누락률·신뢰도 평균을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 확장 실험","title":"밝기 변환 학습자료 효과","detail":"원본 학습 이미지에 밝기·대비 변환 자료를 추가해 같은 모델을 다시 학습한다. 결측값과 단위를 확인한 뒤 추가 전후 테스트 정확도와 조건별 개선 폭을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"로봇 비전의 조명 보정","detail":"산업용 비전에서 사용하는 확산광·백라이트·편광 사례를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 물체 특성·조명 방식·검출 안정성을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"조명의 밝기와 방향은 카메라 기반 물체인식 정확도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]},{"id":"robotics-10","major":"로봇공학","question":"배터리 전압이 낮아질수록 로봇의 속도와 직진 오차는 어떻게 변할까?","hypothesis":"전압이 낮아지면 양쪽 모터의 속도가 감소하고 모터 특성 차이가 커져 직진 오차가 증가할 것이다.","methods":[{"kind":"주행 실험","title":"전압 구간별 직진 성능","detail":"안전한 전원장치로 허용 범위 안의 전압을 단계적으로 바꾸고 같은 PWM으로 주행한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 1m 주행시간·좌우 이탈거리·바퀴 회전수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"전압과 모터 응답 관계","detail":"주행 중 전압·전류·엔코더 값을 같은 주기로 저장한다. 결측값과 단위를 확인한 뒤 전압 구간별 회전속도와 좌우 속도차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"제어 설계","title":"전압 보상 주행 제어","detail":"전압에 따라 PWM을 보정하거나 엔코더 피드백을 적용한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 보정 전후 속도 유지율과 직진 오차을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"배터리 전압이 낮아질수록 로봇의 속도와 직진 오차는 어떻게 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["센서","제어","피드백","좌표","오차"]}]},{"id":"automotive","label":"자동차공학","shortLabel":"자동차","accent":"#3667b1","concepts":["운동","마찰","에너지 전환","공기저항","제어"],"topics":[{"id":"automotive-01","major":"자동차공학","question":"자동차의 출발 속도와 노면 재질은 제동거리에 어떤 영향을 줄까?","hypothesis":"출발 속도가 빠르고 마찰이 작은 노면일수록 제동거리가 길어지며 속도 증가에 따른 거리는 단순 비례보다 크게 늘 것이다.","methods":[{"kind":"모형 실험","title":"속도 조건별 정지거리","detail":"같은 모형차를 경사로의 서로 다른 높이에서 출발시킨다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 평면에서 정지할 때까지 거리와 반복 편차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"노면 비교 실험","title":"표면 재질별 제동거리","detail":"출발 높이는 고정하고 종이·천·고무판 노면을 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 노면별 정지거리와 마찰 경향을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"속도와 제동거리 모형","detail":"속도별 실제 제동거리 자료에 선형과 제곱 모형을 적용한다. 결측값과 단위를 확인한 뒤 모형별 예측오차와 정지거리 구성을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"자동차의 출발 속도와 노면 재질은 제동거리에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-02","major":"자동차공학","question":"타이어 표면의 무늬와 재질은 젖은 노면에서 미끄러짐에 어떤 차이를 만들까?","hypothesis":"배수 홈이 있고 마찰이 큰 재질의 바퀴가 젖은 경사면에서 더 늦게 미끄러질 것이다.","methods":[{"kind":"경사 실험","title":"타이어 조건별 미끄럼각","detail":"바퀴 하중을 같게 하고 표면 무늬·재질만 다른 모형을 경사판에 놓는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 마른·젖은 조건의 미끄럼 시작각을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"제작·검증","title":"배수 홈 패턴 비교","detail":"같은 고무 재료에 세로·가로·격자 홈을 같은 깊이로 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 젖은 표면의 이동거리·미끄럼률·배수 흔적을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"타이어 트레드와 수막현상","detail":"트레드 깊이·속도·수막현상을 설명한 안전자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 홈 깊이·물 깊이·속도별 위험을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"타이어 표면의 무늬와 재질은 젖은 노면에서 미끄러짐에 어떤 차이를 만들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-03","major":"자동차공학","question":"차량 질량이 증가하면 같은 구동력에서 가속시간은 얼마나 달라질까?","hypothesis":"구동력이 같을 때 질량이 증가할수록 목표거리 도달시간이 길어지고 가속도는 감소할 것이다.","methods":[{"kind":"모형 실험","title":"추가 질량별 가속 성능","detail":"같은 모터와 배터리를 사용하고 모형차에 추를 단계적으로 추가한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 1m 도달시간·최고속도·소비전류을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"질량과 가속도 관계","detail":"질량별 시간-거리 자료에서 평균 가속도를 계산한다. 결측값과 단위를 확인한 뒤 질량의 역수와 가속도 관계·이상값을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"수학 모형","title":"구동력·저항을 포함한 운동","detail":"모터 힘과 구름저항을 가정해 질량별 속도 변화를 계산한다. 모형값과 실제 주행시간의 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"차량 질량이 증가하면 같은 구동력에서 가속시간은 얼마나 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-04","major":"자동차공학","question":"차량의 전면 모양과 면적은 공기저항에 어떤 영향을 줄까?","hypothesis":"전면 면적이 작고 모서리가 완만한 모형이 같은 바람에서 받는 저항이 작을 것이다.","methods":[{"kind":"풍동 모형 실험","title":"차체 모양별 저항 비교","detail":"선풍기 앞에 전면 면적이 같고 모양만 다른 차체 모형을 둔다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 밀려난 거리·용수철저울 힘·풍속을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"제작·검증","title":"전면 면적과 유선형 효과 분리","detail":"한 실험은 면적만, 다른 실험은 모서리 모양만 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 조건별 저항지표와 주행거리을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"항력계수와 차량 설계","detail":"세단·SUV·트럭의 공기저항 관련 기술자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 전면면적·항력계수·속도별 영향을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"차량의 전면 모양과 면적은 공기저항에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-05","major":"자동차공학","question":"회생제동 비율을 높이면 전기차의 에너지 회수량과 정차 편안함은 어떻게 달라질까?","hypothesis":"회생제동이 강할수록 회수 에너지는 증가하지만 감속도가 급해져 편안함 지표가 나빠질 수 있다.","methods":[{"kind":"시뮬레이션","title":"회생제동 강도별 에너지","detail":"같은 주행속도와 차량 질량에서 회생 비율을 단계적으로 바꾼다. 회수 에너지·정지거리·최대 감속도을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"도심·고속 주행 회수량 비교","detail":"속도와 감속이 포함된 주행 자료에서 감속 구간을 찾는다. 결측값과 단위를 확인한 뒤 경로별 감속횟수·이론적 회수에너지을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"원페달 주행과 회생제동","detail":"전기차 회생제동 제어를 다룬 기술자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 회수효율·배터리 상태·승차감 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"회생제동 비율을 높이면 전기차의 에너지 회수량과 정차 편안함은 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-06","major":"자동차공학","question":"타이어 공기압 변화는 구름저항과 이동거리에 어떤 영향을 줄까?","hypothesis":"허용 범위 안에서 공기압이 낮아지면 접촉 변형이 커져 같은 힘으로 이동하는 거리가 짧아질 것이다.","methods":[{"kind":"모형 실험","title":"바퀴 변형과 구름거리","detail":"공기압 대신 눌림 정도가 다른 탄성 바퀴 모형을 같은 경사 높이에서 굴린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 정지거리·바퀴 변형량·주행시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"공기압과 연비 자료","detail":"공식 시험자료에서 공기압 조건과 에너지 소비 또는 연비 값을 수집한다. 결측값과 단위를 확인한 뒤 기준 대비 변화율과 시험조건을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"적정 공기압의 성능 영향","detail":"타이어 공기압과 구름저항을 다룬 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 접지면·발열·마모·안전 범위을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"타이어 공기압 변화는 구름저항과 이동거리에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-07","major":"자동차공학","question":"좌우 바퀴의 정렬 오차는 자동차의 직진성과 에너지 소비에 어떤 영향을 줄까?","hypothesis":"좌우 바퀴가 평행하지 않을수록 직진 이탈과 구름저항이 증가할 것이다.","methods":[{"kind":"모형 실험","title":"토우각별 직진 오차","detail":"같은 모형차의 앞바퀴 각도를 평행·안쪽·바깥쪽으로 작게 조정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 주행거리 1m의 좌우 이탈·정지거리을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"힘 측정 실험","title":"정렬 상태별 끌기 힘","detail":"차량 질량과 노면을 고정하고 일정 속도로 끌 때 필요한 힘을 잰다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 토우각별 평균 견인력과 변동을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"휠 얼라인먼트와 마모","detail":"토우·캠버·캐스터의 역할을 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 정렬 요소·직진성·타이어 마모을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"좌우 바퀴의 정렬 오차는 자동차의 직진성과 에너지 소비에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-08","major":"자동차공학","question":"서스펜션 스프링의 강도와 감쇠재는 차체 진동에 어떤 영향을 줄까?","hypothesis":"스프링이 너무 약하거나 강하면 진동이 커지고 적절한 감쇠재를 추가하면 정착시간이 짧아질 것이다.","methods":[{"kind":"제작·검증","title":"스프링 강도별 차체 진동","detail":"같은 차체에 강도가 다른 스프링을 달고 같은 높이의 장애물을 통과시킨다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 최대 흔들림·정착시간·반복 진동횟수을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"감쇠 비교 실험","title":"완충재 추가 전후 비교","detail":"스프링은 고정하고 고무·스펀지 감쇠재의 유무를 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 가속도 최대값과 진동 감소율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"시뮬레이션","title":"질량-스프링-댐퍼 모형","detail":"스프링 강성과 감쇠계수를 단계적으로 바꾼다. 초과량·진동주기·정착시간을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"서스펜션 스프링의 강도와 감쇠재는 차체 진동에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-09","major":"자동차공학","question":"기온에 따라 전기차 배터리 충전속도와 주행가능거리가 달라질까?","hypothesis":"매우 낮거나 높은 온도에서는 배터리 보호 제어 때문에 충전속도와 사용가능 에너지가 감소할 것이다.","methods":[{"kind":"데이터 분석","title":"기온과 충전시간 비교","detail":"기온·충전 시작 잔량·충전량·소요시간이 포함된 자료를 정리한다. 결측값과 단위를 확인한 뒤 온도구간별 평균 충전속도와 변동을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"데이터 분석","title":"기온과 전비·주행거리","detail":"같은 차종의 외기온·전비·주행거리 자료를 수집한다. 결측값과 단위를 확인한 뒤 온도구간별 전비와 난방 사용 영향을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"배터리 열관리 기술","detail":"배터리 저온·고온 성능과 열관리 시스템 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 온도범위·충전제한·예열·냉각 효과을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"기온에 따라 전기차 배터리 충전속도와 주행가능거리가 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]},{"id":"automotive-10","major":"자동차공학","question":"교통신호의 주기와 차량 유입량은 교차로 대기시간에 어떤 영향을 줄까?","hypothesis":"차량 유입량에 비해 녹색신호가 짧으면 대기행렬이 누적되고, 지나치게 길면 다른 방향의 대기시간이 증가할 것이다.","methods":[{"kind":"시뮬레이션","title":"신호주기별 대기행렬","detail":"두 방향의 차량 도착률과 녹색신호 길이를 바꾸는 모형을 만든다. 평균 대기시간·최대 대기차량·통과량을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"현장 측정","title":"교차로 신호와 통과량 조사","detail":"안전한 위치에서 방향별 신호시간과 한 주기 통과차량 수를 기록한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 시간대별 유입량·잔류차량·주기당 처리량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"고정식과 감응식 신호 비교","detail":"교통량이 다른 시간대의 신호 운영 자료를 비교한다. 결측값과 단위를 확인한 뒤 정지횟수·평균 지체시간·방향별 형평성을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"교통신호의 주기와 차량 유입량은 교차로 대기시간에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["운동","마찰","에너지 전환","공기저항","제어"]}]},{"id":"aerospace","label":"항공우주공학","shortLabel":"항공우주","accent":"#4d61b6","concepts":["양력과 항력","추력","무게중심","궤도","열전달"],"topics":[{"id":"aerospace-01","major":"항공우주공학","question":"종이비행기의 날개 면적은 체공시간과 비행거리에 어떤 영향을 줄까?","hypothesis":"날개 면적이 넓으면 체공시간은 늘지만 항력이 커져 비행거리는 일정 지점부터 감소할 것이다.","methods":[{"kind":"제작·검증","title":"날개 면적별 비행","detail":"같은 종이와 동체에서 날개 폭만 3단계로 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 5회 비행거리·체공시간·좌우편차을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"면적과 성능의 최적점","detail":"날개 면적과 평균 체공시간·거리 자료를 정리한다. 결측값과 단위를 확인한 뒤 증가·감소 구간과 최적 면적을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"양력과 항력의 균형","detail":"글라이더 날개 설계 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 날개면적·항력·실속속도·용도을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"종이비행기의 날개 면적은 체공시간과 비행거리에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-02","major":"항공우주공학","question":"종이글라이더의 무게중심 위치는 비행 안정성에 어떤 영향을 줄까?","hypothesis":"무게중심이 너무 앞이나 뒤보다 날개 앞쪽의 적정 위치에 있을 때 비행거리 편차가 작을 것이다.","methods":[{"kind":"직접 실험","title":"클립 위치별 비행","detail":"같은 글라이더의 클립 위치를 앞·중간·뒤로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 비행거리·급강하·상승 후 실속 횟수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"무게중심 좌표 계산","detail":"종이와 클립의 질량·위치로 전체 무게중심을 계산한다. 무게중심 위치와 안정성 지표을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"항공기 중심한계 조사","detail":"항공기의 전방·후방 무게중심 한계를 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 안정성·조종성·연료 배치을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"종이글라이더의 무게중심 위치는 비행 안정성에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-03","major":"항공우주공학","question":"날개의 가로세로비는 비행거리와 방향 안정성에 어떤 차이를 만들까?","hypothesis":"길고 좁은 날개는 활공 효율이 높지만 구조 변형과 좌우 흔들림이 커질 수 있다.","methods":[{"kind":"제작·검증","title":"가로세로비별 글라이더","detail":"날개 면적은 같고 길이와 폭의 비율만 다르게 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 5회 비행거리·체공시간·착륙편차을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"효율과 안정성 동시 비교","detail":"가로세로비별 거리와 편차를 표준화한다. 결측값과 단위를 확인한 뒤 비행거리 점수와 안정성 점수을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"항공기 용도별 날개비","detail":"수송기·전투기·글라이더의 날개 형상을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 가로세로비·속도·기동성·효율을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"날개의 가로세로비는 비행거리와 방향 안정성에 어떤 차이를 만들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-04","major":"항공우주공학","question":"날개의 받음각이 커지면 양력은 계속 증가할까?","hypothesis":"받음각이 증가하면 일정 구간까지 양력이 커지지만 임계각을 넘으면 흐름이 분리되어 양력이 감소할 것이다.","methods":[{"kind":"모형 실험","title":"받음각별 힘 측정","detail":"선풍기 앞 날개 모형의 각도를 일정 간격으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 용수철저울 또는 전자저울의 힘 변화을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"시뮬레이션","title":"받음각-양력 곡선","detail":"간단한 날개 모형에서 받음각을 -5°부터 단계적으로 바꾼다. 양력계수와 실속 시작 구간을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"실속 원리와 안전","detail":"받음각과 실속을 설명한 항공자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 임계각·속도·날개형상·회복 방법을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"날개의 받음각이 커지면 양력은 계속 증가할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-05","major":"항공우주공학","question":"프로펠러의 날개 수와 피치각은 추력과 소비전력에 어떤 영향을 줄까?","hypothesis":"날개 수와 피치각이 증가하면 추력이 커지지만 저항도 증가해 효율이 낮아지는 구간이 나타날 것이다.","methods":[{"kind":"제작·검증","title":"프로펠러 조건별 추력","detail":"같은 모터에 날개 수 또는 피치각이 다른 안전한 모형을 장착한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 전자저울 추력·전류·추력/전력을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"추력 효율 최적점","detail":"조건별 추력과 소비전력을 정리한다. 결측값과 단위를 확인한 뒤 단위전력당 추력과 과전류 조건을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"드론 프로펠러 선정","detail":"드론 질량과 프로펠러 규격 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 직경·피치·날개 수·모터 회전수을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"프로펠러의 날개 수와 피치각은 추력과 소비전력에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-06","major":"항공우주공학","question":"낙하산의 면적과 줄 길이는 낙하시간과 흔들림에 어떤 영향을 줄까?","hypothesis":"낙하산 면적이 넓으면 낙하시간은 길어지지만 줄 길이가 불균형하면 좌우 흔들림이 커질 것이다.","methods":[{"kind":"제작·검증","title":"낙하산 면적별 낙하","detail":"재료와 추 질량은 같게 하고 낙하산 면적만 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 같은 높이의 낙하시간·착륙편차을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"설계·검증","title":"줄 길이와 안정성","detail":"면적은 고정하고 줄 길이와 균형 조건을 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 흔들림 횟수·회전수·착륙편차을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"수학 모형","title":"항력과 종단속도","detail":"면적과 질량을 변수로 단순 낙하 모형을 만든다. 예상 종단속도와 실제 평균속도을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"낙하산의 면적과 줄 길이는 낙하시간과 흔들림에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-07","major":"항공우주공학","question":"풍선로켓의 공기량과 노즐 크기는 이동거리와 속도에 어떤 영향을 줄까?","hypothesis":"공기량이 많으면 추진시간이 늘지만 노즐이 너무 크면 공기가 빨리 빠져나가 지속거리가 줄 수 있다.","methods":[{"kind":"직접 실험","title":"공기량별 이동","detail":"줄을 따라 움직이는 풍선로켓에 주입하는 공기량을 단계적으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 이동시간·최고속도·완주 여부을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"제작·검증","title":"노즐 크기 비교","detail":"풍선과 줄 조건은 고정하고 출구 크기만 바꾼다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 초기속도·추진시간·이동거리을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"데이터 분석","title":"추력 지속시간의 균형","detail":"노즐 크기별 속도-시간 자료를 영상으로 추출한다. 결측값과 단위를 확인한 뒤 최대속도·가속구간·감속구간을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"풍선로켓의 공기량과 노즐 크기는 이동거리와 속도에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-08","major":"항공우주공학","question":"인공위성의 궤도 고도가 높아지면 공전주기는 어떻게 달라질까?","hypothesis":"궤도 고도가 높을수록 이동 경로가 길고 공전속도가 낮아져 공전주기가 크게 증가할 것이다.","methods":[{"kind":"시뮬레이션","title":"고도별 궤도주기","detail":"지구 반지름과 중력을 적용해 고도를 일정 간격으로 바꾼다. 고도·공전속도·공전주기 그래프을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"실제 위성 궤도 비교","detail":"저궤도·중궤도·정지궤도 위성 자료를 수집한다. 결측값과 단위를 확인한 뒤 고도·주기·용도·지상 관측범위을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"임무별 궤도 선택","detail":"통신·관측·항법 위성의 궤도 선정 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 지연시간·재방문주기·위성 수을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"인공위성의 궤도 고도가 높아지면 공전주기는 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-09","major":"항공우주공학","question":"열차폐 재료의 종류와 두께는 내부 온도 상승을 얼마나 늦출까?","hypothesis":"열전도율이 낮고 공기층이 있는 재료가 같은 질량에서 내부 온도 상승을 더 늦출 것이다.","methods":[{"kind":"직접 실험","title":"재료별 열차폐","detail":"같은 용기를 종이·천·에어캡·금속박으로 같은 질량만큼 감싼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 광원 가열 중 내부 온도 상승률을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"설계·검증","title":"다층 열차폐 구조","detail":"재료 양은 같게 하고 밀착층과 공기층 구조를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 목표온도 도달시간·구조 질량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"논문·사례","title":"우주선 열보호 시스템","detail":"재진입 열차폐와 다층단열 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 사용 재료·열전달 방식·일회용/재사용을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"열차폐 재료의 종류와 두께는 내부 온도 상승을 얼마나 늦출까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]},{"id":"aerospace-10","major":"항공우주공학","question":"드론 프로펠러 보호대는 안전성과 비행 효율에 어떤 영향을 줄까?","hypothesis":"보호대가 충돌 손상을 줄이지만 질량과 공기저항 증가로 체공시간과 추력이 감소할 수 있다.","methods":[{"kind":"제작·검증","title":"보호대 질량별 성능","detail":"소형 모터 시험대에 질량과 면적이 다른 보호대 모형을 부착한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 추력·전류·보호범위·질량을 측정해 성능과 재료 효율을 함께 비교한다."},{"kind":"시뮬레이션","title":"추가 질량과 체공시간","detail":"드론 질량과 배터리 에너지를 가정해 보호대 질량을 바꾼다. 예상 체공시간과 추력 여유을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"보호대 적용 드론 비교","detail":"실내·교육·산업 드론의 보호대 설계를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 안전목적·질량·크기·운용환경을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"드론 프로펠러 보호대는 안전성과 비행 효율에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["양력과 항력","추력","무게중심","궤도","열전달"]}]},{"id":"electrical","label":"전기전자공학","shortLabel":"전기전자","accent":"#6f55b7","concepts":["전압과 전류","저항","전자기","신호","에너지"],"topics":[{"id":"electrical-01","major":"전기전자공학","question":"전구나 저항의 직렬·병렬 연결은 전압과 전류에 어떤 차이를 만들까?","hypothesis":"직렬에서는 전압이 나뉘고 전체 전류가 감소하며, 병렬에서는 각 가지에 같은 전압이 걸릴 것이다.","methods":[{"kind":"회로 실험","title":"직렬·병렬 전압전류","detail":"같은 저항 두 개를 직렬과 병렬로 연결한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 각 지점 전압·전체전류·계산값 오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"옴의 법칙 검증","detail":"전원 전압을 단계적으로 바꾸며 전류를 측정한다. 결측값과 단위를 확인한 뒤 전압-전류 기울기와 등가저항을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"시뮬레이션","title":"회로 고장 조건","detail":"한 부품이 끊어지는 조건을 직렬과 병렬 회로에서 비교한다. 전류경로·나머지 부품 작동 여부을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"전구나 저항의 직렬·병렬 연결은 전압과 전류에 어떤 차이를 만들까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-02","major":"전기전자공학","question":"도선의 길이와 굵기는 전기저항에 어떤 영향을 줄까?","hypothesis":"같은 재료에서 길이가 길수록 저항이 커지고 단면적이 클수록 저항이 작아질 것이다.","methods":[{"kind":"직접 실험","title":"길이별 저항 측정","detail":"같은 굵기 도선의 길이를 단계적으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 멀티미터 저항과 단위길이당 저항을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"직접 실험","title":"굵기별 전압강하","detail":"길이와 재료를 고정하고 굵기가 다른 도선에 같은 전류를 흘린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 도선 양끝 전압강하와 발열을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"저항식과 측정값","detail":"길이·단면적·비저항으로 이론 저항을 계산한다. 계산값과 접촉저항을 포함한 실측값을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"도선의 길이와 굵기는 전기저항에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-03","major":"전기전자공학","question":"저항값이 달라지면 LED 밝기와 소비전류는 어떻게 변할까?","hypothesis":"직렬 저항이 작을수록 전류와 밝기가 증가하지만 허용전류를 넘으면 효율과 수명이 나빠질 수 있다.","methods":[{"kind":"회로 실험","title":"저항별 LED 전류","detail":"같은 LED에 허용 범위의 여러 저항을 직렬 연결한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. LED 전류·전압·조도·소비전력을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"밝기 증가의 포화","detail":"전류와 조도 자료를 산점도로 나타낸다. 결측값과 단위를 확인한 뒤 전류 증가 대비 조도 증가율을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"LED 구동과 안전저항","detail":"LED 규격표와 구동회로 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 순방향전압·허용전류·저항 계산을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"저항값이 달라지면 LED 밝기와 소비전류는 어떻게 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-04","major":"전기전자공학","question":"태양광 패널의 각도와 온도는 출력에 어떤 영향을 줄까?","hypothesis":"빛을 수직으로 받을수록 출력이 높지만 패널 온도가 지나치게 오르면 효율이 낮아질 것이다.","methods":[{"kind":"직접 실험","title":"입사각별 출력","detail":"광원 거리와 밝기를 고정하고 패널 각도를 0°·30°·60°로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 전압·전류·전력 P=VI을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"일사량·기온·발전량","detail":"시간별 일사량·기온·발전량 자료를 결합한다. 결측값과 단위를 확인한 뒤 일사량이 비슷한 구간의 온도별 출력을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"최적 설치각과 온도계수","detail":"지역별 태양광 설치 연구를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 위도·계절·각도·온도계수을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"태양광 패널의 각도와 온도는 출력에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-05","major":"전기전자공학","question":"온도가 변하면 온도센서와 저항소자의 값은 어떻게 달라질까?","hypothesis":"NTC 소자는 온도가 높아질수록 저항이 감소하며 일정 범위에서 온도를 추정할 수 있을 것이다.","methods":[{"kind":"센서 실험","title":"온도별 저항 측정","detail":"안전한 온도 범위의 물에서 센서 온도와 저항을 동시에 측정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 온도-저항 곡선과 반복 오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"선형·비선형 보정","detail":"측정 자료에 선형식과 로그 변환식을 적용한다. 결측값과 단위를 확인한 뒤 온도 예측오차와 사용 가능한 구간을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"제작·검증","title":"온도표시장치 보정","detail":"보정식을 마이크로컨트롤러에 적용해 온도를 표시한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 기준 온도계와 표시값의 오차을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"온도가 변하면 온도센서와 저항소자의 값은 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-06","major":"전기전자공학","question":"저항과 커패시터의 값은 충전시간에 어떤 영향을 줄까?","hypothesis":"저항이나 정전용량이 커질수록 목표전압에 도달하는 시간이 비례해 길어질 것이다.","methods":[{"kind":"회로 실험","title":"RC 충전곡선","detail":"저항 또는 커패시터 하나만 바꾸고 시간별 전압을 기록한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 63% 전압 도달시간과 시정수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"지수곡선 적합","detail":"시간-전압 자료에 지수 충전 모형을 적용한다. 결측값과 단위를 확인한 뒤 예측값·측정값·최대 오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"제작·검증","title":"지연회로 설계","detail":"목표 지연시간에 맞춰 R과 C를 선택해 LED 지연회로를 만든다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 설계시간과 실제 켜짐시간을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"저항과 커패시터의 값은 충전시간에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-07","major":"전기전자공학","question":"코일의 감은 횟수와 전류는 전자석의 힘에 어떤 영향을 줄까?","hypothesis":"코일 수와 전류가 증가하면 자력이 커지지만 저항과 발열도 증가할 것이다.","methods":[{"kind":"직접 실험","title":"코일 수별 자력","detail":"같은 철심과 도선으로 감은 횟수만 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 들어 올린 클립 수·전류·코일 온도을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"조건 비교 실험","title":"전류와 자력 관계","detail":"코일 수는 고정하고 안전 범위에서 전류를 단계적으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 흡인력과 발열 증가을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"솔레노이드 설계","detail":"전자석·릴레이·솔레노이드 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 권선수·전류·철심·사용시간을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"코일의 감은 횟수와 전류는 전자석의 힘에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-08","major":"전기전자공학","question":"스피커와의 거리가 멀어질수록 소리의 세기는 어떻게 변할까?","hypothesis":"반사가 적은 환경에서는 거리가 늘수록 음압이 감소하지만 교실에서는 벽 반사 때문에 이론값과 차이가 날 것이다.","methods":[{"kind":"직접 실험","title":"거리별 소리 측정","detail":"같은 음원과 볼륨에서 거리를 일정 간격으로 늘린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 소음계 값·반복 편차·배경소음을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"공간 비교 실험","title":"실내와 흡음 조건","detail":"같은 거리에서 빈 교실과 흡음재를 둔 조건을 비교한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 음압 감소·반사에 따른 변동을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"거리감쇠와 실측 비교","detail":"거리 제곱에 따른 이론적 세기 변화를 계산한다. 이론값과 실내 측정값의 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."}],"focus":"스피커와의 거리가 멀어질수록 소리의 세기는 어떻게 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-09","major":"전기전자공학","question":"PWM 듀티비는 DC모터의 회전속도와 토크에 어떤 영향을 줄까?","hypothesis":"듀티비가 증가하면 평균속도는 증가하지만 부하가 커지면 같은 듀티비에서도 속도가 감소할 것이다.","methods":[{"kind":"모터 실험","title":"듀티비별 회전속도","detail":"같은 전압과 무부하에서 PWM을 20%씩 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 분당 회전수·전류·속도 변동을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"부하 실험","title":"부하별 속도와 전류","detail":"듀티비를 고정하고 축의 부하를 단계적으로 높인다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 회전수·전류·정지 직전 부하을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"듀티비-속도 보정식","detail":"듀티비와 회전수 자료에 구간별 추세선을 적용한다. 결측값과 단위를 확인한 뒤 목표속도 예측오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"PWM 듀티비는 DC모터의 회전속도와 토크에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]},{"id":"electrical-10","major":"전기전자공학","question":"센서의 측정 주기는 신호의 부드러움과 순간 변화 감지에 어떤 영향을 줄까?","hypothesis":"측정 주기가 짧으면 빠른 변화를 잘 잡지만 데이터량과 잡음이 증가하고, 너무 길면 중요한 변화가 누락될 것이다.","methods":[{"kind":"센서 실험","title":"샘플링 주기별 신호","detail":"같은 움직임을 10ms·50ms·200ms 간격으로 측정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 봉우리 검출수·최대값·데이터 개수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"이동평균과 지연","detail":"각 자료에 여러 크기의 이동평균을 적용한다. 결측값과 단위를 확인한 뒤 잡음 감소율·봉우리 크기·신호 지연을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"샘플링 정리 적용","detail":"소리·진동 센서의 샘플링 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 최대 주파수·필요 샘플링률·에일리어싱을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"센서의 측정 주기는 신호의 부드러움과 순간 변화 감지에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["전압과 전류","저항","전자기","신호","에너지"]}]},{"id":"semiconductor","label":"반도체공학","shortLabel":"반도체","accent":"#9b4e91","concepts":["다이오드","밴드갭","집적회로","열","수율"],"topics":[{"id":"semiconductor-01","major":"반도체공학","question":"LED의 색에 따라 빛을 내기 시작하는 전압이 다를까?","hypothesis":"적색보다 청색 LED가 더 높은 순방향전압을 필요로 할 것이다.","methods":[{"kind":"회로 실험","title":"색별 순방향전압","detail":"전류 제한 저항을 사용해 적색·녹색·청색 LED를 측정한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 점등 시작전압·일정 전류의 전압을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"규격 데이터","title":"제조사 규격표 비교","detail":"여러 제조사의 LED 파장과 순방향전압을 수집한다. 결측값과 단위를 확인한 뒤 색상별 평균·범위·실측값 위치을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·이론","title":"파장과 밴드갭","detail":"빛의 파장과 반도체 밴드갭을 설명한 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 광자에너지·색·전압의 순서을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"LED의 색에 따라 빛을 내기 시작하는 전압이 다를까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-02","major":"반도체공학","question":"빛의 세기는 광저항의 저항값에 어떤 영향을 줄까?","hypothesis":"빛이 강해질수록 광저항값은 감소하지만 밝기와 저항은 단순한 직선 관계가 아닐 것이다.","methods":[{"kind":"센서 실험","title":"거리별 광저항","detail":"같은 광원에서 거리를 일정 간격으로 바꾼다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 조도·저항·반복 오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"조도-저항 모형","detail":"측정 자료에 선형·로그·거듭제곱 모형을 적용한다. 결측값과 단위를 확인한 뒤 모형별 예측오차을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"제작·검증","title":"자동조명 임계값","detail":"실험값으로 어두울 때 켜지는 회로의 기준값을 정한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 목표 조도와 실제 작동 조도을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"빛의 세기는 광저항의 저항값에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-03","major":"반도체공학","question":"온도가 높아지면 다이오드의 순방향전압은 어떻게 변할까?","hypothesis":"같은 전류에서 온도가 상승하면 다이오드 순방향전압은 감소할 것이다.","methods":[{"kind":"회로 실험","title":"온도별 다이오드 전압","detail":"안전한 온도 범위에서 같은 전류를 유지하며 전압을 잰다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 온도별 순방향전압과 변화율을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"온도센서 보정 가능성","detail":"온도-전압 자료에 선형식을 적용한다. 결측값과 단위를 확인한 뒤 예측온도 오차와 사용범위을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"반도체 온도 특성","detail":"다이오드 온도계수와 열폭주 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 전압 변화·전류 제한·열관리을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"온도가 높아지면 다이오드의 순방향전압은 어떻게 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-04","major":"반도체공학","question":"트랜지스터의 입력전류가 증가하면 출력전류는 계속 같은 비율로 증가할까?","hypothesis":"활성영역에서는 출력전류가 증가하지만 포화영역에서는 증가 폭이 작아질 것이다.","methods":[{"kind":"회로 실험","title":"입력별 출력전류","detail":"저항으로 베이스 전류를 안전하게 단계 조절한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 베이스전류·컬렉터전류·전압을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"증폭영역과 포화영역","detail":"입출력 전류 그래프의 기울기 변화를 확인한다. 결측값과 단위를 확인한 뒤 전류이득과 포화 시작점을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"제작·검증","title":"트랜지스터 스위치","detail":"측정 결과로 LED 또는 소형 부하 스위치 회로를 설계한다. 재료의 양과 시험 조건을 동일하게 맞추고 시제품별로 3회 이상 시험한다. 켜짐 전압·소비전류·발열을 측정해 성능과 재료 효율을 함께 비교한다."}],"focus":"트랜지스터의 입력전류가 증가하면 출력전류는 계속 같은 비율로 증가할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-05","major":"반도체공학","question":"논리게이트 수가 늘어나면 출력 지연은 누적될까?","hypothesis":"게이트를 직렬로 더 많이 연결할수록 입력 변화가 출력에 나타나는 시간이 길어질 것이다.","methods":[{"kind":"시뮬레이션","title":"게이트 단계별 지연","detail":"NOT 게이트를 1·3·5단 연결하고 동일 입력을 준다. 출력 전환시간과 단계당 지연을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"회로 실험","title":"발진주파수로 지연 추정","detail":"홀수 개 인버터로 안전한 링 발진 구조를 구성한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 단계 수별 주파수와 추정 지연을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"디지털 회로 타이밍","detail":"전파지연과 임계경로 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 게이트 수·배선·전압·클록속도을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"논리게이트 수가 늘어나면 출력 지연은 누적될까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-06","major":"반도체공학","question":"반도체 선폭이 작아지면 성능과 전력소모는 항상 좋아질까?","hypothesis":"선폭 축소는 집적도와 속도를 높이지만 누설전류와 발열 문제가 커질 수 있다.","methods":[{"kind":"자료 검색","title":"공정세대별 지표 비교","detail":"여러 공정세대의 트랜지스터 밀도·전력·성능 자료를 수집한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 세대별 개선율과 측정조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."},{"kind":"데이터 분석","title":"집적도와 전력 관계","detail":"칩 세대별 트랜지스터 수와 소비전력 자료를 정리한다. 결측값과 단위를 확인한 뒤 단위 트랜지스터당 전력과 예외을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"미세화 한계와 구조 변화","detail":"FinFET·GAA 구조 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 누설전류·게이트 제어·제조난도을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"반도체 선폭이 작아지면 성능과 전력소모는 항상 좋아질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-07","major":"반도체공학","question":"칩 온도가 높아지면 연산 성능과 오류 발생 가능성이 달라질까?","hypothesis":"온도가 높아지면 보호 제어로 동작속도가 낮아지고 전력 누설과 오류 가능성이 증가할 것이다.","methods":[{"kind":"데이터 분석","title":"온도와 클록속도","detail":"부하 테스트의 시간별 온도·클록·전력 자료를 수집한다. 결측값과 단위를 확인한 뒤 온도구간별 평균 클록과 성능점수을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"사례 분석","title":"열 스로틀링 비교","detail":"냉각 조건이 다른 동일 칩의 성능 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 최고온도·지속성능·전력을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."},{"kind":"논문·사례","title":"칩 열관리 기술","detail":"방열판·히트파이프·액체냉각 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 열저항·소음·크기·적용분야을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"칩 온도가 높아지면 연산 성능과 오류 발생 가능성이 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-08","major":"반도체공학","question":"웨이퍼의 결함 수와 칩 면적은 생산수율에 어떤 영향을 줄까?","hypothesis":"결함밀도가 같다면 칩 면적이 클수록 한 칩에 결함이 포함될 확률이 높아 수율이 낮아질 것이다.","methods":[{"kind":"시뮬레이션","title":"무작위 결함과 칩 수율","detail":"격자 웨이퍼에 같은 수의 결함을 무작위 배치하고 칩 크기를 바꾼다. 정상 칩 비율과 반복 평균을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"수학 모형","title":"결함밀도 수율모형","detail":"칩 면적과 결함밀도를 변수로 무결함 확률을 계산한다. 면적별 예상수율과 시뮬레이션 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"논문·사례","title":"수율 향상 전략","detail":"반도체 결함검사와 칩렛 설계 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 결함검출·다이 크기·재사용 전략을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"웨이퍼의 결함 수와 칩 면적은 생산수율에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-09","major":"반도체공학","question":"도핑 농도가 달라지면 반도체의 전기저항은 어떻게 변할까?","hypothesis":"전하 운반자 수가 증가하면 저항은 감소하지만 이동도 변화 때문에 단순 반비례하지 않을 수 있다.","methods":[{"kind":"시뮬레이션","title":"도핑농도와 저항률","detail":"도핑농도와 이동도를 변수로 전도도 모형을 만든다. 농도별 저항률과 변화율을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"재료별 도핑 자료","detail":"실리콘 도핑농도와 저항률 표를 정리한다. 결측값과 단위를 확인한 뒤 n형·p형 곡선과 농도구간을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"도핑 공정과 소자 역할","detail":"이온주입·확산 공정 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 농도·깊이·접합 형성·열처리을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"도핑 농도가 달라지면 반도체의 전기저항은 어떻게 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]},{"id":"semiconductor-10","major":"반도체공학","question":"노광에 사용하는 빛의 파장이 짧아지면 더 작은 회로를 만들 수 있을까?","hypothesis":"파장이 짧고 광학계 성능이 높을수록 해상도는 좋아지지만 장비와 공정 복잡성은 증가할 것이다.","methods":[{"kind":"수학 모형","title":"파장과 해상도","detail":"파장·개구수·공정계수를 바꾸는 단순 해상도 식을 만든다. 조건별 최소선폭과 민감도을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"자료 검색","title":"노광세대 비교","detail":"DUV와 EUV 노광의 파장·선폭·마스크·장비 자료를 찾는다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 해상도·공정단계·비용·결함을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."},{"kind":"모형 실험","title":"슬릿 간격과 회절","detail":"안전한 레이저와 회절격자 또는 슬릿 모형으로 무늬를 관찰한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 슬릿·파장 조건별 무늬 간격을 측정해 평균과 변동 폭으로 가설을 판단한다."}],"focus":"노광에 사용하는 빛의 파장이 짧아지면 더 작은 회로를 만들 수 있을까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["다이오드","밴드갭","집적회로","열","수율"]}]},{"id":"computer","label":"컴퓨터·소프트웨어공학","shortLabel":"컴퓨터SW","accent":"#286f9e","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"],"topics":[{"id":"computer-01","major":"컴퓨터·소프트웨어공학","question":"정렬할 데이터가 많아질수록 정렬 알고리즘별 실행시간 차이는 어떻게 달라질까?","hypothesis":"데이터 수가 적을 때는 차이가 작지만 수가 커질수록 O(n²) 알고리즘이 O(n log n) 알고리즘보다 급격히 느려질 것이다.","methods":[{"kind":"코딩 실험","title":"정렬 알고리즘 실행시간 측정","detail":"같은 무작위 정수 목록에 버블·삽입·병합 정렬을 각각 실행하고 목록 크기를 단계적으로 늘린다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 알고리즘별 평균 실행시간·비교 횟수·입력 크기을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"시간복잡도 곡선 비교","detail":"각 알고리즘을 같은 조건에서 10회 측정해 중앙값을 구하고 이론 곡선과 비교한다. 결측값과 단위를 확인한 뒤 입력 크기-실행시간 그래프·증가율·측정 변동을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·사례","title":"실제 정렬 알고리즘 선택","detail":"언어별 표준 정렬 함수가 사용하는 알고리즘과 선택 이유를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 안정성·메모리 사용량·최악 시간복잡도·적용 조건을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"정렬할 데이터가 많아질수록 정렬 알고리즘별 실행시간 차이는 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-02","major":"컴퓨터·소프트웨어공학","question":"정렬된 자료에서는 순차 탐색과 이진 탐색의 비교 횟수가 얼마나 달라질까?","hypothesis":"자료 수가 두 배가 될 때 순차 탐색의 최대 비교 횟수는 두 배가 되지만 이진 탐색은 약 한 번만 증가할 것이다.","methods":[{"kind":"코딩 실험","title":"탐색법별 비교 횟수","detail":"크기가 다른 정렬 목록에서 앞·중간·끝·없는 값을 두 방법으로 찾는다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 성공 여부·비교 횟수·실행시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"자료 수와 탐색 단계","detail":"자료 수를 10부터 100만까지 바꾸며 n과 log₂n을 계산한다. 자료 수별 최대 탐색 단계와 증가율을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"사례 분석","title":"검색 기능의 자료구조","detail":"전화번호부·전자사전·데이터베이스 색인이 빠른 검색을 만드는 방식을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 정렬 비용·색인 구조·탐색 속도·갱신 비용을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"정렬된 자료에서는 순차 탐색과 이진 탐색의 비교 횟수가 얼마나 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-03","major":"컴퓨터·소프트웨어공학","question":"같은 원소를 찾을 때 리스트와 집합 자료형의 처리시간은 어떻게 달라질까?","hypothesis":"원소 수가 많을수록 순서대로 찾는 리스트보다 해시를 이용하는 집합의 포함 여부 확인이 더 빨라질 것이다.","methods":[{"kind":"코딩 실험","title":"자료형별 포함 검사","detail":"같은 정수 자료를 리스트와 집합에 저장하고 존재하는 값과 없는 값을 반복 검색한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 자료 수별 평균 검색시간·메모리 사용량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"속도와 저장공간의 교환","detail":"자료형별 측정시간과 메모리를 표준화해 비교한다. 결측값과 단위를 확인한 뒤 속도 향상률·추가 메모리·자료 수에 따른 변화을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"논문·이론","title":"해시 충돌과 시간복잡도","detail":"해시 테이블의 주소 계산과 충돌 처리 방식을 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 평균·최악 탐색시간·적재율·충돌 해결법을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"같은 원소를 찾을 때 리스트와 집합 자료형의 처리시간은 어떻게 달라질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-04","major":"컴퓨터·소프트웨어공학","question":"이미지 해상도를 높이면 파일 크기와 처리시간은 같은 비율로 늘어날까?","hypothesis":"가로와 세로 픽셀을 각각 두 배로 하면 총 픽셀이 네 배가 되어 무압축 크기와 처리시간도 약 네 배 증가할 것이다.","methods":[{"kind":"코딩 실험","title":"해상도별 이미지 처리","detail":"같은 이미지를 여러 해상도로 바꾸고 회색조 변환 또는 가장자리 검출을 실행한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 픽셀 수·파일 크기·평균 처리시간을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"수학 모형","title":"픽셀 수와 저장용량 계산","detail":"가로·세로·색상 채널·비트 수로 무압축 저장용량을 계산한다. 계산값·실제 파일크기·압축에 따른 차이을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"데이터 분석","title":"해상도-처리시간 관계","detail":"해상도별 10회 실행시간을 수집해 픽셀 수와의 관계를 분석한다. 결측값과 단위를 확인한 뒤 회귀선·증가율·장치 성능에 따른 변동을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."}],"focus":"이미지 해상도를 높이면 파일 크기와 처리시간은 같은 비율로 늘어날까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-05","major":"컴퓨터·소프트웨어공학","question":"이미지 압축률을 높이면 파일 크기와 화질은 어떻게 함께 변할까?","hypothesis":"압축률이 높을수록 파일은 작아지지만 세부 무늬와 글자 가장자리에서 손실이 더 크게 나타날 것이다.","methods":[{"kind":"코딩 실험","title":"압축 품질별 파일 생성","detail":"같은 원본을 JPEG 품질값 여러 단계로 저장하고 크기를 기록한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 압축률·파일 크기·원본 대비 픽셀 오차을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"이미지 분석","title":"영역별 손실 비교","detail":"글자·인물·단색·복잡한 무늬 영역을 나눠 원본과 압축본의 차이를 계산한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 영역별 평균제곱오차·경계 흐림 정도을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"손실·무손실 압축 선택","detail":"JPEG·PNG·WebP의 원리와 활용 사례를 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 압축 방식·투명도·복원 가능성·적합한 콘텐츠을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"이미지 압축률을 높이면 파일 크기와 화질은 어떻게 함께 변할까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-06","major":"컴퓨터·소프트웨어공학","question":"비밀번호 길이와 문자 종류가 늘어나면 전수조사에 필요한 경우의 수는 얼마나 커질까?","hypothesis":"사용 가능한 문자가 많고 길이가 길수록 가능한 조합 수가 지수적으로 증가해 추측에 필요한 시간이 급격히 늘어날 것이다.","methods":[{"kind":"수학 모형","title":"비밀번호 조합 수 계산","detail":"숫자·영문 소문자·대소문자+기호 조건에서 길이를 4~16자로 바꾼다. 조건별 조합 수·초당 시도 횟수별 예상시간을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"코딩 실험","title":"짧은 모형 비밀번호 탐색","detail":"개인정보와 무관한 3~5자리 모형 문자열을 만들어 전수조사 과정을 구현한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 길이별 시도 횟수·실행시간·최악 조건을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"자료 검색","title":"안전한 인증 방식","detail":"공신력 있는 보안기관의 비밀번호·다중인증 지침을 비교한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 길이·재사용 금지·속도 제한·다중인증 근거을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"비밀번호 길이와 문자 종류가 늘어나면 전수조사에 필요한 경우의 수는 얼마나 커질까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-07","major":"컴퓨터·소프트웨어공학","question":"네트워크로 보내는 데이터 묶음의 크기는 전송시간과 오류 복구에 어떤 영향을 줄까?","hypothesis":"묶음이 크면 헤더 비율이 줄어 효율은 높아지지만 오류가 날 때 다시 보내야 할 데이터가 많아질 것이다.","methods":[{"kind":"시뮬레이션","title":"패킷 크기별 전송 모형","detail":"전체 데이터량·헤더 크기·오류확률을 고정하고 패킷 크기를 바꾼다. 총 패킷 수·헤더 비율·재전송량·완료시간을 조건별로 계산해 표와 그래프로 나타낸다. 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 결론에 포함한다."},{"kind":"코딩 실험","title":"분할 크기별 처리시간","detail":"같은 파일을 여러 블록 크기로 읽고 체크섬 계산과 재조립 시간을 잰다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 블록 수·처리시간·메모리 사용량을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"논문·사례","title":"인터넷 패킷과 MTU","detail":"이더넷 MTU와 단편화·재전송 자료를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 패킷 크기·지연·오류율·네트워크 환경을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"네트워크로 보내는 데이터 묶음의 크기는 전송시간과 오류 복구에 어떤 영향을 줄까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-08","major":"컴퓨터·소프트웨어공학","question":"같은 계산을 반복할 때 결과를 저장해 두는 캐시는 실행시간을 얼마나 줄일까?","hypothesis":"중복 계산 비율이 높을수록 캐시를 사용했을 때 실행시간이 크게 줄지만 저장공간 사용은 늘어날 것이다.","methods":[{"kind":"코딩 실험","title":"캐시 사용 전후 비교","detail":"재귀 피보나치 또는 격자 경로 계산을 일반 방식과 메모이제이션 방식으로 실행한다. 바꾸지 않는 조건을 먼저 정하고 각 조건을 3회 이상 반복한다. 입력 크기별 실행시간·함수 호출 수·저장 항목 수을 측정해 평균과 변동 폭으로 가설을 판단한다."},{"kind":"데이터 분석","title":"중복률과 성능 향상","detail":"반복 요청 비율을 단계적으로 바꿔 캐시 적중률과 시간을 기록한다. 결측값과 단위를 확인한 뒤 적중률·속도 향상률·추가 메모리을 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"사례 분석","title":"웹·CPU 캐시의 역할","detail":"브라우저 캐시와 CPU 캐시가 반복 접근을 줄이는 원리를 조사한다. 자료마다 연구 대상·조건·결과를 같은 기준으로 정리하고 저장 위치·적중/실패·갱신 기준·일관성 문제을 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}],"focus":"같은 계산을 반복할 때 결과를 저장해 두는 캐시는 실행시간을 얼마나 줄일까","change":"탐구 질문에서 비교하려는 조건","measure":"선택한 방법에서 제시한 측정값","controls":"재료의 양·측정환경·출발조건·반복 횟수","resources":"선택한 탐구 방법에 제시된 재료 또는 자료","concepts":["알고리즘","자료구조","복잡도","네트워크","오류정정"]},{"id":"computer-09","major":"컴퓨터·소프트웨어공학","question":"미로의 장애물 밀도에 따라 너비우선탐색과 A* 탐색의 효율 차이는 달라질까?","hypothesis":"목표 방향을 알려 주는 정보가 있을 때 A*는 너비우선탐색보다 적은 칸을 확인하지만 복잡한 장애물에서는 차이가 줄어들 것이다.","methods":[{"kind":"코딩 실험","title":"탐색 알고리즘 미로 비교","detail":"같은 크기의 미로에서 장애물 비율을 바꾸고 두 알고리즘을 실행한다.
