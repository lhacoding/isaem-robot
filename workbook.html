 제품군·같은 시점·개인정보 제외","resources":"가상 또는 공개 상품평 요약자료","concepts":["수요와 공급","비용","효율","회귀","의사결정"],"methods":[{"kind":"데이터 분석","title":"평점과 표본 크기 자료 분석","detail":"가상 또는 공개 상품평 요약자료을 준비한다. 결측값·중복값·단위를 먼저 확인하고 상품별 평균평점과 후기 수을 기준으로 자료를 나눈다. 각 조건의 가중평점·평점 분포·추정 변동을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"상품별 평균평점과 후기 수을 가로축, 가중평점·평점 분포·추정 변동을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"평점과 표본 크기 자료 비교","detail":"평점과 표본 크기을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 상품별 평균평점과 후기 수과 가중평점·평점 분포·추정 변동의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"economics-business-08","major":"경제학·경영학","question":"매장 진열 순서를 바꾸면 정해진 물품을 모두 찾는 이동거리가 달라질까?","hypothesis":"함께 구매하는 물품을 가까이 두면 총 이동거리는 줄지만 특정 구역은 혼잡해질 수 있다.","focus":"매장배치와 이동경로","change":"진열 위치와 구매목록","measure":"최단 이동거리·방향전환 수","controls":"같은 매장격자·출입구·구매목록","resources":"격자 매장도와 상품카드","concepts":["수요와 공급","비용","효율","회귀","의사결정"],"methods":[{"kind":"수학 모형·시뮬레이션","title":"매장배치와 이동경로 조건 모형","detail":"격자 매장도와 상품카드을 사용한다. 진열 위치와 구매목록을 일정한 간격으로 바꾸고 최단 이동거리·방향전환 수을 조건별로 계산하거나 30회 이상 모의실험한다. 결과를 표와 그래프로 나타내고, 모형에 사용한 가정과 실제 상황에서 달라질 수 있는 점을 함께 기록한다."},{"kind":"민감도 분석","title":"변수 변화에 따른 결과 비교","detail":"기본조건을 하나 정한 뒤 진열 위치와 구매목록 가운데 한 요소만 ±10% 또는 3단계로 바꾼다. 최단 이동거리·방향전환 수의 변화율을 계산해 결과에 가장 큰 영향을 주는 조건을 찾는다. 계산 규칙과 입력범위를 명확히 적어 다른 사람이 같은 결과를 재현할 수 있게 한다."},{"kind":"논문·전문자료","title":"매장배치와 이동경로 자료 비교","detail":"매장배치와 이동경로을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 진열 위치와 구매목록과 최단 이동거리·방향전환 수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"economics-business-09","major":"경제학·경영학","question":"묶음상품의 표시 방식은 실제 할인율 계산에 어떤 차이를 만들까?","hypothesis":"무료 증정·추가 용량·가격 할인은 표시 문구가 달라도 단위가격으로 환산하면 할인 순위가 달라질 수 있다.","focus":"판촉표시와 실제 할인","change":"1+1·추가용량·정률할인 조건","measure":"정상 단위가격 대비 실제 할인율","controls":"같은 기준 용량·정가·세금조건","resources":"가상 판촉표시 또는 실제 전단 사례","concepts":["수요와 공급","비용","효율","회귀","의사결정"],"methods":[{"kind":"데이터 분석","title":"판촉표시와 실제 할인 자료 분석","detail":"가상 판촉표시 또는 실제 전단 사례을 준비한다. 결측값·중복값·단위를 먼저 확인하고 1+1·추가용량·정률할인 조건을 기준으로 자료를 나눈다. 각 조건의 정상 단위가격 대비 실제 할인율을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"1+1·추가용량·정률할인 조건을 가로축, 정상 단위가격 대비 실제 할인율을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"판촉표시와 실제 할인 자료 비교","detail":"판촉표시와 실제 할인을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 1+1·추가용량·정률할인 조건과 정상 단위가격 대비 실제 할인율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"economics-business-10","major":"경제학·경영학","question":"환율이 바뀌면 같은 수입제품의 원화 환산가격은 어떤 비율로 변할까?","hypothesis":"다른 비용을 고정하면 환율 변동률과 원화 환산가격 변동률은 비슷하지만 실제 판매가는 즉시 같게 변하지 않을 수 있다.","focus":"환율과 수입가격","change":"환율 시나리오","measure":"원화 환산 원가와 판매가격 차이","controls":"외화가격·관세·운송비 가정·같은 시점","resources":"가상 수입가격표와 제공 환율자료","concepts":["수요와 공급","비용","효율","회귀","의사결정"],"methods":[{"kind":"데이터 분석","title":"환율과 수입가격 자료 분석","detail":"가상 수입가격표와 제공 환율자료을 준비한다. 결측값·중복값·단위를 먼저 확인하고 환율 시나리오을 기준으로 자료를 나눈다. 각 조건의 원화 환산 원가와 판매가격 차이을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"환율 시나리오을 가로축, 원화 환산 원가와 판매가격 차이을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"환율과 수입가격 자료 비교","detail":"환율과 수입가격을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 환율 시나리오과 원화 환산 원가와 판매가격 차이의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]}]},{"id":"law-administration-welfare","label":"법학·행정학·사회복지학","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"accent":"#4964a6","topics":[{"id":"law-administration-welfare-01","major":"법학·행정학·사회복지학","question":"같은 권리를 설명하는 법률 조문과 청소년 안내문은 문장 구조가 어떻게 다를까?","hypothesis":"청소년 안내문은 법률 조문보다 문장이 짧고 전문용어의 설명과 사례가 많을 것이다.","focus":"법률문과 안내문의 가독성","change":"법률 조문과 쉬운 안내문","measure":"문장 길이·전문용어 수·설명 사례 수","controls":"같은 권리 주제·비슷한 분량·공식자료","resources":"같은 제도를 다룬 법령과 공공기관 안내문","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"텍스트 분석","title":"법률문과 안내문의 가독성 표현 분류","detail":"같은 제도를 다룬 법령과 공공기관 안내문을 준비한다. 문장 또는 표현을 최소 30개 선정하고 법률 조문과 쉬운 안내문을 기준으로 나눈다. 분류표를 먼저 만든 뒤 문장 길이·전문용어 수·설명 사례 수을 문장별로 표시한다. 일부 자료를 두 번 분류해 기준이 일관되는지 확인하고 빈도뿐 아니라 실제 문맥도 함께 해석한다."},{"kind":"빈도·비율 분석","title":"표현 유형 정량 비교","detail":"분류한 표현 수를 자료의 전체 문장 수로 나누어 비율로 바꾼다. 자료마다 분량이 다른 상태에서 단순 개수만 비교하지 않는다. 유형별 비율 그래프와 대표 문장을 함께 제시해 수치와 맥락이 일치하는지 확인한다."},{"kind":"논문·전문자료","title":"법률문과 안내문의 가독성 자료 비교","detail":"법률문과 안내문의 가독성을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 법률 조문과 쉬운 안내문과 문장 길이·전문용어 수·설명 사례 수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"law-administration-welfare-02","major":"법학·행정학·사회복지학","question":"재난문자의 정보 순서는 핵심 행동을 찾는 시간에 영향을 줄까?","hypothesis":"위험·장소·행동지침 순으로 짧게 배열한 문장에서 행동지침 확인시간과 오류가 줄어들 것이다.","focus":"재난정보 구조와 이해","change":"정보 순서와 문장 길이","measure":"행동지침 찾기 시간과 객관식 정답률","controls":"같은 정보내용·글자크기·제시시간·순서 교차","resources":"가상 재난문자 시안·타이머·객관식 문항","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"객관적 수행 검사","title":"재난정보 구조와 이해 수행 비교","detail":"가상 재난문자 시안·타이머·객관식 문항을 준비한다. 정보 순서와 문장 길이만 다르게 하고 같은 정보내용·글자크기·제시시간·순서 교차을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 행동지침 찾기 시간과 객관식 정답률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 행동지침 찾기 시간과 객관식 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"재난정보 구조와 이해 자료 비교","detail":"재난정보 구조와 이해을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 정보 순서와 문장 길이과 행동지침 찾기 시간과 객관식 정답률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"law-administration-welfare-03","major":"법학·행정학·사회복지학","question":"공공기관 신청서의 항목 배치는 작성시간과 누락에 어떤 영향을 줄까?","hypothesis":"관련 항목을 묶고 작성 예시를 가까이 둔 양식에서 작성시간과 누락 수가 감소할 것이다.","focus":"행정양식과 사용성","change":"기존형과 묶음형 가상 신청서","measure":"작성시간·누락항목·수정횟수","controls":"같은 가상정보·문항 수·제시순서 교차","resources":"개인정보가 없는 가상 신청서 2종과 타이머","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"객관적 수행 검사","title":"행정양식과 사용성 수행 비교","detail":"개인정보가 없는 가상 신청서 2종과 타이머을 준비한다. 기존형과 묶음형 가상 신청서만 다르게 하고 같은 가상정보·문항 수·제시순서 교차을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 작성시간·누락항목·수정횟수을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 작성시간·누락항목·수정횟수을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"행정양식과 사용성 자료 비교","detail":"행정양식과 사용성을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 기존형과 묶음형 가상 신청서과 작성시간·누락항목·수정횟수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"law-administration-welfare-04","major":"법학·행정학·사회복지학","question":"지역별 민원 유형은 계절에 따라 비율이 달라질까?","hypothesis":"여름에는 소음·쓰레기, 겨울에는 제설·난방 관련 민원의 비율이 상대적으로 높아질 것이다.","focus":"계절과 민원 유형","change":"월·계절과 민원 분류","measure":"유형별 건수와 전체 대비 비율","controls":"같은 지역·분류기준·중복 제거·인구규모 주의","resources":"개인정보가 제거된 월별 민원분류 CSV","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"데이터 분석","title":"계절과 민원 유형 자료 분석","detail":"개인정보가 제거된 월별 민원분류 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 월·계절과 민원 분류을 기준으로 자료를 나눈다. 각 조건의 유형별 건수와 전체 대비 비율을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"월·계절과 민원 분류을 가로축, 유형별 건수와 전체 대비 비율을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"계절과 민원 유형 자료 비교","detail":"계절과 민원 유형을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 월·계절과 민원 분류과 유형별 건수와 전체 대비 비율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"law-administration-welfare-05","major":"법학·행정학·사회복지학","question":"정책 예산을 총액으로 비교할 때와 대상자 1명당으로 비교할 때 지역 순위가 달라질까?","hypothesis":"인구와 대상자 수가 다른 지역은 총예산과 1인당 예산 순위가 다르게 나타날 것이다.","focus":"정책예산과 비교기준","change":"총예산·인구·대상자 수","measure":"총액·1인당 금액·지역 순위","controls":"같은 연도·정책범위·단위 통일","resources":"가상 또는 제공된 지역별 정책예산 CSV","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"데이터 분석","title":"정책예산과 비교기준 자료 분석","detail":"가상 또는 제공된 지역별 정책예산 CSV을 준비한다. 결측값·중복값·단위를 먼저 확인하고 총예산·인구·대상자 수을 기준으로 자료를 나눈다. 각 조건의 총액·1인당 금액·지역 순위을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"총예산·인구·대상자 수을 가로축, 총액·1인당 금액·지역 순위을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"정책예산과 비교기준 자료 비교","detail":"정책예산과 비교기준을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 총예산·인구·대상자 수과 총액·1인당 금액·지역 순위의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"law-administration-welfare-06","major":"법학·행정학·사회복지학","question":"버스정류장과 복지시설의 거리는 지역별 접근성 판단에 어떤 영향을 줄까?","hypothesis":"시설 수가 같아도 대중교통에서 평균 이동거리가 긴 지역은 실제 접근성이 낮을 것이다.","focus":"공공시설과 공간 접근성","change":"지역별 정류장·시설 위치","measure":"최근접 거리·평균거리·취약지역 수","controls":"같은 지도 축척·시설 유형·거리 계산방식","resources":"격자형 가상지도 또는 제공 위치자료","concepts":["권리와 책임","정책","공공서비스","자료 해석","형평성"],"methods":[{"kind":"데이터 분석","title":"공공시설과 공간 접근성 자료 분석","detail":"격자형 가상지도 또는 제공 위치자료을 준비한다. 결측값·중복값·단위를 먼저 확인하고 지역별 정류장·시설 위치을 기준으로 자료를 나눈다. 각 조건의 최근접 거리·평균거리·취약지역 수을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"지역별 정류장·시설 위치을 가로축, 최근접 거리·평균거리·취약지역 수을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"공공 , 자료가 일치하는 부분과 충돌하는 부분을 각각 표시한다."},{"kind":"내용 분석","title":"핵심 근거와 관점 분류","detail":"자료의 문장이나 사례를 원인·근거·결과·한계 항목으로 분류한다. 자료별 분량 차이를 고려해 빈도와 대표 사례를 함께 제시한다. 어떤 자료를 선택했는지가 결론에 미친 영향도 한계로 작성한다."},{"kind":"논문·전문자료","title":"작성시기와 사료 신뢰도 자료 비교","detail":"작성시기와 사료 신뢰도을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 사건 직후 기록과 후대 기록과 구체적 사실·추정·평가·다른 자료와 일치 여부의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-04","major":"역사학·철학","question":"역사 설명에서 시간 순서와 원인 중심 서술은 독자의 이해에 어떤 차이를 만들까?","hypothesis":"시간 순서 서술은 사건 흐름 파악에, 원인별 서술은 인과관계 파악에 더 유리할 것이다.","focus":"역사서술 구조와 이해","change":"연대기형과 원인중심형 설명문","measure":"순서·원인 문항별 정답률과 응답시간","controls":"같은 사건·정보량·분량·제시순서","resources":"내용은 같고 구조가 다른 짧은 역사 설명문","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"객관적 수행 검사","title":"역사서술 구조와 이해 수행 비교","detail":"내용은 같고 구조가 다른 짧은 역사 설명문을 준비한다. 연대기형과 원인중심형 설명문만 다르게 하고 같은 사건·정보량·분량·제시순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 순서·원인 문항별 정답률과 응답시간을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 순서·원인 문항별 정답률과 응답시간을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"역사서술 구조와 이해 자료 비교","detail":"역사서술 구조와 이해을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 연대기형과 원인중심형 설명문과 순서·원인 문항별 정답률과 응답시간의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-05","major":"역사학·철학","question":"신문의 시대적 배경에 따라 같은 사회문제를 설명하는 핵심어가 달라질까?","hypothesis":"시대에 따라 중요하게 여긴 가치와 정책이 달라 반복되는 문제 원인과 해결 어휘도 달라질 것이다.","focus":"시대와 사회문제 어휘","change":"서로 다른 시기의 기사 또는 사설","measure":"원인·책임·해결·가치 관련 핵심어","controls":"같은 주제·비슷한 자료 수·분량·출처","resources":"공공저작물 신문자료와 현대 기사 발췌","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"텍스트 분석","title":"시대와 사회문제 어휘 표현 분류","detail":"공공저작물 신문자료와 현대 기사 발췌을 준비한다. 문장 또는 표현을 최소 30개 선정하고 서로 다른 시기의 기사 또는 사설을 기준으로 나눈다. 분류표를 먼저 만든 뒤 원인·책임·해결·가치 관련 핵심어을 문장별로 표시한다. 일부 자료를 두 번 분류해 기준이 일관되는지 확인하고 빈도뿐 아니라 실제 문맥도 함께 해석한다."},{"kind":"빈도·비율 분석","title":"표현 유형 정량 비교","detail":"분류한 표현 수를 자료의 전체 문장 수로 나누어 비율로 바꾼다. 자료마다 분량이 다른 상태에서 단순 개수만 비교하지 않는다. 유형별 비율 그래프와 대표 문장을 함께 제시해 수치와 맥락이 일치하는지 확인한다."},{"kind":"논문·전문자료","title":"시대와 사회문제 어휘 자료 비교","detail":"시대와 사회문제 어휘을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 서로 다른 시기의 기사 또는 사설과 원인·책임·해결·가치 관련 핵심어의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-06","major":"역사학·철학","question":"역사지도에서 경계와 교통로의 변화는 도시 성장과 어떤 관계를 보여줄까?","hypothesis":"교통로가 집중되고 행정경계가 확장된 지역에서 시가지 면적이 더 크게 증가했을 것이다.","focus":"지도 변화와 도시 성장","change":"시기별 교통로·경계·시가지","measure":"시가지 격자 수·교통로 교차점·확장 방향","controls":"같은 축척·범례·지역·비교 시기","resources":"같은 지역의 시기별 단순화 지도 2~3장","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"데이터 분석","title":"지도 변화와 도시 성장 자료 분석","detail":"같은 지역의 시기별 단순화 지도 2~3장을 준비한다. 결측값·중복값·단위를 먼저 확인하고 시기별 교통로·경계·시가지을 기준으로 자료를 나눈다. 각 조건의 시가지 격자 수·교통로 교차점·확장 방향을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"시기별 교통로·경계·시가지을 가로축, 시가지 격자 수·교통로 교차점·확장 방향을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"지도 변화와 도시 성장 자료 비교","detail":"지도 변화와 도시 성장을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 시기별 교통로·경계·시가지과 시가지 격자 수·교통로 교차점·확장 방향의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-07","major":"역사학·철학","question":"권리 선언문은 시대가 달라도 자유와 평등을 같은 방식으로 설명할까?","hypothesis":"선언문마다 공통 가치를 제시하지만 권리의 대상과 국가의 역할은 시대적 상황에 따라 달라질 것이다.","focus":"권리 개념의 변화","change":"서로 다른 시기의 권리 선언문","measure":"권리 주체·자유·평등·국가 의무 표현","controls":"공식 번역·같은 비교항목·역사적 배경 기록","resources":"짧은 권리 선언문 발췌 3편","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"자료 비교","title":"권리 개념의 변화 비교표 작성","detail":"짧은 권리 선언문 발췌 3편을 준비한다. 서로 다른 시기의 권리 선언문을 공통 비교기준으로 정하고 자료별 권리 주체·자유·평등·국가 의무 표현을 같은 표에 기록한다. 작성자·기관·시기·목적을 확인해 사실·해석·주장을 구분하고, 자료가 일치하는 부분과 충돌하는 부분을 각각 표시한다."},{"kind":"내용 분석","title":"핵심 근거와 관점 분류","detail":"자료의 문장이나 사례를 원인·근거·결과·한계 항목으로 분류한다. 자료별 분량 차이를 고려해 빈도와 대표 사례를 함께 제시한다. 어떤 자료를 선택했는지가 결론에 미친 영향도 한계로 작성한다."},{"kind":"논문·전문자료","title":"권리 개념의 변화 자료 비교","detail":"권리 개념의 변화을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 서로 다른 시기의 권리 선언문과 권리 주체·자유·평등·국가 의무 표현의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-08","major":"역사학·철학","question":"철학적 주장에는 근거와 결론을 연결하는 반복적인 논증 구조가 있을까?","hypothesis":"주장문을 전제·근거·반례·결론으로 나누면 서로 다른 글에서도 공통된 논증 구조를 찾을 수 있을 것이다.","focus":"철학글의 논증 구조","change":"짧은 철학 주장문 3~5편","measure":"전제·근거·반례·결론의 위치와 수","controls":"비슷한 분량·분석표·문장 단위 분류","resources":"고등학생 수준의 짧은 철학 논증문","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"텍스트 분석","title":"철학글의 논증 구조 표현 분류","detail":"고등학생 수준의 짧은 철학 논증문을 준비한다. 문장 또는 표현을 최소 30개 선정하고 짧은 철학 주장문 3~5편을 기준으로 나눈다. 분류표를 먼저 만든 뒤 전제·근거·반례·결론의 위치와 수을 문장별로 표시한다. 일부 자료를 두 번 분류해 기준이 일관되는지 확인하고 빈도뿐 아니라 실제 문맥도 함께 해석한다."},{"kind":"빈도·비율 분석","title":"표현 유형 정량 비교","detail":"분류한 표현 수를 자료의 전체 문장 수로 나누어 비율로 바꾼다. 자료마다 분량이 다른 상태에서 단순 개수만 비교하지 않는다. 유형별 비율 그래프와 대표 문장을 함께 제시해 수치와 맥락이 일치하는지 확인한다."},{"kind":"논문·전문자료","title":"철학글의 논증 구조 자료 비교","detail":"철학글의 논증 구조을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 짧은 철학 주장문 3~5편과 전제·근거·반례·결론의 위치와 수의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-09","major":"역사학·철학","question":"같은 도덕적 딜레마를 다룬 두 주장은 판단 기준을 어떻게 다르게 제시할까?","hypothesis":"결과를 중시하는 글과 원칙을 중시하는 글은 옳음을 판단하는 근거와 예외 허용에서 차이가 날 것이다.","focus":"윤리적 판단 기준","change":"결과중심과 원칙중심 주장","measure":"판단근거·예외·책임·반론 대응","controls":"같은 가상 사례·비슷한 분량·입장 표시","resources":"하나의 가상 딜레마와 상반된 주장문 2편","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"자료 비교","title":"윤리적 판단 기준 비교표 작성","detail":"하나의 가상 딜레마와 상반된 주장문 2편을 준비한다. 결과중심과 원칙중심 주장을 공통 비교기준으로 정하고 자료별 판단근거·예외·책임·반론 대응을 같은 표에 기록한다. 작성자·기관·시기·목적을 확인해 사실·해석·주장을 구분하고, 자료가 일치하는 부분과 충돌하는 부분을 각각 표시한다."},{"kind":"내용 분석","title":"핵심 근거와 관점 분류","detail":"자료의 문장이나 사례를 원인·근거·결과·한계 항목으로 분류한다. 자료별 분량 차이를 고려해 빈도와 대표 사례를 함께 제시한다. 어떤 자료를 선택했는지가 결론에 미친 영향도 한계로 작성한다."},{"kind":"논문·전문자료","title":"윤리적 판단 기준 자료 비교","detail":"윤리적 판단 기준을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 결과중심과 원칙중심 주장과 판단근거·예외·책임·반론 대응의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"history-philosophy-10","major":"역사학·철학","question":"역사 통계는 절대값과 인구 대비 비율 중 무엇을 사용할 때 해석이 달라질까?","hypothesis":"인구 규모가 다른 시기나 지역에서는 절대 건수와 인구 대비 비율의 순위가 다르게 나타날 것이다.","focus":"역사통계와 비교기준","change":"절대 건수와 인구 대비 비율","measure":"시기·지역별 순위와 변화율","controls":"같은 자료 정의·단위·기간·인구자료","resources":"가상 또는 제공된 역사 인구·사건 통계표","concepts":["사료","관점","인과관계","논증","신뢰도"],"methods":[{"kind":"데이터 분석","title":"역사통계와 비교기준 자료 분석","detail":"가상 또는 제공된 역사 인구·사건 통계표을 준비한다. 결측값·중복값·단위를 먼저 확인하고 절대 건수와 인구 대비 비율을 기준으로 자료를 나눈다. 각 조건의 시기·지역별 순위와 변화율을 평균·비율·변화량으로 계산해 표와 그래프로 비교한다. 관계가 보여도 바로 원인으로 단정하지 않고 다른 영향 요인을 한계로 기록한다."},{"kind":"그래프·모형","title":"관계식과 예측오차 비교","detail":"절대 건수와 인구 대비 비율을 가로축, 시기·지역별 순위와 변화율을 세로축으로 두고 적절한 그래프를 만든다. 선형·비선형 추세 또는 조건별 평균 중 자료에 맞는 방식을 적용한다. 실제값과 예측값의 오차를 계산하고 어느 구간에서 모형이 잘 맞지 않는지 해석한다."},{"kind":"논문·전문자료","title":"역사통계와 비교기준 자료 비교","detail":"역사통계와 비교기준을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 절대 건수와 인구 대비 비율과 시기·지역별 순위와 변화율의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]}]}]},{"id":"education","label":"교육계열","shortLabel":"교육","accent":"#7b5798","majors":[{"id":"education-psychology","label":"교육학·심리학","concepts":["기억","학습전략","주의","피드백","인지"],"accent":"#7b5798","topics":[{"id":"education-psychology-01","major":"교육학·심리학","question":"같은 시간 동안 재읽기와 인출 연습 중 어느 방법이 지연검사에 더 효과적일까?","hypothesis":"학습내용을 보지 않고 떠올리는 인출 연습이 재읽기보다 일정 시간 뒤 정답률을 높일 것이다.","focus":"재읽기와 인출 연습","change":"재읽기와 인출 연습 조건","measure":"즉시·20분 뒤 객관식 정답률","controls":"학습시간·자료 난이도·문항 수·조건 순서","resources":"난이도가 비슷한 짧은 글 2개와 객관식 문항","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"재읽기와 인출 연습 수행 비교","detail":"난이도가 비슷한 짧은 글 2개와 객관식 문항을 준비한다. 재읽기와 인출 연습 조건만 다르게 하고 학습시간·자료 난이도·문항 수·조건 순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 즉시·20분 뒤 객관식 정답률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 즉시·20분 뒤 객관식 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"재읽기와 인출 연습 자료 비교","detail":"재읽기와 인출 연습을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 재읽기와 인출 연습 조건과 즉시·20분 뒤 객관식 정답률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-02","major":"교육학·심리학","question":"같은 총학습시간도 한 번에 학습하는 것과 나누어 학습하는 것의 기억점수가 다를까?","hypothesis":"중간에 다른 과제를 넣어 학습을 나눈 조건에서 지연검사 점수가 높을 것이다.","focus":"분산학습과 집중학습","change":"연속학습과 두 번으로 나눈 학습","measure":"20분 뒤 기억 정답률","controls":"총학습시간·자료·문항·휴식 중 과제","resources":"단어 또는 짧은 사실목록·검사문항","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"분산학습과 집중학습 수행 비교","detail":"단어 또는 짧은 사실목록·검사문항을 준비한다. 연속학습과 두 번으로 나눈 학습만 다르게 하고 총학습시간·자료·문항·휴식 중 과제을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 20분 뒤 기억 정답률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 20분 뒤 기억 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"분산학습과 집중학습 자료 비교","detail":"분산학습과 집중학습을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 연속학습과 두 번으로 나눈 학습과 20분 뒤 기억 정답률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-03","major":"교육학·심리학","question":"긴 숫자나 단어를 묶어서 제시하면 즉시 기억할 수 있는 양이 늘어날까?","hypothesis":"의미 있는 단위로 묶은 자료가 낱개로 제시한 자료보다 정확히 회상하는 항목 수가 많을 것이다.","focus":"청킹과 작업기억","change":"낱개 제시와 의미단위 묶음","measure":"정확한 회상 항목 수와 순서 오류","controls":"항목 수·제시시간·난이도·조건 순서","resources":"숫자열 또는 단어목록과 타이머","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"청킹과 작업기억 수행 비교","detail":"숫자열 또는 단어목록과 타이머을 준비한다. 낱개 제시와 의미단위 묶음만 다르게 하고 항목 수·제시시간·난이도·조건 순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 정확한 회상 항목 수와 순서 오류을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 정확한 회상 항목 수와 순서 오류을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"청킹과 작업기억 자료 비교","detail":"청킹과 작업기억을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 낱개 제시와 의미단위 묶음과 정확한 회상 항목 수와 순서 오류의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-04","major":"교육학·심리학","question":"배경음이 있을 때 짧은 글의 사실 기억 정확도가 달라질까?","hypothesis":"가사가 있는 배경음 조건에서 조용한 조건보다 정답률이 낮고 읽기시간이 길어질 것이다.","focus":"배경음과 주의","change":"조용함·연주음·가사음 조건","measure":"읽기시간과 사실문항 정답률","controls":"음량·글 난이도·문항 수·조건 순서 교차","resources":"난이도가 비슷한 짧은 글·안전한 음원·문항","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"배경음과 주의 수행 비교","detail":"난이도가 비슷한 짧은 글·안전한 음원·문항을 준비한다. 조용함·연주음·가사음 조건만 다르게 하고 음량·글 난이도·문항 수·조건 순서 교차을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 읽기시간과 사실문항 정답률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 읽기시간과 사실문항 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"배경음과 주의 자료 비교","detail":"배경음과 주의을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 조용함·연주음·가사음 조건과 읽기시간과 사실문항 정답률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-05","major":"교육학·심리학","question":"학습 자료의 앞·중간·끝에 제시된 항목은 기억률이 다를까?","hypothesis":"목록의 앞과 끝 항목이 중간 항목보다 더 잘 기억되는 계열위치 효과가 나타날 것이다.","focus":"계열위치와 기억","change":"목록 속 항목의 위치","measure":"위치구간별 회상률","controls":"목록 길이·제시시간·단어 난이도·검사시간","resources":"관련 없는 단어목록 20개와 기록지","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"계열위치와 기억 수행 비교","detail":"관련 없는 단어목록 20개와 기록지을 준비한다. 목록 속 항목의 위치만 다르게 하고 목록 길이·제시시간·단어 난이도·검사시간을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 위치구간별 회상률을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 위치구간별 회상률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"계열위치와 기억 자료 비교","detail":"계열위치와 기억을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 목록 속 항목의 위치과 위치구간별 회상률의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-06","major":"교육학·심리학","question":"완성된 예제를 먼저 본 뒤 문제를 풀면 바로 문제부터 푼 경우보다 정확도가 높을까?","hypothesis":"새로운 유형에서는 풀이과정을 본 조건이 바로 문제를 푼 조건보다 정확도가 높고 시간이 짧을 것이다.","focus":"완성예제와 문제해결","change":"예제 학습 후 풀이와 바로 풀이","measure":"유사문제 정답률·풀이시간·단계 누락","controls":"문제 난이도·총시간·문항 수·조건 순서","resources":"난이도가 같은 간단한 수학·논리 문제 세트","concepts":["기억","학습전략","주의","피드백","인지"],"methods":[{"kind":"객관적 수행 검사","title":"완성예제와 문제해결 수행 비교","detail":"난이도가 같은 간단한 수학·논리 문제 세트을 준비한다. 예제 학습 후 풀이와 바로 풀이만 다르게 하고 문제 난이도·총시간·문항 수·조건 순서을 동일하게 유지한다. 조건 순서는 번갈아 제시하고 이름·성적·선호도는 수집하지 않는다. 유사문제 정답률·풀이시간·단계 누락을 조건별로 3회 이상 기록해 평균과 오류 수를 비교한다. 안전기준을 벗어나거나 불편하면 즉시 중단한다."},{"kind":"결과 데이터 분석","title":"정확도·시간·편차 분석","detail":"조건별 유사문제 정답률·풀이시간·단계 누락을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다."},{"kind":"논문·전문자료","title":"완성예제와 문제해결 자료 비교","detail":"완성예제와 문제해결을 다룬 공공기관 자료나 고등학생이 읽을 수 있는 연구 요약 2~3편을 준비한다. 자료마다 대상·조건·측정값·결과를 같은 표에 정리하고 예제 학습 후 풀이와 바로 풀이과 유사문제 정답률·풀이시간·단계 누락의 관계가 어떻게 설명되는지 비교한다. 서로 다른 결과와 적용 범위를 구분해 가설을 판단한다."}]},{"id":"education-psychology-07","major":"교육학·심리학","question":"피드백을 즉시 받는 것과 모든 const app = document.querySelector("#app");
const state = {
  categoryId: CATEGORIES[0].id,
  majorId: CATEGORIES[0].majors[0].id,
  expandedTopicId: null,
  selectedMethods: new Map(),
  report: null,
  saveTimer: null,
};

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function activeCategory() {
  return CATEGORIES.find((item) => item.id === state.categoryId) ?? CATEGORIES[0];
}

function activeMajor() {
  const category = activeCategory();
  return category.majors.find((item) => item.id === state.majorId) ?? category.majors[0];
}

function categoryTabs() {
  return CATEGORIES.map((category, index) => `
    <button
      type="button"
      role="tab"
      class="category-tab${category.id === state.categoryId ? " active" : ""}"
      aria-selected="${category.id === state.categoryId}"
      data-category-id="${escapeHtml(category.id)}"
      data-category-index="${index}"
      style="--category-accent:${escapeHtml(category.accent)}"
    >${escapeHtml(category.shortLabel)}</button>`).join("");
}

function majorTabs() {
  const category = activeCategory();
  return category.majors.map((major, index) => `
    <button
      type="button"
      role="tab"
      class="major-tab${major.id === state.majorId ? " active" : ""}"
      aria-selected="${major.id === state.majorId}"
      data-major-id="${escapeHtml(major.id)}"
      data-major-index="${index}"
      style="--major-accent:${escapeHtml(major.accent || category.accent)}"
    >${escapeHtml(major.shortLabel || major.label)}</button>`).join("");
}

function renderBank() {
  const category = activeCategory();
  const major = activeMajor();
  const accent = major.accent || category.accent;

  app.innerHTML = `
    <main class="bank-view" style="--accent:${escapeHtml(accent)}">
      <header class="hero">
        <div class="hero-inner">
          <h1>전공별 진로 탐구 주제은행</h1>
          <p class="hero-copy">궁금증을 탐구 질문으로 바꾸고, 가설을 세워 근거를 찾아보세요.</p>
        </div>
      </header>

      <div class="navigation-shell">
        <nav id="category-tabs" class="category-tabs" role="tablist" aria-label="진로 계열 선택">
          ${categoryTabs()}
        </nav>
        <div class="major-area">
          <nav id="major-tabs" class="major-tabs" role="tablist" aria-label="전공 선택">
            ${majorTabs()}
          </nav>
        </div>
      </div>

      <section class="bank-main" id="topic-bank">
        <p class="breadcrumb">${escapeHtml(category.label)} &gt; ${escapeHtml(major.label)}</p>
        <div class="major-heading">
          <h2>${escapeHtml(major.label)}</h2>
        </div>

        <div class="table-frame">
          <table class="topic-table">
            <thead>
              <tr>
                <th scope="col">번호</th>
                <th scope="col">탐구 질문</th>
                <th scope="col">가설 예시</th>
                <th scope="col">탐구 방법</th>
              </tr>
            </thead>
            <tbody id="topic-body"></tbody>
          </table>
        </div>
      </section>
    </main>`;

  renderTopicRows();
  bindBankEvents();
}

function methodCards(topic) {
  const selected = state.selectedMethods.get(topic.id);
  return topic.methods.map((method, index) => `
    <button
      type="button"
      class="method-option${selected === index ? " selected" : ""}"
      data-select-method="${index}"
      data-topic-id="${escapeHtml(topic.id)}"
      aria-pressed="${selected === index}"
    >
      <span class="method-option-top">
        <strong>${escapeHtml(method.kind)}</strong>
      </span>
      <h4>${escapeHtml(method.title)}</h4>
      <p>${escapeHtml(method.detail)}</p>
      <span class="method-check" aria-hidden="true"></span>
    </button>`).join("");
}

function topicRowsHtml() {
  const topics = activeMajor().topics;
  return topics.map((topic, index) => {
    const expanded = state.expandedTopicId === topic.id;
    const tags = topic.methods.map((method) => `<span>${escapeHtml(method.kind)}</span>`).join("");
    const selected = state.selectedMethods.get(topic.id);
    return `
      <tr class="topic-row${expanded ? " expanded" : ""}">
        <td data-label="번호"><span class="row-number">${index + 1}</span></td>
        <td data-label="탐구 질문"><strong class="question">${escapeHtml(topic.question)}</strong></td>
        <td data-label="가설 예시"><p class="hypothesis">${escapeHtml(topic.hypothesis)}</p></td>
        <td data-label="탐구 방법">
          <div class="method-tags">${tags}</div>
          <button type="button" class="detail-toggle" data-toggle-topic="${escapeHtml(topic.id)}" aria-expanded="${expanded}">
            ${expanded ? "상세 설명 접기" : "자세히 보기"}<b aria-hidden="true">${expanded ? "−" : "+"}</b>
          </button>
        </td>
      </tr>
      ${expanded ? `
        <tr class="detail-row">
          <td colspan="4">
            <div class="detail-panel">
              <div class="detail-title">
                <h3>탐구 방법을 하나 선택하세요.</h3>
              </div>
              <div class="methods-grid">${methodCards(topic)}</div>
              <div class="start-area">
                <span id="selection-message-${escapeHtml(topic.id)}" class="selection-message">
                  ${selected === undefined ? "탐구 방법을 선택하면 보고서 작성을 시작할 수 있습니다." : `‘${escapeHtml(topic.methods[selected].title)}’ 방법을 선택했습니다.`}
                </span>
                <button type="button" class="primary-button" data-start-topic="${escapeHtml(topic.id)}">
                  이 주제로 탐구 시작하기 →
                </button>
              </div>
            </div>
          </td>
        </tr>` : ""}`;
  }).join("");
}

function renderTopicRows() {
  const body = document.querySelector("#topic-body");
  if (!body) return;
  body.innerHTML = topicRowsHtml();
  bindTopicEvents();
}

function selectCategory(categoryId) {
  const category = CATEGORIES.find((item) => item.id === categoryId);
  if (!category) return;
  state.categoryId = category.id;
  state.majorId = category.majors[0].id;
  state.expandedTopicId = null;
  renderBank();
}

function selectMajor(majorId) {
  state.majorId = majorId;
  state.expandedTopicId = null;
  renderBank();
}

function bindBankEvents() {
  document.querySelectorAll("[data-category-id]").forEach((button) => {
    button.addEventListener("click", () => selectCategory(button.dataset.categoryId));
    button.addEventListener("keydown", (event) => {
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
      event.preventDefault();
      const index = Number(button.dataset.categoryIndex);
      let next = event.key === 'Home' ? 0 : event.key === 'End' ? CATEGORIES.length - 1 :
        event.key === 'ArrowRight' ? (index + 1) % CATEGORIES.length : (index - 1 + CATEGORIES.length) % CATEGORIES.length;
      selectCategory(CATEGORIES[next].id);
      requestAnimationFrame(() => document.querySelector(`[data-category-index="${next}"]`)?.focus());
    });
  });

  document.querySelectorAll("[data-major-id]").forEach((button) => {
    button.addEventListener("click", () => selectMajor(button.dataset.majorId));
  });

}

function bindTopicEvents() {
  document.querySelectorAll("[data-toggle-topic]").forEach((button) => {
    button.addEventListener("click", () => {
      const topicId = button.dataset.toggleTopic;
      state.expandedTopicId = state.expandedTopicId === topicId ? null : topicId;
      renderTopicRows();
      requestAnimationFrame(() => document.querySelector(`[data-toggle-topic="${topicId}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" }));
    });
  });

  document.querySelectorAll("[data-select-method]").forEach((button) => {
    button.addEventListener("click", () => {
      state.selectedMethods.set(button.dataset.topicId, Number(button.dataset.selectMethod));
      renderTopicRows();
    });
  });

  document.querySelectorAll("[data-start-topic]").forEach((button) => {
    button.addEventListener("click", () => {
      const topic = activeMajor().topics.find((item) => item.id === button.dataset.startTopic);
      const methodIndex = state.selectedMethods.get(topic.id);
      if (methodIndex === undefined) {
        const message = document.querySelector(`#selection-message-${topic.id}`);
        if (message) message.textContent = "먼저 위의 탐구 방법 중 하나를 선택하세요.";
        return;
      }
      startReport(topic, methodIndex);
    });
  });
}

function startReport(topic, methodIndex) {
  state.report = {
    category: activeCategory(),
    major: activeMajor(),
    topic,
    methodIndex,
    method: topic.methods[methodIndex],
  };
  renderReport();
  window.scrollTo(0, 0);
}

function exampleBlock(examples) {
  return `
    <div class="examples">
      <div class="examples-title"><span>✦</span> 작성 예시</div>
      <div class="example-grid">
        ${examples.slice(0, 3).map((item, index) => `
          <p class="example-card"><strong>예시 ${index + 1}</strong><span>${escapeHtml(item)}</span></p>`).join("")}
      </div>
    </div>`;
}

function field(label, id, examples, placeholder, options = {}) {
  const element = options.single
    ? `<input id="${id}" data-field="${id}" type="text" placeholder="${escapeHtml(placeholder)}">`
    : `<textarea id="${id}" data-field="${id}" placeholder="${escapeHtml(placeholder)}"></textarea>`;
  return `
    <label class="field${options.full === false ? "" : " full"}">
      <span class="field-label">${escapeHtml(label)}</span>
      ${examples?.length ? exampleBlock(examples) : ""}
      ${element}
    </label>`;
}

function section(id, number, title, guide, content) {
  return `
    <section class="report-section" id="${id}">
      <span class="section-number">${number}</span>
      <h2>${escapeHtml(title)}</h2>
      <p class="section-guide">${escapeHtml(guide)}</p>
      ${content}
    </section>`;
}

function cleanQuestion(question) {
  return question.replace(/\?$/, "");
}

const TOPIC_CONCEPT_RULES = [

  { pattern: /라인센서|광저항|온도센서|센서/, name: "센서의 측정 원리", explanation: "센서는 빛·온도·거리 같은 물리량을 전기 신호나 수치 데이터로 바꾸는 장치이다. 센서의 설치 조건과 측정 범위가 달라지면 출력값의 정확도와 안정성도 달라질 수 있다." },

  { pattern: /비례제어|피드백|목표 위치|경로 추종|곡선 추종|제어 명령/, name: "피드백 제어", explanation: "피드백 제어는 현재 상태와 목표값의 차이를 측정해 다음 동작을 수정하는 방식이다. 오차를 얼마나 자주, 얼마나 크게 보정하는지가 추종 속도와 안정성에 영향을 준다." },

  { pattern: /기어/, name: "기어비", explanation: "기어비는 맞물린 기어의 이 수나 지름의 비이다. 큰 기어가 출력축에 연결되면 회전속도는 낮아지는 대신 이상적인 조건에서 돌리는 힘은 커진다." },

  { pattern: /종이비행기|글라이더|날개 면적|가로세로비|받음각|양력/, name: "양력과 항력", explanation: "날개 주위의 공기 흐름은 위쪽으로 뜨게 하는 양력과 운동을 방해하는 항력을 만든다. 날개 면적과 받음각이 달라지면 두 힘의 크기와 비행 안정성이 함께 달라진다." },

  { pattern: /도핑 농도/, name: "도핑과 전기전도성", explanation: "도핑은 순수 반도체에 소량의 불순물을 넣어 전하 운반자의 수를 조절하는 과정이다. 운반자 농도가 달라지면 반도체의 전기저항도 달라진다." },
  { pattern: /노광|빛의 파장|반도체 선폭/, name: "광학적 해상도", explanation: "빛을 이용한 노광에서는 파장이 짧고 광학계의 해상력이 높을수록 더 작은 무늬를 구분할 수 있다. 실제 선폭은 렌즈·공정·재료 조건의 영향도 함께 받는다." },
  { pattern: /정렬 알고리즘|이진 탐색|순차 탐색|경로탐색|너비우선|A\*/, name: "알고리즘과 탐색 효율", explanation: "알고리즘은 문제를 해결하는 절차이며 같은 결과를 내더라도 비교 횟수와 실행시간이 다를 수 있다. 입력 자료의 크기와 정렬 여부, 장애물 구조에 따라 효율 차이가 커진다." },
  { pattern: /리스트와 집합|자료형/, name: "자료구조", explanation: "자료구조는 데이터를 저장하고 찾는 방식을 정한다. 리스트는 순서를 유지하지만 원소 탐색에 시간이 걸릴 수 있고, 집합은 해시 구조를 이용해 포함 여부를 빠르게 확인하는 경우가 많다." },
  { pattern: /해상도|픽셀/, name: "이미지 해상도", explanation: "이미지 해상도는 가로와 세로의 픽셀 수로 나타낸다. 픽셀 수가 늘어나면 표현할 수 있는 세부정보와 처리해야 할 데이터량이 함께 증가한다." },
  { pattern: /압축률|파일 크기와 화질/, name: "손실 압축", explanation: "손실 압축은 사람이 덜 중요하게 느끼는 정보를 일부 제거해 파일 크기를 줄이는 방식이다. 압축을 강하게 할수록 용량은 줄지만 세부정보 손실과 왜곡이 커질 수 있다." },
  { pattern: /비밀번호|전수조사|경우의 수/, name: "조합의 수", explanation: "가능한 문자의 종류가 m개이고 길이가 n이라면 중복을 허용한 비밀번호의 경우의 수는 m의 n제곱으로 증가한다. 길이와 문자 종류가 늘면 전수조사에 필요한 경우가 매우 빠르게 커진다." },
  { pattern: /데이터 묶음|패킷|전송시간|오류 복구/, name: "패킷과 전송 효율", explanation: "네트워크는 데이터를 작은 패킷으로 나누어 전송하며 각 패킷에는 제어정보가 붙는다. 패킷이 너무 작으면 부가정보 비율이 커지고 너무 크면 오류 발생 시 다시 보내야 하는 양이 커질 수 있다." },
  { pattern: /캐시/, name: "캐시와 지역성", explanation: "캐시는 자주 사용하거나 다시 사용할 가능성이 높은 결과를 가까운 저장공간에 보관하는 방식이다. 같은 계산이 반복될 때 다시 계산하는 횟수를 줄여 실행시간을 단축할 수 있다." },
  { pattern: /중복 정보|오류정정|오류를.*복구/, name: "오류 검출과 정정", explanation: "전송 데이터에 규칙적인 중복정보를 더하면 일부 오류를 찾아내거나 원래 값을 복원할 수 있다. 복구 능력을 높일수록 추가로 전송해야 하는 데이터도 늘어난다." },
  { pattern: /학습 데이터 수|학습데이터|정답표시|라벨/, name: "학습데이터와 일반화", explanation: "인공지능은 학습데이터에서 규칙을 찾기 때문에 자료의 양뿐 아니라 대표성과 정답표시의 정확성이 중요하다. 특정 조건에 치우친 자료는 새로운 자료에서의 성능을 낮출 수 있다." },
  { pattern: /한 범주의 데이터|전체 정확도|분류 정확도|평가지표/, name: "분류 평가지표", explanation: "정확도는 전체 예측 중 맞힌 비율이지만 범주별 자료 수가 크게 다르면 소수 범주의 실패를 가릴 수 있다. 이때는 범주별 정밀도·재현율·혼동행렬을 함께 확인해야 한다." },
  { pattern: /입력 특징|과적합/, name: "과적합", explanation: "과적합은 모델이 학습자료의 우연한 특징까지 외워 새로운 자료에서 성능이 낮아지는 현상이다. 특징 수가 많다고 항상 예측력이 좋아지는 것은 아니다." },
  { pattern: /최근접|이웃 수 k/, name: "K-최근접이웃", explanation: "K-최근접이웃은 새 자료와 가까운 k개의 학습자료를 이용해 범주를 정한다. k가 너무 작으면 작은 잡음에 민감하고 너무 크면 서로 다른 범주의 경계가 흐려질 수 있다." },
  { pattern: /시험자료.*학습|정보가 학습과정에 섞/, name: "데이터 누수", explanation: "데이터 누수는 평가에만 사용해야 할 정보가 학습과정에 들어가는 문제이다. 누수가 생기면 실제보다 성능이 높게 측정되므로 학습자료와 시험자료를 먼저 분리해야 한다." },
  { pattern: /극단적으로 큰 값|이상값/, name: "이상값의 영향", explanation: "평균과 회귀직선은 극단적으로 큰 값의 영향을 크게 받을 수 있다. 이상값을 임의로 지우지 말고 발생 원인을 확인한 뒤 포함 전후 결과를 함께 비교해야 한다." },
  { pattern: /빠진 데이터|결측값/, name: "결측값 처리", explanation: "결측값은 관측되지 않은 자료이며 삭제·평균 대체 등 처리 방법에 따라 표본의 분포와 분석 결과가 달라질 수 있다. 선택한 처리 기준과 이유를 기록해야 한다." },
  { pattern: /실제 원인|상관|정책 효과/, name: "상관관계와 인과관계", explanation: "두 변수가 함께 변하는 상관관계가 나타나도 한 변수가 다른 변수의 원인이라고 바로 결론 내릴 수는 없다. 공통 원인과 시간 순서, 다른 조건을 함께 검토해야 한다." },
  { pattern: /입자 크기.*녹|표면적.*사라지|용해/, name: "표면적과 용해 속도", explanation: "같은 질량이라도 입자가 작아지면 용매와 맞닿는 전체 표면적이 커진다. 접촉면이 넓어지면 용해가 진행되는 속도가 빨라질 수 있다." },
  { pattern: /반응속도|발포정|반응을 마치는 시간/, name: "화학반응 속도", explanation: "반응속도는 일정 시간 동안 반응물이나 생성물의 양이 변하는 정도이다. 온도·농도·표면적이 달라지면 입자 사이의 유효충돌 횟수가 달라져 반응속도도 변한다." },
  { pattern: /pH|산성 용액|중화|제산제|적양배추 지시약/, name: "산·염기와 pH", explanation: "pH는 수용액의 산성이나 염기성 정도를 나타내는 척도이다. 산과 염기가 반응하면 서로의 성질이 약해지는 중화가 일어나며 지시약의 색도 pH에 따라 달라진다." },
  { pattern: /부식/, name: "금속의 부식", explanation: "부식은 금속이 주변 물질과 산화·환원 반응을 하며 성질이 변하는 현상이다. 수분·산성도·염분은 전하 이동을 도와 부식 속도에 영향을 줄 수 있다." },
  { pattern: /활성탄|색소 제거|색 농도/, name: "흡착", explanation: "흡착은 용액 속 물질이 고체 표면에 달라붙는 현상이다. 활성탄의 양과 표면적이 커지면 색소가 붙을 수 있는 자리가 늘어나 제거량이 증가할 수 있다." },
  { pattern: /크로마토그래피|전개액|색소 분리/, name: "크로마토그래피", explanation: "크로마토그래피는 성분마다 종이와 전개액에 끌리는 정도가 다른 점을 이용해 혼합물을 분리한다. 전개액의 조성이 달라지면 성분의 이동거리와 분리 정도가 달라진다." },
  { pattern: /전분.*흐르는|점도|소스 모형/, name: "점도", explanation: "점도는 유체가 흐름에 저항하는 정도이다. 전분이나 용질의 농도가 높아지면 입자 사이 상호작용이 커져 흐르는 시간이 길어질 수 있다." },
  { pattern: /효모|발효|기체 발생량/, name: "발효", explanation: "효모는 산소가 부족한 조건에서 당을 분해하여 에너지를 얻고 이산화탄소 등을 만든다. 온도와 당의 농도가 효모의 활동 범위를 벗어나면 기체 발생량이 감소할 수 있다." },
  { pattern: /아밀레이스|효소|갈변/, name: "효소의 작용", explanation: "효소는 생물체의 화학반응을 빠르게 하는 물질이며 온도와 pH에 따라 활성 정도가 달라진다. 적정 범위를 벗어나면 효소의 구조가 변해 반응속도가 낮아질 수 있다." },
  { pattern: /심박수.*회복|운동 강도/, name: "항상성과 회복", explanation: "항상성은 몸속 상태를 일정한 범위로 유지하려는 조절 작용이다. 운동 뒤 심박수가 안정 수준으로 돌아오는 시간은 운동 강도와 개인의 상태에 따라 달라질 수 있다." },
  { pattern: /유전비|완두콩 형질/, name: "확률적 유전", explanation: "대립유전자의 분리는 확률적으로 일어나므로 적은 횟수의 모형 추출에서는 이론적 비율과 차이가 날 수 있다. 반복 횟수가 늘면 관찰 비율이 이론값에 가까워지는 경향이 있다." },
  { pattern: /방형구|생태조사|개체수 추정/, name: "표본조사", explanation: "방형구 조사는 전체 지역의 일부를 표본으로 조사해 개체수나 분포를 추정하는 방법이다. 방형구의 크기·수·배치가 표본의 대표성과 추정오차에 영향을 준다." },
  { pattern: /흙의 입자|스며드는 시간|공극|침하/, name: "공극과 물의 이동", explanation: "토양 입자 사이의 빈 공간인 공극의 크기와 연결 정도는 물이 스며들고 저장되는 속도를 결정한다. 입자 배열과 수분량은 지반의 침하에도 영향을 줄 수 있다." },
  { pattern: /유출량|토양 손실|강우 강도/, name: "지표 유출과 침식", explanation: "비가 땅에 스며드는 양보다 강우량이 많으면 지표 유출이 증가한다. 경사와 지표 재료가 달라지면 물의 속도와 토양을 운반하는 침식 정도도 달라진다." },
  { pattern: /열섬|도시 표면|지표의 색과 재료/, name: "알베도와 열섬", explanation: "알베도는 들어온 빛을 반사하는 비율이다. 어둡고 열을 잘 저장하는 도시 표면은 낮에 더 많은 에너지를 흡수해 표면온도와 주변 기온을 높일 수 있다." },
  { pattern: /여과재|탁도|여과/, name: "여과", explanation: "여과는 입자 크기와 재료의 공극을 이용해 혼합물에서 고체 입자를 분리하는 과정이다. 여과재의 종류와 층 순서는 제거율과 물의 흐름속도에 함께 영향을 준다." },
  { pattern: /표본의 크기|모집단 평균|표본 수/, name: "표본과 표집오차", explanation: "표본은 모집단의 일부이며 표본으로 계산한 값은 표본을 어떻게 뽑았는지에 따라 달라진다. 무작위 표본의 크기가 커지면 평균 추정값의 변동이 작아지는 경향이 있다." },
  { pattern: /평균과 중앙값|대표값|평균평점/, name: "평균과 중앙값", explanation: "평균은 모든 값을 반영하지만 극단값의 영향을 크게 받고, 중앙값은 자료를 순서대로 놓았을 때 가운데 값이라 극단값에 덜 민감하다. 자료의 분포에 맞는 대표값을 선택해야 한다." },
  { pattern: /히스토그램|구간 너비/, name: "히스토그램의 구간", explanation: "히스토그램은 연속적인 수치자료를 구간으로 나누어 빈도를 나타낸다. 구간 너비가 달라지면 봉우리와 퍼짐이 다르게 보일 수 있으므로 여러 구간 설정을 비교해야 한다." },
  { pattern: /이동평균/, name: "이동평균", explanation: "이동평균은 일정 기간의 값을 평균내어 시간에 따른 불규칙한 변동을 완화하는 방법이다. 기간이 길면 잡음은 줄지만 갑작스러운 변화가 늦게 나타날 수 있다." },
  { pattern: /동전 던지기|생일 문제|몬티홀|확률/, name: "확률과 반복", explanation: "확률은 같은 조건에서 어떤 결과가 나타날 가능성을 수로 나타낸 것이다. 독립적인 시행을 많이 반복하면 관찰된 상대도수가 이론적 확률에 가까워지는 경향이 있다." },
  { pattern: /선형함수|지수함수|모형의 오차/, name: "수학적 모형과 오차", explanation: "수학적 모형은 실제 현상의 관계를 식이나 함수로 단순화한 것이다. 예측값과 실제값의 차이를 같은 오차 기준으로 비교해야 어떤 모형이 자료를 더 잘 설명하는지 판단할 수 있다." },
  { pattern: /대기시간|처리 창구|대기줄|도착 간격/, name: "대기행렬", explanation: "대기행렬에서는 단위시간당 도착하는 양과 처리하는 속도의 관계가 대기시간을 결정한다. 도착률이 처리능력에 가까워질수록 대기시간이 급격히 늘 수 있다." },
  { pattern: /판매가격|판매량|총매출|수요/, name: "가격·수요·매출", explanation: "총매출은 판매가격과 판매량의 곱이다. 가격을 낮춰 판매량이 늘더라도 증가 폭이 충분하지 않으면 총매출은 오히려 감소할 수 있다." },
  { pattern: /할인율|100g당 가격|단위가격|환율|원화 환산/, name: "비율과 단위 환산", explanation: "서로 다른 크기나 통화의 값을 비교하려면 같은 단위로 환산해야 한다. 할인은 기준 가격에 대한 비율이므로 연속 할인을 단순히 더해서 계산할 수 없다." },
  { pattern: /메뉴 단계|항목 배치|정보 순서|핵심 행동|목표정보|버튼의 크기|아이콘/, name: "사용성과 정보구조", explanation: "사용성은 사용자가 목표를 정확하고 빠르게 달성할 수 있는 정도이다. 정보의 순서·메뉴 깊이·버튼 크기와 설명 방식은 탐색시간과 오류율에 영향을 준다." },
  { pattern: /기사 제목|원인과 책임|책임 주체|프레이밍|사진 설명문/, name: "프레이밍", explanation: "프레이밍은 같은 사건도 어떤 정보와 표현을 선택하느냐에 따라 특정한 해석이 두드러지게 되는 현상이다. 제목의 동사와 책임 주체, 인용 순서를 비교하면 강조점의 차이를 찾을 수 있다." },
  { pattern: /출처|검증 가능성|정정기사|신뢰할 만/, name: "출처의 신뢰도", explanation: "자료의 신뢰도는 작성자·기관·발표 시기·근거·검증 가능성을 함께 살펴 판단한다. 출처 수가 많다는 사실만으로 신뢰도가 높아지는 것은 아니다." },
  { pattern: /세로축|막대그래프|원그래프|표·|정보 시각화/, name: "자료 시각화", explanation: "그래프는 자료의 차이와 경향을 빠르게 보여주지만 축의 시작점·눈금·그래프 종류에 따라 같은 값이 다르게 보일 수 있다. 수치와 축 범위를 함께 확인해야 한다." },
  { pattern: /역사적 사건|기록자의 위치|사료|교과서의 발행 시기/, name: "사료의 관점과 맥락", explanation: "사료는 작성자의 위치·목적·시대적 배경에 따라 선택한 사실과 해석이 달라질 수 있다. 여러 사료를 비교해 공통 사실과 서로 다른 관점을 구분해야 한다." },
  { pattern: /논증 구조|도덕적 딜레마|철학적 주장|권리 선언문/, name: "논증", explanation: "논증은 근거를 이용해 결론이 타당하다는 것을 보이는 구조이다. 주장마다 전제·근거·결론을 구분하면 서로 다른 판단 기준을 비교할 수 있다." },
  { pattern: /높임 표현|종결 표현|인물을 부르는 표현/, name: "담화 관계와 표현", explanation: "높임말과 종결 표현은 말하는 사람과 듣는 사람의 관계, 발화 목적과 상황을 드러낸다. 인물 관계나 설명·주장·요청의 목적이 달라지면 표현 방식도 달라질 수 있다." },
  { pattern: /인출 연습|재읽기/, name: "인출 연습", explanation: "인출 연습은 학습한 내용을 보지 않고 기억에서 꺼내보는 활동이다. 단순 재읽기보다 기억 경로를 강화해 시간이 지난 뒤의 회상에 도움이 될 수 있다." },
  { pattern: /나누어 학습|한 번에 학습/, name: "분산 학습", explanation: "분산 학습은 같은 총학습시간을 여러 번으로 나누어 학습하는 방식이다. 학습 사이의 간격이 기억을 다시 인출하게 하여 장기 기억에 도움을 줄 수 있다." },
  { pattern: /묶어서 제시|긴 숫자|단어를 묶/, name: "청킹", explanation: "청킹은 여러 정보를 의미 있는 묶음으로 조직해 작업기억의 부담을 줄이는 전략이다. 묶음의 기준이 익숙하고 일관될수록 더 많은 정보를 한꺼번에 다룰 수 있다." },
  { pattern: /앞·중간·끝|기억률/, name: "계열위치 효과", explanation: "목록의 앞부분과 뒷부분 항목이 중간 항목보다 잘 기억되는 현상을 계열위치 효과라고 한다. 제시 순서를 바꾸어야 항목 자체의 차이와 위치 효과를 구분할 수 있다." },

  { pattern: /색 대비|배경색의 대비/, name: "명도 대비와 가독성", explanation: "글자와 배경의 명도 차이가 크면 경계가 뚜렷해져 정보를 찾고 읽기 쉬워지는 경향이 있다. 다만 글자 크기·조명·색각 조건도 함께 통제해야 한다." },

  { pattern: /보폭|보빈도|달리기.*속도/, name: "보폭·보빈도와 속도", explanation: "달리기 속도는 한 걸음의 길이인 보폭과 단위시간당 걸음 수인 보빈도의 곱으로 설명할 수 있다. 영상에서 두 값을 따로 측정하면 속도 변화의 원인을 구분할 수 있다." },
  { pattern: /영양성분|당류|단백질|식이섬유|영양 밀도|식단/, name: "영양 밀도", explanation: "영양 밀도는 일정한 열량이나 질량에 들어 있는 유익한 영양소의 양을 비교하는 개념이다. 1회 제공량과 100g 기준을 구분해야 제품이나 식단을 공정하게 비교할 수 있다." },

function methodConceptFallbacks(method) {
  const type = inquiryProcess(method).type;
  if (type === "데이터 분석형 탐구") {
    return [
      { name: "자료 정제", explanation: "자료 정제는 결측값·중복값·단위 차이·이상값을 확인해 분석 가능한 형태로 만드는 과정이다. 같은 정제 기준을 모든 비교 집단에 적용해야 결과를 공정하게 비교할 수 있다." },
      { name: "대표값과 분포", explanation: "평균이나 중앙값 같은 대표값만으로는 자료의 전체 모습을 알기 어렵다. 자료 수와 범위, 그래프의 퍼짐을 함께 확인해야 집단 간 차이가 일관된지 판단할 수 있다." },
      { name: "상관관계와 인과관계", explanation: "두 변수가 함께 변해도 한 변수가 다른 변수의 원인이라고 바로 결론 내릴 수는 없다. 다른 영향 요인과 시간 순서를 검토해 결론의 범위를 제한해야 한다." },
    ];
  }
  if (type === "논문·자료·사례 탐구") {
    return [
      { name: "자료의 신뢰도", explanation: "자료의 신뢰도는 작성자·기관·발표 시기·연구 대상·근거를 확인해 판단한다. 한 자료의 결론만 따르지 않고 서로 다른 출처를 비교해야 한다." },
      { name: "비교 기준", explanation: "여러 자료를 비교하려면 대상·조건·방법·측정 지표·결과를 같은 항목으로 정리해야 한다. 비교 기준이 다르면 결과 차이가 주제 때문인지 연구 조건 때문인지 구분하기 어렵다." },
      { name: "근거의 종합", explanation: "근거의 종합은 여러 자료에서 일치하는 결과와 충돌하는 결과를 구분해 탐구 질문에 답하는 과정이다. 자료가 적용되는 대상과 조건을 함께 밝혀야 한다." },
    ];
  }
  if (type === "모형·코딩·시뮬레이션 탐구") {
    return [
      { name: "모형의 가정", explanation: "모형은 실제 현상을 단순화하기 위해 일정한 가정을 사용한다. 어떤 조건을 생략하거나 일정하다고 보았는지 밝혀야 결과의 적용 범위를 판단할 수 있다." },
      { name: "입력변수와 출력값", explanation: "입력변수는 모형에서 바꾸는 값이고 출력값은 그에 따라 계산되는 결과이다. 한 번에 한 입력만 바꾸어야 출력 변화의 원인을 분명히 해석할 수 있다." },
      { name: "모형의 검증", explanation: "모형의 검증은 계산 결과를 이론이나 실제 측정자료와 비교해 설명력을 확인하는 과정이다. 차이가 나타나면 가정·입력 범위·계산식의 한계를 살펴야 한다." },
    ];
  }
  if (type === "객관식 검사·과제 수행형 탐구") {
    return [
      { name: "조작적 정의", explanation: "조작적 정의는 정확도·반응시간·오류 수처럼 관찰하고 측정할 수 있는 방식으로 개념을 정하는 것이다. 측정 기준이 분명해야 다른 조건의 결과를 비교할 수 있다." },
      { name: "조건의 표준화", explanation: "문항 수·난이도·제시 시간·장소를 같게 맞추는 것을 조건의 표준화라고 한다. 조건이 다르면 결과 차이를 비교하려는 요인의 영향으로 해석하기 어렵다." },
      { name: "표본과 일반화", explanation: "탐구에 참여한 사람은 전체 집단의 일부인 표본이다. 표본 수가 적거나 한 집단에 치우치면 결과를 모든 사람에게 그대로 일반화할 수 없다." },
    ];
  }
  return [
    { name: "독립변인과 종속변인", explanation: "독립변인은 탐구에서 의도적으로 바꾸는 조건이고 종속변인은 그에 따라 측정하는 결과이다. 두 변인을 분명히 구분해야 탐구 질문을 측정 가능한 형태로 바꿀 수 있다." },
    { name: "변인 통제", explanation: "변인 통제는 비교하려는 조건 하나만 바꾸고 재료·측정 위치·시간·도구 같은 다른 조건을 같게 유지하는 것이다. 그래야 결과 차이를 바꾼 조건의 영향으로 해석할 수 있다." },
    { name: "반복 측정과 평균", explanation: "같은 조건을 여러 번 측정하면 우연한 오차의 영향을 확인할 수 있다. 평균과 함께 최댓값·최솟값 또는 범위를 제시하면 결과의 안정성도 판단할 수 있다." },
  ];
}

function topicConceptExamples(topic, method) {
  const text = `${topic.question} ${topic.hypothesis} ${method.title}`;
  const selected = [];
  const names = new Set();

  const add = (concept) => {
    if (!concept || names.has(concept.name) || selected.length >= 3) return;
    names.add(concept.name);
    selected.push(`${concept.name}: ${concept.explanation}`);
  };

  TOPIC_CONCEPT_RULES.forEach((rule) => {
    if (rule.pattern.test(text)) add(rule);
  });
  methodConceptFallbacks(method).forEach(add);

  return selected.slice(0, 3);
}

function reportExamples(topic, method, major) {
  const focus = topic.focus || cleanQuestion(topic.question);
  const process = inquiryProcess(method);
  const outcome = inquiryOutcomeExamples(topic, method);
  return {
    titles: [
      `${focus}에 관한 조건별 비교 탐구`,
      `${method.title}을 활용한 ${focus} 분석`,
      `${topic.change}에 따른 ${topic.measure}의 변화`,
    ],
    motivations: [
      `생활 속에서 ${focus}과 관련된 현상을 접하고 어떤 조건이 결과에 영향을 주는지 직접 확인하고 싶었다.`,
      `${major.label} 분야에서는 성능이나 현상을 수치로 판단한다는 점에 관심이 생겨 이 주제를 탐구하게 되었다.`,
      `자료에서 설명한 원리가 실제 측정이나 분석 결과와도 일치하는지 확인하고 싶었다.`,
    ],
    questions: [
      topic.question,
      `${topic.change}을 바꾸면 ${topic.measure}은 어떻게 달라질까?`,
      `${topic.measure}의 차이를 가장 크게 만드는 조건은 무엇일까?`,
    ],
    concepts: topicConceptExamples(topic, method),
    hypotheses: [
      topic.hypothesis,
      `${topic.change}이 증가하거나 달라지면 ${topic.measure}에도 일정한 방향의 변화가 나타날 것이다.`,
      `예상한 조건 차이보다 측정 편차나 다른 통제조건의 영향이 더 크게 나타날 수도 있을 것이다.`,
    ],
    materials: [
      topic.resources,
      `선택한 ‘${method.title}’ 방법에 필요한 재료·자료·측정도구`,
      `기록표, 타이머 또는 스프레드시트처럼 결과를 수치로 남길 도구`,
    ],
    changes: [topic.change, `한 번에 한 조건만 바꾸고 나머지 조건은 동일하게 유지한다.`, `비교할 조건을 3단계 또는 3집단으로 구분한다.`],
    measures: [topic.measure, `조건별 측정값을 같은 단위로 기록한다.`, `평균뿐 아니라 최댓값·최솟값 또는 오류 수도 함께 기록한다.`],
    controls: [topic.controls, `재료의 양·측정 위치·시작조건·측정시간을 같게 한다.`, `조건 제시 순서와 반복 횟수를 같게 하거나 순서를 번갈아 적용한다.`],
    steps: [
      process.steps.map((step, index) => `${index + 1}. ${step.title}`).join(" → "),
      method.detail,
      process.caution,
    ],
    results: outcome.results,
    decisions: outcome.decisions,
    conclusions: outcome.conclusions,
    limitations: outcome.limitations,
    followups: outcome.followups,
  };
}

function methodTypeId(method) {
  const signature = `${method.kind} ${method.title}`;
  if (/데이터|공공|회귀|이미지 분석|영상 분석|규격 데이터/.test(signature)) return "data";
  if (/논문|사례|자료 검색|자료 비교|자료 분석|내용 분석|텍스트|문헌|표준|규격|이론/.test(signature)) return "literature";

}

  return ["조건", "1차 결과", "2차 결과", "3차 결과", "평균·요약", "관찰 내용"];

function recordTable(method) {
  const type = methodTypeId(method);
  const headers = recordHeaders(method);
  const rowCount = type === "literature" ? 3 : 4;
  return `
    <div class="table-scroll">
      <table class="record-table">
        <thead><tr>${headers.map((item) => `<th>${escapeHtml(item)}</th>`).join("")}</tr></thead>
        <tbody>
          ${Array.from({ length: rowCount }, (_, row) => `<tr>${headers.map((_, col) => `<td>${type === "literature"
            ? `<textarea rows="3" data-field="record-${row}-${col}" aria-label="${escapeHtml(headers[col])} ${row + 1}행"></textarea>`
            : `<input data-field="record-${row}-${col}" aria-label="${escapeHtml(headers[col])} ${row + 1}행">`}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

  if (type === "model") return [

function storageKey() {
  if (!state.report) return "career-inquiry-report";
  return `career-inquiry:${state.report.topic.id}:${state.report.methodIndex}`;
}

function collectReport() {
  const values = {};
  document.querySelectorAll("[data-field]").forEach((element) => {
    values[element.dataset.field] = element.value;
  });
  return values;
}

function saveReport(silent = false) {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(collectReport()));
    const status = document.querySelector("#save-status");
    if (status) status.textContent = "저장됨";
    if (!silent) showToast("작성 내용을 이 브라우저에 저장했습니다.");
  } catch {
    if (!silent) showToast("브라우저 저장공간을 사용할 수 없습니다.");
  }
}

function restoreReport() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (!raw) return;
    const values = JSON.parse(raw);
    document.querySelectorAll("[data-field]").forEach((element) => {
      if (Object.hasOwn(values, element.dataset.field)) element.value = values[element.dataset.field];
    });
    updateCharacterCount();
    const status = document.querySelector("#save-status");
    if (status) status.textContent = "저장된 작성 내용을 불러왔습니다.";
  } catch {
    showToast("저장된 내용을 불러오지 못했습니다.");
  }
}

function showToast(message) {
  const toast = document.querySelector("#toast");
  if (!toast) return;
  toast.textContent = message;
  toast.hidden = false;
  window.setTimeout(() => { toast.hidden = true; }, 2200);
}

async function copyAiPrompt(button) {
  const promptText = button.closest(".ai-prompt")?.querySelector(".ai-prompt-text")?.textContent.trim();
  if (!promptText) return;

  try {
    if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
    await navigator.clipboard.writeText(promptText);
  } catch {
    const textarea = document.createElement("textarea");
    textarea.value = promptText;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    const copied = typeof document.execCommand === "function" && document.execCommand("copy");
    textarea.remove();
    if (!copied) {
      showToast("프롬프트를 선택해 직접 복사하세요.");
      return;
    }
  }

  showToast("프롬프트를 복사했습니다.");
}

function scheduleAutosave() {
  window.clearTimeout(state.saveTimer);
  const status = document.querySelector("#save-status");
  if (status) status.textContent = "작성 중…";
  state.saveTimer = window.setTimeout(() => saveReport(true), 500);
}

function hasBatchim(text) {
  const clean = String(text).trim().replace(/[\s.!?"'’”)]*$/, "");
  const code = clean.charCodeAt(clean.length - 1);
  if (code < 0xac00 || code > 0xd7a3) return false;
  return (code - 0xac00) % 28 !== 0;
}

function withJosa(text, pair) {
  const [withBatchim, withoutBatchim] = pair.split("/");
  return `${text}${hasBatchim(text) ? withBatchim : withoutBatchim}`;
}

function inputValue(id) {
  return document.querySelector(`#${id}`)?.value.trim() ?? "";
}

function composeSelfEvaluation() {
  const sentences = [];
  const trigger = inputValue("self-trigger");
  const question = inputValue("self-question");
  const method = inputValue("self-method");
  const finding = inputValue("self-finding");
  const growth = inputValue("self-growth");

  if (trigger) sentences.push(`평소 ${trigger}에 관심이 있어 이번 탐구를 시작하였다.`);
  if (question) sentences.push(`확인하고자 한 탐구 질문을 다음과 같이 정하였다. “${question}”`);
  if (method) sentences.push(`${withJosa(method, "을/를")} 활용하여 자료를 수집하고 결과를 비교·분석하였다.`);
  if (finding) sentences.push(`탐구 결과 ${finding}`);
  if (growth) sentences.push(`이 과정에서 ${growth} 능력이 향상되었으며, 근거를 바탕으로 결론을 설명하는 태도의 중요성을 이해하였다.`);

  return sentences.join(" ");
}

function generateSelfEvaluation() {
  const text = composeSelfEvaluation();

  const output = document.querySelector("#self-output");
  if (!output) return;
  output.value = text;
  updateCharacterCount();
  scheduleAutosave();
  showToast(text ? "자기평가서 초안을 만들었습니다. 직접 수정해 완성하세요." : "작성한 항목이 없습니다.");
}

function updateCharacterCount() {
  const output = document.querySelector("#self-output");
  const count = document.querySelector("#self-count");
  if (output && count) count.textContent = `${output.value.length}자`;
}

  return `
    <table class="record">
      <thead><tr>${headers.map((item) => `<th>${escapeHtml(item)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function safeFileNamePart(value) {
  return String(value ?? "")
    .trim()
    .replace(/[\\/:*?"<>|]/g, "_")
    .replace(/\s+/g, "_");
}

function downloadWordReport() {
  if (!state.report) return;
  const { category, major, topic, method } = state.report;
  const plan = inquiryPlanProfile(topic, method);

  let selfEvaluation = inputValue("self-output");
  if (!selfEvaluation) {
    selfEvaluation = composeSelfEvaluation();
    const output = document.querySelector("#self-output");
    if (output && selfEvaluation) {
      output.value = selfEvaluation;
      updateCharacterCount();
    }
  }

  saveReport(true);

  const wordHtml = `<!doctype html>
<html lang="ko" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
  <meta charset="utf-8">
  <title>진로 탐구보고서</title>
  <style>
    @page Section1 { size: 595.3pt 841.9pt; margin: 50pt 48pt; }
    div.Section1 { page: Section1; }
    body { color: #111827; font-family: "맑은 고딕", "Malgun Gothic", sans-serif; font-size: 10.5pt; line-height: 1.65; }
    h1 { margin: 0 0 22pt; padding-bottom: 10pt; font-size: 22pt; text-align: center; border-bottom: 2pt solid #172139; }
    h2 { margin: 24pt 0 8pt; padding: 6pt 8pt; font-size: 14pt; background: #eef1f5; border-left: 4pt solid #dc6845; }
    h3 { margin: 14pt 0 6pt; font-size: 11.5pt; }
    p { margin: 5pt 0; }
    table { width: 100%; margin: 6pt 0 12pt; border-collapse: collapse; }
    th, td { min-height: 18pt; padding: 6pt; vertical-align: top; border: 0.7pt solid #9ca3af; }
    th { width: 22%; text-align: left; background: #f3f4f6; }
    .meta th { width: 12%; text-align: center; }
    .meta td { width: 13%; }
    .record { font-size: 8.5pt; table-layout: fixed; }
    .record th { width: auto; text-align: center; background: #e5e7eb; }
    .selected { padding: 10pt; background: #fff7ed; border: 0.8pt solid #f3c9b9; }
    .word-process { margin: 7pt 0 12pt; padding: 9pt; background: #f7faf9; border: 0.8pt solid #b8cbc8; }
    .word-process ol { margin: 6pt 0; padding-left: 20pt; }
    .word-process li { margin: 4pt 0; }
    .self { min-height: 100pt; padding: 10pt; border: 0.8pt solid #9ca3af; }
    .label { font-weight: bold; color: #374151; }
  </style>
</head>
<body>
  <div class="Section1">
    <h1>진로 탐구보고서</h1>

    <table class="meta">
      <tr>
        <th>학년</th><td>${wordText(inputValue("student-grade"))}</td>
        <th>반</th><td>${wordText(inputValue("student-class"))}</td>
        <th>번호</th><td>${wordText(inputValue("student-number"))}</td>
        <th>이름</th><td>${wordText(inputValue("student-name"))}</td>
      </tr>
    </table>

    <p><span class="label">계열·전공:</span> ${escapeHtml(category.label)} · ${escapeHtml(major.label)}</p>
    <p><span class="label">관심 전공:</span> ${wordText(inputValue("student-interest"))}</p>
    <div class="selected">
      <p><span class="label">선택한 탐구 질문:</span> ${escapeHtml(topic.question)}</p>
      <p><span class="label">선택한 탐구 방법:</span> ${escapeHtml(method.kind)} · ${escapeHtml(method.title)}</p>
      <p>${escapeHtml(method.detail)}</p>
    </div>

    ${wordSection("탐구의 출발", `<table>${wordFieldRows([
      ["탐구 제목", "report-title"],
      ["탐구 동기", "report-motivation"],
      ["탐구 질문", "report-question"],
      ["관련 개념", "report-concepts"],
      ["가설", "report-hypothesis"],
    ])}</table>`)}

    ${wordSection("탐구 설계", `${wordInquiryProcess(method)}<table>${wordFieldRows(
      plan.fields.map((item) => [item.label, item.id]),
    )}</table>`)}

    ${wordSection("탐구 과정 기록", wordRecordTable(method))}

    ${wordSection("결과·가설 판단·결론", `<table>${wordFieldRows([
      ["탐구 결과", "report-results"],
      ["가설 판단", "hypothesis-decision"],
      ["가설 판단 근거", "decision-reason"],
      ["결론", "report-conclusion"],
    ])}</table>`)}

    ${wordSection("한계·후속 탐구·참고자료", `<table>${wordFieldRows([
      ["탐구의 한계", "report-limitations"],
      ["후속 탐구", "report-followup"],
      ["참고자료", "report-references"],
    ])}</table>`)}

    ${wordSection("자기평가서", `<div class="self">${wordText(selfEvaluation)}</div>`)}
  </div>
</body>
</html>`;

  const blob = new Blob(["\ufeff", wordHtml], { type: "application/msword;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  const studentName = safeFileNamePart(inputValue("student-name"));
  const date = new Date().toISOString().slice(0, 10).replaceAll("-", "");
  link.href = url;
  link.download = `${studentName ? `${studentName}_` : ""}진로탐구보고서_${date}.doc`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);

  const status = document.querySelector("#save-status");
  if (status) status.textContent = "Word 파일 다운로드 완료";
  showToast("보고서 전체 내용을 Word 파일로 저장했습니다.");
}

function backToBank() {
  saveReport(true);
  state.report = null;
  renderBank();
  window.scrollTo(0, 0);
}

function bindReportEvents() {
  document.querySelector("#back-to-bank")?.addEventListener("click", backToBank);
  document.querySelector("#bottom-back")?.addEventListener("click", backToBank);
  document.querySelector("#bottom-save")?.addEventListener("click", downloadWordReport);
  document.querySelector("#generate-self")?.addEventListener("click", generateSelfEvaluation);
  document.querySelectorAll(".copy-prompt").forEach((button) => {
    button.addEventListener("click", () => copyAiPrompt(button));
  });

  document.querySelectorAll("[data-field]").forEach((element) => {
    element.addEventListener("input", () => {
      if (element.id === "self-output") updateCharacterCount();
      scheduleAutosave();
    });
    element.addEventListener("change", scheduleAutosave);
  });
}

renderBank();
</script>
</body>
</html>
