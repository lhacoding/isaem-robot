<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="진로 연계 탐구주제 선택부터 보고서 초안, 자료 탐구, 완성 보고서, 자기평가서까지 이어지는 학생용 워크북">
  <title>송도이샘로봇 탐구보고서 작성 템플릿</title>
  <style>:root {
  --navy: #192238;
  --navy-2: #24314d;
  --paper: #f3efe7;
  --panel: #fffdf9;
  --ink: #172039;
  --muted: #697184;
  --line: #ddd6ca;
  --orange: #b95139;
  --orange-soft: #fff0ea;
  --gold: #e8c84e;
  --teal: #177c72;
  --shadow: 0 18px 54px rgba(24, 32, 52, .12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(25,34,56,.028) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 32px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { word-break: keep-all; text-wrap: pretty; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid #78a5ff;
  outline-offset: 3px;
}
a { color: inherit; }
[hidden] { display: none !important; }

.topbar {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 64px;
  padding: 8px 20px;
  color: white;
  background: rgba(25,34,56,.98);
  box-shadow: 0 10px 28px rgba(14,20,35,.18);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand-home { padding: 0; color: inherit; text-align: left; background: transparent; border: 0; cursor: pointer; }
.brand-home:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.brand-home:focus-visible { border-radius: 8px; }
.brand-badge {
  padding: 7px 10px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 999px;
}
.brand strong { font-size: 14px; white-space: nowrap; }
.step-nav {
  display: flex;
  flex: 1;
  justify-content: flex-end;
  gap: 4px;
  overflow: visible;
}
.step-button {
  flex: 0 0 auto;
  padding: 11px 13px;
  color: #cbd3e0;
  font-size: 12px;
  font-weight: 850;
  background: transparent;
  border: 0;
  border-radius: 9px;
  white-space: nowrap;
}
.step-button:hover { color: white; background: rgba(255,255,255,.08); }
.step-button.active { color: white; background: var(--orange); }
.step-button.sample { color: var(--gold); }
.step-button.sample.active { color: var(--navy); background: var(--gold); }

.step-menu {
  position: relative;
  flex: 0 0 auto;
}
/* 상위 버튼과 드롭다운 사이의 보이지 않는 연결 영역 */
.step-menu::after {
  position: absolute;
  z-index: 119;
  top: 100%;
  left: 0;
  width: calc(100% + 24px);
  height: 7px;
  content: "";
}
.step-menu > .step-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.step-menu-caret {
  color: currentColor;
  font-size: 9px;
  line-height: 1;
  transition: transform .18s ease;
}
.step-menu:hover .step-menu-caret,
.step-menu:focus-within .step-menu-caret,
.step-menu.open .step-menu-caret { transform: rotate(180deg); }
.step-menu > .step-button.active .step-menu-caret {
  color: white;
}
/* 예시 페이지: 평소에는 무색, 메뉴를 펼칠 때만 상위 버튼 강조 */
.step-menu.sample-page-menu:hover > .step-button,
.step-menu.sample-page-menu:focus-within > .step-button,
.step-menu.sample-page-menu.open > .step-button {
  color: white;
  background: var(--orange);
}
.step-dropdown {
  position: absolute;
  z-index: 120;
  top: calc(100% + 5px);
  left: 24px;
  display: none;
  width: 100%;
  min-width: 100%;
  padding: 4px;
  background: #fffdf9;
  border: 1px solid #d9d2c7;
  border-radius: 9px;
  box-shadow: 0 10px 24px rgba(14,20,35,.16);
}
.step-menu:hover .step-dropdown,
.step-menu:focus-within .step-dropdown,
.step-menu.open .step-dropdown { display: grid; gap: 1px; }
.step-dropdown::before {
  position: absolute;
  top: -6px;
  left: calc(50% - 24px);
  width: 10px;
  height: 10px;
  content: "";
  background: #fffdf9;
  border-top: 1px solid #d9d2c7;
  border-left: 1px solid #d9d2c7;
  transform: translateX(-50%) rotate(45deg);
}
.step-dropdown button,
.step-dropdown a {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 30px;
  padding: 6px 8px;
  color: #3f495d;
  font-size: 11px;
  font-weight: 850;
  line-height: 1.35;
  text-align: left;
  text-decoration: none;
  background: transparent;
  border: 0;
  border-radius: 6px;
  white-space: nowrap;
}
.step-dropdown button:hover,
.step-dropdown a:hover,
.step-dropdown button:focus-visible,
.step-dropdown a:focus-visible {
  color: var(--ink);
  background: #f3efe7;
}
.nav-sample-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 8px 10px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 900;
  line-height: 1;
  background: rgba(232,200,78,.10);
  border: 1px solid rgba(232,200,78,.46);
  border-radius: 9px;
  white-space: nowrap;
}
.nav-sample-button:hover {
  color: var(--navy);
  background: var(--gold);
  border-color: var(--gold);
}
.nav-sample-button.active {
  color: var(--navy);
  background: var(--gold);
  border-color: var(--gold);
}

.direct-topic-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 9px 11px;
  color: #dff5f1;
  font-size: 11px;
  font-weight: 900;
  line-height: 1;
  text-decoration: none;
  background: rgba(23,124,114,.22);
  border: 1px solid rgba(84,190,178,.55);
  border-radius: 9px;
  white-space: nowrap;
}
.direct-topic-button:hover {
  color: white;
  background: var(--teal);
  border-color: var(--teal);
}
.direct-topic-button .mobile-label { display: none; }
.save-cluster { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.save-status {
  display: inline-block;
  width: 102px;
  color: #cbd3e0;
  font-size: 10px;
  text-align: right;
  white-space: nowrap;
}
.resume-code-indicator {
  max-width: 180px;
  padding: 5px 8px;
  overflow: hidden;
  color: #f6df9a;
  font-size: 10px;
  font-weight: 850;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
}
.plain-action {
  padding: 8px 10px;
  color: white;
  font-size: 11px;
  font-weight: 800;
  background: transparent;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 8px;
}

.page-shell { width: min(1280px, calc(100% - 30px)); margin: 0 auto; padding: 48px 0 90px; }
.scroll-anchor { scroll-margin-top: 86px; }
.hero {
  position: relative;
  overflow: hidden;
  min-height: 240px;
  margin-bottom: 32px;
  padding: 50px 54px;
  color: white;
  background:
    radial-gradient(circle at 90% 10%, rgba(232,200,78,.2), transparent 28%),
    radial-gradient(circle at 8% 110%, rgba(23,124,114,.28), transparent 34%),
    var(--navy);
  border-radius: 28px;
  box-shadow: var(--shadow);
}
.hero::after {
  position: absolute;
  width: 410px;
  height: 410px;
  right: -130px;
  top: -240px;
  content: "";
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 50%;
}
.eyebrow { margin: 0 0 14px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .16em; }
.hero h1 { max-width: none; margin: 0; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(34px, 5vw, 58px); font-weight: 600; line-height: 1.16; letter-spacing: -.05em; word-break: keep-all; text-wrap: pretty; }
.hero p:not(.eyebrow) { max-width: none; margin: 20px 0 0; color: #d2dae7; font-size: 16px; line-height: 1.85; word-break: keep-all; text-wrap: pretty; }
.hero .highlight { color: var(--gold); }
.hero-title-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}
.hero-title-row h1 { flex: 1 1 auto; min-width: 0; }
.page-title-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  padding-top: 6px;
}
.page-title-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 0 13px;
  color: white;
  font-size: 11px;
  font-weight: 900;
  text-decoration: none;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.30);
  border-radius: 10px;
  white-space: nowrap;
}
.page-title-action:hover { background: rgba(255,255,255,.15); }
.page-title-action.sample-action { color: var(--navy); background: var(--gold); border-color: var(--gold); }
.page-title-action.sample-action:hover { background: #f2d96f; border-color: #f2d96f; }
.page-title-action.direct-action { color: white; background: rgba(23,124,114,.82); border-color: rgba(108,203,193,.55); }
.page-title-action.direct-action:hover { background: #177c72; }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 38px 0 16px; }
.section-head > div { min-width: 0; width: 100%; }
.section-head h2, .section-head h3 { margin: 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.section-head p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; word-break: keep-all; text-wrap: pretty; }
.topic-meta span {
  display: inline-flex;
  align-items: center;
  padding: 6px 9px;
  color: #7a5b24;
  font-size: 11px;
  font-weight: 850;
  background: #fff9da;
  border: 1px solid #eadc93;
  border-radius: 999px;
}

.choice-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.choice-button {
  min-height: 48px;
  padding: 9px 10px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 900;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 3px 9px rgba(25,34,56,.035);
}
.choice-button:hover { transform: translateY(-2px); border-color: var(--orange); }
.choice-button.active { color: white; background: var(--orange); border-color: var(--orange); }
.major-row, .difficulty-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
.major-button, .difficulty-button {
  flex: 0 0 auto;
  padding: 10px 14px;
  color: #596478;
  font-size: 12px;
  font-weight: 850;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.major-button.active, .difficulty-button.active { color: white; background: var(--navy-2); border-color: var(--navy-2); }
.difficulty-button.easy.active { background: var(--teal); border-color: var(--teal); }
.difficulty-button.normal.active { background: #a56325; border-color: #a56325; }
.difficulty-button.challenge.active { background: var(--orange); border-color: var(--orange); }


.topic-method-legend { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:-2px 0 16px; padding:12px 14px; color:#5a6476; font-size:11px; line-height:1.6; background:#f8f6f1; border:1px solid #ded8cd; border-radius:11px; }
.topic-method-legend > b { color:var(--navy); font-size:11px; }
.topic-method-legend span { display:inline-flex; align-items:center; gap:4px; }
.topic-method-legend strong { color:#8e472f; }

.topic-list { display: grid; gap: 13px; }
.topic-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(25,34,56,.06);
}
.topic-card:hover { border-color: #d7a493; box-shadow: 0 14px 30px rgba(25,34,56,.1); }

.topic-card.expanded { row-gap: 12px; border-color: #d7a493; }
.topic-card.expanded .topic-card-actions { align-self: end; }
.topic-card-actions { display: grid; gap: 8px; justify-items: stretch; align-self: end; }
.topic-detail-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  min-width: 190px;
  width: 100%;
  padding: 9px 10px 9px 16px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 900;
  text-align: left;
  background: white;
  border: 1px solid #d9d1c4;
  border-radius: 12px;
  box-shadow: none;
}
.topic-detail-toggle:hover { color: var(--orange); border-color: #d7a493; background: #fffaf7; }
.topic-detail-toggle b {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  color: white;
  font-size: 22px;
  line-height: 1;
  background: var(--orange);
  border-radius: 9px;
}
.method-tags { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; margin: 0; }
.method-tag {
  padding: 6px 9px;
  color: #944731;
  font-size: 11px;
  font-weight: 850;
  background: #fff3ed;
  border: 1px solid #efd0c5;
  border-radius: 999px;
}
.method-detail-panel { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line); }
.method-detail-head { margin-bottom: 11px; }
.method-detail-head h4 { margin: 0; font-size: 18px; }
.method-detail-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.method-choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.method-choice {
  position: relative;
  min-height: 180px;
  padding: 16px 16px 42px;
  color: var(--ink);
  text-align: left;
  background: #ffffff;
  border: 2px solid #ded7cc;
  border-radius: 15px;
  box-shadow: 0 5px 14px rgba(25,34,56,.06);
}
.method-choice:hover { transform: translateY(-2px); border-color: #d7a493; box-shadow: 0 9px 20px rgba(25,34,56,.1); }
.method-choice.selected { background: #fffaf7; border-color: var(--orange); box-shadow: 0 8px 18px rgba(191,75,45,.12); }
.method-kind { color: var(--orange); font-size: 11px; font-weight: 950; }
.method-choice h5 { margin: 9px 0 6px; font-size: 16px; line-height: 1.4; }
.method-choice p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.58; word-break: keep-all; }
.method-check {
  position: absolute;
  right: 16px;
  bottom: 15px;
  width: 22px;
  height: 22px;
  border: 2px solid #c8c2b7;
  border-radius: 50%;
}
.method-choice.selected .method-check { border: 7px solid var(--orange); }
.method-start-row { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 12px; }
.method-selection-message { margin-right: auto; color: #8e472f; font-size: 12px; font-weight: 800; }
.selected-method-note { margin: 7px 0 0; color: #705a2a; font-size: 12px; line-height: 1.55; }
.method-process-card { margin: 0 0 22px; padding: 22px; background: #eef8f6; border: 1px solid #c9e3de; border-radius: 18px; }
.method-process-card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.method-process-card h3 { margin: 4px 0 0; font-size: 21px; }
.method-process-card header p { margin: 8px 0 0; color: #4f6866; font-size: 13px; line-height: 1.7; }
.method-process-badge { flex: 0 0 auto; padding: 7px 10px; color: white; font-size: 11px; font-weight: 900; background: var(--teal); border-radius: 999px; }
.method-process-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; margin: 16px 0 0; padding: 0; list-style: none; }
.method-process-steps li { padding: 12px; background: white; border: 1px solid #d7e8e5; border-radius: 11px; }
.method-process-steps b { display: block; margin-bottom: 5px; color: #1f5962; font-size: 12px; }
.method-process-steps span { color: #667573; font-size: 11px; line-height: 1.55; }
@media (max-width: 900px) {
  .method-choice-grid, .method-process-steps { grid-template-columns: 1fr; }
  .method-choice { min-height: 0; }
  .method-start-row { align-items: stretch; flex-direction: column; }
  .method-selection-message { margin-right: 0; }
  .topic-card-actions { justify-items: stretch; }
  .topic-detail-toggle { width: 100%; }
}

.topic-copy h3 { margin: 0; font-size: 18px; line-height: 1.6; word-break: keep-all; text-wrap: pretty; }
.topic-copy p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
.topic-info-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.topic-subjects, .topic-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.topic-meta {
  margin-left: 0;
  justify-content: flex-start;
  flex-wrap: wrap;
}
.topic-meta-label {
  flex: 0 0 auto;
  margin-right: 2px;
  color: #7b8190;
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
}
.topic-subjects span, .topic-meta span {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 5px 9px;
  color: #4f5a6e;
  font-size: 11px;
  font-weight: 850;
  line-height: 1.25;
  background: #f6f3ed;
  border: 1px solid #e2dcd1;
  border-radius: 999px;
  white-space: nowrap;
}
.topic-subjects span {
  color: #315f5a;
  background: #eef8f6;
  border-color: #c9e3de;
}
@media (max-width: 900px) {
  .topic-info-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }
  .topic-subjects, .topic-meta {
    flex-wrap: wrap;
    justify-content: flex-start;
    margin-left: 0;
  }
}
.custom-topic-callout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: center;
  margin-top: 30px;
  padding: 28px 30px;
  color: white;
  background:
    radial-gradient(circle at 95% 10%, rgba(232,200,78,.18), transparent 34%),
    var(--navy);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.custom-topic-kicker { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .06em; }
.custom-topic-copy h2 { margin: 0; color: white; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy > p:not(.custom-topic-kicker) { max-width: none; margin: 10px 0 0; color: #d3dbea; font-size: 13px; line-height: 1.75; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy small { display: block; margin-top: 10px; color: #aeb9ca; font-size: 11px; line-height: 1.65; }
.custom-topic-actions { display: grid; gap: 9px; min-width: 184px; }
.external-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
.custom-topic-callout .secondary-button { color: white; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); }
.custom-topic-callout .sample-guide-button { color: var(--navy); background: var(--gold); border-color: var(--gold); font-weight: 950; }
.custom-topic-callout .sample-guide-button:hover { background: #f2d96f; border-color: #f2d96f; }
.primary-button, .secondary-button, .download-button, .generate-button {
  padding: 12px 16px;
  color: white;
  font-size: 12px;
  font-weight: 900;
  background: var(--orange);
  border: 0;
  border-radius: 11px;
  box-shadow: 0 8px 18px rgba(185,81,57,.2);
  white-space: nowrap;
}
.secondary-button { color: var(--ink); background: white; border: 1px solid var(--line); box-shadow: none; }
.download-button { background: var(--navy); }
.generate-button { background: var(--teal); }

.selected-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;

/* =========================================================
   송도이샘로봇 입장 화면
   - 기존 워크북은 같은 index.html 안에 그대로 유지합니다.
   - 입장 코드는 한국시간 기준 당일 월/일 4자리입니다.
   ========================================================= */
body.access-locked { overflow: hidden; }
body.access-locked #app { display: none !important; }
.access-gate {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: 24px;
  color: #172039;
  background:
    radial-gradient(circle at 82% 12%, rgba(232,200,78,.16), transparent 26%),
    radial-gradient(circle at 10% 92%, rgba(23,124,114,.18), transparent 30%),
    #f3efe7;
}
.access-gate[hidden] { display: none !important; }
.access-gate::before {
  position: absolute;
  inset: 0;
  content: "";
  pointer-events: none;
  background: linear-gradient(rgba(25,34,56,.028) 1px, transparent 1px);
  background-size: 100% 32px;
}
.access-card {
  position: relative;
  width: min(620px, 100%);
  overflow: hidden;
  padding: clamp(34px, 6vw, 58px);
  text-align: center;
  background: #fffdf9;
  border: 1px solid #ddd6ca;
  border-radius: 28px;
  box-shadow: 0 24px 70px rgba(24,32,52,.16);
}
.access-card::after {
  position: absolute;
  width: 300px;
  height: 300px;
  right: -170px;
  top: -185px;
  content: "";
  border: 1px solid rgba(25,34,56,.08);
  border-radius: 50%;
}
.access-kicker {
  margin: 0 0 15px;
  color: #b95139;
  font-size: 11px;
  font-weight: 950;
  letter-spacing: .16em;
}
.access-card h1 {
  margin: 0;
  color: #192238;
  font-family: Georgia, "Noto Serif KR", serif;
  font-size: clamp(29px, 6vw, 46px);
  font-weight: 600;
  line-height: 1.24;
  letter-spacing: -.045em;
}
.access-card h1 strong {
  display: block;
  margin-bottom: 6px;
  color: #177c72;
  font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: .52em;
  font-weight: 950;
  letter-spacing: -.02em;
}
.access-description {
  margin: 20px auto 0;
  max-width: none;
  color: #697184;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.65;
  letter-spacing: -.015em;
  word-break: keep-all;
  white-space: nowrap;
}
.access-form {
  width: min(390px, 100%);
  margin: 30px auto 0;
}
.access-label {
  display: block;
  margin: 0 0 8px;
  color: #404b60;
  font-size: 12px;
  font-weight: 900;
  text-align: left;
}
.access-input-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 9px;
}
.access-code-input {
  width: 100%;
  min-width: 0;
  height: 50px;
  padding: 0 15px;
  color: #192238;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .16em;
  text-align: center;
  background: #fff;
  border: 1px solid #d8d1c5;
  border-radius: 11px;
}
.access-code-input:focus {
  border-color: #177c72;
  box-shadow: 0 0 0 3px rgba(23,124,114,.11);
  outline: none;
}
.access-enter-button {
  min-width: 104px;
  height: 50px;
  padding: 0 18px;
  color: #fff;
  font-size: 13px;
  font-weight: 900;
  background: #192238;
  border: 0;
  border-radius: 11px;
  box-shadow: 0 8px 18px rgba(25,34,56,.14);
}
.access-enter-button:hover { background: #24314d; }
.access-help {
  margin: 10px 0 0;
  color: #8a8490;
  font-size: 11px;
  line-height: 1.55;
}
.access-error {
  min-height: 21px;
  margin: 9px 0 0;
  color: #a43e2b;
  font-size: 12px;
  font-weight: 850;
}
.access-card.is-error { animation: accessShake .26s ease-in-out; }
@keyframes accessShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.access-footer {
  margin: 23px 0 0;
  padding-top: 17px;
  color: #9297a1;
  font-size: 10px;
  border-top: 1px solid #ece5db;
}
@media (max-width: 560px) {
  .access-gate { padding: 14px; }
  .access-card { padding: 34px 21px; border-radius: 22px; }
  .access-description { font-size: 12px; white-space: normal; }
  .access-input-row { grid-template-columns: 1fr; }
  .access-enter-button { width: 100%; }
}
@media print {
  .access-gate { display: none !important; }
}

    function foldDigits(value) {
      let acc = 173;
      for (let i = 0; i < value.length; i += 1) {
        const n = value.charCodeAt(i) - 48;
        if (n < 0 || n > 9) return -1;
        acc = ((acc * 131) ^ ((n + 17) * (i + 29))) >>> 0;
      }
      return acc >>> 0;
    }

    function todaySignature() {
      const { y, m, d } = seoulDateParts();
      const daily = foldDigits(m + d);
      const salt = foldDigits(y.split('').reverse().join(''));
      return ((daily ^ ((salt << 1) >>> 0) ^ 0x5a17c3d9) >>> 0).toString(36);
    }

    function candidateSignature(value) {
      const { y } = seoulDateParts();
      const daily = foldDigits(value);
      const salt = foldDigits(y.split('').reverse().join(''));
      return ((daily ^ ((salt << 1) >>> 0) ^ 0x5a17c3d9) >>> 0).toString(36);
    }

    function unlock() {
      gate.hidden = true;
      document.body.classList.remove('access-locked');
    }

    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 4);
      error.textContent = '';
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (value.length === 4 && candidateSignature(value) === todaySignature()) {
        unlock();
        return;
      }
      error.textContent = '입장 코드가 올바르지 않습니다.';
      card.classList.remove('is-error');
      void card.offsetWidth;
      card.classList.add('is-error');
      input.select();
    });

    requestAnimationFrame(() => input.focus({ preventScroll: true }));
  })();
  </script>

<h3>

<pre>import random
import time
import pandas as pd
import matplotlib.pyplot as plt
import koreanize_matplotlib</pre>
<h3>
Colab 셀 3 — 실험 조건 설정
</h3>
<pre># 탐구할 데이터 개수
data_sizes = [100, 500, 1000, 2000, 3000]

# 각 조건의 반복 횟수
repeat_count = 5

# 결과를 저장할 리스트
results = []

# 같은 조건을 다시 실행할 수 있도록 난수 시작값 고정
random.seed(42)</pre>
<h3>
Colab 셀 4 — 실제 실행시간 측정
</h3>
<pre>for size in data_sizes:

    for repeat in range(repeat_count):

        # 무작위 정수 데이터 생성
        original = [
            random.randint(1, 100000)
            for i in range(size)
        ]

        # -------------------------
        # 1. 버블 정렬
        # -------------------------

        data = original.copy()

        start = time.perf_counter()

        for i in range(len(data) - 1):
            for j in range(len(data) - 1 - i):
                if data[j] &gt; data[j + 1]:
                    data[j], data[j + 1] = data[j + 1], data[j]

        end = time.perf_counter()

        bubble_time = end - start

        results.append([
            size,
            repeat + 1,
            '버블 정렬',
            bubble_time
        ])

        # -------------------------
        # 2. 선택 정렬
        # -------------------------

        data = original.copy()

        start = time.perf_counter()

        for i in range(len(data) - 1):

            min_index = i

            for j in range(i + 1, len(data)):
                if data[j] &lt; data[min_index]:
                    min_index = j

            data[i], data[min_index] = data[min_index], data[i]

        end = time.perf_counter()

        selection_time = end - start

        results.append([
            size,
            repeat + 1,
            '선택 정렬',
            selection_time
        ])

        # -------------------------
        # 3. 삽입 정렬
        # -------------------------

        data = original.copy()

        start = time.perf_counter()

        for i in range(1, len(data)):

            key = data[i]
            j = i - 1

            while j &gt;= 0 and data[j] &gt; key:
                data[j + 1] = data[j]
                j -= 1

            data[j + 1] = key

        end = time.perf_counter()

        insertion_time = end - start

        results.append([
            size,
            repeat + 1,
            '삽입 정렬',
            insertion_time
        ])</pre>
<p>
이 코드에서 중요한 점은
각 반복에서 <code>original</code>이라는 데이터 하나를 만든 뒤
</p>
<pre>data = original.copy()</pre>
<p>
를 사용한다는 것입니다.

<h3>
1. 탐구 동기 및 목적
</h3>
<p>
정보 수업에서 알고리즘은 같은 문제를 해결하더라도
해결 절차에 따라 효율이 달라질 수 있다는 점을 학습하였다.
특히 컴퓨터 프로그램에서는 처리해야 할 데이터가 많아질수록
알고리즘의 효율이 프로그램의 성능에 중요한 영향을 줄 수 있다고 생각하였다.
</p>
<p>
이에 동일한 정렬 문제를 해결하는
버블 정렬, 선택 정렬, 삽입 정렬을 Python으로 직접 구현하고,
정렬할 데이터의 개수를 변화시키면서
실제 실행시간을 측정하고자 하였다.
</p>
<p>
이를 통해 데이터 규모가 증가할 때
세 정렬 알고리즘의 실행시간 차이가 어떻게 변화하는지 분석하고,
알고리즘의 구조와 프로그램 처리 성능 사이의 관계를

</p>
<h3>
2. 연구문제와 가설
</h3>
<h4>
연구문제
</h4>
<p>
정렬할 데이터의 개수가 증가할수록
버블 정렬, 선택 정렬, 삽입 정렬의
실행시간 차이는 어떻게 달라지는가?
</p>
<h4>
가설
</h4>
<p>
정렬할 데이터의 개수가 증가하면
세 정렬 알고리즘의 실행시간도 증가할 것으로 예상하였다.
</p>
<p>
또한 세 알고리즘은
데이터를 비교하고 이동시키는 방법이 서로 다르므로
데이터의 개수가 많아질수록
실제 실행시간에서도 차이가 나타날 가능성이 있다고 예상하였다.
</p>
<p>
다만 실제 실행시간은
프로그램 구현 방식과 실행환경의 영향도 받을 수 있으므로
직접 반복 측정한 결과를 통해 확인하기로 하였다.
</p>
<h3>
3. 이론적 배경
</h3>
<p>
정렬 알고리즘은 여러 데이터를
일정한 기준에 따라 순서대로 배치하는 절차이다.
이번 탐구에서는
버블 정렬, 선택 정렬, 삽입 정렬을 비교한다.
</p>
<p>
버블 정렬은 서로 인접한 두 값을 비교하여
순서가 맞지 않을 경우 위치를 교환하는 과정을 반복한다.
</p>
<p>
선택 정렬은 정렬되지 않은 부분에서
가장 작은 값을 찾아 현재 위치의 값과 교환하는 과정을 반복한다.
</p>
<p>
삽입 정렬은 앞부분의 데이터가 이미 정렬되어 있다고 보고
새로운 값을 알맞은 위치에 삽입하는 방법이다.
</p>
<p>
기본적인 형태의 세 알고리즘은
데이터 개수를 n이라고 할 때
대표적으로 O(n²)의 시간복잡도를 갖는
정렬 방법으로 설명할 수 있다.
</p>
<p>
그러나 시간복잡도가 같다고 해서
실제 실행시간이 항상 동일한 것은 아니다.
</p>
<p>
알고리즘마다 실제 비교 횟수와 값 이동 방식이 다르고,
입력 데이터의 상태,
Python 코드 구조,
컴퓨터 실행환경 등의 영향을 받을 수 있기 때문이다.
</p>

</h3>

<p>

종속변인은 각 정렬 알고리즘의 실행시간이다.
</p>

100개, 500개, 1000개, 2000개, 3000개로 설정한다.

무작위 정수 리스트를 생성한다.
</p>
<p>
알고리즘별 입력 조건이 달라지는 것을 방지하기 위해
하나의 원본 리스트를 생성한 뒤
이를 복사하여
버블 정렬, 선택 정렬, 삽입 정렬에 각각 사용한다.
</p>
<p>
실행시간은 Python의
<code>time.perf_counter()</code>를 이용하여
정렬 코드가 시작되기 직전과 종료된 직후의 시간을 측정하고

itle":"재읽기와 인출 연습 수행 비교","detail":"난이도가 비슷한 짧은 글 2개와 객관식 문항을 준비한다. 재읽기와 인출 연습 조건만 다르게 하고 학습시간·자료 난이도·문항 수·조건 순서를 동일하게 유지한다. 조건 순서는 번갈아 제시하고 자발적 참여만 받고 개인 식별정보는 수집하지 않는다. 즉시·20분 뒤 객관식 정답률을 조건별로 3회 이상 기록해 평균과 결과의 변동 폭을 비교한다. 불편하거나 안전상 문제가 생기면 즉시 중단한다. 학교에서 참여자를 모집한다면 먼저 교사 승인을 받고 학교 지침을 따르며, 언제든 중단할 수 있음을 알린다.","change":"시간 동안 재읽기와 인출 연습 중 어느 방법","measure":"객관식 정답률을 조건별로 3회 이상 기록해 평균과 결과의 변동 폭"},{"kind":"통계 검증","title":"정확도·시간·편차 분석","detail":"조건별 즉시·20분 뒤 객관식 정답률을 익명 번호로 기록한다. 평균뿐 아니라 개인 내 변화와 결과 범위도 함께 계산한다. 연습효과를 확인하기 위해 조건 제시 순서별 결과를 나누어 보고, 차이가 작을 때에는 효과가 있다고 과장하지 않는다.","change":"시간 동안 재읽기와 인출 연습 중 어느 방법","measure":"즉시·20분 뒤 객관식 정답률"},{"kind":"논문·전문자료","title":"인출연습 선행연구 비교","detail":"학술논문·교과서·전문기관 자료 중 재읽기와 인출 연습을 직접 다룬 원문 또는 연구 요약 2~3편을 선정한다. 대상·바꾼 조건·측정값·핵심 결과를 같은 표에 정리하고, 직접 실험이나 모형 결과와 공통점·차이점을 비교한다. 재료·표본·측정환경이 다른 결과는 그대로 합치지 않고 적용 범위를 구분한다.","coreQuestion":"같은 시간 동안 재읽기와 인출 연습 중 어느 방법이 지연검사에 더 효과적일까?","hypothesis":"학습내용을 보지 않고 떠올리는 인출 연습이 재읽기보다 일정 시간 뒤 정답률을 높일 것이다.","change":"자료별 연구 대상·비교 조건","measure":"자료별 측정지표·핵심 결과·적용 범위"}],"focus":"재읽기와 인출 연습","change":"재읽기와 인출 연습 조건","measure":"즉시·20분 뒤 객관식 정답률","controls":"학습시간·자료 난이도·문항 수·조건 순서","resources":"난이도가 비슷한 짧은 글 2개와 객관식 문항","displayKeywords":["인출연습","지연검사"],"subjects":["인간과 심리","확률과 통계"]},{"id":"education-psychology-02","question":"같은 총학습시간도 한 번에 학습하는 것과 나누어 학습하는 것의 기억점수가 다를까?","coreQuestion":"같은 총학습시간도 한 번에 학습하는 것과 나누어 학습하는 것의 기억점수가 다를까?","hypothesis":"중간에 다른 과제를 넣어 학습을 나눈 조건에서 지연검사 점수가 높을 것이다.","course":"인간과 심리·확률과 통계 · 학습·인지·평가","careers":"교육연구·학습설계","sourceHint":"분산학습 집중학습 관련 교육심리 논문·교육통계·전문기관 보고서","levelGuide":"자료의 출처·기간·단위·선정 기준을 밝히고 같은 기준으로 정리한 표·그래프에서 경향과 예외를 함께 해석합니다. 상관관계를 인과관계로 과장하지 않고 자료의 한계를 결론에 포함합니다.","concepts":["기억","학습전략","주의","피드백","인지"],"keywords":["분산학습 집중학습","연속학습과 두 번으로 나눈 학습 20분 뒤 기억 정답률","20분 뒤 기억 정답률 측정 방법","분산학습과 집중학습 자료 비교"],"comparison":["자료의 작성기관","핵심 개념","대표 사례","공통된 설명","자료의 한계"],"methods":[{"kind":"객관적 수행 검사","title":"분산학습과 집중학습 수행 비교","detail":"단어 또는 짧은 사실목록·검사문항을 준비한다. 연속   authDomain: "isaem-robot.firebaseapp.com",
  projectId: "isaem-robot",

};

const FIREBASE_SDK_VERSION = "12.18.0";
const FIREBASE_CLOUD_SAVE_DELAY = 5000;
const INITIAL_URL_PARAMS = new URLSearchParams(location.search);
const INITIAL_RESUME_CODE = String(INITIAL_URL_PARAMS.get("resumeCode") ?? "");
const ADMIN_PREVIEW_MODE = INITIAL_URL_PARAMS.get("adminPreview") === "1";
let firebaseContextPromise = null;
let cloudSaveTimer = null;
let cloudSaveInFlight = false;
let cloudSaveQueued = false;
let cloudSavedAt = null;
let cloudSaveError = "";

function createCloudReportId() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  return `${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
}

function firebaseConfigIsReady() {
  const required = [FIREBASE_CONFIG.apiKey, FIREBASE_CONFIG.projectId, FIREBASE_CONFIG.appId];
  return required.every((value) => {
    const text = String(value ?? "").trim();
    return text && !text.startsWith("PASTE_");
  });
}

async function getFirebaseContext() {
  if (!firebaseConfigIsReady()) return null;
  if (firebaseContextPromise) return firebaseContextPromise;

  firebaseContextPromise = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}`;
    const [appModule, authModule, firestoreModule] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);

    const firebaseApp = appModule.initializeApp(FIREBASE_CONFIG);
    const auth = authModule.getAuth(firebaseApp);
    if (typeof auth.authStateReady === "function") await auth.authStateReady();
    if (!auth.currentUser) await authModule.signInAnonymously(auth);

    return {
      auth,
      db: firestoreModule.getFirestore(firebaseApp),
      doc: firestoreModule.doc,
      getDoc: firestoreModule.getDoc,
      setDoc: firestoreModule.setDoc,
      serverTimestamp: firestoreModule.serverTimestamp,
    };
  })().catch((error) => {
    firebaseContextPromise = null;
    throw error;
  });

  return firebaseContextPromise;
}

function cloudSafeString(value) {
  let text = String(value ?? "");
  // 붙여넣은 이미지가 rich HTML 안에 포함되어 있어도 Firestore에는 저장하지 않습니다.
  text = text.replace(/<img\b[^>]*>/gi, "[이미지 제외]");
  text = text.replace(/data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=\r\n]+/gi, "[이미지 제외]");
  return text;
}

function cloudSafeFields(fields) {
  return Object.fromEntries(
    Object.entries(fields ?? {}).map(([key, value]) => [
      key,
      typeof value === "string" ? cloudSafeString(value) : value,
    ])
  );
}

function cloudStateSnapshot() {
  // Firestore에는 JSON으로 안전하게 직렬화되는 값만 보냅니다.
  // undefined, DOM 객체 등 Firestore가 처리하지 못하는 값이 섞여도
  // 전체 자동저장이 실패하지 않도록 한 번 정리합니다.
  const snapshot = {
    ...state,
    // 저장코드의 원문 표시는 교사용 관리자 화면과 다른 기기 이어쓰기를 위해 함께 저장합니다.
    // 문서 ID로 사용하는 hash 자체는 state 내부에는 중복 저장하지 않습니다.
    resumeCodeHash: undefined,
    researchPhotos: [],
    fields: cloudSafeFields(state.fields),
  };
  return JSON.parse(JSON.stringify(snapshot));
}

function firebaseErrorInfo(error) {
  const rawCode = String(error?.code ?? "").trim();
  const code = rawCode.replace(/^firestore\//, "").replace(/^auth\//, "");
  const message = String(error?.message ?? error ?? "Firebase 저장 오류");

  if (/permission-denied|missing-or-insufficient-permissions/i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 권한 오류", detail: "Firestore 규칙을 확인하세요.", code: rawCode || "permission-denied" };
  }
  if (/unauthenticated|auth\//i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 인증 오류", detail: "Authentication의 익명 로그인을 확인하세요.", code: rawCode || "unauthenticated" };
  }
  if (/failed-precondition/i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 설정 오류", detail: "Firestore 설정 또는 필요한 색인을 확인하세요.", code: rawCode || "failed-precondition" };
  }
  if (/resource-exhausted/i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 사용량 한도", detail: "Firestore 사용량 또는 할당량을 확인하세요.", code: rawCode || "resource-exhausted" };
  }
  if (/unavailable|network|fetch|offline/i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 네트워크 오류", detail: "인터넷 연결 뒤 다시 저장하세요.", code: rawCode || "unavailable" };
  }
  if (/invalid-argument|unsupported field|undefined/i.test(`${rawCode} ${message}`)) {
    return { label: "Firebase 데이터 오류", detail: "저장할 데이터 형식을 확인하세요.", code: rawCode || "invalid-argument" };
  }
  return { label: "Firebase 연결 확인 필요", detail: message, code: rawCode || code || "unknown" };
}

function studentCloudMeta() {
  return {
    grade: String(state.fields?.["student-grade"] ?? "").trim(),
    className: String(state.fields?.["student-class"] ?? "").trim(),
    number: String(state.fields?.["student-number"] ?? "").trim(),
    name: String(state.fields?.["student-name"] ?? "").trim(),
  };
}

function saveStatusText() {
  if (ADMIN_PREVIEW_MODE) return "관리자 보기";
  if (!state.savedAt) return "자동 저장 대기 중";
  if (!firebaseConfigIsReady()) return `저장됨 · ${formatTime(state.savedAt)}`;
  if (cloudSaveInFlight || cloudSaveTimer) return "저장 중…";
  if (cloudSaveError) return cloudSaveError.label || "저장 오류";
  if (cloudSavedAt) return `저장됨 · ${formatTime(cloudSavedAt)}`;
  return "저장 중…";
}

function updateSaveStatus() {
  const label = document.querySelector("#save-status");
  if (label) label.textContent = saveStatusText();
}

async function saveToFirebaseCloud(silent = true) {
  if (!firebaseConfigIsReady() || !hasMeaningfulDraft()) return false;
  if (cloudSaveInFlight) {
    cloudSaveQueued = true;
    return false;
  }

  cloudSaveInFlight = true;
  cloudSaveQueued = false;
  cloudSaveError = "";
  updateSaveStatus();

  try {
    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) throw new Error("Firebase 익명 인증에 실패했습니다.");

    if (!state.cloudReportId) state.cloudReportId = createCloudReportId();
    const uid = ctx.auth.currentUser.uid;
    const selected = typeof workflowSelection === "function" ? workflowSelection() : null;
    const topic = String(
      state.fields?.["draft-topic"] ||
      selected?.topic?.question ||
      ""
    ).trim();

    const payload = {
      schemaVersion: 1,
      ownerUid: uid,
      reportId: state.cloudReportId,
      student: studentCloudMeta(),
      topic,
      currentView: state.view,
      // 교사용 admin.html에서 학생의 저장코드를 확인할 수 있도록 보고서 문서의
      // 최상위 필드에 저장합니다. resume_codes 문서 ID는 계속 SHA-256 해시를 사용합니다.
      resumeCodeLabel: String(state.resumeCodeLabel ?? "").trim(),
      resumeCodeHash: String(state.resumeCodeHash ?? "").trim(),
      updatedAt: ctx.serverTimestamp(),
      updatedAtClient: new Date().toISOString(),
      sourceUrl: location.href,
      state: cloudStateSnapshot(),
    };

    const reportRef = ctx.doc(ctx.db, "users", uid, "reports", state.cloudReportId);
    await ctx.setDoc(reportRef, payload, { merge: true });

    cloudSavedAt = new Date().toISOString();
    cloudSaveError = "";
    // cloudReportId가 처음 생성된 경우 로컬에도 즉시 반영합니다.
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    // 정상 저장 시에는 별도의 팝업을 띄우지 않고 상단 저장 상태만 갱신합니다.
    return true;
  } catch (error) {
    console.error("Firebase cloud save failed:", error);
    cloudSaveError = firebaseErrorInfo(error);
    if (!silent) {
      const codeText = cloudSaveError.code ? ` (${cloudSaveError.code})` : "";
      showToast(`브라우저에는 저장했습니다. ${cloudSaveError.label}: ${cloudSaveError.detail}${codeText}`);
    }
    return false;
  } finally {
    cloudSaveInFlight = false;
    updateSaveStatus();
    // 저장 중에 내용이 다시 바뀌었다면 가장 최신 상태를 한 번 더 저장합니다.
    if (cloudSaveQueued) scheduleFirebaseSave(false, true);
  }
}

function scheduleFirebaseSave(immediate = false, silent = true) {
  if (ADMIN_PREVIEW_MODE) return;
  if (!firebaseConfigIsReady() || !hasMeaningfulDraft()) return;
  cloudSaveQueued = true;
  window.clearTimeout(cloudSaveTimer);
  cloudSaveTimer = window.setTimeout(
    () => {
      cloudSaveTimer = null;
      void saveToFirebaseCloud(silent);
    },
    immediate ? 0 : FIREBASE_CLOUD_SAVE_DELAY
  );
  updateSaveStatus();
}


// ============================================================================
// 저장코드로 이어쓰기
// - 학생이 직접 정한 6~24자 저장코드를 SHA-256으로 해시해 Firestore 문서 ID로 사용합니다.
// - resume_codes 문서 ID에는 원문 대신 SHA-256 해시를 사용합니다. 교사용 보고서 목록에는 확인용 코드 표시값을 저장합니다.
// - 사진은 기존 정책대로 코드 저장에서 제외됩니다.
// - 저장코드를 아는 사람은 해당 보고서를 불러올 수 있으므로 비밀번호처럼 공유하지 않도록 안내합니다.
// ============================================================================
const RESUME_CODE_COLLECTION = "resume_codes";
let resumeCodeBusy = false;

function normalizeResumeCode(value) {
  return String(value ?? "")
    .normalize("NFKC")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();
}

function validResumeCode(value) {
  const code = normalizeResumeCode(value);
  return code.length >= 6 && code.length <= 24;
}

async function resumeCodeHash(value) {
  const code = normalizeResumeCode(value);
  const bytes = new TextEncoder().encode(code);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
}

function closeResumeCodeModal() {
  document.querySelector("#resume-code-modal")?.remove();
}

        <h2 id="resume-code-title">${isLoad ? "저장코드 열기" : (isRecover ? "저장코드 확인" : "저장코드 만들기")}</h2>
        <p>${isLoad
          ? "다른 기기나 브라우저에서 저장한 보고서의 저장코드를 입력하세요."
          : isRecover
            ? "이전 버전에서 코드 연결 정보만 남아 있습니다. 사용하던 저장코드를 한 번만 다시 입력하면 화면과 관리자 페이지에 코드 이름이 표시됩니다."
            : "처음 한 번만 6~24자의 저장코드를 정하세요. 이후에는 같은 코드에 현재 내용이 바로 업데이트됩니다."}</p>
        <label>
          <span class="field-label">저장코드</span>
          <input id="resume-code-input" autocomplete="off" maxlength="24" placeholder="예: 별빛7294">
        </label>
        <p class="input-note">${isRecover ? "기존에 사용하던 저장코드를 정확히 입력하세요." : "저장코드는 다른 사람이 추측하기 어렵게 정하고, 잊지 않도록 따로 기록해 두세요."}</p>
        <div class="modal-actions">
          <button type="button" class="secondary-button" data-close-resume-code>닫기</button>
          ${isLoad
            ? '<button type="button" class="primary-button" data-load-resume-code>열기</button>'
            : isRecover
              ? '<button type="button" class="primary-button" data-recover-resume-code>확인</button>'
              : '<button type="button" class="primary-button" data-save-resume-code>저장</button>'}
        </div>
      </div>
    </div>`);
  window.setTimeout(() => document.querySelector("#resume-code-input")?.focus(), 0);
}

function setResumeCodeButtonsDisabled(disabled) {
  document.querySelectorAll("[data-save-resume-code], [data-load-resume-code], [data-recover-resume-code], [data-save-code], [data-open-code]").forEach((button) => {
    button.disabled = disabled;
  });
}

function loadedStateFromCode(snapshot) {
  const safe = snapshot && typeof snapshot === "object" ? snapshot : {};
  return {
    ...defaultState(),
    ...safe,
    resumeCodeHash: null,
    resumeCodeLabel: String(safe.resumeCodeLabel ?? "").trim(),
    fields: safe.fields && typeof safe.fields === "object" ? safe.fields : {},
    selectedMethods: safe.selectedMethods && typeof safe.selectedMethods === "object" ? safe.selectedMethods : {},
    researchPhotos: [],
    savedAt: new Date().toISOString(),
  };
}

function resumeCodePayload(ctx) {
  const selected = typeof workflowSelection === "function" ? workflowSelection() : null;
  const topic = String(state.fields?.["draft-topic"] || selected?.topic?.question || "").trim();
  return {
    schemaVersion: 1,
    student: studentCloudMeta(),
    topic,
    // 관리자 화면과 이후 접속에서 저장코드 이름을 다시 확인할 수 있도록 원문 표시값을 함께 저장합니다.
    resumeCodeLabel: String(state.resumeCodeLabel ?? "").trim(),
    updatedAt: ctx.serverTimestamp(),
    updatedAtClient: new Date().toISOString(),
    savedByUid: ctx.auth.currentUser.uid,
    state: cloudStateSnapshot(),
  };
}

async function updateLinkedResumeCode({ silent = false } = {}) {
  if (resumeCodeBusy || !state.resumeCodeHash) return false;
  if (!hasMeaningfulDraft()) {
    if (!silent) showToast("먼저 보고서 내용을 작성하세요.");
    return false;
  }
  if (!firebaseConfigIsReady()) {
    if (!silent) showToast("Firebase 설정이 완료되지 않아 저장코드를 사용할 수 없습니다.");
    return false;
  }

  resumeCodeBusy = true;
  setResumeCodeButtonsDisabled(true);
  try {
    saveNow(true);
    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) throw new Error("Firebase 익명 인증에 실패했습니다.");
    const ref = ctx.doc(ctx.db, RESUME_CODE_COLLECTION, state.resumeCodeHash);
    await ctx.setDoc(ref, resumeCodePayload(ctx), { merge: false });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    if (!silent) showToast("저장코드의 내용을 최신 내용으로 업데이트했습니다.");
    return true;
  } catch (error) {
    console.error("Resume-code update failed:", error);
    const errorCode = String(error?.code ?? "");
    if (!silent) {
      showToast(errorCode.includes("permission-denied")
        ? "저장코드 저장 권한이 없습니다. Firestore 규칙을 확인하세요."
        : "저장코드 업데이트에 실패했습니다. Firebase 연결을 확인하세요.");
    }
    return false;
  } finally {
    resumeCodeBusy = false;
    setResumeCodeButtonsDisabled(false);
  }
}

async function startCodeSave() {
  if (state.resumeCodeHash && String(state.resumeCodeLabel ?? "").trim()) {
    await updateLinkedResumeCode({ silent: false });
    return;
  }
  if (state.resumeCodeHash) {
    openResumeCodeModal("recover");
    return;
  }
  openResumeCodeModal("save");
}

async function recoverResumeCodeLabel() {
  if (resumeCodeBusy || !state.resumeCodeHash) return;
  const input = document.querySelector("#resume-code-input");
  const code = normalizeResumeCode(input?.value);
  if (!validResumeCode(code)) {
    showToast("기존 저장코드를 6~24자로 입력하세요.");
    input?.focus();
    return;
  }
  const hash = await resumeCodeHash(code);
  if (hash !== state.resumeCodeHash) {
    showToast("현재 연결된 저장코드와 일치하지 않습니다.");
    input?.focus();
    return;
  }

  resumeCodeBusy = true;
  setResumeCodeButtonsDisabled(true);
  try {
    state.resumeCodeLabel = code;
    state.savedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}

    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) throw new Error("Firebase 익명 인증에 실패했습니다.");
    const ref = ctx.doc(ctx.db, RESUME_CODE_COLLECTION, state.resumeCodeHash);
    await ctx.setDoc(ref, resumeCodePayload(ctx), { merge: true });
    scheduleFirebaseSave(true, true);
    closeResumeCodeModal();
    render();
    showToast("저장코드를 다시 연결했습니다.");
  } catch (error) {
    console.error("Resume-code recovery failed:", error);
    showToast("저장코드 확인 내용을 저장하지 못했습니다. Firebase 연결을 확인하세요.");
  } finally {
    resumeCodeBusy = false;
    setResumeCodeButtonsDisabled(false);
  }
}

async function restoreResumeCodeLabelFromFirebase() {
  if (!state.resumeCodeHash || String(state.resumeCodeLabel ?? "").trim() || !firebaseConfigIsReady()) return false;
  try {
    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) return false;
    const ref = ctx.doc(ctx.db, RESUME_CODE_COLLECTION, state.resumeCodeHash);
    const snap = await ctx.getDoc(ref);
    if (!snap.exists()) return false;
    const label = String(snap.data()?.resumeCodeLabel ?? snap.data()?.state?.resumeCodeLabel ?? "").trim();
    if (!label) return false;
    state.resumeCodeLabel = label;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    const indicator = document.querySelector("#resume-code-indicator");
    if (indicator) indicator.textContent = resumeCodeIndicatorText();
    scheduleFirebaseSave(true, true);
    return true;
  } catch (error) {
    console.warn("저장코드 표시값 자동 복구 실패:", error);
    return false;
  }
}

async function saveByResumeCode() {
  if (resumeCodeBusy) return;
  const input = document.querySelector("#resume-code-input");
  const code = normalizeResumeCode(input?.value);
  if (!validResumeCode(code)) {
    showToast("저장코드는 공백을 제외하고 6~24자로 입력하세요.");
    input?.focus();
    return;
  }
  if (!hasMeaningfulDraft()) {
    showToast("먼저 보고서 내용을 작성하세요.");
    return;
  }
  if (!firebaseConfigIsReady()) {
    showToast("Firebase 설정이 완료되지 않아 저장코드를 사용할 수 없습니다.");
    return;
  }

  resumeCodeBusy = true;
  setResumeCodeButtonsDisabled(true);
  try {
    saveNow(true);
    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) throw new Error("Firebase 익명 인증에 실패했습니다.");

    const hash = await resumeCodeHash(code);
    const ref = ctx.doc(ctx.db, RESUME_CODE_COLLECTION, hash);
    const existing = await ctx.getDoc(ref);
    if (existing.exists()) {
      showToast("이미 사용 중인 저장코드입니다. 다른 코드를 입력하세요.");
      input?.focus();
      return;
    }

    // 저장 전에 먼저 현재 state에 코드 이름을 연결해야 resume_codes 문서에도 표시값이 함께 저장됩니다.
    state.resumeCodeHash = hash;
    state.resumeCodeLabel = code;
    await ctx.setDoc(ref, resumeCodePayload(ctx), { merge: false });
    state.savedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    // 저장코드를 만든 즉시 일반 보고서 백업에도 코드 표시값을 연결해 admin.html에서 확인할 수 있게 합니다.
    scheduleFirebaseSave(true, true);
    closeResumeCodeModal();
    updateSaveStatus();
    const indicator = document.querySelector("#resume-code-indicator");
    if (indicator) indicator.textContent = resumeCodeIndicatorText();
    showToast("저장코드가 설정되었습니다. 이후에는 '저장'을 누르면 같은 코드에 바로 업데이트됩니다.");
  } catch (error) {
    console.error("Resume-code save failed:", error);
    const errorCode = String(error?.code ?? "");
    if (errorCode.includes("permission-denied")) {
      showToast("저장코드 저장 권한이 없습니다. Firestore 규칙에 resume_codes 허용 규칙을 게시하세요.");
    } else {
      showToast("저장코드 저장에 실패했습니다. Firebase 연결을 확인하세요.");
    }
  } finally {
    resumeCodeBusy = false;
    setResumeCodeButtonsDisabled(false);
  }
}

async function loadResumeCodeValue(rawCode, options = {}) {
  if (resumeCodeBusy) return false;
  const {
    skipConfirm = false,
    persistLocal = true,
    scheduleCloud = true,
    writeBackLabel = true,
    showSuccess = true,
  } = options;
  const code = normalizeResumeCode(rawCode);
  if (!validResumeCode(code)) {
    showToast("저장코드는 공백을 제외하고 6~24자로 입력하세요.");
    document.querySelector("#resume-code-input")?.focus();
    return false;
  }
  if (!firebaseConfigIsReady()) {
    showToast("Firebase 설정이 완료되지 않아 저장코드를 사용할 수 없습니다.");
    return false;
  }

  resumeCodeBusy = true;
  setResumeCodeButtonsDisabled(true);
  try {
    const ctx = await getFirebaseContext();
    if (!ctx?.auth?.currentUser) throw new Error("Firebase 익명 인증에 실패했습니다.");

    const hash = await resumeCodeHash(code);
    const ref = ctx.doc(ctx.db, RESUME_CODE_COLLECTION, hash);
    const docSnap = await ctx.getDoc(ref);
    if (!docSnap.exists()) {
      showToast("해당 저장코드로 저장된 보고서를 찾지 못했습니다.");
      return false;
    }

    if (!skipConfirm && hasMeaningfulDraft() && !window.confirm("현재 브라우저에서 작성 중인 내용을 저장코드의 내용으로 바꿀까요?")) return false;

    const data = docSnap.data() ?? {};
    state = loadedStateFromCode(data.state);
    state.resumeCodeHash = hash;
    state.resumeCodeLabel = code;
    if (writeBackLabel) {
      // 이전 버전에서 생성된 resume_codes 문서에도 코드 표시값을 보완합니다.
      await ctx.setDoc(ref, { resumeCodeLabel: code, updatedAtClient: new Date().toISOString() }, { merge: true });
    }
    // 다른 기기나 관리자 미리보기에서 원 소유자의 일반 보고서 문서를 덮어쓰지 않도록 새 연결로 둡니다.
    state.cloudReportId = null;
    resumeVisible = false;
    resumeTargetView = ["draft", "explore", "report", "self"].includes(state.view) ? state.view : "draft";
    if (persistLocal) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }
    closeResumeCodeModal();
    render();
    if (scheduleCloud) scheduleFirebaseSave(true, true);
    if (showSuccess) showToast(ADMIN_PREVIEW_MODE ? `저장코드 ${code}의 워크북을 열었습니다.` : "저장코드의 보고서를 불러왔습니다.");
    return true;
  } catch (error) {
    console.error("Resume-code load failed:", error);
    const errorCode = String(error?.code ?? "");
    if (errorCode.includes("permission-denied")) {
      showToast("저장코드 불러오기 권한이 없습니다. Firestore 규칙에 resume_codes 허용 규칙을 게시하세요.");
    } else {
      showToast("저장코드 불러오기에 실패했습니다. Firebase 연결을 확인하세요.");
    }
    return false;
  } finally {
    resumeCodeBusy = false;
    setResumeCodeButtonsDisabled(false);
  }
}

async function loadByResumeCode() {
  const input = document.querySelector("#resume-code-input");
  return loadResumeCodeValue(input?.value, {
    skipConfirm: false,
    persistLocal: true,
    scheduleCloud: true,
    writeBackLabel: true,
    showSuccess: true,
  });
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value).replaceAll("\n", "&#10;");
}

function cleanQuestion(value) {
  return String(value ?? "")
    .replace(/^(기본 자료 비교|연구 조건 비교|연구 한계 분석):\s*/, "")
    .trim();
}

function activeCategory() {
  return TOPIC_DATA.find((item) => item.id === state.categoryId) ?? TOPIC_DATA[0];
}

function activeMajor() {
  const category = activeCategory();
  return category.majors.find((item) => item.id === state.majorId) ?? category.majors[0];
}

function activeTopic() {
  for (const category of TOPIC_DATA) {
    for (const major of category.majors) {
      const topic = major.topics.find((item) => item.id === state.topicId);
      if (topic) {
        topic.majorLabel = major.label;
        const methodIndex = Number.isInteger(Number(state.methodIndex)) ? Number(state.methodIndex) : 0;
        const method = topic.methods?.[methodIndex] ?? topic.methods?.[0] ?? null;
        return { category, major, topic, method, methodIndex };
      }
    }
  }
  return null;
}

function selectedMethodForTopic(topic) {
  if (!topic?.methods?.length) return null;
  const selected = activeTopic();
  if (selected?.topic.id === topic.id && selected.method) return selected.method;
  const savedIndex = Number(state.selectedMethods?.[topic.id]);
  return Number.isInteger(savedIndex) && topic.methods[savedIndex]
    ? topic.methods[savedIndex]
    : topic.methods[0];
}

function effectiveCoreQuestion(topic) {
  const method = selectedMethodForTopic(topic);
  return String(method?.coreQuestion ?? topic?.coreQuestion ?? topic?.question ?? "").trim();
}

function effectiveHypothesis(topic) {
  const method = selectedMethodForTopic(topic);
  return String(method?.hypothesis ?? topic?.hypothesis ?? "").trim();
}

function methodTypeId(method) {
  const signature = `${method?.kind ?? ""} ${method?.title ?? ""}`;
  // 공공데이터와 학생이 직접 측정·생성한 데이터는 출처와 분석 절차가 다르므로 구분합니다.
  if (/공공데이터|공공 데이터|공공통계|공공 통계/.test(signature)) return "data";
  if (/측정데이터|생성데이터|성능데이터|기술데이터|공개 데이터셋|데이터 분석/.test(signature)) return "analysis";
  if (/논문|사례|자료 검색|자료 비교|전문자료|내용 분석|텍스트|문헌|원문|선행연구|표준|규격|이론|빈도|비율/.test(signature)) return "literature";
  if (/시뮬레이션|코딩|수학 모형|회귀 모형|모델|모형 비교|수학·모형|통계 모형|성능 결과|결정경계|벤치마크|데이터셋/.test(signature)) return "model";
  if (/객관식|시각탐색|인식 실험|검사|통계 검증/.test(signature)) return "objective";
  return "experiment";
}

function customRecommendedKeywords(topicTitle, questionRaw = "") {
  const title = String(topicTitle ?? "").trim();
  const question = String(questionRaw ?? "").trim();
  const context = [
    title,
    question,
    state.fields.final03,
    state.fields.final04,
    state.fields["draft-outline"],
  ].map((value) => String(value ?? "")).join(" ");

  // 현재 샘플처럼 두 성분 비교형 의약품 탐구에서는 실제 검색에 바로 쓸 수 있는
  // 성분명 + 화학 개념 + 임상 근거 조합을 우선 제시합니다.
  if (/아세트아미노펜|acetaminophen|paracetamol/i.test(context)
      && /이부프로펜|ibuprofen/i.test(context)) {
    return [
      "아세트아미노펜 이부프로펜 분자구조 작용기",
      "acetaminophen ibuprofen XLogP pKa",
      "아세트아미노펜 이부프로펜 이온화율 Henderson-Hasselbalch",
      "acetaminophen ibuprofen mechanism of action COX",
      "NICE headache paracetamol NSAID",
    ];
  }

  const stopwords = new Set([
    "어떻게","어떤","무엇","무엇을","왜","얼마나","때문","영향","영향을","관계","관계를","차이","차이는",
    "결과","기준","기준과","연결","연결되는가","나타날까","달라질까","보일까","줄까","할까","인가","있는가",
    "탐구","연구","분석","비교","대해","대한","통해","따라","사용","활용","실제","관련","경우","정도",
  ]);

  const stripParticle = (token) => token
    .replace(/[?？!！,.;:()[\]{}'"“”‘’]/g, "")
    .replace(/(으로|에서|에게|한테|까지|부터|보다|처럼|으로는|에서는|과는|와는|이라|라고|이며|이고|하여|해서)$/g, "")
    .replace(/(과|와|의|은|는|이|가|을|를|에|도|만|로)$/g, "")
    .trim();

  const titleTokens = title.split(/\s+/).map(stripParticle)
    .filter((token) => token.length >= 2 && !stopwords.has(token));
  const contextTokens = context.split(/\s+/).map(stripParticle)
    .filter((token) => token.length >= 2 && !stopwords.has(token));

  const unique = [];
  [...titleTokens, ...contextTokens].forEach((token) => {
    const key = token.toLowerCase();
    if (!unique.some((item) => item.toLowerCase() === key)) unique.push(token);
  });

  const subjects = unique.filter((token) => token.length >= 3).slice(0, 3);
  const base = subjects.slice(0, 2).join(" ") || subjects[0] || "탐구 주제";
  const conceptPool = unique.filter((token) => !subjects.includes(token)).slice(0, 8);
  const c1 = conceptPool[0] || "원리";
  const c2 = conceptPool[1] || "측정";
  const c3 = conceptPool[2] || "조건";

  const suggestions = [
    `${base} ${c1}`,
    `${base} ${c2} ${c3}`,
    `${base} 논문`,
    `${base} 실험 방법`,
    `${base} 데이터 분석`,
  ];
  return suggestions.filter((item, index, arr) => item && arr.indexOf(item) === index);
}

    updateSaveStatus();
    scheduleFirebaseSave(!silent, silent);
    if (!silent) {

        : "현재 기기의 브라우저에 작성 내용을 저장했습니다.");

    return true;
  } catch {

}

function formatTime(value) {
  if (!value) return "아직 저장되지 않음";
  const date = new Date(value);
  return new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit" }).format(date);
}

function formatDateTime(value) {
  if (!value) return "저장 시각 없음";
  return new Intl.DateTimeFormat("ko-KR", {
    year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit",
  }).format(new Date(value));
}

function showToast(message) {
  let toast = document.querySelector("#toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toast";
    toast.className = "toast";
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.hidden = false;
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2400);
}

  if (state.view === "report") content = renderReport();
  if (state.view === "self") content = renderSelfEvaluation();

  if (state.view === "topicSample") content = renderTopicSample();
  app.innerHTML = `${headerHTML()}${content}${resumeVisible ? resumeModal() : ""}`;
  if (state.view === "topicSample") {
    const walker = document.createTreeWalker(app, NodeFilter.SHOW_TEXT);
    const remove = [];
    while (walker.nextNode()) {
      const text = walker.currentNode.nodeValue || "";
      if (/={8,}/.test(text) && /(상단\s*메뉴|소개|대화\s*시작)/.test(text)) remove.push(walker.currentNode);
    }
    remove.forEach((node) => node.remove());
  }
  app.querySelectorAll(".sample-summary-vertical article > b").forEach((node) => {
    node.textContent = String(node.textContent ?? "").replace(/^0(?=\d)/, "");
  });
  updateSelfCount();
  updateSelfSyncNote();
  window.requestAnimationFrame(() => {
    if (!scrollTarget) {
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    window.requestAnimationFrame(() => {
      const target = document.querySelector(scrollTarget);
      if (!target) return;
      const topbarHeight = document.querySelector(".topbar")?.getBoundingClientRect().height ?? 0;
      const targetTop = window.scrollY + target.getBoundingClientRect().top - topbarHeight - 12;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
    });
  });
}

              </div>
            </div>
            <div class="topic-card-actions">
              <div class="method-tags">${topic.methods.map((method) => `<span class="method-tag">${escapeHTML(method.kind)}</span>`).join("")}</div>
              <button type="button" class="topic-detail-toggle" data-toggle-topic="${escapeAttr(topic.id)}" aria-expanded="${expanded}" aria-label="${expanded ? "상세 내용 접기" : "상세 내용 펼치기"}">

            </div>
            ${expanded ? `<div class="method-detail-panel">

            </div>` : ""}

        }).join("")}
      </section>

    ${backToTopHTML()}
    </main>`;
}

function outlineDetail(value, fallback) {
  const text = String(value ?? "").trim();
  if (!text || /탐구 질문에서|선택한 방법에서|선택한 탐구 방법/.test(text)) return fallback;
  return text;
}

function numberedOutline(items) {
  return items.map((item, index) => `5-${index + 1}. ${item}`).join("\n");
}

function topicOutline(topic) {
  return topicOutlineExamples(topic)[0];
}

function draftExamples(topic) {
  const question = cleanQuestion(effectiveCoreQuestion(topic));
  const q = question.replace(/[?？]+$/g, "");
  const concept = topic.concepts[0] ?? "관련 개념";
  const career = String(topic.careers ?? topic.majorLabel ?? "관련 분야").split("·")[0];
  const method = selectedMethodForTopic(topic);
  const profile = methodProfile(method);
  const processText = profile.steps.map(([title, detail], index) => `${index + 1}. ${title}: ${detail}`).join(" → ");
  return {
    "draft-topic": [question, `${method?.title ?? profile.type}: ${question}`, `${q}에 대한 ${profile.type} 탐구`],
    "draft-motivation-purpose": [
      `수업에서 ${withJosa(concept, "을")} 배우면서 ${q}라는 궁금증이 생겼다. 이를 ${method?.title ?? profile.type} 방식으로 확인하여 조건에 따른 결과와 그 원리를 알아보고자 한다.`,
      `생활 속에서 ${withJosa(q, "와")} 관련된 현상을 접했지만 실제 결과가 궁금했다. ${profile.type}의 절차에 따라 근거를 수집하고 예상과 비교하고자 한다.`,
      `${career} 분야에 관심이 있어 실제 문제를 ${method?.kind ?? "탐구"} 방식으로 해결해 보고, 교과 개념이 결과 해석에 어떻게 활용되는지 이해하고자 한다.`,
    ],
    "draft-question-hypothesis": [`핵심 질문: ${q}?\n예상·가설: ${effectiveHypothesis(topic)}`, `핵심 질문: ${q}에서 조건별 결과는 어떤 차이를 보이는가?\n예상·가설: ${effectiveHypothesis(topic)}`, `핵심 질문: ${q}에 대한 결과가 달라지는 조건은 무엇인가?\n예상·가설: 조건과 측정 기준의 차이에 따라 결과의 크기가 달라질 것이다.`],
    "draft-method": [method?.detail ?? profile.planGuide, processText, `${profile.planGuide} 결과는 ${profile.resultGuide}`],
    "draft-outline": topicOutlineExamples(topic),
    "draft-expectation": [`${effectiveHypothesis(topic)} 선택한 ${profile.type}을 통해 예상이 실제 결과와 일치하는지 확인하고, 결과의 적용 범위와 한계를 판단할 수 있을 것이다.`, `이 탐구를 통해 ${method?.kind ?? "탐구"}의 절차와 ${withJosa(concept, "을")} 결과 해석에 적용하는 방법을 익힐 수 있을 것이다.`, `결과가 예상과 다르더라도 반복값·자료 범위·모형의 가정 등 오차 원인을 분석하여 후속 탐구 질문을 찾을 수 있을 것이다.`],
  };
}

function fieldBlock(number, id, title, guide, examples, options = {}) {
  const value = state.fields[id] ?? "";
  const tag = "";
  const anchor = options.anchorId ? ` id="${escapeAttr(options.anchorId)}"` : "";
  const input = options.single
    ? `<input id="${id}" data-field="${id}" value="${escapeAttr(value)}" placeholder="${escapeAttr(options.placeholder ?? "학생이 직접 작성하세요.")}">`
    : `<textarea id="${id}" data-field="${id}" rows="${options.rows ?? 6}" placeholder="${escapeAttr(options.placeholder ?? "학생이 직접 작성하세요.")}">${escapeHTML(value)}</textarea>`;
  return `
    <section class="form-card section-anchor"${anchor}>
      ${number === "" ? "" : `<span class="form-card-number">${escapeHTML(String(number))}.</span>`}
      <h3>${escapeHTML(title)}${tag}</h3>
      <p class="guide">${escapeHTML(guide)}</p>
      ${examples?.length ? `
        <details class="examples">
          <summary>${escapeHTML(options.exampleLabel ?? "예시")}</summary>
          <div class="example-list">
            ${examples.map((text, index) => `<button type="button" class="example-card" data-example-target="${id}" data-example="${escapeAttr(encodeURIComponent(text))}"><b>예시 ${index + 1}</b>${escapeHTML(text)}</button>`).join("")}
          </div>
        </details>` : ""}
      ${input}
      ${examples?.length ? `<p class="input-note">예시를 사용했다면 자신의 경험과 실제 탐구 내용에 맞게 수정하세요.</p>` : ""}
    </section>`;
}

function sanitizeClipHTML(value) {
  const template = document.createElement("template");
  template.innerHTML = String(value ?? "");
  const allowed = new Set(["BR", "DIV", "P", "UL", "OL", "LI", "B", "STRONG", "EM", "IMG"]);
  [...template.content.querySelectorAll("*")].forEach((node) => {
    if (!allowed.has(node.tagName)) {
      node.replaceWith(document.createTextNode(node.textContent ?? ""));
      return;
    }
    [...node.attributes].forEach((attribute) => {
      if (node.tagName === "IMG" && ["src", "alt"].includes(attribute.name)) return;
      node.removeAttribute(attribute.name);
    });
    if (node.tagName === "IMG" && !String(node.getAttribute("src") ?? "").startsWith("data:image/")) node.remove();
  });
  return template.innerHTML;
}

function movePythonSectionState(fromSection, toSection) {
  const fromCount = pythonCellCount(fromSection);
  const toCount = pythonCellCount(toSection);
  for (let cell = 0; cell < toCount; cell += 1) {
    delete state.fields[pythonCodeFieldId(toSection, cell)];
    delete pythonLabResults[pythonResultKey(toSection, cell)];
  }
  for (let cell = 0; cell < fromCount; cell += 1) {
    const fromField = pythonCodeFieldId(fromSection, cell);
    const toField = pythonCodeFieldId(toSection, cell);
    if (Object.prototype.hasOwnProperty.call(state.fields, fromField)) state.fields[toField] = state.fields[fromField];
    else delete state.fields[toField];
    const fromResult = pythonLabResults[pythonResultKey(fromSection, cell)];
    if (fromResult) pythonLabResults[pythonResultKey(toSection, cell)] = fromResult;
    else delete pythonLabResults[pythonResultKey(toSection, cell)];
  }
  ensurePythonCellCounts()[toSection] = fromCount;
}

function deletePythonSectionState(sectionIndex) {
  const count = pythonCellCount(sectionIndex);
  for (let cell = 0; cell < count; cell += 1) {
    delete state.fields[pythonCodeFieldId(sectionIndex, cell)];
    delete pythonLabResults[pythonResultKey(sectionIndex, cell)];
  }
  delete ensurePythonCellCounts()[sectionIndex];
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (globalThis.loadPyodide) { resolve(); return; }
    const existing = [...document.scripts].find((script) => script.src === src);
    if (existing) {
      existing.addEventListener("load", resolve, { once: true });
      existing.addEventListener("error", () => reject(new Error("Python 실행 모듈을 불러오지 못했습니다.")), { once: true });
      return;
    }
    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.onload = resolve;
    script.onerror = () => reject(new Error("Python 실행 모듈을 불러오지 못했습니다."));
    document.head.appendChild(script);
  });
}

async function getPyodideLab(statusLab = null) {
  if (pyodideReadyPromise) return pyodideReadyPromise;
  pyodideReadyPromise = (async () => {
    updatePythonLabStatus("Python 실행 환경을 불러오는 중…", statusLab);
    await loadScriptOnce(`${PYODIDE_BASE_URL}pyodide.js`);
    if (typeof globalThis.loadPyodide !== "function") throw new Error("Pyodide 초기화 함수를 찾지 못했습니다.");
    updatePythonLabStatus("pandas·Matplotlib 등 분석 라이브러리를 준비하는 중…", statusLab);
    const pyodide = await globalThis.loadPyodide({
      indexURL: PYODIDE_BASE_URL,
      packages: PYTHON_PACKAGES,
    });

    // koreanize-matplotlib은 Python 3.14에서 제거된 distutils에 의존하므로
    // 패키지를 import하지 않고, 한글 폰트 파일을 직접 Matplotlib에 등록합니다.
    updatePythonLabStatus("Matplotlib 한글 폰트를 준비하는 중…", statusLab);
    try {
      const fontResponse = await fetch(KOREAN_MATPLOTLIB_FONT_URL, { cache: "force-cache" });
      if (!fontResponse.ok) throw new Error(`한글 폰트 다운로드 실패 (${fontResponse.status})`);
      const fontBytes = new Uint8Array(await fontResponse.arrayBuffer());
      pyodide.FS.writeFile("/tmp/NanumGothic.ttf", fontBytes);
      await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
from matplotlib import font_manager

_font_path = "/tmp/NanumGothic.ttf"
font_manager.fontManager.addfont(_font_path)
_font_name = font_manager.FontProperties(fname=_font_path).get_name()
matplotlib.rcParams["font.family"] = _font_name
matplotlib.rcParams["axes.unicode_minus"] = False
`);
      updatePythonLabStatus("Python 실행 준비 완료 · Matplotlib 한글 표시 가능", statusLab);
    } catch (fontError) {
      console.warn("Matplotlib 한글 폰트 준비 실패", fontError);
      await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
matplotlib.rcParams["axes.unicode_minus"] = False
`);
      updatePythonLabStatus("Python 실행 준비 완료 · 한글 폰트는 불러오지 못했습니다.", statusLab);
    }
    return pyodide;
  })().catch((error) => {
    pyodideReadyPromise = null;
    updatePythonLabStatus("Python 실행 환경을 준비하지 못했습니다.", statusLab);
    throw error;
  });
  return pyodideReadyPromise;
}

function parseOutline() {
  const raw = String(state.fields["draft-outline"] ?? "");
  return raw.split(/\n+/).map((line) => line.trim()).filter(Boolean).slice(0, 30);
}

function reportOutline(topic) {
  if (Array.isArray(state.analysisManualOutline) && state.analysisManualOutline.length) {
    return state.analysisManualOutline
      .map((item) => String(item ?? "").trim())
      .filter(Boolean)
      .slice(0, 30);
  }

  const written = parseOutline();
  let outline;

  if (written.length) {
    outline = [...written];
  } else if (topic?.id === "custom-topic") {
    outline = ["5-1. 분석 내용 1", "5-2. 분석 내용 2", "5-3. 분석 내용 3"];
  } else {
    outline = topicOutline(topic).split("\n");
  }

  const extraCount = Math.max(0, Number(state.analysisExtraCount) || 0);
  for (let index = 0; index < extraCount; index += 1) {
    outline.push(`5-${outline.length + 1}. 새 소제목`);
  }
  return outline;
}

function renumberAnalysisTitle(title, index) {
  const value = String(title ?? "").trim();
  if (!value) return `5-${index + 1}. 분석 내용 ${index + 1}`;

  // 기존에 5-1., 5-2.처럼 번호가 붙어 있던 제목만 새 순서에 맞게 번호를 다시 매깁니다.
  if (/^\s*5\s*[-–—.]\s*\d+/i.test(value)) {
    const clean = stripAnalysisNumber(value).trim();
    return `5-${index + 1}. ${clean || `분석 내용 ${index + 1}`}`;
  }
  return value;
}

function referencesText() {
  const rows = [];
  const referenceCount = Math.max(1, Number(state.referenceCount) || 3);
  for (let index = 1; index <= referenceCount; index += 1) {
    const title = String(state.fields[`ref${index}-title`] ?? "").trim();
    if (!title) continue;
    const author = String(state.fields[`ref${index}-author`] ?? "").trim();
    const year = String(state.fields[`ref${index}-year`] ?? "").trim();
    const url = String(state.fields[`ref${index}-url`] ?? "").trim().replace(/[?&]utm_source=[^&\s]+/g, "");
    rows.push(`${author ? `${author}. ` : ""}${title}${year ? ` (${year})` : ""}${url ? `\n${url}` : ""}`);
  }
  return rows.join("\n\n");
}

function syncReportFromPrevious(force = false) {
  // 이전 버전에서 작성한 초안 내용이 남아 있는 경우에만 새 보고서 초안 항목으로 한 번 옮깁니다.
  const legacyPairs = [
    ["final01", "draft-motivation-purpose"],
    ["final02", "draft-question-hypothesis"],
    ["final04", "draft-method"],
  ];
  legacyPairs.forEach(([target, source]) => {
    const current = String(state.fields[target] ?? "");
    const next = String(state.fields[source] ?? "");
    if (!current.trim() && next.trim()) {
      state.fields[target] = next;
    }
  });
  const legacyOrganizingNotes = String(state.fields["source-organizing-notes"] ?? "").trim();
  if (legacyOrganizingNotes && !String(state.fields["analysis-content-0"] ?? "").trim()) {
    state.fields["analysis-content-0"] = legacyOrganizingNotes;
  }
  const refs = referencesText();
  const previousRefs = String(state.fields["_imported-final08"] ?? "");
  const currentRefs = String(state.fields.final08 ?? "");
  if (force || !currentRefs.trim() || currentRefs === previousRefs) {
    state.fields.final08 = refs;
    state.fields["_imported-final08"] = refs;
  }
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  outline.forEach((title, index) => {
    const target = `analysis-title-${index}`;
    const marker = `_imported-${target}`;
    const previousImport = String(state.fields[marker] ?? "");
    const current = String(state.fields[target] ?? "");
    if (force || !current.trim() || current === previousImport) {
      state.fields[target] = title;
      state.fields[marker] = title;
    }
  });
  saveNow(true);
}

function summarySentenceList(value) {
  const text = String(value ?? "")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
  if (!text) return [];

  // 학생이 작성한 문장을 그대로 활용하기 위해 문장 경계만 나눈다.
  // 마침표·물음표·느낌표 뒤 또는 줄바꿈을 문장 경계로 본다.
  const protectedText = text
    .replace(/(\d)\.(\d)/g, "$1__DECIMAL__$2")
    .replace(/([A-Za-z])\.([A-Za-z])/g, "$1__DOT__$2");
  return protectedText
    .split(/(?<=[.!?。！？])\s+|\n+/)
    .map((sentence) => sentence
      .replace(/__DECIMAL__/g, ".")
      .replace(/__DOT__/g, ".")
      .replace(/\s+/g, " ")
      .trim())
    .filter((sentence) => sentence.length >= 12);
}

function summarySentenceScore(sentence, index, total, keywords = []) {
  const s = String(sentence ?? "");
  let score = 0;
  if (index === 0) score += 2.4;
  if (index === total - 1) score += 1.0;
  if (/\d|%|배|증가|감소|높|낮|차이|비교|비례|반비례|관계|경향|결과|확인|나타|영향|원인|때문|따라/.test(s)) score += 2.2;
  if (/따라서|종합|결론|판단|가설|예상|의미|해석|시사|알 수|확인할 수/.test(s)) score += 2.6;
  if (/한계|제한|어렵|부족|주의|추가|보완|후속/.test(s)) score += 1.8;
  keywords.forEach((keyword) => {
    if (keyword && s.includes(keyword)) score += 1.3;
  });
  // 지나치게 짧은 문장이나 매우 긴 문장은 핵심문장 후보에서 약간 낮춘다.
  if (s.length < 28) score -= 1.0;
  if (s.length > 220) score -= 0.8;
  return score;
}

function selectCoreSentences(value, options = {}) {
  const {
    maxChars = 220,
    maxSentences = 2,
    keywords = [],
    preferFirst = true,
    filter = null,
  } = options;
  let sentences = summarySentenceList(value);
  if (typeof filter === "function") {
    const filtered = sentences.filter(filter);
    if (filtered.length) sentences = filtered;
  }
  if (!sentences.length) return "아직 작성되지 않았습니다.";

  const ranked = sentences.map((sentence, index) => ({
    sentence,
    index,
    score: summarySentenceScore(sentence, index, sentences.length, keywords),
  }));
  if (preferFirst && ranked.length) ranked[0].score += 1.2;
  ranked.sort((a, b) => b.score - a.score || a.index - b.index);

  const selected = [];
  let used = 0;
  for (const item of ranked) {
    if (selected.length >= maxSentences) break;
    const add = item.sentence.length + (selected.length ? 1 : 0);
    if (selected.length && used + add > maxChars) continue;
    // 첫 핵심문장이 예산보다 조금 길더라도 문장 중간을 자르지 않고 그대로 둔다.
    if (!selected.length && item.sentence.length > maxChars * 1.35 && ranked.length > 1) continue;
    selected.push(item);
    used += add;
  }
  if (!selected.length) selected.push(ranked[0]);
  selected.sort((a, b) => a.index - b.index);
  return selected.map((item) => item.sentence).join(" ");
}

function analysisSummaryBlockCount() {
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  let maxIndex = outline.length - 1;

  // 사용자가 5-13처럼 소제목을 많이 추가한 경우에도 현재 작성된 모든 분석 칸을 찾습니다.
  Object.keys(state.fields || {}).forEach((key) => {
    const match = key.match(/^analysis-(?:title|content)-(\d+)$/);
    if (match) maxIndex = Math.max(maxIndex, Number(match[1]));
  });
  return Math.min(30, Math.max(0, maxIndex + 1));
}

function analysisSummaryItems() {
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  const count = analysisSummaryBlockCount();
  const items = [];

  for (let index = 0; index < count; index += 1) {
    const fallbackTitle = outline[index] || `5-${index + 1}. 분석 내용 ${index + 1}`;
    const actualTitle = String(state.fields[`analysis-title-${index}`] ?? fallbackTitle).trim() || fallbackTitle;
    const content = stripAnalysisNumber(state.fields[`analysis-content-${index}`]).trim();
    if (!content) continue;

    const sentences = summarySentenceList(content);
    if (!sentences.length) continue;

    // 각 소제목에서 가장 핵심적인 문장 1개만 선택합니다.
    // 이렇게 하면 특정 소제목이 두 번 반복되는 일을 막고, 5-1~5-13처럼
    // 소제목이 많아도 최신 내용이 각 항목별로 요약에 반영됩니다.
    const ranked = sentences.map((sentence, sentenceIndex) => ({
      sentence,
      sentenceIndex,
      score: summarySentenceScore(sentence, sentenceIndex, sentences.length, [
        "결과", "비교", "평균", "중앙값", "표준편차", "증가", "관계", "가설", "해석", "종합", "결론", "판단"
      ]),
    })).sort((a, b) => b.score - a.score || a.sentenceIndex - b.sentenceIndex);

    items.push({
      blockIndex: index,
      title: actualTitle,
      sentence: ranked[0].sentence,
    });
  }

  if (!items.length) return [];

  // 작성된 모든 분석 소제목을 한 줄씩 반영합니다. 전체 길이 때문에 뒤쪽 소제목이
  // 누락되지 않도록 별도의 글자 수 제한을 두지 않습니다.
  // 요약에서는 소제목과 내용을 한 줄에 붙이지 않고, 보고서처럼
  // 소제목을 먼저 표시한 뒤 다음 줄에 핵심 내용을 배치합니다.
  return items.map((item) => `${item.title}\n${item.sentence}`);
}

function compactSummaryText(value, maxLength, preserveLines = false) {
  const source = String(value ?? "");
  const text = preserveLines
    ? source.split(/\r?\n/).map((line) => line.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n")
    : source.replace(/\s+/g, " ").trim();
  return text || "아직 작성되지 않았습니다.";
}

function summaryCoreQuestion(topic) {
  const raw = String(state.fields.final02 || state.fields["draft-question-hypothesis"] || "").trim();
  const labeled = raw.match(/(?:핵심 질문|연구문제)\s*[:：]?\s*([^\n]+?)(?=\n|예상|가설|$)/);
  if (labeled?.[1]) return labeled[1].trim();
  const question = raw.match(/[^.!。\n]*[?？]/)?.[0]?.trim();
  return question || cleanQuestion(effectiveCoreQuestion(topic));
}

function summaryLimitText() {
  const growth = String(state.fields["self-growth"] ?? "").trim();
  if (growth) {
    return selectCoreSentences(growth, {
      maxChars: 230,

      keywords: ["한계", "배운", "알게", "보완", "추가"],
    });
  }

  // 자기평가서의 '배운 점'을 아직 쓰지 않았다면 보고서의 결론·한계에서
  // 실제 한계에 해당하는 문장만 골라 사용한다. 한계 문장이 없으면 억지로
  // 결론 문장을 반복하지 않는다.
  const conclusionSentences = summarySentenceList(state.fields.final06);
  const limitSentences = conclusionSentences.filter((sentence) =>
    /한계|제한|어렵|부족|일반화|추가|보완|주의|적어|적었|한정|범위|대상|오차|자료 수/.test(sentence)
  );
  if (!limitSentences.length) return "아직 작성되지 않았습니다.";
  return selectCoreSentences(limitSentences.join("\n"), {
    maxChars: 220,
    maxSentences: 2,
    keywords: ["한계", "제한", "어렵", "부족", "일반화", "추가", "보완", "오차"],

}

function summaryValueToText(value) {
  // 분석 결과처럼 소제목+내용으로 이루어진 배열은 항목 사이를 한 줄 띄워
  // 읽기 쉽게 정리합니다.
  if (Array.isArray(value)) return value.join("\n\n");
  return String(value ?? "");
}

function initializeSummaryDraft(force = false) {
  const auto = buildAutoSummarySnapshot();
  if (!auto) return null;

  if (!state.summaryManualEdits || typeof state.summaryManualEdits !== "object" || Array.isArray(state.summaryManualEdits)) {
    state.summaryManualEdits = {};
  }

  let changed = false;
  auto.sections.forEach(([, value], index) => {
    const key = SUMMARY_DRAFT_FIELDS[index];
    const autoText = summaryValueToText(value);
    const manuallyEdited = Boolean(state.summaryManualEdits[key]);

    // 보고서·탐구활동 내용이 바뀌면 자동 요약도 최신 내용으로 갱신한다.
    // 학생이 이 요약 칸을 직접 수정한 경우에는 그 항목만 유지한다.
    if (force || !manuallyEdited) {
      if (String(state.fields[key] ?? "") !== autoText) {
        state.fields[key] = autoText;
        changed = true;
      }
      if (force && state.summaryManualEdits[key]) {
        delete state.summaryManualEdits[key];
        changed = true;
      }
    }
  });

  state.summaryDraftInitialized = true;
  if (changed) scheduleSave();
  return auto;
}

function summarySnapshot() {
  const auto = buildAutoSummarySnapshot();
  if (!auto) return null;

  initializeSummaryDraft(false);

  const titles = auto.sections.map(([title]) => title);
  return {
    ...auto,
    sections: titles.map((title, index) => [
      title,
      String(state.fields[SUMMARY_DRAFT_FIELDS[index]] ?? "").trim() || "아직 작성되지 않았습니다.",
    ]),
  };
}
