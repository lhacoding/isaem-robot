function hasKoreanBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
  if (/\d/.test(last)) return new Set(["0", "1", "3", "6", "7", "8"]).has(last);
  return false;
}

function hasRieulBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  return code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8;
}

function resolveLeadingJosa(value, suffix) {
  const batchim = hasKoreanBatchim(value);
  const text = String(suffix);
  if (text.startsWith("으로") || text.startsWith("로")) {
    const particle = !batchim || hasRieulBatchim(value) ? "로" : "으로";
    return `${particle}${text.slice(text.startsWith("으로") ? 2 : 1)}`;
  }
  const pairs = [
    ["을", "를"],
    ["이", "가"],
    ["은", "는"],
    ["과", "와"],
  ];
  for (const [withBatchim, withoutBatchim] of pairs) {
    if (text.startsWith(withBatchim) || text.startsWith(withoutBatchim)) {
      return `${batchim ? withBatchim : withoutBatchim}${text.slice(1)}`;
    }
  }
  return suffix;
}

function withJosa(value, suffix) {
  return `${value}${resolveLeadingJosa(value, suffix)}`;
}

function updateGuidedJosa(id, value) {
  const suffix = document.querySelector(`[data-josa-for="${CSS.escape(id)}"]`);
  if (!suffix) return;
  suffix.textContent = resolveLeadingJosa(value, suffix.dataset.josaTemplate ?? "");
}

function guidedSelfRow(number, id, title, examples, prefix, suffix) {

  if (!selected) return emptyState("먼저 탐구주제를 작성하세요.", "완성한 보고서를 바탕으로 자기평가서를 작성합니다.");

  // 탐구활동에서 바뀐 참고자료·분석 소제목 등을 최신 보고서 상태로 먼저 맞춘다.
  syncReportFromPrevious(false);
  initializeSummaryDraft(false);

  if (!state.selfOutputCustomized) {
    state.fields["self-output"] = composeSelfEvaluation();
    state.selfOutputNeedsSync = false;
  }
  const items = selfEvaluationItems(selected);
  return `
    <main class="page-shell">

      <div class="workspace-layout">

        ["self-summary", "1. 탐구내용 요약정리"],
        ["self-builder", "2. 자기평가서 내용 채우기"],
        ["self-output", "3. 자기평가서 완성하기"],
        ["self-download", "4. 다운로드"],

      <div class="workspace-content">

        ${items.map((item,index) => guidedSelfRow(index + 1,item.id,item.title,item.examples,item.prefix,item.suffix)).join("")}
      </div></section>
      <section class="form-card section-anchor" id="self-output"><span class="form-card-number">3.</span><h3>자기평가서 완성하기</h3><p class="guide">입력한 항목을 바탕으로 문장을 연결합니다. 첫 문장에는 불필요한 연결어를 붙이지 않고, 앞뒤 내용에 따라 연결 표현을 조정합니다. 완성된 문장은 자신의 실제 활동과 표현에 맞게 다시 다듬어 주세요.</p><div class="report-actions"><button type="button" class="generate-button" data-generate-self>위 항목으로 문장 다시 만들기</button><span class="character-count" id="self-count">0자</span></div><p class="self-sync-note" id="self-sync-note"></p><textarea class="generated-box" data-field="self-output" rows="11" placeholder="위의 빈칸을 채우면 자기평가서가 자동으로 만들어집니다.">${escapeHTML(state.fields["self-output"] ?? "")}</textarea></section>

            <h4>요약정리·자기평가서 다운로드</h4>
            <div class="download-choice-buttons">
              <button type="button" class="download-button" data-download-self-word>Word (.docx)</button>
              <button type="button" class="download-button hwpx-download-button" data-download-self-hwpx>한글 (.hwpx)</button>
            </div>
          </div>
        </div>
      </section>
      </div>
      </div>
    ${backToTopHTML()}
    </main>`;
}

function renderSampleLegacy() {
  return `
    <main class="page-shell">
      <section class="hero sample-hero"><p class="eyebrow">MODEL REPORT · SAMPLE</p><h1>두통이 있을 때 아세트아미노펜과 이부프로펜 중 <span class="highlight">어떤 성분을 선택해야 할까?</span></h1><p>작용·효과·안전성에 따른 선택 기준 탐구</p></section>
      <nav class="sample-toc" aria-label="보고서 예시 목차"><a href="#sample-plan">1. 보고서 초안</a><a href="#sample-search">2. 자료 검색</a><a href="#sample-analysis">3. 자료 비교</a><a href="#sample-report">4. 완성 보고서</a><a href="#sample-self">5. 자기평가서</a></nav>

      <details class="sample-section" id="sample-plan"><summary>01. 보고서 초안 예시</summary><div class="sample-body">
        <h3>1. 탐구 주제</h3><blockquote>두통이 있을 때 아세트아미노펜과 이부프로펜 중 어떤 성분을 선택해야 할까?</blockquote>
        <h3>2. 탐구 동기 및 목적</h3><blockquote>일상에서 두통이 생겼을 때 두 성분이 모두 사용되지만 차이를 알지 못한 채 제품 이름만 보고 선택하는 경우가 많다. 작용 원리, 진통 효과, 부작용과 주의사항을 논문과 공공기관 자료로 비교하여 특정 성분이 항상 우수한지, 개인의 상태와 두통 특성에 따라 기준이 달라지는지 알아보고자 한다.</blockquote>
        <h3>3. 핵심 질문 및 예상·가설</h3><blockquote><b>핵심 질문:</b> 두 성분은 작용 원리, 두통 완화 효과, 안전성에서 어떤 차이를 보이며 성분 선택 시 무엇을 고려해야 하는가?<br><b>예상·가설:</b> 이부프로펜은 일부 조건에서 빠른 진통 효과를 보일 수 있지만 위장과 신장 관련 주의사항이 많고, 아세트아미노펜은 항염 작용은 약하지만 과다복용 시 간 손상 위험이 중요한 기준이 될 것으로 예상한다.</blockquote>
        <h3>4. 자료 조사 및 비교 계획</h3><blockquote>긴장형 두통을 대상으로 한 체계적 문헌고찰, 임상시험, 공공기관 의약품 정보를 찾는다. 작용 원리, 연구 대상, 복용 후 2시간 통증 소실률, 부작용, 복용 시 주의사항을 같은 기준으로 비교한다. 블로그나 제품 광고는 주요 근거에서 제외하고 원문을 직접 확인한다.</blockquote>
        <h3>5. 예상 목차</h3><ol><li>두통과 진통제 선택의 필요성</li><li>아세트아미노펜과 이부프로펜의 특징</li><li>두 성분의 작용 원리 비교</li><li>긴장형 두통 완화 효과 비교</li><li>부작용과 복용 시 주의사항 비교</li><li>개인의 상태에 따른 선택 기준</li><li>결론 및 탐구의 한계</li></ol>
        <h3>6. 예상 결과와 기대 효과</h3><blockquote>한 성분이 모든 사람에게 항상 더 적합하다는 결론보다 두통 유형, 개인 질환, 함께 복용하는 약과 부작용 위험에 따라 기준이 달라진다는 결과가 나올 것으로 예상한다.</blockquote>
      </div></details>

      <details class="sample-section" id="sample-search"><summary>02. 자료 검색과 선정 예시</summary><div class="sample-body">
        <h3>추천 검색어</h3><ul><li>아세트아미노펜 이부프로펜 두통 비교</li><li>긴장형 두통 2시간 통증 소실률</li><li>이부프로펜 NSAID 위장 신장 부작용</li><li>아세트아미노펜 과다복용 간 손상</li><li>acetaminophen versus ibuprofen tension-type headache</li></ul>
        <h3>자료 선정 기준</h3><p>체계적 문헌고찰·무작위 대조 임상시험·공공기관 자료를 우선한다. 연구 대상의 나이와 두통 유형, 사용한 성분과 조건, 효과 측정시간, 핵심 결과, 부작용, 연구 한계를 확인한다.</p>
        <h3>선정한 핵심 자료</h3><ol><li><a href="https://www.cochrane.org/evidence/CD011889_oral-paracetamol-treatment-acute-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－아세트아미노펜과 급성 긴장형 두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011474_oral-ibuprofen-acute-treatment-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－이부프로펜과 급성 긴장형 두통</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10940094/" target="_blank" rel="noopener">PubMed－두 성분 직접 비교 임상시험</a></li><li><a href="https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen" target="_blank" rel="noopener">FDA－아세트아미노펜 안전정보</a></li><li><a href="https://www.nhs.uk/medicines/nsaids/" target="_blank" rel="noopener">NHS－NSAID 안전정보</a></li></ol>
      </div></details>

      <details class="sample-section" id="sample-analysis"><summary>03. 자료 비교 및 해석 예시</summary><div class="sample-body">
        <h3>효과 자료 비교</h3>
        <table><thead><tr><th>비교 항목</th><th>아세트아미노펜 연구</th><th>이부프로펜 연구</th></tr></thead><tbody><tr><td>포함된 전체 참여자</td><td>8,079명</td><td>3,094명</td></tr><tr><td>2시간 뒤 통증 소실</td><td>24명/100명</td><td>23명/100명</td></tr><tr><td>위약군 통증 소실</td><td>19명/100명</td><td>16명/100명</td></tr><tr><td>약물로 인한 추가 효과</td><td>약 5명/100명</td><td>약 7명/100명</td></tr><tr><td>주요 해석</td><td>효과는 있었지만 크지 않음</td><td>소수에게 추가 효과</td></tr></tbody></table>
        <p>두 수치는 서로 다른 연구에서 얻었고 참여자와 위약 반응도 다르므로 24%와 23%만 보고 우열을 판단할 수 없다. 직접 비교한 한 연구에서는 특정 액상형 이부프로펜의 통증 완화 시작이 더 빨랐지만, 표본과 제형이 제한되어 모든 제품에 일반화하기 어렵다.</p>
        <h3>안전성 비교</h3><table><thead><tr><th>항목</th><th>아세트아미노펜</th><th>이부프로펜</th></tr></thead><tbody><tr><td>분류</td><td>해열진통제</td><td>비스테로이드성 소염진통제</td></tr><tr><td>중요 위험</td><td>과다·중복복용에 따른 간 손상</td><td>위장 출혈·궤양, 신장·심혈관계 문제</td></tr><tr><td>확인할 조건</td><td>간질환, 다른 동일성분 제품</td><td>위장·신장·심혈관질환, 다른 NSAID</td></tr></tbody></table>
        <h3>종합 해석</h3><p>성분 선택은 단순한 효과 순위가 아니라 두통 유형·연령·기존 질환·복용 중인 약과 각 성분의 위험을 함께 판단하는 문제였다. 주요 연구가 성인을 대상으로 했으므로 청소년에게 그대로 적용할 수 없다는 한계도 확인하였다.</p>
      </div></details>

      <details class="sample-section" id="sample-report"><summary>04. 완성 보고서 예시</summary><div class="sample-body">
        <h3>01. 탐구 동기 및 목적</h3><blockquote>두통약은 쉽게 구할 수 있지만 같은 두통약이라도 주성분과 주의사항이 다르다. 특히 아세트아미노펜과 이부프로펜은 모두 통증 완화에 사용되지만 작용 원리와 안전성에 차이가 있다. 따라서 제품 이름이 아닌 성분과 연구 근거를 바탕으로 두 성분의 선택 기준을 알아보고자 하였다.</blockquote>
        <h3>02. 연구문제와 가설</h3><blockquote>핵심 연구문제는 두 성분이 작용 원리, 긴장형 두통 완화 효과, 안전성에서 어떤 차이를 보이는지 확인하는 것이다. 이부프로펜은 일부 조건에서 빠른 효과를 보일 수 있지만 NSAID 관련 주의사항이 많고, 아세트아미노펜은 위장 관련 부담은 상대적으로 적지만 과다·중복복용에 따른 간 손상 위험이 중요한 기준이 될 것으로 예상하였다.</blockquote>
        <h3>03. 이론적 배경</h3><p>이부프로펜은 비스테로이드성 소염진통제(NSAID)로 사이클로옥시게나제와 프로스타글란딘 생성 과정을 억제하여 진통·해열·항염 작용을 나타낸다. 아세트아미노펜도 진통과 해열에 사용되지만 항염 효과는 상대적으로 약하며 정확한 작용기전에는 아직 완전히 밝혀지지 않은 부분이 있다. 따라서 두 성분은 모두 통증을 줄이지만 약리작용과 안전성에서 차이가 나타날 수 있다.</p>
        <h3>04. 탐구 방법</h3><p>성인의 급성 긴장형 두통을 대상으로 한 체계적 문헌고찰과 무작위 대조 임상시험을 우선 선정하였다. 안전성은 FDA와 NHS 등 공공기관 자료를 활용하였다. 자료마다 연구 대상, 두통 유형, 약물과 제형, 측정시간, 통증 소실률, 부작용, 연구의 한계를 같은 표에 기록하였다. 서로 다른 연구의 수치를 단순 순위로 비교하지 않고 위약 대비 추가 효과와 연구 조건을 함께 해석하였다.</p>
        <h3>05. 분석 결과 및 해석</h3>
        <h4>5-1. 두통과 진통제 선택의 필요성</h4><p>두통은 원인과 유형이 다양하며 조사 자료의 주요 대상인 긴장형 두통과 편두통도 구분해야 한다. 따라서 ‘두통’이라는 증상만으로 한 성분을 일괄 선택하는 것은 적절하지 않다. 이번 탐구에서는 비교 범위를 성인의 급성 긴장형 두통으로 좁히고, 효과뿐 아니라 복용자의 상태와 안전성까지 선택 기준에 포함하였다.</p>
        <h4>5-2. 아세트아미노펜과 이부프로펜의 특징</h4><p>두 성분 모두 진통·해열 목적으로 사용되지만 이부프로펜은 NSAID에 속해 항염 작용을 함께 나타내고, 아세트아미노펜의 항염 효과는 상대적으로 약하다. 즉 같은 ‘두통약’으로 판매되더라도 약의 분류와 주의해야 할 신체 기관이 같지 않았다. 제품명보다 주성분과 다른 복합 성분의 포함 여부를 확인해야 하는 이유가 여기에 있다.</p>
        <h4>5-3. 두 성분의 작용 원리 비교</h4><p>이부프로펜은 프로스타글란딘 생성에 관여하는 효소 경로를 억제해 통증·열·염증 반응을 줄인다. 아세트아미노펜은 중추에서 진통과 해열 효과를 나타내는 것으로 알려져 있으나 정확한 기전에는 아직 설명되지 않은 부분이 있다. 작용 원리가 다르다는 사실만으로 실제 두통 완화 효과의 우열을 확정할 수는 없으므로 임상 결과를 따로 확인하였다.</p>
        <h4>5-4. 긴장형 두통 완화 효과 비교</h4><p>아세트아미노펜에 관한 Cochrane 고찰은 23개 연구 8,079명을 포함했고, 2시간 뒤 통증이 사라진 사람은 약물군 100명 중 24명, 위약군 19명이었다. 이부프로펜 고찰은 12개 연구 3,094명을 포함했으며 약물군 23명, 위약군 16명이 2시간 뒤 통증 소실을 보였다. 따라서 위약보다 추가로 효과를 얻은 사람은 각각 약 5명과 7명 수준이었다. 그러나 두 수치는 서로 다른 연구 집단과 조건에서 산출되었기 때문에 24%와 23%만 비교하여 아세트아미노펜이 더 낫다고 말할 수 없다. 성인 154명의 직접 비교 연구에서는 특정 액상형 이부프로펜이 아세트아미노펜보다 통증 완화를 더 빨리 시작했지만, 작은 표본과 특정 제형에 한정된 결과이므로 모든 제품과 사람에게 일반화하기 어렵다.</p>
        <h4>5-5. 부작용과 복용 시 주의사항 비교</h4><p>FDA 자료에서는 아세트아미노펜을 권장량보다 많이 복용하거나 동일 성분이 포함된 여러 제품을 함께 복용할 때 심각한 간 손상이 발생할 수 있다고 안내한다. 이부프로펜과 같은 NSAID는 위장 출혈·궤양, 신장 문제, 심혈관계 위험 등을 확인해야 하며 기존 질환과 병용약에 따라 주의가 필요하다. 그러므로 ‘아세트아미노펜은 안전하고 이부프로펜은 위험하다’는 식의 단순 구분은 근거에 맞지 않았다.</p>
        <h4>5-6. 개인의 상태에 따른 선택 기준</h4><p>선택 전에는 두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약, 같은 성분의 중복 여부를 확인해야 한다. 위장·신장 관련 위험이 있는 사람과 간 손상 위험이 있는 사람에게 필요한 판단 기준은 서로 다르다. 따라서 실제 선택과 용량은 제품 설명서를 확인하고 청소년은 보호자·약사·의료전문가와 상의해야 한다.</p>
        <h4>5-7. 결론으로 이어지는 해석과 탐구의 한계</h4><p>‘이부프로펜은 일부 조건에서 더 빠를 수 있다’는 예상은 특정 직접 비교 연구에서는 지지되었다. 반면 아세트아미노펜이 항상 더 안전할 것이라는 예상은 간 손상과 중복복용 위험 때문에 수정해야 했다. 조사한 핵심 연구가 성인을 대상으로 했고 서로 다른 연구의 결과를 간접 비교했으며, 두통 유형과 제형도 제한되어 있다는 점이 최종 결론의 범위를 제한한다.</p>
        <h3>06. 결론 및 한계</h3><blockquote>두 성분 모두 성인의 급성 긴장형 두통 완화에 도움이 될 수 있지만 한 성분이 모든 사람에게 항상 더 적합하다고 결론 내리기는 어려웠다. 두통의 유형, 연령, 기존 질환, 복용 중인 약, 각 성분의 부작용 위험과 제품 설명서를 함께 고려해야 한다. 또한 주요 연구가 성인을 대상으로 했고 서로 다른 연구 조건을 간접 비교했으므로 결과를 청소년에게 그대로 적용할 수 없다는 한계가 있다.</blockquote>
        <h3>07. 후속 탐구 계획</h3><blockquote>후속 탐구에서는 긴장형 두통과 편두통을 구분하여 두 성분의 효과를 비교하고, 정제와 액상형 연질캡슐 등 제형 차이가 약효가 나타나는 시간에 미치는 영향을 조사하고자 한다. 청소년을 대상으로 한 연구가 충분한지도 추가로 확인할 필요가 있다.</blockquote>
        <h3>08. 참고자료 및 출처</h3><ol><li><a href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6557" target="_blank" rel="noopener">질병관리청 국가건강정보포털－편두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011889_oral-paracetamol-treatment-acute-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－아세트아미노펜과 급성 긴장형 두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011474_oral-ibuprofen-acute-treatment-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－이부프로펜과 급성 긴장형 두통</a></li><li><a href="https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen" target="_blank" rel="noopener">FDA－아세트아미노펜 안전정보</a></li><li><a href="https://www.nhs.uk/medicines/nsaids/" target="_blank" rel="noopener">NHS－NSAID 안전정보</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10940094/" target="_blank" rel="noopener">PubMed－두 성분 직접 비교 임상시험</a></li></ol>

      <details class="sample-section" id="sample-self"><summary>05. 자기평가서 예시</summary><div class="sample-body">
        <h3>항목별 작성</h3><p><b>탐구 계기:</b> 두통약마다 성분과 주의사항이 다른 이유가 궁금하여 탐구를 시작하였다.</p><p><b>탐구 질문:</b> 두 성분은 효과와 안전성에서 어떤 차이를 보이며 무엇을 고려해야 하는지 확인하였다.</p><p><b>탐구 과정:</b> 체계적 문헌고찰·임상시험·공공기관 자료를 찾아 연구 대상과 조건을 확인하고 같은 기준으로 비교하였다.</p><p><b>탐구 결과:</b> 두 성분 모두 도움이 될 수 있지만 효과와 위험 조건이 달라 하나를 항상 우수하다고 판단할 수 없었다.</p><p><b>성장과 성찰:</b> 수치뿐 아니라 연구 대상·측정방법·한계를 함께 해석하고 예상과 다른 근거도 검토하는 능력이 향상되었다.</p>
        <h3>완성된 자기평가서</h3><blockquote>두통약마다 성분과 주의사항이 다른 이유가 궁금하여 아세트아미노펜과 이부프로펜의 효과와 안전성을 비교하였다. 체계적 문헌고찰과 임상시험, 공공기관 자료에서 연구 대상과 조건을 확인하고 동일한 기준으로 결과를 정리하였다. 두 성분 모두 긴장형 두통 완화에 도움이 될 수 있지만 효과와 위험 조건이 달라 하나를 항상 우수하다고 판단할 수 없었다. 이 과정에서 수치뿐 아니라 연구 조건과 한계를 함께 해석하고 예상과 다른 근거도 검토하는 능력이 향상되었다.</blockquote>

      if (!word) return;
      if (current && `${current} ${word}`.length <= limit) {
        current += ` ${word}`;
        return;
      }
      if (current) {
        rows.push(current);
        current = "";
      }
      if (word.length <= limit) {
        current = word;
        return;
      }
      let rest = word;
      while (rest.length > limit) {
        rows.push(rest.slice(0, limit));
        rest = rest.slice(limit);
      }
      current = rest;

    nodes.push(`<rect class="mapr-main-${color}" height="${branch.height}" rx="10" width="205" x="268" y="${mainTop}"></rect>`);
    nodes.push(`<circle cx="289" cy="${mainTop + 18}" fill="#ffffff28" r="12"></circle>`);
    nodes.push(`<text class="mapr-main-text" text-anchor="middle" x="289" y="${mainTop + 22}">${branch.no}</text>`);
    nodes.push(svgText(branch.titleRows, 310, branch.center, "mapr-main-text", 16));

    branch.groups.forEach((group) => {
      const subTop = group.center - group.height / 2;
      connectors.push(`<path class="mapr-line-${color}" d="M 488 ${group.center} H 503"></path>`);
      connectors.push(`<path class="mapr-line-${color}" d="M 643 ${group.center} H 653 V ${group.leaves[0].center} V ${group.leaves.at(-1).center}"></path>`);
      nodes.push(`<rect class="mapr-sub-${color}" height="${group.height}" rx="7" width="140" x="503" y="${subTop}"></rect>`);
      nodes.push(svgText(group.rows, 513, group.center, "mapr-sub-text"));
      group.leaves.forEach((leaf) => {
        connectors.push(`<path class="mapr-line-${color}" d="M 653 ${leaf.center} H 668"></path>`);
        nodes.push(`<rect class="mapr-leaf" height="${leaf.height}" rx="6" width="310" x="668" y="${leaf.top}"></rect>`);
        nodes.push(svgText(leaf.rows, 678, leaf.center, "mapr-leaf-text"));
      });
    });
  });

  const rootTop = rootCenterY - 49;
  const root = `<rect class="mapr-root" height="98" rx="10" width="210" x="18" y="${rootTop}"></rect>${svgText(["두통약 주요 성분","(아세트아미노펜·","이부프로펜)","비교 분석"],32,rootCenterY,"mapr-root-text",18)}`;

          <section><h3>4. 자료 수집 기준 및 비교 방법</h3>
            <p>아세트아미노펜과 이부프로펜의 구조 및 물리·화학적 성질은 PubChem에서 확인하였다. 작용 기전은 Ohashi와 Kohno의 리뷰 논문과 NCBI Bookshelf의 Ibuprofen 자료를 활용하였고, 두통 치료에서의 적용은 NICE 진료지침을 확인하였다. 안전성은 FDA 자료를 참고하였다.</p>
            <p>자료는 두 성분 모두에 동일하게 적용할 수 있도록 ① 분자구조와 작용기, ② 극성 및 친유성, ③ pKa와 이온화 특성, ④ COX·프로스타글란딘과 관련된 작용 기전, ⑤ 두통 치료에서의 적용 및 주의점이라는 다섯 가지 기준으로 분류하였다. pH에 따른 이온화 정도는 동일한 pH 조건을 설정하고 Henderson-Hasselbalch 관계를 이용하여 계산하였다. 또한 XLogP와 pKa의 출처를 확인하고, 물리·화학적 성질만으로 실제 치료 효과나 흡수 정도를 직접 단정하지 않도록 약리학적 자료와 진료지침을 함께 비교하였다.</p>
          </section>

          <section><h3>5. 분석 결과 및 해석</h3>
            <h4>5-1. 분자구조와 작용기의 차이</h4>
            <p>아세트아미노펜과 이부프로펜의 분자구조와 물리·화학적 특성을 비교한 결과 두 성분 사이에는 뚜렷한 차이가 확인되었다. PubChem에서 아세트아미노펜의 분자식은 C₈H₉NO₂, 분자량은 151.16 g/mol이고, 이부프로펜의 분자식은 C₁₃H₁₈O₂, 분자량은 206.28 g/mol로 확인하였다. 아세트아미노펜에는 페놀성 수산기와 아마이드가 존재하는 반면 이부프로펜에는 카복실산 작용기가 존재한다. 따라서 두 물질의 산·염기 성질과 분자 간 상호작용이 서로 다를 것으로 해석하였다.</p>

            <h4>5-2. 친유성과 수소결합 특성 비교</h4>
            <p>두 성분의 친유성을 비교하기 위해 PubChem의 계산값인 XLogP3를 확인하였다. 아세트아미노펜은 0.5, 이부프로펜은 3.5로 나타났다. XLogP가 큰 물질일수록 중성 상태에서 상대적으로 친유성 성격이 크다는 점을 고려하면 이부프로펜이 아세트아미노펜보다 상대적으로 친유성이 큰 구조적 특징을 갖는 것으로 해석할 수 있다. 아세트아미노펜의 수소결합 donor와 acceptor 수는 각각 2개와 2개이고, 이부프로펜은 각각 1개와 2개였다. 이러한 결과를 통해 두 성분의 구조적 차이가 극성 및 주변 분자와의 상호작용 차이에 영향을 줄 수 있음을 확인하였다. 다만 XLogP는 실제 체내 흡수율 자체를 나타내는 값이 아니므로 이 값만으로 약물 흡수 정도를 판단하지 않았다.</p>

            <h4>5-3. pKa와 pH에 따른 이온화율 비교</h4>
            <p>다음으로 산·염기 평형 개념을 적용하여 두 물질의 이온화 정도를 비교하였다. 아세트아미노펜의 pKa는 9.38을 사용하였으며, 이부프로펜은 PubChem에 여러 출처의 pKa가 제시되어 있어 그중 ChEMBL에서 제시한 acidic pKa 4.45를 계산 기준으로 사용하였다. Henderson-Hasselbalch 관계를 이용하여 pH 2에서 계산한 이온화율은 아세트아미노펜이 약 0.0000042%, 이부프로펜이 약 0.354%였으며, pH 7.4에서는 각각 약 1.04%와 99.89%였다.</p>

            <h4>5-4. 이온화율 차이에 대한 화학적 해석</h4>
            <p>이 계산에서 특히 pH 7.4에서 큰 차이가 나타났다. 아세트아미노펜은 계산상 대부분 비이온화 상태로 존재하는 반면 이부프로펜은 대부분 이온화된 형태로 존재한다. 이는 이부프로펜의 카복실산 작용기가 아세트아미노펜의 페놀성 수산기보다 산성도가 크기 때문에 나타나는 차이로 해석할 수 있다. 따라서 교과에서 학습한 작용기와 산·염기 평형 개념이 실제 의약품 분자의 화학적 상태를 설명하는 데 적용될 수 있음을 확인하였다. 그러나 이온화율만으로 실제 약물의 흡수율이나 진통 효과를 직접 예측할 수는 없으며, 용해도, 친유성, 약의 제형, 막 투과성 및 대사 등의 요인도 함께 고려해야 한다.</p>

            <h4>5-5. 아세트아미노펜과 이부프로펜의 작용 기전 비교</h4>
            <p>작용 기전을 비교한 결과에서도 차이가 나타났다. 이부프로펜은 NSAID로서 COX-1과 COX-2 경로를 억제하여 프로스타글란딘 생성을 감소시키며, 이러한 과정이 진통·해열·항염증 작용과 연결된다. 반면 아세트아미노펜의 정확한 진통 기전은 완전히 규명되지 않았다. 관련 리뷰 논문에서는 기존의 COX 관련 기전뿐 아니라 아세트아미노펜의 대사산물인 AM404가 TRPV1 및 CB1과 관련된 중추 신경계의 통증 조절 과정에 관여할 가능성이 제시되어 있다. 따라서 두 약은 모두 통증을 줄이는 데 사용할 수 있지만 동일한 화학적·약리학적 과정을 통해 작용한다고 볼 수는 없다.</p>

            <h4>5-6. 두통 치료제 선택 기준과 안전성 해석</h4>
            <p>마지막으로 이러한 화학적·약리학적 차이가 실제 두통 치료에서 어떻게 연결되는지 확인하였다. NICE의 두통 진료지침에서는 긴장형 두통의 급성 치료에서 paracetamol 또는 NSAID 등을 선택할 수 있도록 하고 있으며, 환자의 동반 질환과 부작용 위험 등을 함께 고려하도록 제시하고 있다. 편두통에서도 paracetamol과 NSAID가 모두 치료 선택지가 될 수 있는 반면, 군발두통에서는 두 종류 모두 권장되는 급성 치료제가 아니다. 이를 통해 단순히 ‘이부프로펜이 아세트아미노펜보다 두통에 더 좋다’ 또는 그 반대로 결론내리는 것은 적절하지 않다는 것을 확인하였다. 두 약의 분자구조와 화학적 성질 및 작용 기전에 차이가 있지만, 실제 선택에는 두통의 유형과 개인의 건강 상태가 함께 영향을 미치기 때문이다.</p>
            <p>또한 안전성 측면에서도 고려해야 하는 위험의 종류가 달랐다. FDA 자료에 따르면 아세트아미노펜은 과량 사용 시 심각한 간 손상의 위험이 있으며, NSAID는 일부 사람에게 위장 출혈이나 신장 문제를 유발할 수 있다. 따라서 본 탐구의 자료 범위에서는 어느 하나의 약물이 모든 상황에서 더 우수하다고 판단하기보다, 분자구조와 화학적 성질의 차이가 서로 다른 작용 특성과 주의점으로 이어지며 실제 두통 치료제의 선택은 두통 유형과 개인의 조건을 함께 고려해야 한다고 해석할 수 있다.</p>
          </section>

          <section><h3>6. 결론 및 한계</h3>
            <h4>6-1. 화학적 구조와 성질 비교에 따른 결론</h4>
            <p>본 탐구에서는 아세트아미노펜과 이부프로펜의 분자구조와 화학적 성질, 작용 기전을 비교하고 이러한 차이가 두통 치료제 선택 기준과 어떻게 연결되는지를 분석하였다.</p>
            <p>분석 결과, 두 성분은 분자구조와 작용기에서 뚜렷한 차이를 보였다. 아세트아미노펜은 페놀성 수산기와 아마이드 구조를 가지고 있는 반면, 이부프로펜은 카복실산 작용기를 가지고 있었다. 또한 PubChem 자료에서 아세트아미노펜의 XLogP3는 0.5, 이부프로펜은 3.5로 나타나 중성 상태에서 이부프로펜이 상대적으로 친유성이 큰 특성을 보였다. 이러한 결과는 두 분자가 주변 물질과 상호작용하는 방식이 서로 다를 수 있음을 보여준다.</p>
            <p>특히 산·염기 평형을 이용한 이온화율 계산에서 큰 차이가 나타났다. 아세트아미노펜의 pKa 9.38과 이부프로펜의 계산 기준 pKa 4.45를 사용하여 pH 7.4에서 계산한 결과, 아세트아미노펜은 약 1.04%, 이부프로펜은 약 99.89%가 이온화된 형태로 존재하는 것으로 계산되었다. 이는 이부프로펜의 카복실산 작용기가 아세트아미노펜의 페놀성 수산기보다 더 강한 산성을 나타내기 때문에 동일한 pH 환경에서도 두 분자의 화학적 상태가 크게 달라질 수 있음을 보여준다. 이를 통해 화학 수업에서 학습한 작용기, pKa, 산·염기 평형 개념이 실제 의약품의 성질을 설명하는 데 적용될 수 있음을 확인하였다.</p>

            <h4>6-2. 작용 기전과 두통 치료제 선택에 대한 결론</h4>
            <p>작용 기전에서도 두 성분은 차이를 보였다. 이부프로펜은 NSAID로서 COX 경로를 억제하여 프로스타글란딘 생성을 감소시키며, 이를 통해 진통·해열뿐 아니라 항염증 작용도 나타낸다. 반면 아세트아미노펜의 진통 기전은 하나의 과정으로 완전히 밝혀지지 않았으며, COX 관련 작용뿐 아니라 AM404, TRPV1, CB1 등 중추신경계의 여러 통증 조절 경로가 관련된 것으로 연구되고 있었다. 따라서 두 성분은 모두 두통 완화에 사용할 수 있지만 같은 화학적·약리학적 방식으로 작용하는 것은 아니라는 점을 확인하였다.</p>
            <p>그러나 이러한 차이만으로 어느 한 약이 모든 두통에서 더 효과적이라고 판단할 수는 없었다. 실제 두통 진료지침에서는 긴장형 두통이나 편두통에서 아세트아미노펜과 NSAID 모두가 치료 선택지가 될 수 있으며, 두통의 종류, 개인의 건강 상태, 동반 질환, 부작용 위험 등을 함께 고려하도록 하고 있다. 또한 아세트아미노펜은 과량 사용 시 간 손상 위험을, 이부프로펜을 포함한 NSAID는 위장관 및 신장 관련 부작용 위험을 주의해야 한다.</p>
            <p>따라서 본 탐구의 자료 범위에서는 아세트아미노펜과 이부프로펜 중 어느 하나를 절대적으로 더 좋은 두통약이라고 결론내리기보다는, 두 약의 화학적 구조와 성질 및 작용 기전이 서로 다르며 실제 약물 선택에서는 이러한 차이와 개인의 조건을 함께 고려해야 한다고 해석할 수 있다.</p>

            <h4>6-3. 탐구의 한계</h4>
            <p>본 탐구에는 몇 가지 한계가 있다. 첫째, 실제 사람을 대상으로 약물 효과를 측정한 실험이 아니라 공개된 화학 데이터와 문헌을 비교한 탐구이므로 개인별 실제 진통 효과 차이를 직접 확인하지 못했다.</p>
            <p>둘째, pH와 pKa를 이용한 이온화율 계산은 단순화된 화학적 모델이므로 실제 인체에서의 약물 흡수, 분포, 대사 및 배설 과정을 모두 설명할 수 없다. 이온화 정도 외에도 용해도, 친유성, 약물의 제형, 생체막의 특성 등 여러 요인이 함께 작용하기 때문이다.</p>
            <p>셋째, 이부프로펜의 pKa는 자료 출처에 따라 서로 다른 값이 보고되어 있어 이번 탐구에서는 PubChem에 수록된 ChEMBL의 acidic pKa 4.45를 비교 계산의 기준값으로 사용하였다. 따라서 다른 pKa 값을 적용할 경우 이온화율의 구체적인 수치는 달라질 수 있다.</p>
            <p>넷째, 비교 대상을 아세트아미노펜과 이부프로펜 두 성분으로 제한했기 때문에 아스피린이나 나프록센과 같은 다른 진통제까지 본 탐구의 결과를 그대로 일반화하기에는 한계가 있다.</p>

            <h4>6-4. 한계 보완 및 탐구의 의미</h4>
            <p>이러한 한계를 보완하기 위해 후속 탐구에서는 아스피린 등 다른 진통제를 추가하여 작용기와 pKa, 친유성, 작용 기전을 동일한 기준으로 비교할 수 있다. 또한 약물의 이온화 상태와 실제 용해도, 막 투과성 및 약동학 자료를 함께 비교한다면 분자 수준의 화학적 특성이 실제 체내 약물 거동과 어떻게 연결되는지를 더욱 구체적으로 분석할 수 있을 것이다.</p>
            <p>이번 탐구를 통해 단순히 두통약의 효능을 조사하는 데 그치지 않고, 분자구조와 작용기, 산·염기 평형, pKa와 같은 화학 개념을 실제 의약품에 적용할 수 있었다. 또한 하나의 화학적 수치만으로 실제 약효를 설명하기 어렵다는 점을 확인하면서 여러 자료와 조건을 종합하여 해석하는 과정의 중요성을 알 수 있었다.</p>
          </section>

          <section><h3>7. 후속 탐구 계획</h3>
            <p>이번 탐구에서는 아세트아미노펜과 이부프로펜의 분자구조, 작용기, XLogP, pKa를 비교하고 pH에 따른 이온화율을 계산하여 두 약물의 화학적 특성 차이를 분석하였다. 그 과정에서 분자의 이온화 상태와 친유성이 서로 다르다는 점을 확인했지만, 이러한 화학적 특성만으로 실제 체내 흡수와 약효를 직접 설명하기에는 한계가 있었다.</p>
            <p>따라서 후속 탐구에서는 <b>‘약물의 pKa와 친유성 차이는 생체막 투과성과 약물 흡수 특성에 어떤 영향을 미치는가?’</b>를 연구문제로 설정하고자 한다. 아세트아미노펜과 이부프로펜의 pKa, XLogP, 용해도 및 막 투과성 관련 문헌 자료를 동일한 기준으로 비교하고, 위와 혈액 등 서로 다른 pH 환경에서 계산한 이온화 상태와 실제 약동학 자료가 어느 정도 일치하는지 분석할 것이다.</p>
            <p>이 후속 탐구를 통해 단순히 ‘비이온화된 물질이 세포막을 잘 통과한다’는 개념에서 그치지 않고, 이온화 정도, 친유성, 수용해도, 약의 제형, 생체막의 특성 등 여러 요인이 실제 약물의 흡수 과정에 어떻게 함께 영향을 주는지를 분석하고자 한다. 이를 통해 화학에서 학습한 산·염기 평형과 분자 간 상호작용 개념을 생명과학 및 약학의 약물 흡수 과정과 더욱 구체적으로 연결할 수 있을 것으로 생각한다.</p>

function safeFileName(value) {
  return String(value ?? "").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
}

function wordText(value) {
  return escapeHTML(value ?? "").replace(/\r?\n/g, "<br>");
}

// Word에서 <br>을 강제 줄바꿈으로 해석하면 양쪽 맞춤 문단의 낱말 간격이
// 과도하게 벌어진다. 보고서 본문은 줄마다 일반 문단으로 변환해 자연스럽게 배치한다.
function wordParagraphs(value) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  if (!lines.some((line) => line.trim())) return "<p>&nbsp;</p>";
  return lines
    .map((line) => line.trim() ? `<p>${escapeHTML(line.trim())}</p>` : '<p class="blank-line">&nbsp;</p>')
    .join("");
}

function docxXmlText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function normalizeReportMath(value) {
  let text = String(value ?? "");

  // 자주 사용되는 LaTeX 명령을 일반 문서에서 읽을 수 있는 기호로 변환한다.
  const symbols = {
    "\\rho": "ρ", "\\theta": "θ", "\\alpha": "α", "\\beta": "β",
    "\\gamma": "γ", "\\delta": "δ", "\\Delta": "Δ", "\\lambda": "λ",
    "\\mu": "μ", "\\pi": "π", "\\sigma": "σ", "\\omega": "ω",
    "\\Omega": "Ω", "\\times": "×", "\\cdot": "·", "\\pm": "±",
    "\\leq": "≤", "\\le": "≤", "\\geq": "≥", "\\ge": "≥",
    "\\neq": "≠", "\\approx": "≈", "\\rightarrow": "→", "\\to": "→",
    "\\infty": "∞"
  };
  Object.entries(symbols).forEach(([from, to]) => { text = text.split(from).join(to); });

  // \text{drop} -> drop
  text = text.replace(/\\text\s*\{([^{}]*)\}/g, "$1");

  // 단순 분수는 L/A와 같이 읽기 쉬운 꼴로 바꾼다.
  // 중첩되지 않은 \frac{...}{...}를 여러 번 처리한다.
  for (let i = 0; i < 4; i += 1) {
    const next = text.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, "$1/$2");
    if (next === text) break;
    text = next;
  }

  // 아래첨자/위첨자 중 숫자는 유니코드로 바꾸고, 문자 첨자는 붙여서 표시한다.
  const subMap = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","-":"₋" };
  const supMap = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻" };
  text = text.replace(/_\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => subMap[ch] || ch).join(""));
  text = text.replace(/_([0-9])/g, (_, s) => subMap[s] || s);
  text = text.replace(/\^\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => supMap[ch] || ch).join(""));
  text = text.replace(/\^([0-9])/g, (_, s) => supMap[s] || s);
  text = text.replace(/_\{([^{}]+)\}/g, "$1");
  text = text.replace(/_([A-Za-z가-힣]+)/g, "$1");

  // 수식 구분 기호와 남은 불필요한 LaTeX 기호를 정리한다.
  text = text
    .replace(/\\left|\\right/g, "")
    .replace(/\\\[|\\\]|\$\$/g, "")
    .replace(/\$/g, "")
    .replace(/\\,/g, " ")
    .replace(/\\;/g, " ")
    .replace(/\\!/g, "")
    .replace(/\s*=\s*/g, " = ")
    .replace(/\s*([≤≥≈≠×±])\s*/g, " $1 ")
    .replace(/[ \t]{2,}/g, " ")
    .trim();

  return text;
}

function dataUrlBytes(dataUrl) {
  const match = String(dataUrl ?? "").match(/^data:([^;,]+)(;base64)?,([\s\S]*)$/i);
  if (!match) throw new Error("지원하지 않는 사진 데이터입니다.");
  const mime = match[1].toLowerCase();
  if (match[2]) {
    const binary = atob(match[3]);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
    return { mime, bytes };
  }
  return { mime, bytes: new TextEncoder().encode(decodeURIComponent(match[3])) };
}

function loadExportImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("사진 크기를 확인하지 못했습니다."));
    image.src = src;
  });
}

function fittedExportSize(width, height, maxWidth, maxHeight) {
  const safeWidth = Math.max(1, Number(width) || 1);
  const safeHeight = Math.max(1, Number(height) || 1);
  const scale = Math.min(1, maxWidth / safeWidth, maxHeight / safeHeight);
  return {
    width: Math.max(1, Math.round(safeWidth * scale)),
    height: Math.max(1, Math.round(safeHeight * scale)),
  };
}

async function prepareExportPhotoAssets() {
  const photos = researchPhotoItems();
  const assets = [];

  for (const photo of photos) {
    const image = await loadExportImage(photo.src);
    let exportSrc = photo.src;
    let parsed = dataUrlBytes(exportSrc);

    // Word와 한글에서 안정적으로 열리는 JPEG·PNG만 사용합니다.
    // 그 밖의 형식은 첫 화면을 PNG로 변환해 사진이 빠지지 않게 합니다.
    if (!["image/jpeg", "image/png"].includes(parsed.mime)) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, image.naturalWidth || image.width || 1);
      canvas.height = Math.max(1, image.naturalHeight || image.height || 1);
      const context = canvas.getContext("2d");
      if (!context) throw new Error("사진을 문서용 이미지로 변환하지 못했습니다.");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      exportSrc = canvas.toDataURL("image/png");
      parsed = dataUrlBytes(exportSrc);
    }

    const assetIndex = assets.length + 1;
    const extension = parsed.mime === "image/png" ? "png" : "jpg";
    const widthPx = Math.max(1, image.naturalWidth || image.width || 1);
    const heightPx = Math.max(1, image.naturalHeight || image.height || 1);
    const docxSize = fittedExportSize(widthPx * 9525, heightPx * 9525, 5000000, 5700000);
    const hwpxSize = fittedExportSize(widthPx * 75, heightPx * 75, 40000, 52000);

    assets.push({
      ...photo,
      assetIndex,
      mime: parsed.mime,
      extension,
      bytes: parsed.bytes,
      docxRelId: `rIdImage${assetIndex}`,
      docxFileName: `image${assetIndex}.${extension}`,
      docxDocPrId: 1000 + assetIndex,
      docxWidth: docxSize.width,
      docxHeight: docxSize.height,
      hwpxId: `image${assetIndex}`,
      hwpxFileName: `image${assetIndex}.${extension}`,
      hwpxWidth: hwpxSize.width,
      hwpxHeight: hwpxSize.height,
    });
  }

  return assets;
}

function docxRun(text, options = {}) {
  const props = [];
  props.push('<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕"/>');
  if (options.bold) props.push('<w:b/>');
  if (options.color) props.push(`<w:color w:val="${options.color}"/>`);
  if (options.size) props.push(`<w:sz w:val="${options.size}"/><w:szCs w:val="${options.size}"/>`);
  const sourceText = options.normalizeMath ? normalizeReportMath(text) : String(text ?? "");
  const value = docxXmlText(sourceText || " ");
  return `<w:r><w:rPr>${props.join("")}</w:rPr><w:t xml:space="preserve">${value}</w:t></w:r>`;
}

function docxParagraph(text, options = {}) {
  const pPr = [];
  if (options.align) pPr.push(`<w:jc w:val="${options.align}"/>`);
  if (options.keepNext) pPr.push('<w:keepNext/>');
  if (options.pageBreakBefore) pPr.push('<w:pageBreakBefore/>');
  if (options.spacingBefore || options.spacingAfter || options.line) {
    pPr.push(`<w:spacing w:before="${options.spacingBefore || 0}" w:after="${options.spacingAfter || 0}" w:line="${options.line || 360}" w:lineRule="auto"/>`);
  }
  if (options.leftIndent || options.hanging) {
    pPr.push(`<w:ind w:left="${options.leftIndent || options.hanging || 0}"${options.hanging ? ` w:hanging="${options.hanging}"` : ""}/>`);
  }
  if (options.borderBottom) {
    pPr.push(`<w:pBdr><w:bottom w:val="single" w:sz="${options.borderSize || 10}" w:space="5" w:color="${options.borderColor || "192238"}"/></w:pBdr>`);
  }
  return `<w:p><w:pPr>${pPr.join("")}</w:pPr>${docxRun(text, options)}</w:p>`;
}

function docxBodyParagraphs(value, options = {}) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  const paragraphOptions = {
    size: 21,
    line: 340,
    spacingAfter: 90,
    align: "both",
    normalizeMath: options.normalizeMath !== false,
    ...options
  };
  if (!lines.some((line) => line.trim())) {
    return docxParagraph(" ", paragraphOptions);
  }
  return lines.map((line) =>
    docxParagraph(line.trim() || " ", paragraphOptions)
  ).join("");
}

function docxCrc32(bytes) {
  if (!docxCrc32.table) {
    docxCrc32.table = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      return c >>> 0;
    });
  }
  let crc = 0xFFFFFFFF;
  for (const byte of bytes) crc = docxCrc32.table[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function docxLe16(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF);
}

function docxLe32(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF, (value >>> 16) & 0xFF, (value >>> 24) & 0xFF);
}

function docxConcat(parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const part of parts) { out.set(part, offset); offset += part.length; }
  return out;
}

function docxZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;
  const now = new Date();
  const year = Math.max(1980, now.getFullYear());
  const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((Math.floor(now.getSeconds() / 2)) & 31);
  const dosDate = (((year - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

  for (const [name, content] of Object.entries(files)) {
    const nameBytes = encoder.encode(name);
    const data = content instanceof Uint8Array
      ? content
      : content instanceof ArrayBuffer
        ? new Uint8Array(content)
        : encoder.encode(String(content));
    const crc = docxCrc32(data);
    const localHeader = docxConcat([
      docxLe32(0x04034B50), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), nameBytes,
    ]);
    localParts.push(localHeader, data);

    const centralHeader = docxConcat([
      docxLe32(0x02014B50), docxLe16(20), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), docxLe16(0),
      docxLe16(0), docxLe16(0), docxLe32(0), docxLe32(localOffset), nameBytes,
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + data.length;
  }

  const central = docxConcat(centralParts);
  const local = docxConcat(localParts);
  const count = Object.keys(files).length;
  const end = docxConcat([
    docxLe32(0x06054B50), docxLe16(0), docxLe16(0), docxLe16(count), docxLe16(count),
    docxLe32(central.length), docxLe32(local.length), docxLe16(0),
  ]);
  return new Blob([local, central, end], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

let hwpxParagraphSequence = 1000000000;

function hwpxParagraphXml(value, options = {}) {
  const charPr = options.charPr ?? 0;
  const paraPr = options.paraPr ?? 0;
  const pageBreak = options.pageBreak ? 1 : 0;
  const normalized = options.normalizeMath === false ? String(value ?? "") : normalizeReportMath(value);
  const textValue = normalized || " ";
  const id = hwpxParagraphSequence++;
  return `<hp:p id="${id}" paraPrIDRef="${paraPr}" styleIDRef="0" pageBreak="${pageBreak}" columnBreak="0" merged="0">
    <hp:run charPrIDRef="${charPr}"><hp:t>${hwpxXmlText(textValue)}</hp:t></hp:run>
  </hp:p>`;
}

function hwpxBodyXml(value, options = {}) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  if (!lines.some((line) => line.trim())) return hwpxParagraphXml(" ", options);

  const firstParaPr = options.firstParaPr;
  const baseOptions = { ...options };
  delete baseOptions.firstParaPr;

  return lines.map((line, index) =>
    hwpxParagraphXml(line.trim() || " ", {
      ...baseOptions,
      ...(index === 0 && firstParaPr !== undefined ? { paraPr: firstParaPr } : {}),
    })
  ).join("");
}

function hwpxTableXml(rows, options = {}) {
  const width = options.width ?? 43000;
  const totalHeight = rows.reduce((sum, row) => sum + (row.height ?? 3200), 0);
  const colCnt = options.colCnt ?? Math.max(...rows.map((row) => row.colCnt ?? row.cells.length));
  const tableId = hwpxTableSequence++;

  const rowsXml = rows.map((row, rowIndex) => {
    const cellsXml = row.cells.map((cell) =>
      hwpxCellXml(cell.text, {
        ...cell,
        rowAddr: rowIndex,
        height: row.height ?? 3200,

    return `<hp:tr>${cellsXml}</hp:tr>`;

  const tableXml = `<hp:tbl id="${tableId}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${rows.length}" colCnt="${colCnt}" cellSpacing="0" borderFillIDRef="3" noAdjust="0">

function hwpxZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;
  const now = new Date();
  const year = Math.max(1980, now.getFullYear());
  const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((Math.floor(now.getSeconds() / 2)) & 31);
  const dosDate = (((year - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

  // HWPX 규격상 mimetype은 첫 ZIP 엔트리여야 하며 압축하지 않는다.
  const entries = Object.entries(files);
  entries.sort(([a], [b]) => a === "mimetype" ? -1 : b === "mimetype" ? 1 : 0);

  for (const [name, content] of entries) {
    const nameBytes = encoder.encode(name);
    const data = content instanceof Uint8Array
      ? content
      : content instanceof ArrayBuffer
        ? new Uint8Array(content)
        : encoder.encode(String(content));
    const crc = docxCrc32(data);
    const localHeader = docxConcat([
      docxLe32(0x04034B50), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), nameBytes,
    ]);
    localParts.push(localHeader, data);

    const centralHeader = docxConcat([
      docxLe32(0x02014B50), docxLe16(20), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), docxLe16(0),
      docxLe16(0), docxLe16(0), docxLe32(0), docxLe32(localOffset), nameBytes,
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + data.length;
  }

  const central = docxConcat(centralParts);
  const local = docxConcat(localParts);
  const count = entries.length;
  const end = docxConcat([
    docxLe32(0x06054B50), docxLe16(0), docxLe16(0), docxLe16(count), docxLe16(count),
    docxLe32(central.length), docxLe32(local.length), docxLe16(0),
  ]);
  return new Blob([local, central, end], { type: "application/hwp+zip" });
}

function downloadHwpx(title, sectionXml, fileName, previewText, message, imageAssets = []) {
  const blob = hwpxZipBlob(hwpxPackageFiles(title, sectionXml, previewText, imageAssets));
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  saveNow(true);
  showToast(message);
}

    return;
  }

  let content = "";
  // Word 표지와 최대한 비슷하게: 제목 → 탐구정보 표 → 하단 인적사항 표
  content += hwpxSpacerXml(3);
  content += hwpxParagraphXml("탐구보고서", { charPr: 3, paraPr: 1 });
  content += hwpxSpacerXml(3);
  content += hwpxResearchInfoTableXml(topic, exportProfile.type, question);
  content += hwpxSpacerXml(7);
  content += hwpxStudentInfoTableXml();

  const addHeading = (label, pageBreak = false) => {
    // 이전 섹션의 마지막 본문과 다음 대제목이 붙지 않도록
    // 2~8번 대제목 앞에 실제 빈 줄 1개를 넣습니다.
    if (!pageBreak) {
      content += hwpxParagraphXml(" ", { charPr: 0, paraPr: 0 });
    }

    content += hwpxParagraphXml(label, { charPr: 2, paraPr: 3, pageBreak });

    // 대제목 아래 구분선과 첫 본문 사이에도 빈 줄 1개를 유지합니다.
    content += hwpxParagraphXml(" ", { charPr: 0, paraPr: 0 });
  };
  const addBody = (value, afterHeading = true) => {
    content += hwpxBodyXml(value, {
      charPr: 0,
      paraPr: 0,
    });
  };

  addHeading("1. 탐구 동기 및 목적", true); addBody(state.fields.final01);
  addHeading("2. 연구문제와 가설"); addBody(state.fields.final02);
  addHeading("3. 이론적 배경"); addBody(state.fields.final03);
  addHeading(`4. ${exportProfile.reportMethodTitle}`); addBody(state.fields.final04);
  addHeading("5. 분석 결과 및 해석");
  outline.forEach((title, index) => {
    // HWPX에서는 문단 간격만으로는 소제목이 위 본문에 붙어 보일 수 있으므로
    // 5-2부터는 소제목 앞에 실제 빈 문단(Enter) 1개를 넣습니다.
    // 5-1 앞의 빈 줄은 addHeading()이 이미 만들어 줍니다.
    if (index > 0) {
      content += hwpxParagraphXml(" ", { charPr: 0, paraPr: 0 });
    }
    content += hwpxParagraphXml(String(state.fields[`analysis-title-${index}`] ?? title), { charPr: 1, paraPr: 2 });
    addBody(stripAnalysisNumber(state.fields[`analysis-content-${index}`]), false);
    imageAssets
      .filter((asset) => asset.sectionIndex === index)
      .forEach((asset, photoIndex) => {
        content += hwpxPhotoBlockXml(asset, photoIndex + 1);
      });
  });
  addHeading("6. 결론 및 한계"); addBody(state.fields.final06);
  addHeading("7. 후속 탐구 계획"); addBody(state.fields.final07);
  addHeading("8. 참고자료 및 출처"); addBody(state.fields.final08);

  const date = new Date().toISOString().slice(0,10).replaceAll("-","");
  const preview = [topic, student, state.fields.final01, state.fields.final06].filter(Boolean).join("\n");
  downloadHwpx(
    "탐구보고서",
    hwpxSectionXml(content),
    `${studentFilePrefix()}탐구보고서_${date}.hwpx`,
    preview,
    imageAssets.length
      ? "사진을 포함한 완성 보고서를 HWPX 파일로 다운로드했습니다."
      : "완성 보고서를 HWPX 파일로 다운로드했습니다.",
    imageAssets
  );
}

function downloadDocx(title, bodyXml, fileName, message, options = {}) {
  const blob = docxZipBlob(docxPackageFiles(title, bodyXml, options));
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  saveNow(true);
  showToast(message);
}

function studentFilePrefix() {
  const parts = [state.fields["student-grade"] && `${safeFileName(state.fields["student-grade"])}학년`, state.fields["student-class"] && `${safeFileName(state.fields["student-class"])}반`, state.fields["student-number"] && `${safeFileName(state.fields["student-number"])}번`, safeFileName(state.fields["student-name"])].filter(Boolean);
  return parts.length ? `${parts.join("_")}_` : "";
}

function docxReferenceParagraphs() {
  const currentRefs = String(state.fields.final08 ?? "").trim();
  const importedRefs = String(state.fields["_imported-final08"] ?? "").trim();

  // 보고서 완성 단계에서 참고자료를 직접 수정했다면 그 수정 내용을 우선한다.
  if (currentRefs && currentRefs !== importedRefs) {
    return docxBodyParagraphs(currentRefs, {
      size: 21,
      color: "333333",
      line: 340,
      spacingAfter: 90,
      leftIndent: 360,
      hanging: 360,
      align: "both",
      normalizeMath: false
    });
  }

  const items = [];
  const referenceCount = Math.max(1, Number(state.referenceCount) || 3);

  for (let index = 1; index <= referenceCount; index += 1) {
    const title = String(state.fields[`ref${index}-title`] ?? "").trim();
    if (!title) continue;

    const author = String(state.fields[`ref${index}-author`] ?? "").trim().replace(/[.。]\s*$/g, "");
    const year = String(state.fields[`ref${index}-year`] ?? "").trim();
    const cleanTitle = title.replace(/[.。]\s*$/g, "");
    const url = String(state.fields[`ref${index}-url`] ?? "").trim().replace(/[?&]utm_source=[^&\s]+/g, "");

    const parts = [];
    if (author) parts.push(`${author}.`);
    if (year) parts.push(`(${year}).`);
    parts.push(`${cleanTitle}.`);
    if (url) parts.push(url);

    items.push(`${items.length + 1}. ${parts.join(" ")}`);
  }

  if (items.length) {
    return items.map((item) => docxParagraph(item, {
      size: 21,
      color: "333333",
      line: 340,
      spacingAfter: 90,
      leftIndent: 360,
      hanging: 360,
      align: "both",
      normalizeMath: false
    })).join("");
  }

  // 직접 입력한 주제 등 구조화된 참고자료가 없으면 기존 입력 내용을 그대로 사용한다.
  return docxBodyParagraphs(state.fields.final08, {
    size: 21,
    color: "333333",
    line: 340,
    spacingAfter: 90,
    leftIndent: 360,
    hanging: 360,
    normalizeMath: false
  });
}

function insertPlainTextAtCursor(textValue) {
  const selection = window.getSelection();
  if (!selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  range.deleteContents();
  const textNode = document.createTextNode(textValue);
  range.insertNode(textNode);
  range.setStartAfter(textNode);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
}

function compressedImageData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const image = new Image();
      image.onerror = reject;
      image.onload = () => {
        const scale = Math.min(1, 1100 / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", .75));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addResearchPhotoFiles(fileList, sectionIndex, sourceType = "file") {
  if (!Number.isInteger(sectionIndex) || sectionIndex < 0) return false;

  const originalPhotos = [...researchPhotoItems()];
  const remaining = Math.max(0, 8 - originalPhotos.length);
  if (!remaining) {
    showToast("사진 자료는 최대 8장까지 추가할 수 있습니다.");
    return false;
  }

  const files = [...(fileList ?? [])]
    .filter((file) => file && String(file.type ?? "").startsWith("image/"))
    .slice(0, remaining);
  if (!files.length) {
    showToast(sourceType === "paste" ? "클립보드에 붙여넣을 이미지가 없습니다." : "추가할 사진 파일을 선택하세요.");
    return false;
  }

  const added = [];
  for (const [index, file] of files.entries()) {
    try {
      added.push({
        id: `${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}`,
        src: await compressedImageData(file),
        name: file.name || `붙여넣은_이미지_${index + 1}`,
        caption: "",
        source: "",
        sectionIndex,
      });
    } catch {
      // 읽지 못한 이미지만 제외하고 나머지는 계속 처리합니다.
    }
  }

  if (!added.length) {
    showToast(sourceType === "paste" ? "클립보드 이미지를 붙여넣지 못했습니다. 다른 이미지로 다시 시도하세요." : "사진을 불러오지 못했습니다. 다른 사진 파일로 다시 시도하세요.");
    return false;
  }

  state.researchPhotos = [...originalPhotos, ...added];
  if (!saveNow(true)) {
    state.researchPhotos = originalPhotos;
    saveNow(true);
    render(`#analysis-block-${sectionIndex}`);
    showToast("브라우저 저장공간이 부족해 사진을 추가하지 못했습니다. 사진 수를 줄여 다시 시도하세요.");
    return false;
  }

  render(`#analysis-block-${sectionIndex}`);
  const photoDetails = document.querySelector(`[data-photo-details-index="${sectionIndex}"]`);
  if (photoDetails) photoDetails.open = true;
  showToast(sourceType === "paste"
    ? `소제목 ${sectionIndex + 1}에 클립보드 사진 ${added.length}장을 붙여넣었습니다.`
    : `소제목 ${sectionIndex + 1}에 사진 ${added.length}장을 삽입했습니다.`);
  return true;
}

function closeStepMenus(except = null) {
  document.querySelectorAll(".step-menu.open").forEach((menu) => {
    if (menu === except) return;
    menu.classList.remove("open");
    menu.querySelector("[data-step-menu-trigger]")?.setAttribute("aria-expanded", "false");
  });
}

function usesTouchMenu() {
  return window.matchMedia("(hover: none), (pointer: coarse)").matches;
}

document.addEventListener("click", async (event) => {
  const clickedStepMenu = event.target.closest?.(".step-menu") ?? null;
  if (!clickedStepMenu) closeStepMenus();
  const target = event.target.closest("button, a");
  if (!target) return;
  if (target.hasAttribute("data-step-menu-trigger") && usesTouchMenu()) {
    const menu = target.closest(".step-menu");
    if (menu && !menu.classList.contains("open")) {
      event.preventDefault();
      closeStepMenus(menu);
      menu.classList.add("open");
      target.setAttribute("aria-expanded", "true");
      return;
    }
  }
  if (target.hasAttribute("data-open-topic-sample")) {
    event.preventDefault();
    state.view = "topicSample";
    saveNow(true);
    render();
    return;
  }
  if (target.hasAttribute("data-topic-sample-open-all")) {
    document.querySelectorAll(".topic-sample-page details.gpt-bubble").forEach((detail) => { detail.open = true; });
    return;
  }
  if (target.hasAttribute("data-topic-sample-close-all")) {
    document.querySelectorAll(".topic-sample-page details.gpt-bubble").forEach((detail) => { detail.open = false; });
    return;
  }
  if (target.hasAttribute("data-scroll-top")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (target.hasAttribute("data-save-code")) { await startCodeSave(); return; }
  if (target.hasAttribute("data-open-code")) { openResumeCodeModal("load"); return; }
  if (target.hasAttribute("data-close-resume-code")) { closeResumeCodeModal(); return; }
  if (target.hasAttribute("data-save-resume-code")) { await saveByResumeCode(); return; }
  if (target.hasAttribute("data-load-resume-code")) { await loadByResumeCode(); return; }
  if (target.hasAttribute("data-recover-resume-code")) { await recoverResumeCodeLabel(); return; }
  if (target.dataset.nav) {
    const next = target.dataset.nav;
    state.view = next;
    saveNow(true);
    render();
    return;
  }
  if (target.dataset.category) {
    state.categoryId = target.dataset.category;
    state.majorId = activeCategory().majors[0].id;
    state.expandedTopicId = null;
    render("#major-section"); return;
  }
  if (target.dataset.major) { state.majorId = target.dataset.major; state.expandedTopicId = null; render("#topic-section"); return; }
  if (target.dataset.toggleTopic) {
    const topicId = target.dataset.toggleTopic;
    const opening = state.expandedTopicId !== topicId;
    state.expandedTopicId = opening ? topicId : null;
    render(opening ? `#topic-card-${topicId} .topic-copy h3` : `#topic-card-${topicId}`); return;
  }
  if (target.dataset.selectMethod !== undefined && target.dataset.topicId) {
    state.selectedMethods = { ...(state.selectedMethods ?? {}), [target.dataset.topicId]: Number(target.dataset.selectMethod) };
    scheduleSave();
    render(`#topic-card-${target.dataset.topicId}`); return;
  }
  if (target.dataset.startTopic) { startTopic(target.dataset.startTopic); return; }
  if (target.hasAttribute("data-start-custom-topic")) { startCustomTopic(); return; }
  if (target.dataset.exampleTarget) {
    const id = target.dataset.exampleTarget;
    const text = decodeURIComponent(target.dataset.example);
    const input = document.querySelector(`[data-field="${CSS.escape(id)}"]`);
    const current = String(state.fields[id] ?? "").trim();
    let next = text;
    if (current && current !== text && !SELF_PART_FIELDS.has(id)) {
      const replace = window.confirm("이미 작성한 내용이 있습니다. 확인을 누르면 예시로 바꾸고, 취소하면 기존 내용 뒤에 예시를 추가합니다.");
      next = replace ? text : `${current}${input?.tagName === "INPUT" ? " / " : "\n\n"}${text}`;
    }
    state.fields[id] = next;
    if (input) { input.value = next; input.focus(); }
    if (SELF_PART_FIELDS.has(id)) updateGuidedJosa(id, next);
    const selfSynced = SELF_PART_FIELDS.has(id) ? syncSelfOutputFromParts(false) : true;
    scheduleSave();
    showToast(selfSynced ? "예시가 입력되었습니다. 자신의 내용에 맞게 수정하세요." : "예시는 입력했지만 아래에서 직접 수정한 문장은 유지했습니다.");
    return;
  }
  if (target.dataset.copyKeyword) {
    try { await navigator.clipboard.writeText(target.dataset.copyKeyword); showToast("검색어를 복사했습니다."); }
    catch { showToast("검색어를 선택해 직접 복사하세요."); }
    return;
  }
  if (target.hasAttribute("data-delete-research-photo")) {
    const photoId = String(target.dataset.deleteResearchPhoto ?? "");
    const photo = researchPhotoItems().find((item) => String(item.id) === photoId);
    if (!photo) return;
    if (!window.confirm("이 소제목에 삽입한 사진을 삭제하시겠습니까? 삭제한 사진은 복구할 수 없습니다.")) return;
    state.researchPhotos = researchPhotoItems().filter((item) => String(item.id) !== photoId);
    saveNow(true);
    render(`#analysis-block-${photo.sectionIndex}`);
    const photoDetails = document.querySelector(`[data-photo-details-index="${photo.sectionIndex}"]`);
    if (photoDetails) photoDetails.open = true;
    showToast("소제목에서 사진을 삭제했습니다.");
    return;
  }
  if (target.hasAttribute("data-delete-reference")) {
    const deleteIndex = Number(target.dataset.deleteReference);
    const referenceCount = Math.max(1, Number(state.referenceCount) || 3);
    if (!Number.isInteger(deleteIndex) || deleteIndex < 1 || deleteIndex > referenceCount) return;
    if (referenceCount <= 1) {
      showToast("자료 입력칸은 최소 1개가 필요합니다.");
      return;
    }

    const suffixes = ["title", "author", "year", "url", "clipping", "limit"];
    if (!window.confirm(`자료 ${deleteIndex}를 삭제하시겠습니까? 삭제한 자료는 복구할 수 없습니다.`)) return;

    // 중간 자료를 삭제하면 뒤 자료를 한 칸씩 당겨 번호가 연속되도록 유지합니다.
    for (let index = deleteIndex; index < referenceCount; index += 1) {
      suffixes.forEach((suffix) => {
        const nextKey = `ref${index + 1}-${suffix}`;
        const currentKey = `ref${index}-${suffix}`;
        if (Object.prototype.hasOwnProperty.call(state.fields, nextKey)) state.fields[currentKey] = state.fields[nextKey];
        else delete state.fields[currentKey];
      });
    }
    suffixes.forEach((suffix) => delete state.fields[`ref${referenceCount}-${suffix}`]);
    state.referenceCount = referenceCount - 1;

    // 보고서의 참고자료가 자동 연동 상태라면 삭제 결과도 즉시 반영합니다.
    syncReportFromPrevious(false);
    saveNow(true);
    render("#explore-references");
    showToast(`자료 ${deleteIndex}를 삭제했습니다.`);
    return;
  }
  if (target.hasAttribute("data-add-reference")) {
    state.referenceCount = Math.max(1, Number(state.referenceCount) || 3) + 1;
    saveNow(true);
    const addedIndex = state.referenceCount;
    render(`#reference-card-${addedIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="ref${addedIndex}-title"]`)?.focus();
    }, 450);
    showToast(`자료 ${addedIndex} 입력칸을 추가했습니다.`);
    return;
  }
  if (target.hasAttribute("data-delete-analysis-subheading")) {
    const deleteIndex = Number(target.dataset.deleteAnalysisSubheading);
    const selected = workflowSelection();
    const topic = selected?.topic ?? { id: "custom-topic" };
    const outline = reportOutline(topic);
    const count = outline.length;

    if (!Number.isInteger(deleteIndex) || deleteIndex < 0 || deleteIndex >= count) return;
    if (count <= 1) {
      showToast("분석 결과 소제목은 최소 1개가 필요합니다.");
      return;
    }

    if (!window.confirm(`소제목 ${deleteIndex + 1}을 삭제하시겠습니까? 작성한 제목·내용과 이 소제목에 삽입한 사진도 함께 삭제되며 복구할 수 없습니다.`)) return;

    // 화면에 보이는 현재 제목을 기준으로 삭제 후 목록을 만들고 번호를 다시 정리합니다.
    const visibleTitles = outline.map((title, index) =>
      String(state.fields[`analysis-title-${index}`] ?? title).trim() || title
    );
    const remainingTitles = visibleTitles
      .filter((_, index) => index !== deleteIndex)
      .map((title, index) => renumberAnalysisTitle(title, index));

    // 중간 항목을 삭제하면 뒤의 제목·본문을 한 칸씩 앞으로 당깁니다.
    for (let index = deleteIndex; index < count - 1; index += 1) {
      const nextTitleKey = `analysis-title-${index + 1}`;
      const nextContentKey = `analysis-content-${index + 1}`;
      const currentTitleKey = `analysis-title-${index}`;
      const currentContentKey = `analysis-content-${index}`;

      if (Object.prototype.hasOwnProperty.call(state.fields, nextTitleKey)) {
        state.fields[currentTitleKey] = state.fields[nextTitleKey];
      } else {
        delete state.fields[currentTitleKey];
      }

      if (Object.prototype.hasOwnProperty.call(state.fields, nextContentKey)) {
        state.fields[currentContentKey] = state.fields[nextContentKey];
      } else {
        delete state.fields[currentContentKey];
      }

      movePythonSectionState(index + 1, index);
    }

    // 마지막에 남은 이전 값과 자동 연동 표식을 제거합니다.
    delete state.fields[`analysis-title-${count - 1}`];
    delete state.fields[`analysis-content-${count - 1}`];
    deletePythonSectionState(count - 1);
    for (let index = 0; index < count; index += 1) {
      delete state.fields[`_imported-analysis-title-${index}`];
    }

    // 삭제 후 제목을 새 순서대로 저장합니다.
    remainingTitles.forEach((title, index) => {
      state.fields[`analysis-title-${index}`] = title;
      state.fields[`_imported-analysis-title-${index}`] = title;
    });

    // 삭제한 소제목의 사진은 제거하고, 뒤 소제목의 사진은 새 번호에 맞춰 앞으로 이동합니다.
    state.researchPhotos = researchPhotoItems()
      .filter((photo) => photo.sectionIndex !== deleteIndex)
      .map((photo) => ({
        ...photo,
        sectionIndex: photo.sectionIndex > deleteIndex ? photo.sectionIndex - 1 : photo.sectionIndex,
      }));

    state.analysisManualOutline = remainingTitles;
    state.analysisExtraCount = 0;
    if (pythonLabOpenIndex === deleteIndex) pythonLabOpenIndex = null;
    else if (Number.isInteger(pythonLabOpenIndex) && pythonLabOpenIndex > deleteIndex) pythonLabOpenIndex -= 1;

    saveNow(true);
    const focusIndex = Math.min(deleteIndex, remainingTitles.length - 1);
    render(`#analysis-block-${focusIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="analysis-title-${focusIndex}"]`)?.focus();
    }, 450);
    showToast(`소제목 ${deleteIndex + 1}을 삭제했습니다.`);
    return;
  }

  if (target.hasAttribute("data-add-analysis-subheading")) {
    const selected = workflowSelection();
    const topic = selected?.topic ?? { id: "custom-topic" };
    const currentOutline = reportOutline(topic);

    if (Array.isArray(state.analysisManualOutline) && state.analysisManualOutline.length) {
      state.analysisManualOutline = [
        ...currentOutline,
        `5-${currentOutline.length + 1}. 새 소제목`
      ];
    } else {
      state.analysisExtraCount = Math.max(0, Number(state.analysisExtraCount) || 0) + 1;
    }

    const newOutline = reportOutline(topic);
    const addedIndex = newOutline.length - 1;
    saveNow(true);
    render(`#analysis-block-${addedIndex}`);
    window.setTimeout(() => {
      document.querySelector(`[data-field="analysis-title-${addedIndex}"]`)?.focus();
    }, 450);
    showToast(`소제목 ${addedIndex + 1}을 추가했습니다.`);
    return;
  }
  if (target.hasAttribute("data-refresh-summary")) {
    // 화면에서 아직 포커스 중인 입력값까지 먼저 state에 확실히 반영합니다.
    document.querySelectorAll("[data-field]").forEach((element) => {
      if (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement || element instanceof HTMLSelectElement) {
        state.fields[element.dataset.field] = element.value;
      }
    });
    document.querySelectorAll("[data-rich-field]").forEach((element) => {
      state.fields[element.dataset.richField] = sanitizeClipHTML(element.innerHTML);
    });

    // 기존 요약과 수동수정 표시를 모두 지운 뒤 현재 탐구활동·완성 보고서에서 새로 생성합니다.
    SUMMARY_DRAFT_FIELDS.forEach((key) => delete state.fields[key]);
    state.summaryManualEdits = {};
    state.summaryDraftInitialized = false;
    syncReportFromPrevious(false);
    initializeSummaryDraft(true);
    saveNow(true);
    render("#self-summary");
    showToast("최신 탐구내용으로 요약을 다시 만들었습니다.");
    return;
  }
  if (target.hasAttribute("data-generate-self")) {
    if (state.selfOutputCustomized && !window.confirm("아래에서 직접 수정한 문장은 사라지고 위 항목을 기준으로 다시 만들어집니다. 계속할까요?")) return;
    syncSelfOutputFromParts(true);
    scheduleSave(); showToast("위 항목을 기준으로 자기평가서 문장을 다시 만들었습니다."); return;
  }
  if (target.hasAttribute("data-reset-self")) {
    if (!window.confirm("자기평가서에서 작성·수정한 내용만 초기화할까요? 완성 보고서는 그대로 유지됩니다.")) return;
    SELF_PART_FIELDS.forEach((key) => delete state.fields[key]);
    SUMMARY_DRAFT_FIELDS.forEach((key) => delete state.fields[key]);
    state.summaryManualEdits = {};
    delete state.fields["self-output"];
    state.summaryDraftInitialized = false;
    state.selfOutputCustomized = false;
    state.selfOutputNeedsSync = false;
    saveNow(true);
    render("#self-summary");
    showToast("자기평가서를 초기화했습니다. 완성 보고서는 유지됩니다.");
    return;
  }
  if (target.hasAttribute("data-sync-report")) { syncReportFromPrevious(true); render(); showToast("탐구활동에서 기록한 참고자료를 다시 반영했습니다."); return; }
  if (target.hasAttribute("data-download-word")) { await downloadReportWord(); return; }
  if (target.hasAttribute("data-download-hwpx")) { await downloadReportHwpx(); return; }
  if (target.hasAttribute("data-download-self-word")) { downloadSelfWord(); return; }
  if (target.hasAttribute("data-download-self-hwpx")) { downloadSelfHwpx(); return; }
  if (target.hasAttribute("data-toggle-python-lab")) {
    const index = Number(target.dataset.togglePythonLab);
    if (!Number.isInteger(index) || index < 0) return;
    const willOpen = pythonLabOpenIndex !== index;
    pythonLabOpenIndex = willOpen ? index : null;
    // Python 실행창을 열 때 소제목 맨 위가 아니라 실제 코드 실행 영역으로 이동합니다.
    // 닫을 때도 사용자가 누른 Python 버튼 위치를 유지합니다.
    render(willOpen ? `#python-section-${index}` : `#analysis-block-${index} .analysis-code-row`);
    return;
  }
  if (target.hasAttribute("data-add-python-cell")) {
    const sectionIndex = Number(target.dataset.addPythonCell);
    if (!Number.isInteger(sectionIndex) || sectionIndex < 0) return;
    const currentCount = pythonCellCount(sectionIndex);
    if (currentCount >= 6) { showToast("한 소제목에는 Python 실행창을 최대 6개까지 추가할 수 있습니다."); return; }
    ensurePythonCellCounts()[sectionIndex] = currentCount + 1;
    pythonLabOpenIndex = sectionIndex;
    saveNow(true);
    render(`#explore-python-${sectionIndex}-${currentCount}`);
    window.setTimeout(() => document.querySelector(`#python-code-editor-${sectionIndex}-${currentCount}`)?.focus(), 300);
    showToast(`Python 코드 실행 ${currentCount + 1}을 추가했습니다.`);
    return;
  }
  if (target.hasAttribute("data-delete-python-cell")) {
    const [sectionText, cellText] = String(target.dataset.deletePythonCell ?? "").split(":");
    const sectionIndex = Number(sectionText);
    const cellIndex = Number(cellText);
    const count = pythonCellCount(sectionIndex);
    if (!Number.isInteger(sectionIndex) || !Number.isInteger(cellIndex) || cellIndex < 0 || cellIndex >= count || count <= 1) return;
    if (!window.confirm(`Python 코드 실행 ${cellIndex + 1}을 삭제하시겠습니까? 작성한 코드와 현재 실행 결과도 함께 삭제됩니다.`)) return;
    for (let cell = cellIndex; cell < count - 1; cell += 1) {
      const nextField = pythonCodeFieldId(sectionIndex, cell + 1);
      const currentField = pythonCodeFieldId(sectionIndex, cell);
      if (Object.prototype.hasOwnProperty.call(state.fields, nextField)) state.fields[currentField] = state.fields[nextField];
      else delete state.fields[currentField];
      const nextResult = pythonLabResults[pythonResultKey(sectionIndex, cell + 1)];
      if (nextResult) pythonLabResults[pythonResultKey(sectionIndex, cell)] = nextResult;
      else delete pythonLabResults[pythonResultKey(sectionIndex, cell)];
    }
    delete state.fields[pythonCodeFieldId(sectionIndex, count - 1)];
    delete pythonLabResults[pythonResultKey(sectionIndex, count - 1)];
    ensurePythonCellCounts()[sectionIndex] = count - 1;
    saveNow(true);
    const focusCell = Math.min(cellIndex, count - 2);
    render(`#explore-python-${sectionIndex}-${focusCell}`);
    showToast("Python 실행창을 삭제했습니다.");
    return;
  }
  if (target.hasAttribute("data-python-run")) { await runPythonLab(target); return; }
  if (target.hasAttribute("data-python-example")) {
    const lab = target.closest("[data-python-section]");
    const editor = lab?.querySelector(".python-code-editor");
    if (!editor) return;
    const next = target.dataset.pythonExample === "csv" ? PYTHON_CSV_CODE : PYTHON_DEFAULT_CODE;
    editor.value = next;
    const codeField = editor.dataset.field || "python-code-0";
    state.fields[codeField] = next;
    scheduleSave();
    editor.focus();
    showToast(target.dataset.pythonExample === "csv" ? "CSV 분석 예시를 넣었습니다." : "기본 분석 예시를 넣었습니다.");
    return;
  }
  if (target.hasAttribute("data-save-now")) { saveNow(false); return; }
  if (target.hasAttribute("data-reset")) {
    if (!window.confirm("이 브라우저에 저장된 작성 내용을 모두 지우고 새로 시작할까요?")) return;
    localStorage.removeItem(STORAGE_KEY); state = defaultState(); pythonLabResults = Object.create(null); pythonLabOpenIndex = null; resumeTargetView = "topics"; resumeVisible = false; render(); showToast("새 보고서를 시작합니다."); return;
  }
  if (target.hasAttribute("data-resume-continue")) {
    resumeVisible = false;
    state.view = resumeTargetView;
    render();
    return;
  }
  if (target.hasAttribute("data-resume-new")) {
    if (!window.confirm("저장된 작성 내용을 지우고 새로 시작할까요?")) return;
    localStorage.removeItem(STORAGE_KEY); state = defaultState(); resumeTargetView = "topics"; resumeVisible = false; render(); return;
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && document.querySelector("#resume-code-modal")) {
    closeResumeCodeModal();
    return;
  }
  if (event.key === "Enter" && event.target?.id === "resume-code-input") {
    event.preventDefault();
    const mode = document.querySelector("#resume-code-modal")?.dataset.resumeCodeMode;
    if (mode === "load") void loadByResumeCode();
    else if (mode === "recover") void recoverResumeCodeLabel();
    else void saveByResumeCode();
    return;
  }
  const pasteZone = event.target.closest?.("[data-research-photo-paste-zone]");
  if (!pasteZone) return;
  const isPasteShortcut = (event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "v";
  const isNavigationKey = ["Tab", "Shift", "Control", "Meta"].includes(event.key);
  if (!isPasteShortcut && !isNavigationKey) event.preventDefault();
});

document.addEventListener("paste", async (event) => {
  const pasteZone = event.target.closest?.("[data-research-photo-paste-zone]");
  if (pasteZone) {
    event.preventDefault();
    const sectionIndex = Number(pasteZone.dataset.analysisPhotoIndex);
    const imageFiles = [...(event.clipboardData?.items ?? [])]
      .filter((item) => item.type.startsWith("image/"))
      .map((item) => item.getAsFile())
      .filter(Boolean);
    await addResearchPhotoFiles(imageFiles, sectionIndex, "paste");
    return;
  }

  const rich = event.target.closest?.("[data-rich-field]");
  if (!rich) return;
  const imageFiles = [...(event.clipboardData?.items ?? [])]
    .filter((item) => item.type.startsWith("image/"))
    .map((item) => item.getAsFile())
    .filter(Boolean);
  event.preventDefault();
  if (imageFiles.length) {
    for (const file of imageFiles) {
      try {
        const image = document.createElement("img");
        image.src = await compressedImageData(file);
        image.alt = "붙여넣은 참고자료 그림";
        rich.append(document.createElement("br"), image, document.createElement("br"));
      } catch {
        showToast("그림을 붙여넣지 못했습니다. 화면 캡처 크기를 줄여 다시 시도하세요.");
      }
    }
    state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
    scheduleSave();
    showToast("참고자료 그림을 이 브라우저에 저장했습니다.");
    return;
  }
  insertPlainTextAtCursor(event.clipboardData?.getData("text/plain") ?? "");
  state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
  scheduleSave();
});

document.addEventListener("input", (event) => {
  const rich = event.target.closest?.("[data-rich-field]");
  if (rich) {
    state.fields[rich.dataset.richField] = sanitizeClipHTML(rich.innerHTML);
    scheduleSave();
    return;
  }
  const element = event.target.closest("[data-field]");
  if (!element) return;
  state.fields[element.dataset.field] = element.value;
  if (SUMMARY_DRAFT_FIELDS.includes(element.dataset.field)) {
    if (!state.summaryManualEdits || typeof state.summaryManualEdits !== "object" || Array.isArray(state.summaryManualEdits)) {
      state.summaryManualEdits = {};
    }
    state.summaryManualEdits[element.dataset.field] = true;
  }
  if (!state.topicId && (
    element.dataset.field.startsWith("draft-")
    || element.dataset.field.startsWith("final")
    || element.dataset.field.startsWith("analysis-")
  )) {
    state.customTopicMode = true;
  }
  if (SELF_PART_FIELDS.has(element.dataset.field)) {
    updateGuidedJosa(element.dataset.field, element.value);
    syncSelfOutputFromParts(false);
  }
  if (element.dataset.field === "self-output") {
    state.selfOutputCustomized = true;
    state.selfOutputNeedsSync = false;
    updateSelfSyncNote();
  }
  if (element.dataset.field === "self-output") updateSelfCount();
  scheduleSave();
});

document.addEventListener("change", async (event) => {
  const pythonCsvInput = event.target.closest?.("[data-python-csv]");
  if (pythonCsvInput) {
    const file = pythonCsvInput.files?.[0] ?? null;
    pythonCsvInput.value = "";
    await setPythonCsvFile(file, pythonCsvInput.closest("[data-python-section]"));
    return;
  }
  const photoInput = event.target.closest?.("[data-research-photo-upload]");
  if (photoInput) {
    const sectionIndex = Number(photoInput.dataset.analysisPhotoIndex);
    const files = [...(photoInput.files ?? [])];
    photoInput.value = "";
    await addResearchPhotoFiles(files, sectionIndex, "file");
    return;
  }
  const element = event.target.closest("[data-field]");
  if (element) scheduleSave();
});

window.addEventListener("pagehide", () => {
  saveNow(true);
  // 브라우저 종료 직전에는 네트워크 요청이 완료되지 않을 수도 있으므로 최선의 방식으로 즉시 시도합니다.
  if (firebaseConfigIsReady()) void saveToFirebaseCloud(true);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    saveNow(true);
    if (firebaseConfigIsReady()) void saveToFirebaseCloud(true);
  }
});

const normalizedInitialResumeCode = normalizeResumeCode(INITIAL_RESUME_CODE);

if (!normalizedInitialResumeCode) {
  try {
    const rawSaved = localStorage.getItem(STORAGE_KEY);
    if (rawSaved) {
      const saved = JSON.parse(rawSaved);
      if (saved && typeof saved === "object") {
        state = {
          ...defaultState(),
          ...saved,
          fields: saved.fields ?? {},
          selectedMethods: saved.selectedMethods ?? {},
          researchPhotos: Array.isArray(saved.researchPhotos) ? saved.researchPhotos : [],
          summaryManualEdits: saved.summaryManualEdits && typeof saved.summaryManualEdits === "object" && !Array.isArray(saved.summaryManualEdits)
            ? saved.summaryManualEdits
            : {},
        };
        if (typeof saved.selfOutputCustomized !== "boolean" && String(state.fields["self-output"] ?? "").trim()) {
          state.selfOutputCustomized = true;
        }
        resumeTargetView = ["draft","explore","report","self"].includes(saved.view) ? saved.view : "draft";
        state.view = "topics";
        resumeVisible = hasMeaningfulDraft();
      }
    }
  } catch {
    state = defaultState();
  }
} else {
  // 관리자 페이지에서 저장코드로 연 경우 현재 브라우저의 기존 작성 내용을 건드리지 않고
  // URL의 코드 내용을 메모리로 바로 불러옵니다.
  state = defaultState();
  resumeVisible = false;
}

render();
if (normalizedInitialResumeCode) {
  void loadResumeCodeValue(normalizedInitialResumeCode, {
    skipConfirm: true,
    persistLocal: !ADMIN_PREVIEW_MODE,
    scheduleCloud: !ADMIN_PREVIEW_MODE,
    writeBackLabel: !ADMIN_PREVIEW_MODE,
    showSuccess: true,
  });
} else if (firebaseConfigIsReady() && hasMeaningfulDraft()) {
  scheduleFirebaseSave(false, true);
  void restoreResumeCodeLabelFromFirebase();
}

</script>
</body>
</html>
